]},

"UE10": {titre:"Santé publique, économie de la santé, droit, éthique et communication", duree:"13 min", diapos:[
 {t:"intro", kick:"UE11 · pour commencer", titre:"Le patient n'est pas un dossier",
  texte:"Cette UE ne parle pas de technique. Elle parle de ce qui encadre la technique : les droits de la personne soignée, le secret que vous devez, les règles de transmission d'informations dans une équipe, et la manière de communiquer sans trahir ni l'un ni l'autre."},

 {t:"notion", kick:"Le texte fondateur", titre:"La loi du 4 mars 2002",
  paras:["La loi n° 2002-303 du 4 mars 2002 relative aux droits des malades et à la qualité du système de santé réaffirme des droits jusque-là éparpillés dans plusieurs textes, dont la charte du patient hospitalisé de 1995. Elle consacre notamment l'accès direct du patient à son dossier médical.",
   "Le décret n° 2002-637 du 29 avril 2002 en précise les modalités. La consultation sur place des informations est gratuite ; lorsque le demandeur souhaite des copies, les frais laissés à sa charge ne peuvent excéder le coût de la reproduction et, le cas échéant, de l'envoi."],
  encart:{type:"info", titre:"L'expression à connaître", texte:"On parle de « démocratie sanitaire » : le patient devient acteur, ce qui suppose information, consentement et participation active. L'expression est apparue lors des États généraux de la santé, en 1998-1999."}},

 {t:"notion", kick:"Le secret", titre:"Ce que couvre exactement le secret professionnel",
  paras:["L'article L. 1110-4 du code de la santé publique, introduit par la loi du 4 mars 2002, en fait un droit du patient : excepté dans les cas de dérogation expressément prévus par la loi, le secret couvre l'ensemble des informations concernant la personne venues à la connaissance du professionnel de santé.",
   "Sa violation est sanctionnée par l'article 226-13 du code pénal. Le référentiel du diplôme le rappelle sans détour : le préparateur en pharmacie hospitalière est soumis au secret professionnel."],
  encart:{type:"piege", titre:"Trois erreurs fréquentes", texte:"Le secret vaut aussi à l'égard des proches du patient. Il ne cesse pas au décès : certaines informations peuvent être transmises aux ayants droit, sauf si le malade s'y était opposé de son vivant. Et il couvre tout ce que vous apprenez, pas seulement ce qu'on vous a dit officiellement."}},

 {t:"notion", kick:"Le secret partagé", titre:"L'équipe de soins, une exception organisée",
  paras:["Lorsque la personne est prise en charge par une équipe de soins dans un établissement de santé, les informations la concernant sont réputées confiées par le malade à l'ensemble de l'équipe. C'est ce qui rend possible le travail collectif sans violer le secret.",
   "Cette exception a une limite simple à retenir : elle ne justifie que la transmission des informations nécessaires à la prise en charge, aux personnes qui y participent. Elle n'autorise pas la conversation de couloir."],
  encart:{type:"astuce", titre:"Le test à s'appliquer", texte:"Avant de transmettre une information : est-ce que cette personne participe à la prise en charge, et est-ce que cette information lui est nécessaire pour le faire ? Si l'une des deux réponses est non, on se tait."}},

 {t:"notion", kick:"L'information", titre:"Le droit d'être informé",
  paras:["L'article L. 1111-2 du code de la santé publique pose que toute personne a le droit d'être informée sur son état de santé. Cette information porte sur les investigations, traitements ou actions de prévention proposés, leur utilité, leur urgence éventuelle, leurs conséquences, les risques fréquents ou graves normalement prévisibles, ainsi que sur les autres solutions possibles.",
   "L'information est délivrée oralement, de préférence au cours d'un entretien qui lui est spécifiquement consacré ; elle peut s'appuyer sur des documents écrits, mais ceux-ci ne la remplacent pas."],
  encart:{type:"info", titre:"Le lien avec votre métier", texte:"Les critères d'évaluation du diplôme reprennent cette exigence à leur manière : le vocabulaire utilisé est adapté à l'interlocuteur, la compréhension de l'interlocuteur est vérifiée, et des mesures adaptées sont prises pour les personnes en situation de handicap ou de fragilité."}},

 {t:"notion", kick:"Communication", titre:"Transmettre sans trahir",
  paras:["La compétence C10 de l'arrêté du 31 juillet 2024 demande de transmettre informations et données en lien avec la personne soignée, en utilisant les outils numériques, aux membres d'une équipe pluriprofessionnelle, dans un but de coopération et de continuité de service.",
   "Elle impose de respecter les règles de sécurité numérique et la réglementation relative aux données de santé, et de sécuriser son environnement numérique de travail. Communiquer avec la personne soignée, son entourage et les autres professionnels se fait dans le respect des droits du patient et du secret professionnel."],
  encart:{type:"astuce", titre:"Les indicateurs du texte", texte:"Les données transmises doivent être fiables et conformes, organisées et hiérarchisées donc exploitables, les anomalies ou incohérences ciblées, et le vocabulaire adapté aux interlocuteurs et à la situation."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les notions à ne pas confondre", mots:[
  {m:"Déontologie", d:"Ensemble des devoirs professionnels, inscrits dans des codes et opposables. Le manquement expose à une sanction."},
  {m:"Éthique", d:"Réflexion sur ce qu'il est juste de faire quand les règles ne tranchent pas, ou se contredisent."},
  {m:"Secret professionnel", d:"Obligation légale de ne pas révéler les informations connues à raison de sa profession, sanctionnée pénalement."},
  {m:"Secret partagé", d:"Transmission, au sein de l'équipe de soins, des seules informations nécessaires à la prise en charge."},
  {m:"Démocratie sanitaire", d:"Reconnaissance de droits individuels et collectifs des usagers, et de leur participation aux décisions de santé."},
  {m:"Ayant droit", d:"Personne qui peut, après le décès du patient et sous conditions, accéder à certaines informations du dossier médical."}]},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE11", lignes:[
  {v:"1995", l:"charte du patient hospitalisé, l'un des textes que la loi de 2002 vient rassembler"},
  {v:"1998-1999", l:"États généraux de la santé, où apparaît l'expression « démocratie sanitaire »"},
  {v:"4 mars 2002", l:"loi relative aux droits des malades et à la qualité du système de santé"},
  {v:"29 avril 2002", l:"décret précisant les modalités d'accès aux informations de santé"},
  {v:"L. 1110-4", l:"secret professionnel, érigé en droit du patient"},
  {v:"L. 1111-2", l:"droit d'être informé sur son état de santé"},
  {v:"226-13", l:"article du code pénal sanctionnant la violation du secret professionnel"}]},

 {t:"quiz", kick:"Vérification", question:"Le fils d'une patiente hospitalisée vous demande quels médicaments elle prend. Que faites-vous ?",
  options:["Je réponds, il s'agit d'un proche",
   "Je ne réponds pas : le secret vaut aussi à l'égard des proches, et j'oriente vers l'équipe médicale et la patiente elle-même",
   "Je réponds si la patiente est âgée"],
  bonne:1,
  expl:"Le secret professionnel doit être maintenu à l'égard des proches du patient. Seule la patiente peut décider de ce qui est partagé avec sa famille."},

 {t:"quiz", kick:"Vérification", question:"Quel article du code de la santé publique fonde le secret professionnel comme un droit du patient ?",
  options:["L'article L. 1111-2","L'article L. 1110-4","L'article 226-13 du code pénal"],
  bonne:1,
  expl:"L'article L. 1110-4 a été introduit par la loi du 4 mars 2002. L'article L. 1111-2 porte sur le droit à l'information, et l'article 226-13 du code pénal sanctionne la violation du secret."},

 {t:"quiz", kick:"Vérification", question:"Un patient demande une copie de son dossier médical. Que peut-on lui facturer ?",
  options:["Rien, tout est gratuit dans tous les cas",
   "Au plus le coût de la reproduction et, le cas échéant, de l'envoi",
   "Un forfait fixé librement par l'établissement"],
  bonne:1,
  expl:"La consultation sur place est gratuite. Pour les copies, les frais laissés à la charge du demandeur ne peuvent excéder le coût de la reproduction et de l'envoi."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Loi n° 2002-303 du 4 mars 2002", ref:"Droits des malades et qualité du système de santé : accès au dossier, gratuité de la consultation sur place, frais de copie", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000227015/"},
  {titre:"AP-HP, direction des affaires juridiques", ref:"Le secret médical : portée de l'article L. 1110-4, secret à l'égard des proches, cas du patient décédé", url:"https://affairesjuridiques.aphp.fr/textes/le-secret-medical/"},
  {titre:"AP-HP, direction des affaires juridiques", ref:"Accès au dossier médical : loi du 4 mars 2002 et décret n° 2002-637 du 29 avril 2002", url:"https://affairesjuridiques.aphp.fr/textes/acces-au-dossier-medical/"},
  {titre:"Conseil national de l'Ordre des médecins", ref:"Secret professionnel : article 226-13 du code pénal, article L. 1110-4 du CSP, définition extensive de l'équipe de soins", url:"https://www.conseil-national.medecin.fr/code-deontologie/devoirs-generaux-medecins-art-2-31/article-4-secret-professionnel"},
  {titre:"Arrêté du 31 juillet 2024, annexes I et II", ref:"Préparateur soumis au secret professionnel ; compétence C10 et ses critères d'évaluation", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"}],
  note:"Textes consultés le 9 août 2026. Cette leçon ne traite pas de l'économie de la santé ni des modalités de financement des soins, qui figurent parmi les objectifs de l'UE : je n'ai pas pu consulter de source primaire à jour et je préfère ne rien écrire plutôt qu'un chiffre approximatif. Reportez-vous au cours de votre centre pour cette partie."}
]},

"UE11": {titre:"Pédagogie, tutorat, projet personnel et engagement", duree:"13 min", diapos:[
 {t:"intro", kick:"UE12 · pour commencer", titre:"Un jour, ce sera vous le tuteur",
  texte:"Vous êtes en formation aujourd'hui ; dans quelques mois, un étudiant vous suivra en stage et le texte prévoit que ce soit un préparateur en pharmacie hospitalière qui l'encadre. Cette UE prépare ce basculement, et elle porte aussi sur votre propre parcours : portfolio, démarche réflexive, projet professionnel.",
  img:{f:"ue12-01-tutorat.jpg", leg:"Accompagnement d'un étudiant en milieu professionnel"}},

 {t:"notion", kick:"Le cadre", titre:"Qui peut être tuteur",
  paras:["Chaque étudiant se voit attribuer un tuteur de stage. Celui-ci est un préparateur en pharmacie hospitalière. En l'absence de préparateur dans la structure d'accueil, un cadre de santé ou un pharmacien praticien hospitalier peut être désigné tuteur.",
   "Les terrains de stage sont agréés par le directeur du centre de formation, et une convention de stage est signée entre l'apprenant, l'organisme d'accueil et le centre de formation."],
  encart:{type:"info", titre:"L'ordre de priorité", texte:"Le préparateur est le tuteur de droit commun. Le cadre de santé et le pharmacien praticien hospitalier ne viennent qu'à défaut. C'est une reconnaissance de la profession, pas une formalité."}},

 {t:"chiffres", kick:"La formation", titre:"Les chiffres du diplôme", lignes:[
  {v:"1 400 h", l:"durée totale de la formation, travail personnel de l'étudiant inclus"},
  {v:"700 h", l:"formation en milieu professionnel, soit 20 semaines"},
  {v:"60 ECTS", l:"dont 40 pour la théorie et 20 pour les périodes en milieu professionnel"},
  {v:"1 semaine = 1 ECTS", l:"règle de conversion des périodes en milieu professionnel"},
  {v:"35 h", l:"base hebdomadaire des stages, dont 5 à 7 heures dédiées aux travaux de l'étudiant"},
  {v:"70 h", l:"franchise maximale d'absence, soit 5 % de la durée totale de la formation"},
  {v:"25 h", l:"durée maximale d'enseignement par semaine recommandée"}]},

 {t:"etapes", kick:"Le parcours de stage", titre:"Comment se répartissent les 20 semaines",
  etapes:["17 semaines en pharmacie à usage intérieur",
   "Dont 5 semaines en stérilisation et dispositifs médicaux, avec une semaine vers les blocs, plateaux techniques, équipes opérationnelles d'hygiène ou services de soins",
   "Dont 5 semaines en secteur de production : 3 en cytotoxiques injectables et préparations stériles et non stériles, 2 en radiopharmacie",
   "Dont 7 semaines dans les autres secteurs : logistique, essais cliniques, médicaments, services de soins",
   "3 semaines choisies en concertation avec l'équipe pédagogique selon le projet professionnel, dont une semaine pour le service sanitaire"],
  note:"Une adaptation locale de cette répartition est possible selon le projet du centre de formation et l'offre de stage sur le territoire. Le service sanitaire concerne les apprenants à compter de la rentrée universitaire 2025-2026."},

 {t:"notion", kick:"Le portfolio", titre:"À quoi il sert vraiment",
  paras:["Le portfolio est un outil de suivi qui sert à mesurer la progression de l'apprenant en milieu professionnel. Il est centré sur l'acquisition des compétences, des activités et des actes du préparateur en pharmacie hospitalière. L'étudiant le renseigne lui-même.",
   "Le référent pédagogique en charge du suivi fait le bilan des acquisitions avec l'apprenant, le conseille et le guide pour la suite de son parcours. Ce n'est donc pas un carnet de présence : c'est le support d'un dialogue sur ce qui est acquis et ce qui ne l'est pas encore."],
  encart:{type:"piege", titre:"L'erreur à ne pas commettre", texte:"Remplir le portfolio la veille du bilan. Il documente une progression : rempli après coup, il ne documente plus rien et l'entretien perd son objet."}},

 {t:"notion", kick:"L'évaluation en stage", titre:"Trois mots, et rien d'autre",
  paras:["La feuille d'évaluation mesure la progression de l'apprenant et son degré d'acquisition des compétences, à partir des critères et indicateurs du référentiel de compétences. Trois critères d'évaluation seulement sont retenus : non pratiqué, non acquis, acquis.",
   "Dans chaque période, les professionnels du lieu de formation renseignent la feuille par une argumentation précise et factuelle, en présence de l'apprenant. En cas de difficulté d'apprentissage, un entretien entre le tuteur professionnel, l'enseignant référent et l'apprenant est préconisé."],
  encart:{type:"astuce", titre:"Ce que « non pratiqué » veut dire", texte:"Ce n'est pas un échec : c'est l'absence d'occasion. Le distinguer de « non acquis » est essentiel, pour l'étudiant comme pour le tuteur, et c'est ce que le texte impose en n'offrant que trois cases."}},

 {t:"notion", kick:"Accompagner", titre:"Ce qu'on attend d'un tuteur",
  paras:["La compétence C11 demande d'accompagner les pairs, les personnes en formation et les autres professionnels, dans la limite de son champ de compétences, en tenant compte d'éventuels besoins spécifiques des personnes en situation de handicap.",
   "Elle se décline en trois temps : organiser et superviser l'accueil, l'information et les activités d'apprentissage dans un climat de confiance et bienveillant ; mettre en œuvre des actions de transmission de savoir-faire par conseils, démonstrations, explications et analyse commentée de sa propre pratique ; évaluer les compétences mises en œuvre à l'aide des outils de suivi."],
  encart:{type:"info", titre:"Les indicateurs du texte", texte:"Une démarche d'accueil est mise en œuvre et les objectifs d'apprentissage sont formalisés ; les méthodes pédagogiques sont adaptées à l'apprenant et à la situation ; une procédure d'évaluation est appliquée et l'évaluation donne lieu à un échange avec la personne évaluée."}},

 {t:"notion", kick:"Votre parcours", titre:"Démarche réflexive et projet personnel",
  paras:["L'UE vise à se positionner en tant que tuteur et à contribuer au développement de la démarche réflexive dans un contexte de pluridisciplinarité, mais aussi à prendre des initiatives et des engagements, notamment dans le champ de la formation ou professionnel.",
   "La compétence C12 précise ce qu'analyser sa pratique veut dire : la confronter à celle de ses pairs et d'autres professionnels, identifier ses points forts et ses difficultés, analyser ces difficultés et proposer des améliorations, en utilisant les grilles d'habilitation aux postes de travail pour s'auto-évaluer."],
  encart:{type:"astuce", titre:"Une piste concrète", texte:"Les grilles d'habilitation existent déjà dans votre service. S'en servir comme outil d'auto-évaluation est explicitement prévu par le texte, et c'est le moyen le plus simple de repérer un besoin de formation avant qu'il ne devienne un écart."}},

 {t:"encart", kick:"Bon à savoir", titre:"Les règles de validation, en une phrase", type:"garde",
  texte:"Une note au moins égale à 10 sur 20 est requise pour valider un domaine de compétences. Au sein d'un même domaine, les unités d'enseignement dont le résultat est au moins équivalent à 8 sur 20 peuvent être compensées entre elles. Ne peuvent jamais être compensées entre elles les UE de deux domaines différents, ni les UE théoriques et celles de formation en milieu professionnel. Deux sessions d'examen sont prévues ; lorsqu'une UE a été présentée aux deux, c'est la note de la deuxième session qui est retenue."},

 {t:"quiz", kick:"Vérification", question:"Dans une structure sans préparateur en pharmacie hospitalière, qui peut être désigné tuteur de stage ?",
  options:["Personne, le stage ne peut pas avoir lieu",
   "Un cadre de santé ou un pharmacien praticien hospitalier",
   "N'importe quel professionnel de l'équipe"],
  bonne:1,
  expl:"Le tuteur est en principe un préparateur en pharmacie hospitalière. Le texte prévoit explicitement ces deux solutions de remplacement, et elles seulement."},

 {t:"quiz", kick:"Vérification", question:"Vous n'avez jamais eu l'occasion de manipuler en radiopharmacie pendant votre période de stage. Que porte le tuteur sur la feuille d'évaluation ?",
  options:["Non acquis","Non pratiqué","Acquis avec réserve"],
  bonne:1,
  expl:"Les trois seuls critères sont non pratiqué, non acquis et acquis. « Non pratiqué » signale une absence d'occasion, pas un échec : la nuance est précisément ce que le texte permet de tracer."},

 {t:"quiz", kick:"Vérification", question:"Une UE du domaine 3 est notée 7 sur 20, une autre du même domaine 15 sur 20. Que se passe-t-il ?",
  options:["Les deux se compensent, le domaine est validé",
   "Aucune compensation possible : sous 8 sur 20, l'UE n'est pas compensable",
   "La compensation est possible avec une UE d'un autre domaine"],
  bonne:1,
  expl:"La compensation ne joue qu'au-dessus de 8 sur 20 et seulement entre UE d'un même domaine. Jamais entre domaines, jamais entre théorie et stage."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Arrêté du 31 juillet 2024, articles 11 à 19", ref:"Durée de la formation, tutorat, portfolio, convention de stage, franchise d'absence, règles de validation et de compensation", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"},
  {titre:"Arrêté du 31 juillet 2024, annexe III", ref:"Répartition des 20 semaines de formation en milieu professionnel, portfolio, feuille d'évaluation et ses trois critères", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"},
  {titre:"Arrêté du 31 juillet 2024, annexe II", ref:"Compétences C11 et C12, critères d'évaluation et indicateurs", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"},
  {titre:"Légifrance", ref:"Arrêté du 31 juillet 2024 relatif au diplôme d'État de préparateur en pharmacie hospitalière, texte officiel", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000050066720"},
  {titre:"ANFH", ref:"Grade de licence et modification des référentiels ; décret n° 2024-855 du 31 juillet 2024", url:"https://www.anfh.fr/actualites/de-preparateur-en-pharmacie-hospitaliere-grade-licence-et-modification-des-referentiels"}],
  note:"Textes consultés le 9 août 2026, arrêté lu dans son texte intégral. C'est la seule leçon dont la source principale décrit directement votre propre formation : en cas de doute sur une modalité, c'est ce texte qui fait foi, et votre centre qui l'applique."}
]},

"UE12.1": {titre:"Initiation à la démarche de recherche", duree:"13 min", diapos:[
 {t:"intro", kick:"UE13 · pour commencer", titre:"Savoir d'où vient ce qu'on vous affirme",
  texte:"Un fournisseur vous montre une étude, un collègue cite un article, une revue annonce un résultat. Cette UE apprend deux choses : comment une recherche impliquant des personnes est encadrée en France, et comment juger le poids réel d'un résultat avant de changer une pratique."},

 {t:"notion", kick:"Le cadre", titre:"La loi Jardé",
  paras:["La loi n° 2012-300 du 5 mars 2012, dite loi Jardé, encadre les recherches impliquant la personne humaine. Ses décrets d'application ont été promulgués le 16 novembre 2016 avec le décret n° 2016-1537, à effet immédiat.",
   "Elle a changé le vocabulaire : les termes « recherche biomédicale » et « recherche en soins courants » sont obsolètes. On parle désormais de recherche impliquant la personne humaine, en abrégé RIPH."],
  encart:{type:"garde", titre:"Attention, ça a changé", texte:"Si votre cours parle encore de « recherche biomédicale » au sens de la loi Huriet-Sérusclat de 1988, ou de « recherche en soins courants » issue de la loi de 2004, il décrit un vocabulaire abandonné depuis 2016."}},

 {t:"chiffres", kick:"Le cœur de l'UE", titre:"Les trois catégories de RIPH", lignes:[
  {v:"RIPH 1", l:"recherches interventionnelles comportant une intervention sur la personne non justifiée par sa prise en charge habituelle"},
  {v:"RIPH 2", l:"recherches interventionnelles ne comportant que des risques et des contraintes minimes"},
  {v:"RIPH 3", l:"recherches non interventionnelles, sans aucun risque ni contrainte pour les participants"}],
  note:"Article L. 1121-1 du code de la santé publique. Les listes permettant de classer une recherche en catégorie 2 ou 3 sont fixées par deux arrêtés du 12 avril 2018, publiés au Journal officiel du 18 avril 2018."},

 {t:"notion", kick:"Les autorisations", titre:"Qui doit dire oui, et à quel titre",
  paras:["Toutes les catégories requièrent l'avis favorable d'un comité de protection des personnes. Le CPP est devenu la seule instance éthique pour l'ensemble des RIPH, avec une demande d'avis obligatoire pour les trois catégories.",
   "En revanche, l'autorisation de l'ANSM n'est obligatoire que pour la catégorie 1. Pour les catégories 2 et 3, l'agence est informée : on lui transmet une copie de l'avis favorable du CPP et le résumé de la recherche."],
  encart:{type:"astuce", titre:"Le schéma à retenir", texte:"CPP pour les trois catégories, toujours. ANSM : autorisation en catégorie 1, information en catégories 2 et 3. C'est la question qui tombe le plus souvent sur ce chapitre."}},

 {t:"notion", kick:"Le participant", titre:"Consentement ou non-opposition",
  paras:["Les recherches de catégories 1 et 2 nécessitent le consentement des personnes concernées. Les recherches de catégorie 3 se limitent à leur information et au recueil de leur non-opposition.",
   "Toutes les RIPH sont diffusées dans un répertoire public, et chacune porte un numéro d'identification, l'ID-RCB, demandé auprès de l'ANSM."],
  encart:{type:"piege", titre:"Le piège", texte:"« Pas de consentement » ne veut pas dire « pas d'information ». En catégorie 3, la personne doit être informée et pouvoir s'opposer : c'est une exigence, pas une formalité facultative."}},

 {t:"notion", kick:"L'organisation", titre:"Le tirage au sort des comités",
  paras:["Les comités de protection des personnes ne sont plus choisis dans l'inter-région de l'investigateur coordonnateur : ils sont désignés par tirage au sort, après dépôt du dossier auprès d'un guichet unique.",
   "La loi Jardé a créé la commission nationale des recherches impliquant la personne humaine, la CNRIPH, chargée notamment d'assurer la formation des membres des comités, de les réunir au moins une fois par an et d'homogénéiser leurs pratiques. Son secrétariat assure le tirage au sort des dossiers."],
  encart:{type:"info", titre:"Pourquoi ce tirage au sort", texte:"Il rompt le lien géographique entre le promoteur et le comité qui l'évalue. C'est une mesure d'indépendance, pas une complication administrative."}},

 {t:"chiffres", kick:"Lire la littérature", titre:"Les quatre niveaux de preuve", lignes:[
  {v:"Niveau 1", l:"essais comparatifs randomisés de forte puissance sans biais majeur, méta-analyses d'essais randomisés"},
  {v:"Niveau 2", l:"essais comparatifs randomisés de faible puissance, études comparatives non randomisées bien menées, études de cohorte"},
  {v:"Niveau 3", l:"études cas-témoins"},
  {v:"Niveau 4", l:"études comparatives à biais importants, études rétrospectives, séries de cas, études épidémiologiques descriptives"}],
  note:"Grille de gradation utilisée en France par la HAS, issue du guide d'analyse de la littérature de l'ANAES. Le niveau de preuve caractérise la capacité d'une étude à répondre à la question posée."},

 {t:"notion", kick:"Lire la littérature", titre:"Du niveau de preuve au grade",
  paras:["À chaque niveau correspond un grade de recommandation. Grade A : preuve scientifique établie, fondée sur des études de niveau 1. Grade B : présomption scientifique, fondée sur des études de niveau 2. Grade C : études de moindre niveau de preuve, niveaux 3 et 4.",
   "S'il n'y a pas de précision, la recommandation s'appuie sur un accord professionnel. Et la gradation d'une recommandation ne présume pas obligatoirement du degré de sa force : une recommandation de grade C peut être forte."],
  encart:{type:"piege", titre:"L'erreur de raisonnement", texte:"Confondre niveau de preuve et importance clinique. Le niveau décrit la solidité de la démonstration, pas l'ampleur du bénéfice ni l'urgence d'appliquer le résultat."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots de la méthode", mots:[
  {m:"Randomisation", d:"Attribution par tirage au sort du groupe de traitement, pour rendre les groupes comparables."},
  {m:"Puissance", d:"Capacité d'une étude à mettre en évidence une différence qui existe réellement. Une étude de faible puissance peut conclure à tort à l'absence d'effet."},
  {m:"Biais", d:"Erreur systématique qui fausse le résultat dans un sens donné. Un biais ne se corrige pas en augmentant l'effectif."},
  {m:"Méta-analyse", d:"Synthèse quantitative de plusieurs essais portant sur la même question."},
  {m:"Étude de cohorte", d:"Suivi d'un groupe exposé et d'un groupe non exposé dans le temps, sans attribution du traitement par l'investigateur."},
  {m:"Étude cas-témoins", d:"Comparaison rétrospective de personnes atteintes et non atteintes, à la recherche d'une exposition passée."},
  {m:"Promoteur", d:"Personne ou organisme qui prend l'initiative de la recherche et en assure la gestion."}]},

 {t:"notion", kick:"Votre rôle", titre:"Ce que le référentiel attend de vous",
  paras:["La compétence C12 demande de rechercher et d'analyser les publications scientifiques et professionnelles et les ressources documentaires internationales, afin de suivre les évolutions des connaissances dans une démarche d'amélioration continue.",
   "Elle demande aussi de conduire des actions de recherche ou des études à visée professionnelle en lien avec l'exercice de préparateur, et d'élaborer des documents professionnels et scientifiques en vue de leur communication orale et écrite."],
  encart:{type:"astuce", titre:"Les indicateurs du texte", texte:"Les données pertinentes sont recherchées et sélectionnées dans les documents professionnels et scientifiques en français et en anglais ; les bases documentaires sont utilisées correctement et avec discernement, y compris les sources internet."}},

 {t:"quiz", kick:"Vérification", question:"Une étude non interventionnelle par questionnaire, qui ne modifie pas la prise en charge, est envisagée dans votre PUI. Quelles démarches ?",
  options:["Aucune, elle sort du champ de la loi",
   "Avis d'un CPP, et information de l'ANSM par transmission de l'avis favorable et du résumé",
   "Avis d'un CPP et autorisation de l'ANSM"],
  bonne:1,
  expl:"C'est une RIPH de catégorie 3 : l'avis du CPP est requis comme pour les trois catégories, mais l'autorisation de l'ANSM n'est exigée qu'en catégorie 1."},

 {t:"quiz", kick:"Vérification", question:"Un article rapporte une série de cas favorable à une nouvelle pratique. Quel niveau de preuve ?",
  options:["Niveau 1","Niveau 2","Niveau 4"],
  bonne:2,
  expl:"Les séries de cas relèvent du niveau 4, avec les études rétrospectives et les études descriptives. Cela ne rend pas le résultat faux, mais il ne peut pas à lui seul fonder un changement de pratique."},

 {t:"quiz", kick:"Vérification", question:"Comment le comité de protection des personnes chargé d'un dossier est-il désigné ?",
  options:["Par le promoteur, dans sa région","Par tirage au sort","Par l'ARS de l'établissement investigateur"],
  bonne:1,
  expl:"Le tirage au sort a remplacé le rattachement à l'inter-région de l'investigateur coordonnateur. Le secrétariat de la CNRIPH l'assure."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Université de Lorraine, cellule éthique et intégrité scientifique", ref:"Les trois catégories de RIPH selon l'article L. 1121-1 du CSP, consentement et non-opposition, démarches ANSM", url:"https://www.univ-lorraine.fr/luniversite-de-lorraine/ethique-deontologie-integrite-scientifique/ethique/la-loi-jarde-et-son-application/"},
  {titre:"SFRMS", ref:"Loi Jardé en pratique : rôle du CPP par catégorie, arrêtés du 12 avril 2018, création et missions de la CNRIPH, tirage au sort", url:"https://www.sfrms-sommeil.org/loi-jarde-application-pratique/"},
  {titre:"Comité de protection des personnes Sud-Méditerranée II", ref:"Loi n° 2012-300 du 5 mars 2012, décret n° 2016-1537 du 16 novembre 2016, guichet unique et tirage au sort", url:"https://www.cpp-sudmed2.fr/Soumission-des-dossiers"},
  {titre:"HAS", ref:"Niveau de preuve et gradation des recommandations de bonne pratique — état des lieux", url:"https://www.has-sante.fr/jcms/c_1600564/fr/niveau-de-preuve-et-gradation-des-recommandations-de-bonne-pratique-etat-des-lieux"},
  {titre:"Ministère chargé de la santé", ref:"Tableau de gradation des recommandations et des niveaux de preuve", url:"https://sante.gouv.fr/IMG/pdf/02_Gradation_et_niveau_de_preuve.pdf"},
  {titre:"Arrêté du 31 juillet 2024, annexe II", ref:"Compétence C12 et ses critères d'évaluation", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"}],
  note:"Textes consultés le 9 août 2026. Les catégories de RIPH et les circuits d'autorisation évoluent régulièrement : vérifiez la date de votre support avant de réviser ce chapitre."}
]},

"UE12.2": {titre:"Anglais", duree:"12 min", diapos:[
 {t:"intro", kick:"UE14 · pour commencer", titre:"Reading, not speaking",
  texte:"L'objectif de cette UE n'est pas de tenir une conversation : c'est d'acquérir les connaissances en anglais permettant d'appréhender la lecture d'articles scientifiques, et de communiquer en anglais dans le domaine de la santé et des soins. Autrement dit, comprendre un résumé, une notice, un étiquetage — pas discuter météo."},

 {t:"notion", kick:"Pourquoi l'anglais", titre:"Ce que le référentiel exige, exactement",
  paras:["L'annexe III de l'arrêté du 31 juillet 2024 fixe deux objectifs pour l'UE Anglais : acquérir les connaissances permettant d'appréhender la lecture d'articles scientifiques, et communiquer en anglais dans le domaine de la santé et des soins.",
   "Un indicateur de la compétence C12 le confirme : les données pertinentes sont recherchées et sélectionnées dans les documents professionnels et scientifiques en français et en anglais. L'anglais n'est pas un supplément culturel, c'est un outil de veille."],
  encart:{type:"info", titre:"Ce qui est évalué", texte:"L'évaluation de cette UE peut être écrite, orale, ou prendre la forme d'un dossier individuel ou collectif. Elle vaut 2 ECTS, dans le domaine 5."}},

 {t:"vocab", kick:"Core vocabulary", titre:"Les mots du métier", mots:[
  {m:"Pharmaceutical dose form", d:"Forme pharmaceutique. Terme officiel des Standard Terms, à préférer à « dosage form » dans un contexte réglementaire européen."},
  {m:"Route of administration", d:"Voie d'administration."},
  {m:"Container, closure, delivery device", d:"Récipient, système de fermeture, dispositif d'administration."},
  {m:"Batch, lot", d:"Lot de fabrication."},
  {m:"Shelf life", d:"Durée de conservation."},
  {m:"Storage conditions", d:"Conditions de conservation."},
  {m:"Compounding", d:"Réalisation de préparations."},
  {m:"Adverse event", d:"Événement indésirable, sans préjuger du lien de causalité."},
  {m:"Adverse reaction", d:"Effet indésirable, c'est-à-dire un événement pour lequel un lien avec le produit est suspecté."},
  {m:"SmPC", d:"Summary of Product Characteristics, le résumé des caractéristiques du produit."}]},

 {t:"notion", kick:"Une base de référence", titre:"Les Standard Terms de l'EDQM",
  paras:["La base Standard Terms, créée à la demande de la Commission européenne et gérée par l'EDQM, contient les termes et définitions décrivant les formes pharmaceutiques, les voies et méthodes d'administration, les unités de présentation, les récipients, systèmes de fermeture et dispositifs d'administration, pour les médicaments à usage humain et vétérinaire.",
   "Elle donne l'équivalent de plus de 900 termes dans 35 langues, dont le français et l'anglais. Elle contient aussi des termes combinés, et des patient-friendly terms, plus courts, utilisables sur certaines étiquettes lorsque la place est limitée."],
  encart:{type:"astuce", titre:"L'usage à en faire", texte:"C'est un dictionnaire bilingue officiel de votre métier, gratuit et en ligne. Pour traduire « comprimé pelliculé » ou « solution pour perfusion » sans risque d'erreur, c'est la source à utiliser, pas un traducteur automatique."},
  img:{f:"ue14-04-etiquetage.jpg", leg:"Étiquetage d'un médicament en anglais"}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE14", lignes:[
  {v:"900+", l:"termes disponibles dans la base Standard Terms"},
  {v:"35", l:"langues couvertes par la base"},
  {v:"1996", l:"première liste de Standard Terms, publiée dans une édition spéciale de Pharmeuropa"},
  {v:"2014", l:"refonte complète de la base, dont l'accès devient gratuit"},
  {v:"30/06/2022", l:"usage des termes EDQM rendu obligatoire pour les déclarations à EudraVigilance"}]},

 {t:"notion", kick:"Reading", titre:"Ce que l'on cherche dans un résumé",
  paras:["Un résumé d'article scientifique répond toujours aux mêmes questions, quel que soit le vocabulaire employé : quelle était la question posée, sur qui ou sur quoi, avec quelle méthode, quel résultat chiffré, et quelle conclusion les auteurs en tirent.",
   "Repérer ces cinq éléments suffit pour décider si l'article mérite une lecture complète. Le reste du vocabulaire s'apprend en lisant, pas en apprenant des listes par cœur."],
  encart:{type:"piege", titre:"Le réflexe à garder", texte:"La conclusion d'un résumé est écrite par les auteurs, qui ont intérêt à ce que leur travail paraisse utile. Le chiffre du résultat, lui, ne ment pas : c'est celui qu'il faut lire en premier."}},

 {t:"vocab", kick:"False friends", titre:"Les faux amis à ne pas rater", mots:[
  {m:"Drug", d:"Médicament ou substance active, selon le contexte. Ce n'est pas systématiquement une drogue au sens français."},
  {m:"Preservative", d:"Conservateur d'une préparation. « Préservatif » se dit condom."},
  {m:"Assist", d:"Aider, seconder. « Assister à » se dit attend."},
  {m:"Actually", d:"En réalité, en fait. « Actuellement » se dit currently."},
  {m:"Eventually", d:"Finalement, à terme. « Éventuellement » se dit possibly."},
  {m:"Injury", d:"Lésion, blessure. Ce n'est pas une injure."},
  {m:"Prescription", d:"Ordonnance. Le mot français « prescription » au sens juridique de délai se dit statute of limitations."}]},

 {t:"notion", kick:"Writing", titre:"Communiquer par écrit dans un contexte de soins",
  paras:["Le second objectif de l'UE est de communiquer en anglais dans le domaine de la santé et des soins. Dans un service, cela veut dire des choses simples et précises : signaler une rupture, transmettre une modalité de reconstitution, demander une confirmation de dosage.",
   "La règle utile est la même qu'en français : une information par phrase, les unités toujours écrites, et la vérification de la compréhension de l'interlocuteur, que le référentiel exige quelle que soit la langue employée."],
  encart:{type:"info", titre:"Le point d'attention", texte:"Les unités et les séparateurs décimaux ne s'écrivent pas de la même façon selon les pays. Un chiffre mal recopié depuis un document anglophone est une erreur médicamenteuse en puissance : recopier l'unité en toutes lettres lève l'ambiguïté."}},

 {t:"quiz", kick:"Vérification", question:"Dans un document réglementaire européen, comment traduit-on « forme pharmaceutique » ?",
  options:["Drug shape","Pharmaceutical dose form","Medicine type"],
  bonne:1,
  expl:"C'est le terme officiel des Standard Terms de l'EDQM, base créée à la demande de la Commission européenne et utilisée notamment dans les autorisations de mise sur le marché et les étiquetages."},

 {t:"quiz", kick:"Vérification", question:"Quelle est la différence entre « adverse event » et « adverse reaction » ?",
  options:["Aucune, ce sont deux synonymes",
   "L'événement indésirable survient sans préjuger d'un lien de causalité, l'effet indésirable suppose un lien suspecté avec le produit",
   "L'adverse reaction est toujours plus grave"],
  bonne:1,
  expl:"La distinction est la même qu'en français entre événement indésirable et effet indésirable. La confondre fausse toute lecture d'un article de pharmacovigilance."},

 {t:"quiz", kick:"Vérification", question:"Un article indique que the study eventually included 240 patients. Que signifie « eventually » ?",
  options:["Éventuellement, peut-être","Finalement, à terme","Régulièrement"],
  bonne:1,
  expl:"C'est l'un des faux amis les plus fréquents. « Éventuellement » se traduit par possibly, et « actuellement » par currently."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Arrêté du 31 juillet 2024, annexes II et III", ref:"Objectifs pédagogiques de l'UE Anglais, 2 ECTS ; indicateur de la compétence C12 sur les documents en français et en anglais", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"},
  {titre:"EDQM, Standard Terms database", ref:"Contenu de la base : formes pharmaceutiques, voies d'administration, récipients, termes combinés, patient-friendly terms, 900 termes en 35 langues", url:"https://www.edqm.eu/en/standard-terms-database"},
  {titre:"EDQM, Standard Terms", ref:"Historique de la base : première liste dans Pharmeuropa en 1996, refonte et gratuité en 2014", url:"https://standardterms.edqm.eu/"},
  {titre:"EMA", ref:"Usage obligatoire des terminologies EDQM pour les formes et voies d'administration dans les déclarations à EudraVigilance depuis le 30 juin 2022", url:"https://www.ema.europa.eu/en/documents/other/mandatory-use-iso-icsrich-e2br3-and-edqm-terminology-dosage-forms-df-and-routes-administration-roa_en.pdf"}],
  note:"Consulté le 9 août 2026. Cette leçon est volontairement centrée sur le vocabulaire réglementaire vérifiable et sur les faux amis : je n'ai pas construit de cours de grammaire ni de liste d'expressions toutes faites, faute de source institutionnelle sur laquelle les appuyer. Le cours de votre centre reste la référence pour la partie linguistique."}
]},

"UE13": {titre:"Démarche qualité et gestion des risques", duree:"14 min", diapos:[
 {t:"intro", kick:"UE15 · pour commencer", titre:"Ce qui transforme une erreur en enseignement",
  texte:"Toute organisation produit des erreurs. Ce qui distingue une organisation sûre d'une organisation dangereuse, ce n'est pas leur absence : c'est ce qu'elle en fait. Signaler, analyser les causes, corriger, vérifier que la correction tient. Cette UE décrit ce cycle et les instances qui le rendent obligatoire."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots de la qualité", mots:[
  {m:"Non-conformité", d:"Écart constaté entre ce qui était prévu et ce qui a été fait ou obtenu."},
  {m:"Événement indésirable", d:"Fait survenu au cours de la prise en charge, susceptible de causer un dommage."},
  {m:"EIGS", d:"Événement indésirable grave associé à des soins, dont la déclaration est obligatoire."},
  {m:"Action corrective", d:"Mesure prise pour supprimer la cause d'un écart déjà survenu et éviter sa répétition."},
  {m:"Action préventive", d:"Mesure prise pour supprimer la cause d'un écart potentiel, avant qu'il ne survienne."},
  {m:"Procédure", d:"Document décrivant la manière de réaliser une activité, opposable dans le système qualité."},
  {m:"Structure régionale d'appui", d:"La SRA : structure mise en place par l'ARS pour aider les professionnels à analyser les causes d'un EIGS."}]},

 {t:"notion", kick:"Les vigilances", titre:"Cinq vigilances nommées par le référentiel",
  paras:["La compétence C13 demande de mettre en œuvre les principes et règles de vigilance dans toute activité, pour assurer la qualité et la traçabilité des interventions. Le texte en nomme cinq : pharmacovigilance, matériovigilance, réactovigilance, identitovigilance et vigilance informatique.",
   "L'indicateur associé est bref et sans ambiguïté : les principes et règles de vigilance sont expliqués, et tout événement indésirable est signalé à l'interlocuteur approprié."],
  encart:{type:"astuce", titre:"Le réflexe de tri", texte:"Un médicament : pharmacovigilance. Un dispositif médical : matériovigilance. Un dispositif de diagnostic in vitro ou un réactif : réactovigilance. Une erreur d'identité de patient : identitovigilance. Un dysfonctionnement du système d'information : vigilance informatique."}},

 {t:"encart", kick:"Attention, ça a changé", titre:"La déclaration des EIGS est obligatoire depuis 2016", type:"garde",
  texte:"Le décret n° 2016-1606 du 25 novembre 2016, pris en application de l'article 161 de la loi du 26 janvier 2016, a créé un dispositif national de déclaration des événements indésirables graves associés à des soins et institué les structures régionales d'appui à la qualité des soins et à la sécurité des patients. Un support antérieur à 2017 ne décrit ni ce circuit, ni le rôle des SRA."},

 {t:"etapes", kick:"Le circuit", titre:"Comment se déclare un EIGS",
  etapes:["Tout professionnel de santé, quel que soit son lieu et son mode d'exercice, ou le représentant légal de l'établissement, constate l'événement",
   "Il le déclare au directeur général de l'ARS au moyen d'un formulaire dont la forme et le contenu sont fixés par arrêté",
   "Première partie, adressée sans délai : nature de l'événement, circonstances de survenue, premières mesures prises localement, mention de l'information donnée",
   "Analyse approfondie des causes par les professionnels concernés, avec l'aide de la structure régionale d'appui",
   "Seconde partie, dans les trois mois : descriptif de la gestion, éléments de retour d'expérience, plan d'actions correctrices avec échéances de mise en œuvre et d'évaluation",
   "Transmission des deux parties par l'ARS à la HAS, sans le nom du déclarant ni l'adresse du lieu de survenue"],

 {t:"erreur", q:"Un agent de stérilisation reçoit un plateau du bloc, non prédésinfecté et sec depuis plusieurs heures. Il le passe directement en laveur-désinfecteur, recompose le plateau sans contrôler la fonctionnalité des instruments, puis lance un cycle vapeur en se fiant au voyant vert de l'autoclave pour libérer la charge. Relevez les non-conformités.",
  a:"Quatre écarts. La prédésinfection est le premier traitement, effectué au plus près de l'utilisation : son absence compromet le nettoyage et expose le personnel. Le contrôle de propreté et de fonctionnalité précède la recomposition : un instrument défectueux ne doit pas repartir en circulation. La recomposition suit la composition de référence du plateau, qui doit être vérifiée. Enfin, la libération est une décision pharmaceutique fondée sur le contrôle des paramètres du cycle et sur l'ensemble des enregistrements, pas sur un voyant : la stérilité se prouve par la maîtrise du procédé.",
  m:["prédésinfection","fonctionnalité","composition de référence","libération","paramètres"],
  s:"Bonnes pratiques de pharmacie hospitalière, ligne directrice particulière n° 1."},

 {t:"situation", q:"Pourquoi ne peut-on pas contrôler la stérilité de chaque sachet avant de le distribuer, et comment garantit-on alors la qualité ?",
  a:"Ouvrir le conditionnement pour vérifier la stérilité le détruit : le contrôle serait destructif et porterait sur un échantillon non représentatif. La garantie repose donc sur la maîtrise du procédé : validation initiale conforme aux normes opposables, dont la NF EN ISO 14937, contrôle de routine des paramètres de chaque cycle, enregistrement de ces paramètres, traçabilité de chaque unité d'emploi jusqu'au cycle et aux opérateurs, puis libération pharmaceutique fondée sur ces éléments.",
  m:["destructif","validation","paramètres","traçabilité","libération"],
  s:"Arrêté du 3 juin 2002 ; bonnes pratiques de pharmacie hospitalière, ligne directrice n° 1."},

 {t:"ouverte", q:"Quelles sont les trois catégories de procédés de stérilisation mises en œuvre après conditionnement, et laquelle domine en France ?",
  a:"La stérilisation à la vapeur d'eau saturée, la stérilisation à basse température par le peroxyde d'hydrogène gazeux associé ou non à d'autres gaz, et la stérilisation par irradiation, qui en France n'est utilisée que dans l'industrie. La vapeur d'eau domine en établissement de santé. La chaleur sèche est proscrite, et l'oxyde d'éthylène comme le formaldéhyde ne sont plus utilisés en établissement de santé français.",

  s:"SF2S, procédés de stérilisation."},

 {t:"erreur", q:"Dans une ZAC, un opérateur constate une souillure au sol en milieu de matinée. Il note qu'un nettoyage est prévu le soir et poursuit son travail. En fin de session, il oublie l'empreinte de gant, et le résultat d'air actif du mois dernier, au-dessus du seuil d'alerte, n'a donné lieu à aucune action. Relevez les non-conformités.",

 {t:"situation", q:"Un nouvel arrivant vous demande pourquoi l'hygiène des mains reste la mesure la plus importante alors qu'il porte des gants. Que lui répondez-vous ?",
  a:"Le port de gants ne remplace pas l'hygiène des mains : une hygiène des mains est pratiquée après avoir retiré les gants, comme après avoir retiré un masque ou une protection de la tenue. Les gants se contaminent, se percent et se retirent mal. La friction hydro-alcoolique est la technique de référence, plus rapide, mieux tolérée et efficace sur la flore transitoire, à condition d'attendre l'évaporation complète avant de toucher le patient ou le matériel. C'est une mesure des précautions standard, appliquée pour tout patient quel que soit son statut.",

  s:"SF2H, Précautions standard juin 2017 ; recommandations sur l'hygiène des mains."},

 {t:"ouverte", q:"Pourquoi dit-on qu'une salle propre ne se juge pas à l'œil ?",
  a:"Parce que la propreté d'une zone classée est définie par des mesures : un nombre maximal de particules par taille et par mètre cube, qui détermine la classe selon NF ISO 14644, et des limites de contamination microbiologique exprimées en unités formant colonie, contrôlées selon NF EN 17141, avec des fréquences de prélèvement définies et des seuils d'alerte et d'action. Une surface peut sembler impeccable et dépasser les seuils, et inversement. Seuls les prélèvements, tracés et interprétés, permettent de conclure.",
  m:["particules","classe","unités formant colonie","seuils","prélèvements"],
  s:"BPP 2023, ligne directrice LD1 ; normes NF ISO 14644 et NF EN 17141."}
],

     "Le nombre de patients inclus","La notoriété de la revue"], r:1,
  c:"Il se juge par l'adéquation entre le design de l'étude et la question posée : population, critères de jugement, biais, méthodes statistiques, puissance.",
  s:"HAS, définition du niveau de preuve."},

 {t:"qcmMulti", q:"Quels éléments entrent dans l'appréciation du niveau de preuve d'une étude ?",
  o:["La présence de biais","La puissance statistique","Le choix des critères de jugement","Le pays de publication"], r:[0,1,2],
  c:"Le pays de publication n'est pas un critère méthodologique.",

 {t:"cloze", q:"Une erreur systématique qui fausse un résultat dans un sens donné et ne se corrige pas en augmentant l'effectif s'appelle un _____.",
  r:"biais", s:"HAS, guide d'analyse de la littérature."},

 {t:"erreur", q:"Un fournisseur vous présente une série de cas de douze patients, publiée dans un congrès, et affirme qu'elle démontre la supériorité de son dispositif et justifie de modifier votre procédure dès la semaine prochaine. Que relevez-vous ?",
  a:"Trois problèmes. Une série de cas relève du niveau de preuve 4, le plus faible : elle ne permet pas de conclure à une supériorité, faute de groupe comparateur et de randomisation. Une communication de congrès n'a pas le même statut qu'un article publié dans un journal à comité de lecture. Enfin, le changement de procédure relève d'une décision fondée sur l'analyse des données disponibles et validée dans le cadre du système qualité, en concertation avec l'équipe, et non sur la présentation d'un fournisseur.",
  m:["niveau","comparateur","comité de lecture","procédure","équipe"],
  s:"HAS, niveaux de preuve ; arrêté du 31 juillet 2024, compétences C12 et C13."},

 {t:"situation", q:"Votre PUI souhaite mener une étude par questionnaire auprès des patients, sans modifier leur prise en charge. Quelles démarches entreprendre ?",
  a:"Il s'agit d'une recherche non interventionnelle, donc d'une RIPH de catégorie 3 : tous les actes sont pratiqués et les produits utilisés de manière habituelle, sans procédure supplémentaire de diagnostic, de traitement ou de surveillance. L'avis favorable d'un comité de protection des personnes est requis, ce comité étant désigné par tirage au sort après dépôt auprès du guichet unique. L'ANSM n'a pas à autoriser la recherche mais reçoit une copie de l'avis favorable et le résumé. Les participants doivent être informés et pouvoir s'opposer. La recherche reçoit un numéro ID-RCB et figure au répertoire public.",
  m:["catégorie 3","comité de protection","tirage au sort","ANSM","s'opposer"],
  s:"Loi Jardé et ses textes d'application ; article L. 1121-1 du CSP."},

 {t:"ouverte", q:"Pourquoi l'avis d'un CPP est-il requis même pour une recherche sans risque ?",
  a:"Parce que le CPP est devenu la seule instance éthique pour l'ensemble des RIPH, et que l'absence de risque physique n'écarte ni les enjeux de protection des données, ni l'exigence d'information des personnes et de recueil de leur non-opposition, ni la qualité méthodologique du protocole. La loi Jardé a maintenu un niveau élevé de protection tout en modulant les démarches auprès de l'ANSM selon la catégorie.",
  m:["CPP","instance éthique","information","non-opposition","protection"],
  s:"SFRMS, loi Jardé en pratique."},

 {t:"vf", q:"Toutes les recherches impliquant la personne humaine sont diffusées dans un répertoire public.",
  r:true, c:"Exact, et chacune porte un numéro ID-RCB demandé auprès de l'ANSM.",
  s:"Documentation sur la mise en œuvre de la loi Jardé."}
],

 {t:"situation", q:"Un patient reçoit un médicament destiné à un autre patient, avec une conséquence grave. Quelles obligations s'imposent à l'établissement ?",

  s:"Décret n° 2016-1606 du 25 novembre 2016 ; arrêté du 31 juillet 2024, compétence C13."},

 {t:"qcm", q:"Une préparation présente un critère relevant de la catégorie 2 et un critère relevant de la catégorie 3. Comment la classez-vous ?",

 {t:"erreur", q:"Un préparateur commence un lot de gélules. Il pèse la substance active, est appelé au téléphone dix minutes, revient, termine la préparation puis enchaîne immédiatement sur une seconde préparation différente sur le même plan de travail sans autre formalité. Relevez les non-conformités et l'action corrective attendue.",
  a:"Trois écarts : l'opération d'un lot doit être confiée préférentiellement à la même personne sans être interrompue avant la réalisation complète ; une seule préparation à la fois est réalisée sur une même zone de travail ; un vide de ligne doit être effectué avant le nouveau lot pour éliminer tout risque de contamination croisée. Action corrective : tracer l'interruption dans le relevé d'anomalies du dossier de lot, réaliser le vide de ligne et le nettoyage de la zone avant toute nouvelle préparation.",
  m:["interruption","une seule préparation","vide de ligne","contamination croisée","dossier de lot"],
  s:"BPP 2023, point 5.34 et note de bas de page sur le vide de ligne au point 5.35."},

 {t:"situation", q:"Le pharmacien vous demande de préparer une poche de cytotoxique alors que l'alarme du système de traitement d'air de la ZAC s'est déclenchée il y a dix minutes. Que faites-vous et sur quoi vous appuyez-vous ?",
  a:"On ne démarre pas. L'alimentation en air filtré doit être maintenue en toutes circonstances pour garantir la pression positive, et toute déficience détectée par l'alarme est portée sans délai à la connaissance du pharmacien désigné comme responsable des préparations. Les vérifications de conformité des contrôles d'environnement sont réalisées avant utilisation de la zone. L'incident est tracé, la conformité de la ZAC rétablie et vérifiée avant reprise.",
  m:["alarme","pression positive","pharmacien désigné","contrôles d'environnement","tracé"],
  s:"BPP 2023, LD1 points 51 et 52, et point 5.36."},

 {t:"ouverte", q:"Quelle est la différence entre le dossier de préparation et le dossier de lot ?",
  a:"Le dossier de préparation regroupe en trois parties la validité technico-réglementaire, la description du procédé et des spécifications, et la description des contrôles ; il sert de matrice et peut couvrir plusieurs préparations de même composition qualitative. Le dossier de lot concerne un lot précis et comporte cinq parties : préparation, conditionnement, contrôle, libération pharmaceutique, gestion des anomalies ou retours et réclamations.",
  m:["trois parties","matrice","lot","cinq parties","libération"],
  s:"BPP 2023, points 4.30, 4.31, 4.36 et 4.38."},

 {t:"qcm", q:"Combien de temps le livre-registre des préparations est-il conservé ?",
  o:["1 an","5 ans","10 ans","Selon le règlement interne de l'établissement"], r:2,
  c:"Le dossier de préparation se conserve 5 ans après la péremption du dernier lot ; le dossier de lot 1 an au moins, ou 10 ans s'il sert à la traçabilité du livre-registre.",
  s:"BPP 2023, tableau d'archivage du point 4.47."},

 {t:"vf", q:"Les préparations de médicaments radiopharmaceutiques peuvent être réalisées en officine sur autorisation.",
  r:false, c:"Faux. Le champ d'application des BPP l'énonce clairement : ces préparations ne sont pas autorisées en officine.",
  s:"BPP 2023, champ d'application, renvoi à l'article L. 5125-1-1 du CSP."}
],

 {t:"erreur", q:"Un opérateur prépare une dose de MRP, la contrôle lui-même faute de collègue disponible, l'étiquette avec la seule dénomination du produit et l'activité mesurée, puis la range en attendant l'appel du service dans une heure. Relevez les non-conformités.",
  a:"Trois écarts au moins : le contrôle de qualité doit être réalisé par une personne formée et habilitée différente de celle qui a préparé, sauf exception justifiée ; l'étiquetage de la dose destinée au patient doit comporter l'identité du patient, le numéro d'enregistrement, la date et l'heure limite d'utilisation, l'activité avec sa date et son heure exacte, et le trisecteur ; l'heure limite d'utilisation d'une dose à administrer ne doit pas excéder 30 minutes sauf justification, donc une heure d'attente n'est pas acceptable en l'état.",

 {t:"situation", q:"Vous découvrez, en fin de session, qu'une préparation de MRP est non conforme au contrôle. Que devient-elle et quelle décision doit être formalisée ?",
  a:"Après recherche des causes de l'anomalie, toute préparation non conforme est considérée comme un déchet radioactif et traitée comme telle, donc entreposée en décroissance dans le local prévu au plan de gestion des déchets radioactifs. La décision de conformité ou de non-conformité du lot appartient au radiopharmacien et doit être formellement enregistrée, y compris lorsque des préparations ont été délivrées avant l'achèvement de tous les contrôles.",
  m:["déchet radioactif","recherche des causes","radiopharmacien","enregistrée","décroissance"],
  s:"BPP 2023, LD4 points 23, 96 et 97."},

 {t:"ouverte", q:"Expliquez la différence entre dosimètre passif et dosimètre opérationnel, et le rôle du système SISERI.",
  a:"Le dosimètre passif, à lecture différée, mesure a posteriori la dose reçue par le corps entier ou une partie du corps et alimente le suivi réglementaire. Le dosimètre opérationnel est actif, à lecture directe, porté en zone contrôlée, en zone d'extrémité et en zone d'opération ; il mesure la dose en temps réel, est paramétré par le conseiller en radioprotection et dispose d'alarmes sonores et visuelles activées. SISERI centralise, consolide et conserve l'ensemble des résultats de la surveillance individuelle des travailleurs.",
  m:["lecture différée","lecture directe","temps réel","alarmes","SISERI"],
  s:"INRS, réglementation rayonnements ionisants ; ASNR, modalités de surveillance de l'exposition des travailleurs."},

 {t:"vf", q:"Pour les préparations radiopharmaceutiques, la constitution d'une échantillothèque est obligatoire.",

  s:"BPP 2023, LD4 point 98."},

/* =========================================================================

   Un anneau à trois segments : acquis, fait sans être acquis, jamais fait.

function repartition(l, table){
  const t = table || S.progres;
  let jamais = 0, encours = 0, acquis = 0;
  l.forEach(i => { const p = t[i.id];
    if(!p || !p.vus) jamais++; else if(p.boite === 3) acquis++; else encours++; });
  return {total:l.length, jamais, encours, acquis};
}
function anneau3(c, taille, centre){
  const t = Math.max(1, c.total);
  const r = (taille - 9) / 2, circ = 2 * Math.PI * r;
  const seg = (n, coul, debut) => {
    const l = circ * n / t;
    if(l <= 0) return "";
    return `<circle cx="${taille/2}" cy="${taille/2}" r="${r}" fill="none" stroke="${coul}"
      stroke-width="7" stroke-dasharray="${l.toFixed(1)} ${(circ - l).toFixed(1)}"
      stroke-dashoffset="${(-circ * debut / t).toFixed(1)}"
      transform="rotate(-90 ${taille/2} ${taille/2})"></circle>`;
  };
  const val = centre !== undefined ? centre : (c.total ? Math.round(c.acquis / c.total * 100) + "%" : "—");
  return `<svg width="${taille}" height="${taille}" viewBox="0 0 ${taille} ${taille}" class="anneau3"
    role="img" aria-label="${c.acquis} acquis, ${c.encours} à reprendre, ${c.jamais} jamais faits">
    <circle cx="${taille/2}" cy="${taille/2}" r="${r}" fill="none" stroke="var(--trait2)" stroke-width="7"></circle>
    ${seg(c.acquis, "var(--menthe)", 0)}
    ${seg(c.encours, "var(--or)", c.acquis)}
    <text x="${taille/2}" y="${taille/2}" text-anchor="middle" dominant-baseline="central"
      font-family="'IBM Plex Mono',monospace" font-size="${Math.round(taille/4.6)}"
      font-weight="600" fill="var(--encre)">${esc(String(val))}</text></svg>`;
}
function legendeSegments(){
  return `<div class="legSeg">
    <span><i style="background:var(--menthe)"></i>acquis</span>
    <span><i style="background:var(--or)"></i>à reprendre</span>
    <span><i style="background:var(--trait2)"></i>jamais fait</span></div>`;
}
/* Couverture d'une unité : combien d'exercices existent, et dans quel état. */
function couvertureUE(ueId, banque){
  const l = banque === "prep" ? itemsExos(ueId) : tousItems().filter(i => i.ueId === ueId);
  const c = repartition(l);
  c.part = c.total ? Math.round(c.acquis / c.total * 100) : 0;
  c.cours = banque === "prep" ? 0 : S.cours.filter(x => x.ueId === ueId).length;
  return c;
}
/* Ce qui pèse lourd en crédits et qui n'est pas su passe devant. */
function urgenceUE(u, banque){ return u.ects * (1 - couvertureUE(u.id, banque).part / 100); }
function bandeauDomaines(banque){
  let h = `<div class="anneaux">`;
  for(let d = 1; d <= 5; d++){
    const l = banque === "prep"
      ? UES.filter(u => u.dom === d).flatMap(u => itemsExos(u.id))
      : tousItems().filter(i => { const u = UE(i.ueId); return u && u.dom === d; });
    h += `<button class="anneauD" data-act="ecran" data-e="${banque === "prep" ? "accueil" : "reviser"}">
      ${anneau3(repartition(l), 64)}

      <span class="lab2">${l.length ? l.length + " ex." : "aucun"}</span></button>`;
  }
  return h + `</div>` + legendeSegments();
}
function ligneUE(u, banque){
  const c = couvertureUE(u.id, banque);
  let etat, bouton = "";
  if(banque === "prep"){
    const L = LECONS[u.id], p = L ? progLecon(u.id) : null;
    if(!L) etat = "leçon à venir";

    else etat = c.acquis + " acquis · " + c.encours + " à reprendre · " + c.jamais + " jamais faits";
    if(L) bouton = `<button class="btn mini" data-act="ouvrir-lecon" data-ue="${esc(u.id)}">${p.termine ? "Revoir" : (p.index ? "Reprendre" : "Lire")}</button>`;
  } else {
    etat = c.total ? c.acquis + " acquis · " + c.encours + " à reprendre · " + c.jamais + " jamais faits"
      : (c.cours ? "cours importé, aucun exercice" : "rien d'importé");
    if(c.total) bouton = `<button class="btn mini" data-act="session" data-source="ue" data-ue="${esc(u.id)}">Réviser</button>`;
  }
  return `<div class="ligneUE"><span class="pastUE" style="background:${DOMAINES[u.dom].coul}">${esc(u.id.replace("UE",""))}</span>
    <span class="tx"><b>${esc(tronquer(u.nom, 42))}</b><small>${esc(etat)}</small>

    <span class="fin"><span class="coef">${u.ects}</span>${bouton}</span></div>`;
}

async function ouvrirDecoupe(fichier){
  ui.message = {type:"info", titre:"Ouverture du PDF", txt:fichier.name}; rendre();
  try{
    await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await window.pdfjsLib.getDocument({data: await fichier.arrayBuffer()}).promise;
    ui.decoupe = {doc, page:1, total:doc.numPages, rect:null};
    ui.ecran = "decoupe"; ui.message = null; rendre();
    await dessinerPage();
  }catch(e){ ui.message = {type:"err", titre:"PDF illisible", txt:e.message}; rendre(); }
}
async function dessinerPage(){
  const d = ui.decoupe; if(!d) return;
  const cv = document.getElementById("cv-pdf"); if(!cv) return;
  const page = await d.doc.getPage(d.page);
  const large = Math.min(520, (cv.parentElement || {clientWidth:360}).clientWidth || 360);
  const v0 = page.getViewport({scale:1});
  const ech = large / v0.width;
  const vp = page.getViewport({scale: ech * 2});   // deux fois la taille d'affichage, pour la netteté
  cv.width = vp.width; cv.height = vp.height;
  cv.style.width = large + "px"; cv.style.height = (vp.height / 2) + "px";
  const ctx = cv.getContext("2d");
  if(!ctx) return;
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  d.rect = null; majCadre();
}
function majCadre(){
  const c = document.getElementById("cadre"), d = ui.decoupe;
  if(!c) return;
  if(!d || !d.rect){ c.style.display = "none"; return; }
  const r = d.rect;
  c.style.display = "block";
  c.style.left = Math.min(r.x0, r.x1) + "px"; c.style.top = Math.min(r.y0, r.y1) + "px";
  c.style.width = Math.abs(r.x1 - r.x0) + "px"; c.style.height = Math.abs(r.y1 - r.y0) + "px";
}
async function extraireZone(){
  const d = ui.decoupe, c = S.cours.find(x => x.id === ui.fiche);
  if(!d || !d.rect || !c) return;
  const cv = document.getElementById("cv-pdf");
  const f = cv.width / parseFloat(cv.style.width);   // affichage vers pixels réels
  const x = Math.min(d.rect.x0, d.rect.x1) * f, y = Math.min(d.rect.y0, d.rect.y1) * f;
  const w = Math.abs(d.rect.x1 - d.rect.x0) * f, hh = Math.abs(d.rect.y1 - d.rect.y0) * f;
  if(w < 20 || hh < 20){ ui.message = {titre:"Zone trop petite", txt:"Encadrez une zone plus large."}; rendre(); return; }
  const dst = document.createElement("canvas");
  dst.width = Math.round(w); dst.height = Math.round(hh);
  const ctx = dst.getContext("2d");
  if(!ctx){ ui.message = {type:"err", titre:"Extraction impossible", txt:"Le navigateur refuse l'accès au canevas."}; rendre(); return; }
  ctx.drawImage(cv, x, y, w, hh, 0, 0, dst.width, dst.height);
  const url = dst.toDataURL("image/jpeg", 0.9);
  try{
    const im = await redimensionner(url);
    await ajouterVisuel(c, im, "pdf");
    ui.message = {type:"info", titre:"Zone extraite", txt:"Ajoutez-lui une légende et un emplacement."};
    ui.ecran = "visuels"; rendre();
  }catch(e){ ui.message = {type:"err", titre:"Extraction impossible", txt:e.message}; rendre(); }
}
async function ajouterVisuel(c, im, origine){
  const id = uid();
  const ou = await ecrireImage(id, im.blob);
  if(!c.visuels) c.visuels = [];
  c.visuels.push({id, legende:"", place:"fin", w:im.w, h:im.h, origine});
  sauver();
  const b = await lireImage(id);
  if(b){ const u = await urlPour(b); if(u) URL_IMG[id] = u; }
  return ou;
}

function visHtml(c, place, pourImpression){

/* =========================================================================
   PODCAST — transformer un contenu en audio à écouter hors ligne

/* La matière de départ : une fiche importée, ou une leçon de préparation terminée. */
function matierePodcast(source){
  if(source.kind === "cours"){
    const c = S.cours.find(x => x.id === source.id);
    if(!c) return null;
    const f = c.fiche;
    const bl = (t, l) => l && l.length ? "\n" + t + "\n" + l.join("\n") : "";
    return {ueId:c.ueId, titre:c.titre, texte:
      (f.resume ? f.resume + "\n" : "") +
      bl("DÉFINITIONS :", (f.definitions||[]).map(x => {
        let t = "- " + x.terme + " : " + x.def;
        const r = x.reform && (x.reform.tres || x.reform.simple);
        if(r) t += "\n  [dit plus simplement : " + r + "]";
        return t;
      })) +
      bl("SIGLES :", (f.sigles||[]).map(x => "- " + x.sigle + " : " + x.sens)) +
      bl("À SAVOIR PAR CŒUR :", (f.points||[]).map(x => "- " + x.txt)) +
      bl("CHIFFRES CLÉS :", (f.chiffres||[]).map(x => "- " + x.txt)) +
      bl("TEXTES ET NORMES :", (f.normes||[]).map(x => "- " + x.txt)) +
      bl("PIÈGES :", (f.pieges||[]).map(x => "- " + x.txt)) +
      bl("SUITES D'ÉTAPES :", (f.procedures||[]).map(x => "- " + (x.etapes||[]).join(" puis ")))};
  }
  const L = LECONS[source.id];
  if(!L) return null;
  const morceaux = [];
  L.diapos.forEach(d => {
    if(d.t === "sources" || d.t === "quiz") return;
    if(d.titre) morceaux.push("## " + d.titre);
    if(d.texte) morceaux.push(d.texte);
    if(d.paras) morceaux.push(d.paras.join(" "));
    if(d.mots) d.mots.forEach(m => morceaux.push("- " + m.m + " : " + m.d));
    if(d.etapes) d.etapes.forEach((e,i) => morceaux.push((i+1) + ". " + e));
    if(d.lignes) d.lignes.forEach(l => morceaux.push("- " + l.v + " : " + l.l));
    if(d.encart) morceaux.push((d.encart.titre ? d.encart.titre + " : " : "") + d.encart.texte);
    if(d.note) morceaux.push(d.note);
  });
  return {ueId:source.id, titre:L.titre, texte:morceaux.join("\n")};
}

/* Reformule toutes les définitions retenues en un seul appel. */
async function reformuler(niveau){
  const c = S.cours.find(x => x.id === ui.fiche);
  if(!c || !(c.fiche.definitions || []).length) return;
  if(S.reglages.moteur !== "gemini" || !S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Gemini est nécessaire", txt:"Reformuler demande l'API. Renseignez la clé dans les réglages."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Reformulation en cours…"; ui.message = null; rendre();
  try{
    const out = await reformulerGemini(c.fiche.definitions, niveau, S.reglages.cleGemini, S.reglages.modele);
    let n = 0;
    Object.keys(out).forEach(i => {
      const x = c.fiche.definitions[Number(i)];
      if(!x) return;
      if(!x.reform) x.reform = {};
      x.reform[niveau] = out[i]; n++;
    });
    sauver();
    ui.voirReform = niveau;
    ui.message = n ? {type:"info", titre:"Reformulé",
      txt: n + " définition" + (n>1?"s":"") + " en « " + NIVEAUX_REFORM[niveau].nom.toLowerCase() + " ». Le texte du cours reste affiché au-dessus."}
      : {titre:"Rien n'est revenu", txt:"Relancez, ou essayez un autre niveau."};
  }catch(e){ ui.message = {type:"err", titre:"Reformulation interrompue", txt:e.message}; }
  ui.occupe = false; ui.etape = ""; rendre();
}

async function faireSchema(id, type){
  const c = S.cours.find(x => x.id === id);
  if(!c) return;
  if(S.reglages.moteur !== "gemini" || !S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Gemini est nécessaire",
      txt:"Écrire le code d'un schéma demande l'API. Le rendu, lui, se fait sur l'appareil."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Construction du schéma…"; ui.message = null; rendre();
  try{
    const r = await schemaGemini(c.fiche, c.ueId, type, S.reglages.cleGemini, S.reglages.modele);
    const x = {id:uid(), titre:r.titre, type, code:r.code, cree:Date.now()};
    try{ await rendreSchema(x.id, x.code); }
    catch(e){ x.erreur = String(e && e.message || e).slice(0,160); }
    schemasDe(c).push(x);
    sauver();
    ui.message = x.erreur
      ? {type:"err", titre:"Schéma à corriger", txt:"Le code produit ne se rend pas. Ouvrez-le et corrigez la ligne fautive."}
      : {type:"info", titre:"Schéma ajouté", txt:"Il se range dans la fiche et s'imprime avec elle."};
  }catch(e){ ui.message = {type:"err", titre:"Construction interrompue", txt:e.message}; }

async function reRendreSchema(idCours, idSchema){

  ui.occupe = false; sauver(); rendre();

  return h + `</div>`;

/* Transcription de notes manuscrites. Étape strictement séparée de l'analyse :
   c'est au déchiffrage que les erreurs s'introduisent, elles doivent être
   corrigeables avant que quoi que ce soit n'en découle. */
const PHOTO_MAX = 8, PHOTO_PX = 2000, PHOTO_QUALITE = 0.86;
function consigneTranscription(){
  return [
"Tu transcris les notes manuscrites d'un étudiant préparant le diplôme d'État de préparateur en pharmacie hospitalière.",
"Ta seule tâche est de LIRE et de RECOPIER. Tu ne corriges pas, tu ne complètes pas, tu n'expliques pas.",
"",
"RÈGLES ABSOLUES :",
"1. Ne corrige pas le fond, même si une affirmation te semble fausse. Recopie ce qui est écrit.",
"2. N'ajoute aucun mot, aucune phrase, aucun titre qui ne figure pas sur la page.",
"3. Un mot que tu n'arrives pas à lire devient exactement [?]. Un passage entier illisible devient exactement [passage illisible].",
"4. Ne devine JAMAIS un chiffre, une date, une posologie, une unité, un nom propre ou un sigle. Dans le doute, écris [?].",
"5. Conserve la structure : # pour les titres, - pour les listes, **entre doubles astérisques** pour ce qui est souligné, surligné ou encadré.",
"6. Sépare les pages par une ligne contenant uniquement ---",
"7. Ne mets aucun commentaire avant ou après la transcription.",
"",
"Réponds en texte simple, sans balisage autre que celui décrit ci-dessus."
  ].join("\n");
}
function enBase64(blob){
  return new Promise((ok, ko) => {
    const fr = new FileReader();
    fr.onload = () => { const s = String(fr.result || ""); const i = s.indexOf(","); ok(i >= 0 ? s.slice(i+1) : s); };
    fr.onerror = () => ko(new Error("Lecture de l'image impossible."));
    fr.readAsDataURL(blob);
  });
}
async function transcrire(photos, cle, modele){
  const parts = [];
  for(const p of photos) parts.push({inline_data:{mime_type:"image/jpeg", data: await enBase64(p.blob)}});
  parts.push({text:"Transcris ces " + photos.length + " page" + (photos.length>1?"s":"") + " de notes manuscrites."});
  const cand = await appelGemini({
    systemInstruction:{parts:[{text:consigneTranscription()}]},
    contents:[{role:"user", parts}],
    generationConfig:{temperature:0, maxOutputTokens:8192}
  }, modele, cle);
  const t = (cand.content && cand.content.parts || []).map(p => p.text || "").join("").trim();
  if(!t) throw new Error("Aucun texte n'a pu être lu sur ces pages.");
  return t;
}
function compterIllisibles(t){
  const mots = (String(t||"").match(/\[\?\]/g) || []).length;
  const blocs = (String(t||"").match(/\[passage illisible\]/g) || []).length;
  return {mots, blocs, total: mots + blocs};
}

async function lancerTranscription(){
  const l = ui.photos || [];
  if(!l.length) return;
  if(!S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Configuration incomplète", txt:"Renseignez la clé et le modèle dans les réglages."};
    rendre(); return;
  }
  ui.occupe = true; ui.message = null; rendre();
  let t;
  try{ t = await transcrire(l, S.reglages.cleGemini, S.reglages.modele); }
  catch(e){ ui.occupe = false; ui.message = {type:"err", titre:"Déchiffrage interrompu", txt:e.message}; rendre(); return; }
  ui.occupe = false;
  const n = compterIllisibles(t);
  // les photos ne sont pas conservées : seul le texte relu le sera
  viderPhotos();
  ui.importTexte = ui.importTexte ? ui.importTexte + "\n\n" + t : t;
  if(!ui.importUE) ui.importUE = detecterUE(ui.importTexte) || "";
  const al = sonderDonnees(ui.importTexte);
  ui.avisRGPD = al.length ? al : null; ui.rgpdIgnore = false;
  ui.transcritIllisibles = n;
  ui.ecran = "import";
  ui.message = {type:"info", titre:"Transcription terminée",
    txt:"Relisez le texte avant de lancer l'analyse. Les pages photographiées ont été effacées."};
  rendre(); window.scrollTo(0,0);
}
