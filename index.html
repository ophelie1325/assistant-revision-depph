        <ul class="vocab">${ui.testCle.etapes.map(x => `<li><b>${x.etat==="ok"?"✓":"✗"} ${esc(x.nom)}</b><span>${esc(x.detail)}</span></li>`).join("")}</ul>
        </div>` : ""}
      <p style="font-size:13px;color:var(--encre2)">La clé reste sur cet appareil. Sur l'offre gratuite, Google peut utiliser les contenus transmis pour entraîner ses modèles : aucune donnée de patient.</p>`;
  }
  h += `<p class="kick" style="margin-top:20px">Lecture audio</p>
    <label class="champ" for="v-voix">Voix</label>
    <select id="v-voix" data-bind="voix"><option value="">Voix par défaut</option>
      ${voix.map(v => `<option value="${esc(v.name)}"${r.voix===v.name?" selected":""}>${esc(v.name)}</option>`).join("")}</select>
    <label class="champ" for="v-deb" style="margin-top:12px">Débit</label>
    <input type="number" id="v-deb" data-bind="debitVoix" min="0.5" max="2" step="0.1" value="${r.debitVoix}">`;
  const poids = poidsDonnees();
  h += `<p class="kick" style="margin-top:20px">Sauvegarde</p>
    <div class="rang"><button class="btn mini" data-act="exporter">Exporter</button>
      <label class="btn mini" for="i-json">Importer</label>
      <input type="file" id="i-json" accept=".json" style="display:none"></div>
    <label class="champ" for="r-rap">Me rappeler d'exporter toutes les</label>
    <select id="r-rap" data-bind="rappelExport">
      ${[0,3,5,10,20].map(n => `<option value="${n}"${Number(r.rappelExport)===n?" selected":""}>${n ? n + " sessions" : "jamais"}</option>`).join("")}</select>
    <p style="font-size:12.5px;color:var(--encre2);margin-top:8px">
      Dernière sauvegarde : ${S.meta.dernierExport ? dateFr(new Date(S.meta.dernierExport).toISOString()) : "jamais"}.
      Données stockées : ${poidsLisible(poids)}.</p>
    ${poids > 3500000 ? `<div class="avis"><b>Stockage bientôt saturé</b>
      Vos données approchent la limite habituelle des navigateurs. Exportez, puis supprimez les cours dont vous n'avez plus besoin.</div>` : ""}`;

  h += `<p class="kick" style="margin-top:20px">Effacement ciblé</p>
    <label class="champ" for="ef-ue">Remettre à zéro une unité d'enseignement</label>
    <select id="ef-ue" data-bind="effacerUE"><option value="">— choisir —</option>
      ${UES.map(u => `<option value="${u.id}"${ui.effacerUE===u.id?" selected":""}>${u.id} · ${esc(tronquer(u.nom,38))}</option>`).join("")}</select>
    <div class="rang"><button class="btn mini" data-act="effacer-ue"${ui.effacerUE?"":" disabled"} style="color:var(--rouge)">Effacer la progression de cette UE</button>
      <button class="btn mini" data-act="imprimer-ue"${ui.effacerUE?"":" disabled"}>Imprimer cette UE</button></div>
    <p style="font-size:12.5px;color:var(--encre3)">L'effacement porte sur la progression : boîtes, erreurs et avancement de la leçon. Les cours importés et leurs fiches sont conservés.</p>`;

  const ecartes = itemsEcartes().length;
  h += `<p class="kick" style="margin-top:20px">Exercices écartés</p>
    <p style="font-size:14px;color:var(--encre2)">${ecartes ? ecartes + " exercice" + (ecartes>1?"s":"") + " ne tombent plus en session." : "Aucun exercice écarté."}</p>
    ${ecartes ? `<div class="rang"><button class="btn mini" data-act="reintegrer">Tous les réintégrer</button></div>` : ""}`;

  h += `<p class="kick" style="margin-top:20px">Zone sensible</p>
    <div class="rang"><button class="btn mini" data-act="tout-effacer" style="color:var(--rouge)">Tout effacer</button></div>
    <p style="font-size:12.5px;color:var(--encre3)">Les leçons de préparation ne sont pas effacées par ce bouton : seuls vos cours, exercices et résultats le sont.</p>`;
  return h + `</div>`;
}
/* =========================================================================
   25. ACTIONS ET ÉVÉNEMENTS
   ========================================================================= */
async function analyser(){
  const texte = (ui.importTexte||"").trim();
  if(texte.length < 200){
    ui.message = {titre:"Texte trop court", txt:"Quelques paragraphes au minimum pour produire une fiche utile."};
    rendre(); return;
  }
  const al = sonderDonnees(texte);
  if(al.length && !ui.rgpdIgnore){ ui.avisRGPD = al; rendre(); return; }
  const emp = empreinte(texte);
  const jumeau = S.cours.find(c => c.emp === emp);
  if(jumeau && !ui.doublonIgnore){
    ui.message = {titre:"Ce cours semble déjà importé",
      txt:"Un cours au contenu identique existe déjà sous le titre « " + jumeau.titre + " ». Réimporter créerait des exercices en double. Relancez l'analyse pour passer outre."};
    ui.doublonIgnore = true; rendre(); return;
  }
  const ueId = ui.importUE || detecterUE(texte);
  if(!ueId){ ui.message = {titre:"Unité à préciser", txt:"Elle n'a pas pu être déduite du texte : choisissez-la dans la liste."}; rendre(); return; }
  ui.occupe = true; ui.message = null; rendre();
  let res, origine = S.reglages.moteur;
  try{
    if(origine === "gemini"){
      if(!S.reglages.cleGemini || !S.reglages.modele) throw new Error("Renseignez la clé et le modèle dans les réglages, ou repassez en mode local.");
      const morceaux = decouperTexte(texte, 16000);
      if(morceaux.length > 1){
        const parts = [];
        for(let k = 0; k < morceaux.length; k++){
          ui.message = {type:"info", titre:"Cours long", txt:"Analyse du morceau " + (k+1) + " sur " + morceaux.length + "…"};
          rendre();
          parts.push(await analyseGemini(morceaux[k], ueId, S.reglages.cleGemini, S.reglages.modele));
        }
        res = fusionnerAnalyses(parts);
      } else res = await analyseGemini(texte, ueId, S.reglages.cleGemini, S.reglages.modele);
    } else res = analyseLocale(texte, ueId);
  }catch(e){ ui.occupe = false; ui.message = {type:"err", titre:"Analyse interrompue", txt:e.message}; rendre(); return; }
  if(!res.items.length){
    ui.occupe = false;
    ui.message = {titre:"Aucun exercice tiré de ce texte",
      txt:"Un cours structuré — définitions, listes, valeurs chiffrées — donne de bien meilleurs résultats."};
    rendre(); return;
  }
  const titre = (ui.importTitre||"").trim() || res.fiche.titreDetecte || UE(ueId).nom;
  const c = {id:uid(), titre, ueId, date:new Date().toISOString(), origine, fiche:res.fiche,
    items:res.items.map(i => Object.assign(i, {ueId})), texte, emp:empreinte(texte)};
  S.cours.push(c); sauver();
  ui.occupe = false; ui.importTexte = ""; ui.importTitre = ""; ui.importUE = "";
  ui.avisRGPD = null; ui.rgpdIgnore = false; ui.fiche = c.id; ui.ecran = "fiche";
  ui.message = {type:"info", titre:"Fiche créée", txt:res.items.length + " exercices générés."};
  rendre(); window.scrollTo(0,0);
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const a = el.dataset.act, s = ui.session;
  switch(a){
    case "nav": ui.session = null; clearInterval(minuteur); aller(el.dataset.tab, "accueil"); break;
    case "ecran": ui.ecran = el.dataset.e; ui.message = null; rendre(); window.scrollTo(0,0); break;
    case "filtre": ui.filtreUE = el.dataset.ue; rendre(); break;
    case "src": { const c = document.getElementById(el.dataset.cible); if(c) c.classList.toggle("ouvert"); break; }

    /* --- leçons --- */
    case "ouvrir-lecon": {
      ui.ue = el.dataset.ue;
      const p = progLecon(ui.ue);
      if(p.termine) p.index = 0;
      ui.quizRep = null; ui.ecran = "lecon"; sauver(); rendre(); window.scrollTo(0,0); break;
    }
    case "fermer-lecon": ui.ecran = "accueil"; ui.quizRep = null; rendre(); break;
    case "quiz": {
      const d = LECONS[ui.ue].diapos[progLecon(ui.ue).index];
      ui.quizRep = Number(el.dataset.k);
      progLecon(ui.ue).quiz[progLecon(ui.ue).index] = ui.quizRep === d.bonne;
      sauver(); rendre(); break;
    }
    case "diapo-suiv": {
      const p = progLecon(ui.ue), L = LECONS[ui.ue];
      if(p.index >= L.diapos.length - 1){
        p.termine = true; p.index = L.diapos.length - 1; sauver();
        ui.ecran = "accueil"; ui.quizRep = null;
        ui.message = {type:"info", titre:"Leçon terminée",
          txt: L.titre + (EXOS[ui.ue] ? " — les exercices de cette unité vous attendent plus bas." : " — vous pouvez la reprendre quand vous voulez.")};
      } else { p.index++; ui.quizRep = null; sauver(); }
      rendre(); window.scrollTo(0,0); break;
    }
    case "diapo-prec": { const p = progLecon(ui.ue); if(p.index > 0) p.index--; ui.quizRep = null; sauver(); rendre(); window.scrollTo(0,0); break; }

    /* --- fiches --- */
    case "ouvrir-fiche": ui.fiche = el.dataset.id; ui.ecran = "fiche"; rendre(); window.scrollTo(0,0); break;
    case "imprimer": imprimerFiche(el.dataset.id); break;
    case "fiche-erreurs": imprimerErreurs(); break;
    case "lire": { const c = S.cours.find(x => x.id === el.dataset.id); if(c) lire(texteFiche(c)); break; }
    case "stop-lecture": if(window.speechSynthesis) speechSynthesis.cancel(); break;
    case "supprimer":
      if(confirm("Supprimer ce cours, sa fiche et ses exercices ?")){
        const c = S.cours.find(x => x.id === el.dataset.id);
        if(c) c.items.forEach(i => delete S.progres[i.id]);
        S.cours = S.cours.filter(x => x.id !== el.dataset.id);
        sauver(); ui.ecran = "fiches"; rendre();
      } break;
    case "analyser": await analyser(); break;
    case "anonymiser": ui.importTexte = anonymiser(ui.importTexte); ui.avisRGPD = null; ui.rgpdIgnore = true;
      ui.message = {type:"info", titre:"Texte anonymisé", txt:"Relisez-le avant de lancer l'analyse."}; rendre(); break;
    case "rgpd-ignorer": ui.rgpdIgnore = true; ui.avisRGPD = null; rendre(); break;

    /* --- sessions --- */
    case "exos": lancerExosPrep(el.dataset.ue, el.dataset.mode || ""); break;
    case "session": lancerSession(el.dataset.source, el.dataset.ue, el.dataset.id); break;
    case "choix": {
      const it = s.liste[s.i];
      if(it.type === "qcmMulti"){ const k = Number(el.dataset.k); s.choix = s.choix || [];
        s.choix = s.choix.includes(k) ? s.choix.filter(x => x !== k) : s.choix.concat([k]); }
      else if(it.type === "vf") s.choix = el.dataset.v === "true";
      else s.choix = Number(el.dataset.k);
      rendre(); break;
    }
    case "sur": s.sur = el.dataset.v === "1"; rendre(); break;
    case "monter": { const p = Number(el.dataset.p); [s.ordre[p-1], s.ordre[p]] = [s.ordre[p], s.ordre[p-1]]; rendre(); break; }
    case "descendre": { const p = Number(el.dataset.p); [s.ordre[p+1], s.ordre[p]] = [s.ordre[p], s.ordre[p+1]]; rendre(); break; }
    case "valider": valider(); break;
    case "passer": if(s.mode === "examen") s.resultats.push({id:s.liste[s.i].id, ueId:s.liste[s.i].ueId, juste:false}); suivant(); break;
    case "auto": { const it = s.liste[s.i], j = el.dataset.v === "1";
      majProg(it.id, j, s.sur); s.resultats.push({id:it.id, ueId:it.ueId, juste:j}); suivant(); break; }
    case "suivant": suivant(); break;
    case "quitter-session": terminerSession(); break;
    case "lancer-examen": {
      const nb = Math.max(10, Math.min(60, Number(document.getElementById("e-nb").value) || 20));
      const mn = Math.max(5, Math.min(180, Number(document.getElementById("e-min").value) || 30));
      ui.resultat = null; ouvrirSession(composerExamen(nb), "examen", mn*60); break;
    }

    /* --- réglages --- */
    case "jour-off": {
      const k = Number(el.dataset.k);
      const l = (S.reglages.joursOff || []).map(Number);
      S.reglages.joursOff = l.includes(k) ? l.filter(x => x !== k) : l.concat([k]);
      sauver(); rendre(); break;
    }
    case "date-vider": { delete datesUE()[el.dataset.ue]; sauver(); rendre(); break; }
    case "moteur": S.reglages.moteur = el.dataset.v; ui.testCle = null; sauver(); rendre(); break;
    case "affichage": S.reglages.affichage = el.dataset.v; sauver(); appliquerAffichage(); rendre(); break;
    case "theme": S.reglages.theme = el.dataset.v; sauver(); appliquerAffichage(); rendre(); break;
    case "texte": S.reglages.texte = el.dataset.v; sauver(); appliquerAffichage(); rendre(); break;
    case "voir-cle": ui.cleVisible = !ui.cleVisible; rendre(); break;
    case "rappel-plus-tard": S.meta.sessionsExport = 0; S.meta.dernierExport = Date.now(); sauver(); rendre(); break;
    case "reintegrer": S.cours.forEach(c => c.items.forEach(i => { delete i.douteux; })); sauver(); rendre(); break;
    case "imprimer-ue": if(ui.effacerUE) imprimerUE(ui.effacerUE); break;
    case "effacer-ue": {
      const u = ui.effacerUE; if(!u) break;
      if(confirm("Remettre à zéro toute la progression de " + u + " ?")){
        S.cours.filter(c => c.ueId === u).forEach(c => c.items.forEach(i => delete S.progres[i.id]));
        itemsExos(u).forEach(i => delete S.progres[i.id]);
        if(S.prep[u]) S.prep[u] = {index:0, termine:false, quiz:{}};
        sauver();
        ui.message = {type:"info", titre:"Progression effacée", txt:"Tout ce qui concerne " + u + " repart de zéro."};
        rendre();
      } break;
    }
    case "aller-lecon": {
      ui.ue = el.dataset.ue;
      const p = progLecon(ui.ue); p.index = Number(el.dataset.i) || 0;
      ui.quizRep = null; ui.tab = "prep"; ui.ecran = "lecon"; sauver(); rendre(); window.scrollTo(0,0); break;
    }
    case "exo-editer": ui.editExo = ui.editExo === s.liste[s.i].id ? null : s.liste[s.i].id; rendre(); break;
    case "exo-annuler": ui.editExo = null; rendre(); break;
    case "exo-enregistrer": enregistrerEdition(); break;
    case "exo-douteux": retirerExercice("douteux"); break;
    case "exo-supprimer": if(confirm("Supprimer définitivement cet exercice ?")) retirerExercice("supprimer"); break;
    case "tester-cle": ui.testCle = {etapes:[], fini:false}; rendre(); await testerCle(); break;
    case "charger-modeles": {
      if(!S.reglages.cleGemini){ ui.message = {titre:"Clé manquante", txt:"Collez d'abord votre clé Google AI Studio."}; rendre(); break; }
      el.textContent = "Chargement…";
      try{
        const m = await listerModeles(S.reglages.cleGemini);
        S.reglages.modeles = m;
        if(!S.reglages.modele && m.length){
          const pref = m.find(x => /flash/i.test(x.id) && !/lite|preview|exp/i.test(x.id)) || m.find(x => /flash/i.test(x.id)) || m[0];
          S.reglages.modele = pref.id;
        }
        sauver(); ui.message = {type:"info", titre:"Modèles chargés", txt:m.length + " modèles disponibles."};
      }catch(err){ ui.message = {type:"err", titre:"Clé refusée", txt:err.message}; }
      rendre(); break;
    }
    case "json-annuler": ui.importJSON = null; rendre(); break;
    case "json-remplacer":
      if(confirm("Remplacer toutes vos données actuelles ? Cette action est définitive.")){
        S = Object.assign(etatVierge(), ui.importJSON.donnees);
        S.reglages = Object.assign(etatVierge().reglages, ui.importJSON.donnees.reglages || {});
        S.meta = Object.assign(etatVierge().meta, ui.importJSON.donnees.meta || {});
        ui.importJSON = null; sauver(); ui.fiche = null; aller("rev","accueil");
      } break;
    case "json-fusion": {
      const o = ui.importJSON.donnees;
      const connus = new Set(S.cours.map(c => c.emp || c.id));
      let n = 0;
      (o.cours || []).forEach(c => { if(!connus.has(c.emp || c.id)){ S.cours.push(c); n++; } });
      Object.keys(o.progres || {}).forEach(k => { if(!S.progres[k]) S.progres[k] = o.progres[k]; });
      Object.keys(o.prep || {}).forEach(k => {
        const a = S.prep[k], b = o.prep[k];
        if(!a || (b && (b.termine && !a.termine || (b.index || 0) > (a.index || 0)))) S.prep[k] = b;
      });
      (o.examens || []).forEach(e => { if(!S.examens.some(x => x.date === e.date)) S.examens.push(e); });
      ui.importJSON = null; sauver();
      ui.message = {type:"info", titre:"Fusion effectuée", txt:n + " cours ajouté" + (n>1?"s":"") + ", vos données existantes sont intactes."};
      rendre(); break;
    }
    case "exporter":
      telecharger("prepa-depph-" + new Date().toISOString().slice(0,10) + ".json", JSON.stringify(S, null, 1));
      S.meta.dernierExport = Date.now(); S.meta.sessionsExport = 0; sauver(); rendre(); break;
    case "tout-effacer":
      if(confirm("Effacer vos cours, fiches, exercices et résultats ? La progression des leçons est conservée.")){
        const prep = S.prep, regl = S.reglages;
        S = etatVierge(); S.prep = prep; S.reglages = regl;
        sauver(); ui.fiche = null; aller("rev", "accueil");
      } break;
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id === "i-fic" && t.files[0]){
    const f = t.files[0];
    ui.message = {type:"info", titre:"Lecture du fichier", txt:f.name}; rendre();
    try{
      const txt = await lireFichier(f);
      ui.importTexte = txt;
      if(!ui.importTitre) ui.importTitre = f.name.replace(/\.[^.]+$/,"");
      if(!ui.importUE) ui.importUE = detecterUE(txt) || "";
      const al = sonderDonnees(txt);
      ui.avisRGPD = al.length ? al : null; ui.rgpdIgnore = false;
      ui.message = {type:"info", titre:"Fichier lu",
        txt: txt.length + " caractères" + (ui.importUE ? " · unité proposée : " + ui.importUE : "") + "."};
    }catch(err){ ui.message = {type:"err", titre:"Lecture impossible", txt:err.message}; }
    rendre(); return;
  }
  if(t.id === "i-json" && t.files[0]){
    try{
      const o = JSON.parse(await t.files[0].text());
      if(!o || !Array.isArray(o.cours)) throw new Error("Ce fichier ne contient pas de sauvegarde.");
      const connus = new Set(S.cours.map(c => c.emp || c.id));
      const neufs = o.cours.filter(c => !connus.has(c.emp || c.id));
      ui.importJSON = {donnees:o, neufs:neufs.length, total:o.cours.length};
      ui.message = null; ui.ecran = "reglages"; rendre();
    }catch(err){ ui.message = {type:"err", titre:"Import impossible", txt:err.message}; rendre(); }
    t.value = ""; return;
  }
  if(t.dataset.dateue){
    const v = t.value;
    if(v) datesUE()[t.dataset.dateue] = v; else delete datesUE()[t.dataset.dateue];
    sauver(); rendre(); return;
  }
  const act = t.closest("[data-act]");
  if(act && act.dataset.act === "assoc"){ ui.session.assoc[Number(act.dataset.i)] = t.value; return; }
  const b = t.dataset.bind;
  if(!b) return;
  if(b in ui){
    ui[b] = t.value;
    if(b === "importTexte"){
      const al = sonderDonnees(t.value);
      ui.avisRGPD = al.length ? al : null;
      if(!ui.importUE){ const d = detecterUE(t.value); if(d) ui.importUE = d; }
      rendre();
    }
  } else {
    S.reglages[b] = t.value; sauver();
    if(b === "cleGemini" || b === "modele") ui.testCle = null;
    if(["dateExamen","dateRentree","voix","debitVoix","modele","rappelExport","minutesJour"].includes(b)) rendre();
  }
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind;
  if(b === "importTexte" || b === "importTitre") ui[b] = e.target.value;
  if(b === "requete"){
    ui.requete = e.target.value;
    clearTimeout(window.__rech);
    window.__rech = setTimeout(() => {
      const pos = document.getElementById("q-txt") ? document.getElementById("q-txt").selectionStart : null;
      rendre();
      const c = document.getElementById("q-txt");
      if(c){ c.focus(); if(pos !== null) try{ c.setSelectionRange(pos, pos); }catch(err){} }
    }, 260);
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "rep" && e.target.tagName === "INPUT"){ e.preventDefault(); valider(); }
});
window.addEventListener("resize", () => { if((S.reglages.affichage || "auto") === "auto") appliquerAffichage(); });
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if(ui.ecran === "reglages") rendre(); };

charger();
if(!S.prep) S.prep = {};
rendre();
