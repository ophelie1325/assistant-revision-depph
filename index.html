  note:"Textes consultés le 9 août 2026, guide BPP lu dans son texte intégral. En cas d'écart avec le cours de votre centre de formation, c'est le cours qui fait foi pour l'examen — mais signalez l'écart à votre formateur."}
]},

"UE4.2": {titre:"Radiopharmacie et radioprotection", duree:"16 min", diapos:[
 {t:"intro", kick:"UE5 · pour commencer", titre:"Un médicament qui décroît pendant qu'on le prépare",
  texte:"Un médicament radiopharmaceutique perd son activité minute après minute, ne peut pas être stérilisé dans son récipient final, et expose celui qui le manipule. Trois contraintes qui ne se retrouvent nulle part ailleurs à la pharmacie, et qui expliquent que la radiopharmacie ait son propre référentiel et son propre corps de règles de radioprotection."},

 {t:"notion", kick:"Les fondations", titre:"Justification, optimisation, limitation",
  paras:["La radioprotection française transpose la directive 2013/59/Euratom, dans le code du travail aux articles L. 4451-1 et suivants et R. 4451-1 et suivants, et dans le code de la santé publique aux articles L. 1333-1 et suivants. Elle réintroduit les neuf principes généraux de prévention sans renier les trois principes fondateurs de la radioprotection : justification, optimisation, limitation.",
   "L'employeur doit supprimer ou réduire au minimum les risques, en tenant compte du progrès technique et de la disponibilité de mesures de maîtrise du risque à la source. La prévention est intégrée dès la conception des lieux de travail, la protection collective prime, l'équipement individuel vient en dernier ressort."],
  encart:{type:"info", titre:"Deux risques distincts", texte:"L'exposition externe, où la source irradie à distance, et la contamination externe ou interne, où la substance radioactive se dépose ou entre dans l'organisme. Les parades ne sont pas les mêmes."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Ne pas confondre", mots:[
  {m:"Dose efficace", d:"La grandeur qui exprime l'exposition de l'organisme entier. C'est elle qui porte la limite des 20 mSv."},
  {m:"Dose équivalente", d:"La grandeur qui exprime l'exposition d'un organe ou d'un tissu : peau, extrémités, cristallin."},
  {m:"Période", d:"Le temps au bout duquel l'activité d'un radionucléide a diminué de moitié."},
  {m:"Zone délimitée", d:"Zone surveillée ou contrôlée, dont l'accès est réservé aux travailleurs autorisés par l'employeur."},
  {m:"Conseiller en radioprotection", d:"Personne physique salariée, dite personne compétente en radioprotection, ou personne morale, dite organisme compétent en radioprotection."},
  {m:"Radiopharmacien", d:"Seul à pouvoir assumer la responsabilité technique de la préparation et du contrôle des médicaments radiopharmaceutiques."},
  {m:"MRP", d:"Médicament radiopharmaceutique, l'abréviation employée par la ligne directrice LD4 des BPP."}]},

 {t:"notion", kick:"Le zonage", titre:"Des couleurs qui gradent le risque",
  paras:["L'employeur identifie les lieux où l'exposition est susceptible de dépasser 0,08 mSv par mois pour l'organisme entier, 4 mSv par mois pour les extrémités ou la peau, ou 6 mSv par an pour le radon. L'évaluation se fait en considérant le lieu de travail occupé de manière permanente, soit 2 000 heures par an ou 170 heures par mois.",
   "Il délimite alors des zones qui traduisent la gradation du risque : zone surveillée signalée en bleu, zone contrôlée verte, jaune, orange puis rouge. Si l'exposition des extrémités ou de la peau peut dépasser 4 mSv par mois, une zone d'extrémité est délimitée."],
  encart:{type:"piege", titre:"Les conditions d'accès diffèrent", texte:"L'accès en zone contrôlée orange ou rouge fait l'objet d'une autorisation individuelle délivrée par l'employeur. Pour la zone rouge, cet accès est exceptionnel et donne lieu à un enregistrement nominatif à chaque entrée."},
  img:{f:"ue5-04-zonage.jpg", leg:"Signalisation de zone contrôlée et trisecteur radiologique"}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les limites d'exposition des travailleurs", lignes:[
  {v:"20 mSv", l:"dose efficace, organisme entier, sur douze mois consécutifs"},
  {v:"500 mSv", l:"dose équivalente aux extrémités : mains, avant-bras, pieds, chevilles"},
  {v:"500 mSv", l:"dose équivalente à la peau, sur tout cm² quelle que soit la surface exposée"},
  {v:"20 mSv", l:"dose équivalente au cristallin depuis le 1er juillet 2023"},
  {v:"6 mSv", l:"jeunes travailleurs de 16 à 18 ans, organisme entier"},
  {v:"1 mSv", l:"enfant à naître, de la déclaration de grossesse à l'accouchement"}],
  note:"Articles R. 4451-6 à R. 4451-8 du code du travail. Les femmes enceintes et les jeunes travailleurs de 16 à 18 ans sont exclus des travaux impliquant un classement en catégorie A. Une femme allaitant ne peut être affectée à un poste entraînant un risque d'exposition interne."},

 {t:"encart", kick:"Attention, ça a changé", titre:"La limite au cristallin a été divisée par sept", type:"garde",
  texte:"La valeur limite d'exposition du cristallin était de 150 mSv par an. Entre le 1er juillet 2018 et le 30 juin 2023, un régime transitoire a fixé une limite cumulée de 100 mSv sur cinq ans, sans dépasser 50 mSv une année donnée. Depuis le 1er juillet 2023, la limite est de 20 mSv sur douze mois consécutifs. Un support qui affiche encore 150 mSv au cristallin a plus de huit ans de retard."},

 {t:"notion", kick:"L'organisation", titre:"Classement, dosimétrie, formation",
  paras:["Sont classés en catégorie A les travailleurs susceptibles de recevoir sur douze mois consécutifs une dose efficace supérieure à 6 mSv, ou une dose équivalente supérieure à 150 mSv pour la peau ou les extrémités. Sont classés en catégorie B les autres travailleurs susceptibles de dépasser 1 mSv de dose efficace, ou 15 mSv au cristallin, ou 50 mSv à la peau ou aux extrémités.",
   "Le classement suit une évaluation individuelle préalable, réalisée avant l'affectation au poste, et recueille l'avis du médecin du travail. Les travailleurs disposant d'une surveillance dosimétrique individuelle reçoivent une formation renouvelée au moins tous les trois ans."],
  encart:{type:"astuce", titre:"Deux dosimètres, deux usages", texte:"Le dosimètre passif à lecture différée mesure la dose reçue a posteriori et alimente SISERI. Le dosimètre opérationnel, actif et à lecture directe, se porte en zone contrôlée, en zone d'extrémité et en zone d'opération ; il est muni d'alarmes sonores et visuelles qui doivent être activées."},
  img:{f:"ue5-07-dosimetre.jpg", leg:"Dosimètres individuels portés par les travailleurs exposés"}},

 {t:"notion", kick:"La radiopharmacie", titre:"Qui décide, et où",
  paras:["Les préparations de médicaments radiopharmaceutiques ne sont pas autorisées en officine. Elles relèvent d'une PUI dont les locaux répondent aux textes sur les installations utilisant des radionucléides en sources non scellées, soumises à l'autorisation préalable de l'Autorité de sûreté nucléaire délivrée au responsable de l'activité nucléaire.",
   "Seuls les radiopharmaciens peuvent avoir la responsabilité technique de la préparation et du contrôle des MRP ; en PUI, le radiopharmacien reçoit une délégation écrite du pharmacien gérant. Les préparateurs en pharmacie qui effectuent ces tâches sont placés sous son autorité technique."],
  encart:{type:"info", titre:"Ce que le préparateur y fait", texte:"Il prépare et contrôle sous autorité technique du radiopharmacien, après avoir réussi l'évaluation de sa formation, laquelle comprend un test de remplissage aseptique, et après avoir été habilité par le radiopharmacien."}},

 {t:"notion", kick:"LD4 · les locaux", titre:"Surpression dehors, dépression dedans",
  paras:["Les locaux de préparation des MRP sont des zones d'atmosphère contrôlée dont les caractéristiques sont conformes à celles décrites dans la LD1. Ils sont munis d'un sas d'accès, dont les portes sont asservies et ne peuvent être ouvertes en même temps. Les locaux de préparation et leur sas sont placés en surpression par rapport à l'environnement extérieur, avec un écart d'au moins 10 pascals.",
   "Les enceintes blindées, elles, sont ventilées en dépression pour assurer le confinement et empêcher la dispersion de la contamination radioactive, avec une filtration de l'air extrait adaptée aux gaz ou aérosols présents."],
  encart:{type:"astuce", titre:"La logique à retenir", texte:"On protège le produit en mettant la salle en surpression, et on protège l'opérateur en mettant l'enceinte en dépression. Les deux exigences cohabitent parce qu'elles ne portent pas sur le même volume."},
  img:{f:"ue5-09-enceinte.jpg", leg:"Enceinte blindée de radiopharmacie"}},

 {t:"chiffres", kick:"Le tableau à connaître", titre:"Classes exigées selon le procédé", lignes:[
  {v:"A dans D", l:"transfert en système clos en enceinte blindée : classe D minimum, classe C recommandée"},
  {v:"A dans C", l:"préparation aseptique en système ouvert, enceinte blindée ou hotte à flux unidirectionnel"},
  {v:"A dans C", l:"étape de filtration stérilisante"},
  {v:"A dans C", l:"radiosynthèse automatisée selon un procédé aseptique"},
  {v:"A dans C", l:"radiomarquage d'éléments figurés du sang en système ouvert"}],
  note:"Points 72 à 82 de la LD4. Le radiomarquage d'éléments figurés du sang se fait dans un local uniquement dédié à cette activité, un seul radiomarquage à la fois sur une même zone de travail."},

 {t:"notion", kick:"Le générateur", titre:"Faire venir un radionucléide qui ne voyage pas",
  paras:["Le technétium-99m est le radionucléide de diagnostic le plus utilisé, mais sa période est trop courte pour être transporté. On transporte donc son père, le molybdène-99, fixé sur une colonne : c'est le générateur, que l'on élue pour récupérer le technétium en solution saline.",
   "Le résumé des caractéristiques du produit indique que le molybdène-99 décroît avec une période de 66 heures en générant principalement le technétium-99m, qui décroît avec une période de 6 heures par émission gamma principale d'énergie 140 keV, en technétium-99 de période très longue."],
  encart:{type:"info", titre:"Traçabilité des sources", texte:"Les sources radioactives détenues font l'objet d'un inventaire permettant de justifier en permanence de leur origine et de leur localisation. Les activités commandées sont strictement en rapport avec l'utilisation et avec les activités maximales autorisées."},
  img:{f:"ue5-11-generateur.jpg", leg:"Générateur de technétium-99m"}},

 {t:"notion", kick:"Étiquetage et délais", titre:"L'heure fait partie du médicament",
  paras:["Toute indication d'activité indique la date et l'heure exacte de la mesure. L'étiquetage du blindage de protection comporte au minimum la dénomination de la préparation, son numéro d'enregistrement, l'activité, le volume, la date et l'heure exacte de mesure en fin de préparation, la date et l'heure limite d'utilisation, et le trisecteur normalisé signalant la présence de substances radioactives.",
   "L'étiquetage de la dose destinée au patient ajoute l'identité du patient et l'activité de la dose avec sa date et son heure exacte."],
  encart:{type:"piege", titre:"Le délai à retenir", texte:"La préparation d'une dose à administrer se fait le plus près possible de son heure d'administration. L'heure limite d'utilisation d'une dose à administrer ne doit pas excéder 30 minutes, sauf justification appropriée."}},

 {t:"notion", kick:"Contrôle et libération", titre:"Personne différente, décision du radiopharmacien",
  paras:["Les contrôles de qualité sont réalisés par une personne formée et habilitée, différente de celle qui a préparé le MRP, sauf exception justifiée. La libération est effectuée par le radiopharmacien, et aucune préparation n'est libérée ni délivrée avant qu'il ait certifié qu'elle répond aux spécifications du dossier de préparation.",
   "La taille des lots ne permet pas de suivre les prescriptions de la pharmacopée européenne pour l'essai de stérilité : le radiopharmacien évalue alors le risque associé, en s'appuyant notamment sur la surveillance particulaire et microbiologique des ZAC."],
  encart:{type:"info", titre:"Deux règles propres aux MRP", texte:"Une préparation peut être délivrée avant l'achèvement de tous les contrôles, mais cela ne supprime pas l'obligation d'une décision formellement enregistrée sur la conformité du lot. Toute préparation non conforme est considérée, après recherche des causes, comme un déchet radioactif et traitée comme tel. Sauf indication contraire, l'échantillothèque n'est pas requise."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE5", lignes:[
  {v:"66 h / 6 h", l:"périodes du molybdène-99 et du technétium-99m"},
  {v:"140 keV", l:"énergie d'émission gamma principale du technétium-99m"},
  {v:"30 min", l:"heure limite d'utilisation d'une dose à administrer, sauf justification"},
  {v:"10 Pa", l:"écart minimal de pression entre le local de préparation et son sas"},
  {v:"6 mois", l:"délai sans préparation au-delà duquel la formation théorique est à renouveler"},
  {v:"3 ans", l:"périodicité minimale de renouvellement de la formation des travailleurs suivis"},
  {v:"1 fois/an", l:"requalification des ZAC, essais d'étanchéité et d'intégrité des filtres HEPA"}]},

 {t:"quiz", kick:"Vérification", question:"Un collègue affirme que la limite d'exposition du cristallin est de 150 mSv par an. Que répondez-vous ?",
  options:["C'est exact, cette valeur n'a jamais bougé",
   "C'était exact avant 2018 ; depuis le 1er juillet 2023 la limite est de 20 mSv sur douze mois consécutifs",
   "C'est faux, la limite a toujours été de 20 mSv"],
  bonne:1,
  expl:"Un régime transitoire a fixé 100 mSv cumulés sur cinq ans entre le 1er juillet 2018 et le 30 juin 2023, sans dépasser 50 mSv par an. Depuis le 1er juillet 2023 la limite est de 20 mSv sur douze mois consécutifs, alignée sur celle du corps entier."},

 {t:"quiz", kick:"Vérification", question:"Vous avez préparé une dose de MRP. Qui en réalise le contrôle de qualité ?",
  options:["Vous-même, puisque vous connaissez la préparation",
   "Une personne formée et habilitée, différente de celle qui a préparé, sauf exception justifiée",
   "Le physicien médical, obligatoirement"],
  bonne:1,
  expl:"C'est la règle du point 90 de la LD4, cohérente avec le chapitre 6 des BPP qui exige un contrôle indépendant de l'activité de préparation. Le physicien médical intervient sur les contrôles de qualité de l'activimètre, pas sur la préparation."},

 {t:"quiz", kick:"Vérification", question:"Pourquoi les locaux de préparation des MRP sont-ils en surpression alors que les enceintes blindées sont en dépression ?",
  options:["C'est une incohérence historique du texte",
   "La surpression protège la préparation de la contamination extérieure, la dépression confine la contamination radioactive dans l'enceinte",
   "La dépression sert à accélérer la filtration stérilisante"],
  bonne:1,
  expl:"Les deux exigences portent sur des volumes différents : le local vis-à-vis de l'extérieur, l'enceinte vis-à-vis du local. La LD4 impose la surpression des locaux et de leur sas, et la ventilation en dépression des enceintes blindées."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"ANSM, Bonnes pratiques de préparation 2023, ligne directrice LD4", ref:"Préparation de médicaments radiopharmaceutiques : locaux, équipements, personnel, préparation, contrôle et libération", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"Code du travail, articles R. 4451-6 et suivants", ref:"Valeurs limites d'exposition professionnelle aux rayonnements ionisants", url:"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072050/LEGISCTA000018491123/"},
  {titre:"INRS, Rayonnements ionisants — réglementation et démarche de prévention", ref:"Valeurs limites, régime transitoire du cristallin, zonage, classement des travailleurs, conseiller en radioprotection", url:"https://www.inrs.fr/risques/rayonnements-ionisants/reglementation.html"},
  {titre:"ASNR, modalités de surveillance de l'exposition des travailleurs", ref:"Catégories A et B, dosimétrie individuelle et système SISERI", url:"https://recherche-expertise.asnr.fr/savoir-comprendre/sante/modalites-surveillance-lexposition-travailleurs"},
  {titre:"ANSM, résumé des caractéristiques du produit d'un générateur de technétium", ref:"Périodes du molybdène-99 et du technétium-99m, énergie gamma de 140 keV", url:"https://agence-prd.ansm.sante.fr/php/ecodex/rcp/R0229128.htm"}],
  note:"Textes consultés le 9 août 2026. Les valeurs de dose sont celles du code du travail en vigueur ; vérifiez la date de votre support de cours avant de réviser des chiffres de radioprotection."}
]},

"UE5": {titre:"Contrôles des préparations", duree:"14 min", diapos:[
 {t:"intro", kick:"UE6 · pour commencer", titre:"Prouver que ce qu'on a fabriqué est bien ce qu'on croit",
  texte:"Une préparation n'a pas d'autorisation de mise sur le marché. Personne n'a validé sa formule, sa stabilité ou sa pureté avant vous. Le contrôle est donc la seule chose qui sépare une intention thérapeutique d'un médicament réellement conforme. Le chapitre 6 des bonnes pratiques de préparation lui est entièrement consacré."},

 {t:"notion", kick:"La définition", titre:"Mesurer, comparer, décider",
  paras:["Le contrôle de la qualité pharmaceutique consiste à mettre en œuvre des opérations de mesure ou d'examen des caractéristiques des matières premières, des articles de conditionnement, des préparations en cours et des préparations terminées, en comparant les résultats obtenus aux exigences spécifiées.",
   "L'objectif est double : déterminer si chaque caractéristique est conforme, et prendre pour chacun une décision d'acceptation ou de refus. Rien n'est libéré tant que la qualité n'a pas été jugée satisfaisante."],
  encart:{type:"info", titre:"Ce que couvre le contrôle", texte:"Pas seulement l'analyse : aussi l'échantillonnage, l'établissement des spécifications, l'organisation, la documentation et les procédures de libération."}},

 {t:"etapes", kick:"Le cycle", titre:"Cinq moments de contrôle",
  etapes:["Le contrôle à réception : matières premières, articles de conditionnement, préparations sous-traitées",
   "Le contrôle en cours de préparation, si nécessaire : enregistrements et autocontrôles",
   "Le contrôle des préparations terminées",
   "Le contrôle libératoire",
   "Le cas échéant, le contrôle de stabilité et de l'absence d'interactions contenant-contenu"],
  note:"Point 6.3 du chapitre 6. La nature du contrôle de la qualité est définie et justifiée en fonction de l'analyse de risque réalisée pour la préparation concernée : tout ne se contrôle pas de la même manière."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les termes du chapitre 6", mots:[
  {m:"Spécification", d:"L'exigence chiffrée ou qualitative à laquelle le résultat obtenu est comparé pour décider de la conformité."},
  {m:"Certificat d'analyse", d:"Document signé du fournisseur, comportant le nom et l'adresse du fabricant d'origine et le référentiel des contrôles effectués."},
  {m:"Recevabilité", d:"Vérification documentaire et visuelle à réception, sans analyse : concordance commande-produit, inviolabilité, certificat d'analyse, dénomination, numéro de lot, péremption."},
  {m:"Échantillothèque", d:"Conservation d'échantillons de la préparation terminée, tracée dans le dossier de lot."},
  {m:"Étalon primaire", d:"Étalon qualifié et certifié indiqué par la méthode officielle. Un étalon secondaire n'est utilisable que s'il est qualifié par rapport à un étalon primaire certifié."},
  {m:"Contrôle libératoire", d:"L'ensemble des contrôles sur lesquels s'appuie la décision de libération pharmaceutique du lot."}]},

 {t:"chiffres", kick:"La hiérarchie", titre:"Quel référentiel, dans quel ordre", lignes:[
  {v:"1", l:"Pharmacopée européenne : monographies générales et spécifiques, prescriptions générales"},
  {v:"2", l:"Pharmacopée française, et en particulier le Formulaire national"},
  {v:"3", l:"Pharmacopées et formulaires nationaux des autres États membres de l'Union européenne"},
  {v:"4", l:"Pharmacopées et formulaires de pays tiers, par exemple l'US Pharmacopeia"},
  {v:"5", l:"À défaut : méthodes internes, méthodes des fabricants ou fournisseurs, littérature"}],
  note:"Points 6.5 à 6.8. Si une monographie existe dans la Pharmacopée européenne ou française, son application est obligatoire. La validation des méthodes non officielles se fait selon des référentiels tels qu'ICH Q2."},

 {t:"notion", kick:"Le principe cardinal", titre:"On ne contrôle pas son propre travail",
  paras:["L'activité de contrôle est organisée de façon à permettre un contrôle indépendant de l'activité de préparation. Le guide va plus loin : sauf exception justifiée, les contrôles sont effectués par une personne différente de celle qui a réalisé la préparation.",
   "Les locaux de contrôle sont en principe séparés des locaux de préparation. Le texte admet cependant que l'activité de contrôle s'effectue en zone de préparation pour limiter la dissémination de contaminants ou faciliter le contrôle en ligne."],
  encart:{type:"piege", titre:"Attention à la nuance", texte:"Séparation des locaux : « en principe », avec des dérogations motivées. Séparation des personnes : « sauf exception justifiée ». Ce ne sont pas les mêmes niveaux d'exigence, et l'examen aime cette distinction."}},

 {t:"notion", kick:"Matières premières", titre:"Le contrôle dépend du fournisseur",
  paras:["L'un des paramètres critiques pour orienter le contrôle d'une matière première est sa source d'approvisionnement. Les BPP répartissent les MPUP en trois catégories.",
   "Première catégorie : matière issue d'un établissement pharmaceutique de fabrication autorisé ou d'un établissement de fabrication ou de distribution autorisé ou déclaré dans l'Union européenne, avec certificat de conformité aux bonnes pratiques pour les substances actives, système d'inviolabilité et certificat d'analyse du lot. Une simple vérification de recevabilité suffit, et l'échantillothèque n'est pas obligatoire.",
   "Troisième catégorie : autres établissements, distributeurs sans reconditionnement, importateurs, ou fournisseurs ni déclarés ni autorisés. Un contrôle complet s'impose, en plus des points de recevabilité."],
  encart:{type:"astuce", titre:"Le réflexe", texte:"L'absence d'un seul des éléments — inviolabilité, certificat d'analyse, date de péremption ou de recontrôle, certificat de conformité aux BPF pour les substances actives — déclenche un contrôle complet, quel que soit le fournisseur."}},

 {t:"notion", kick:"Cas particulier", titre:"Quand on part d'une spécialité",
  paras:["Si, à défaut de matière première adaptée disponible, une spécialité pharmaceutique est utilisée, aucun contrôle de celle-ci n'est exigé au titre de matière première : elle a déjà été contrôlée par son fabricant dans le cadre de son autorisation de mise sur le marché.",
   "Mais le déconditionnement fait toujours l'objet d'une évaluation de ses conséquences sur la qualité, la stabilité, la sécurité et l'efficacité de la préparation."],
  encart:{type:"piege", titre:"Le piège classique", texte:"Partir d'une spécialité dispense du contrôle de la matière première, jamais du contrôle de la préparation terminée. Le texte le dit explicitement au point 6.44."}},

 {t:"notion", kick:"L'environnement", titre:"Contrôler l'air, les surfaces, l'eau",
  paras:["Parmi les contrôles possibles figurent les contrôles de recevabilité documentaire, physico-chimiques, pharmacotechniques, microbiologiques, de radioactivité le cas échéant, et de l'environnement — air, surfaces, eau.",
   "Pour les préparations stériles, la LD1 fixe des limites recommandées de contamination microbiologique en activité : moins de 1 unité formant colonie par mètre cube en classe A, 10 en classe B, 100 en classe C, 200 en classe D. Les empreintes de gant à cinq doigts admettent moins de 1 ufc en classe A et 5 en classe B."],
  encart:{type:"info", titre:"Les fréquences minimales", texte:"En classe A : gélose de sédimentation quotidienne au plan de travail, empreinte de gant quotidienne en fin de session, prélèvements de contact hebdomadaires, prélèvement d'air actif mensuel."},
  img:{f:"ue6-09-gelose.jpg", leg:"Boîtes de Petri utilisées pour le contrôle microbiologique"}},

 {t:"encart", kick:"Attention, ça a changé", titre:"La norme de biocontamination a été remplacée", type:"garde",
  texte:"La maîtrise de la biocontamination en salles propres relevait des normes NF EN ISO 14698-1 et 14698-2. La norme NF EN 17141, homologuée en septembre 2020, les annule et les remplace. Les BPP 2023 citent d'ailleurs NF ISO 14644 et NF EN 17141 comme les référentiels adaptés au moment de leur publication, et renvoient à NF EN 17141 pour la maîtrise de la contamination microbiologique. Un cours qui cite encore l'ISO 14698 renvoie à une norme annulée."},

 {t:"notion", kick:"La libération", titre:"Le dernier maillon, pas le seul",
  paras:["Pour les préparations stériles, la LD1 rappelle que la garantie de stérilité ne repose pas sur un test final : elle est assurée par la validation et la maîtrise des procédés, la qualification des installations, la qualité des matières premières et des articles de conditionnement, les contrôles microbiologiques et particulaires de l'environnement et la formation du personnel.",
   "L'essai de stérilité de la pharmacopée, ou une méthode équivalente validée, est considéré comme le dernier d'une série de contrôles permettant de garantir la stérilité. Une attention particulière est portée aux résultats de la surveillance des ZAC au moment de libérer."],
  encart:{type:"astuce", titre:"La formule à retenir", texte:"La stérilité se construit pendant le procédé, elle ne se démontre pas à la fin. C'est exactement pour cela que le dossier de lot pèse autant dans la décision de libération."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les durées d'archivage", lignes:[
  {v:"5 ans", l:"dossier de préparation, après la date de péremption du dernier lot produit"},
  {v:"1 an", l:"dossier de lot au moins, après la péremption du lot concerné"},
  {v:"10 ans", l:"dossier de lot si les données servent à la traçabilité du livre-registre"},
  {v:"10 ans", l:"livre-registre des préparations"},
  {v:"5 ans", l:"cahiers de laboratoire, après péremption du dernier lot produit"}],
  note:"Tableau du point 4.47. Le registre des contrôles réalisés à réception des MPUP relève, lui, du règlement interne de l'établissement."},

 {t:"quiz", kick:"Vérification", question:"Vous avez réalisé une préparation ce matin. Le laboratoire de contrôle est débordé et vous propose de faire vous-même le dosage. Que dit le texte ?",
  options:["C'est possible, rien ne l'interdit",
   "Sauf exception justifiée, le contrôle est effectué par une personne différente de celle qui a réalisé la préparation",
   "C'est interdit en toutes circonstances"],
  bonne:1,
  expl:"Le point 6.18 pose la règle avec sa réserve : « sauf exception justifiée ». L'exception existe mais elle doit être motivée et tracée, elle n'est pas laissée à l'organisation du moment."},

 {t:"quiz", kick:"Vérification", question:"Une monographie de la préparation existe à la Pharmacopée européenne. Vous disposez aussi d'une méthode interne validée, plus rapide. Laquelle appliquez-vous ?",
  options:["La méthode interne, puisqu'elle est validée",
   "La monographie de la Pharmacopée européenne : son application est obligatoire",
   "Au choix, les deux référentiels ont la même valeur"],
  bonne:1,
  expl:"Le point 6.6 est sans ambiguïté : si les monographies existent dans la Pharmacopée européenne ou française, leur application est obligatoire. Les méthodes internes n'interviennent qu'en l'absence de référentiel disponible."},

 {t:"quiz", kick:"Vérification", question:"Vous préparez une solution injectable à partir d'une spécialité pharmaceutique, faute de matière première disponible. Quels contrôles ?",
  options:["Aucun contrôle de la spécialité au titre de matière première, mais le contrôle de la préparation terminée reste dû",
   "Contrôle complet de la spécialité avant emploi",
   "Aucun contrôle, ni sur la spécialité ni sur la préparation"],
  bonne:0,
  expl:"Le point 6.42 dispense du contrôle de la spécialité au titre de matière première, et le point 6.44 précise que cela n'exonère pas du contrôle de la préparation terminée. Le déconditionnement, lui, fait l'objet d'une évaluation de ses conséquences."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"ANSM, Bonnes pratiques de préparation 2023, chapitre 6", ref:"Contrôle de la qualité pharmaceutique : principes, référentiels, organisation, contrôle des MPUP, stratégie libératoire", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"ANSM, BPP 2023, chapitre 4 point 4.47", ref:"Tableau des durées minimales de conservation des documents", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"ANSM, BPP 2023, ligne directrice LD1", ref:"Surveillance microbiologique des ZAC, fréquences de prélèvement, essai de stérilité et stratégie libératoire", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"AFNOR, norme NF EN 17141 (septembre 2020)", ref:"Maîtrise de la biocontamination ; annule et remplace NF EN ISO 14698-1 et NF EN ISO 14698-2", url:"https://www.boutique.afnor.org/fr-fr/norme/nf-en-17141/salles-propres-et-environnements-maitrises-apparentes-maitrise-de-la-biocon/fa187568/86055"},
  {titre:"ICH, Quality Guidelines", ref:"Q2, validation des méthodes d'analyse, cité en note par les BPP 2023", url:"https://www.ich.org/page/quality-guidelines"}],
  note:"Textes consultés le 9 août 2026, chapitre 6 et LD1 lus dans leur texte intégral. En cas d'écart avec le cours de votre centre de formation, c'est le cours qui fait foi pour l'examen."}
]},

"UE6": {titre:"Bon usage et référencement des dispositifs médicaux", duree:"15 min", diapos:[
 {t:"intro", kick:"UE7 · pour commencer", titre:"Un médicament agit, un dispositif fonctionne",
  texte:"Une compresse, un stent, une prothèse de hanche, un logiciel d'aide à la décision : ce sont tous des dispositifs médicaux. Ils ne relèvent ni de l'autorisation de mise sur le marché ni de la pharmacovigilance, mais d'un marquage CE et d'une vigilance qui leur est propre. Confondre les deux régimes est l'erreur qui coûte le plus cher en examen.",
  img:{f:"ue7-01-dispositifs.jpg", leg:"Dispositifs médicaux stériles conditionnés"}},

 {t:"encart", kick:"Attention, ça a changé", titre:"Les directives ont laissé place à un règlement", type:"garde",
  texte:"Le règlement (UE) 2017/745 du 5 avril 2017, dit MDR, abroge les directives 90/385/CEE et 93/42/CEE. Il s'applique depuis le 26 mai 2020, et depuis le 27 mai 2025 aucun dispositif ne peut plus être mis sur le marché au titre des anciennes directives. Les certificats délivrés par les organismes notifiés sous l'empire des directives ont été invalidés le 25 mai 2024. Un cours qui parle encore de « la directive 93/42 » décrit un texte abrogé."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots à distinguer", mots:[
  {m:"Marquage CE", d:"Apposé de façon visible, lisible et indélébile sur le dispositif ou sur le conditionnement qui en garantit la stérilité. Il atteste la conformité au règlement, pas l'efficacité clinique au sens d'une AMM."},
  {m:"Organisme notifié", d:"Organisme habilité qui évalue la conformité. Il intervient pour toutes les classes au-dessus de la classe I simple."},
  {m:"DMI", d:"Dispositif médical implantable, soumis à une traçabilité renforcée jusqu'au patient."},
  {m:"IUD", d:"Identifiant unique des dispositifs, qui permet de retrouver un dispositif précis dans toute la chaîne."},
  {m:"EUDAMED", d:"Base de données européenne dans laquelle les fabricants enregistrent leurs dispositifs."},
  {m:"Matériovigilance", d:"Surveillance des incidents et risques d'incidents mettant en cause un dispositif médical après sa mise sur le marché."},
  {m:"Correspondant local", d:"Le correspondant local de matériovigilance, désigné dans l'établissement, qui enregistre, analyse et valide les signalements."}]},

 {t:"notion", kick:"La classification", titre:"Quatre classes, un principe de risque croissant",
  paras:["Les dispositifs sont répartis en quatre classes, du risque le plus faible au plus élevé : classe I, comme les compresses, les lunettes ou les béquilles ; classe IIa, comme les lentilles de contact, les appareils d'échographie ou les couronnes dentaires ; classe IIb, comme les préservatifs ou les produits de désinfection des lentilles ; classe III, comme les implants mammaires, les stents ou les prothèses de hanche.",
   "La classe dépend de la destination du dispositif, du niveau de risque lié à son utilisation — durée, partie du corps exposée, intérieur ou extérieur du corps — et des risques potentiels pour la santé publique. Les règles figurent à l'annexe VIII du règlement."],
  encart:{type:"astuce", titre:"La règle de prudence", texte:"Lorsqu'un doute subsiste sur la classe d'un dispositif, c'est la classe de risque la plus élevée qui est retenue."}},

 {t:"notion", kick:"La classification", titre:"Les trois classes I qui ne sont pas comme les autres",
  paras:["Pour un dispositif de classe I mis sur le marché non stérile, sans fonction de mesurage et qui n'est pas un instrument chirurgical réutilisable, la certification se fait sans intervention d'un organisme notifié : le fabricant s'auto-certifie.",
   "Trois sous-catégories échappent à cette règle et exigent un organisme notifié : la classe Im, avec fonction de mesurage, la classe Is, mise sur le marché à l'état stérile, et la classe Ir, instruments chirurgicaux réutilisables. Comme pour les classes IIa, IIb et III."],
  encart:{type:"piege", titre:"Le piège d'examen", texte:"« Classe I, donc pas d'organisme notifié » est faux dès que le dispositif est stérile, mesure quelque chose, ou est un instrument chirurgical réutilisable."}},

 {t:"chiffres", kick:"Le calendrier", titre:"Les dates du règlement 2017/745", lignes:[
  {v:"26/05/2020", l:"date d'application du règlement"},
  {v:"26/05/2021", l:"obligations IUD pour les implantables et la classe III"},
  {v:"26/11/2021", l:"enregistrement des dispositifs dans EUDAMED par les fabricants"},
  {v:"26/05/2023", l:"obligations IUD pour les classes IIa et IIb"},
  {v:"25/05/2024", l:"invalidation des certificats délivrés sous les anciennes directives"},
  {v:"26/05/2025", l:"obligations IUD pour la classe I"},
  {v:"27/05/2025", l:"plus aucune mise sur le marché au titre des directives"}]},

 {t:"notion", kick:"Matériovigilance", titre:"Signaler sans délai",
  paras:["Les professionnels de santé et les utilisateurs professionnels signalent sans délai les incidents graves au sens du règlement (UE) 2017/745, et peuvent signaler tous les autres incidents qu'ils constatent ou dont ils ont connaissance.",
   "Le signalement se fait auprès du correspondant local de matériovigilance lorsqu'on exerce dans un établissement, ou directement auprès du directeur général de l'ANSM lorsqu'on exerce à titre indépendant ou au sein d'une structure de prévention ou associative."],
  encart:{type:"info", titre:"Ce que fait le correspondant local", texte:"Il enregistre, analyse et valide tout incident ou risque d'incident signalé, recommande le cas échéant les mesures conservatoires, conseille les déclarants, sensibilise les utilisateurs, et signale au centre régional de pharmacovigilance les incidents provoqués par des dispositifs destinés à administrer des médicaments."}},

 {t:"notion", kick:"Traçabilité", titre:"Retrouver un implant, des années après",
  paras:["La traçabilité de certains dispositifs médicaux repose sur le décret n° 2006-1497 et l'arrêté du 26 janvier 2007 qui précise les dispositifs concernés. Elle est placée sous la responsabilité des utilisateurs, avec un objectif de sécurité sanitaire et dans le cadre de l'obligation d'information du patient prévue à l'article L. 5212-3 du code de la santé publique.",
   "Un guide d'application à l'intention des établissements de santé a été rédigé par Euro-Pharmat en collaboration avec l'ANSM en 2007, complété par une version de 2016 qui précise les définitions et les types de dispositifs à tracer."],
  encart:{type:"astuce", titre:"La question à se poser", texte:"Si ce dispositif faisait l'objet d'un rappel de lot dans cinq ans, saurait-on dire quel patient l'a reçu, quand et par qui ? Toute la traçabilité tient dans cette question."},
  img:{f:"ue7-08-implant.jpg", leg:"Dispositif médical implantable et son étiquetage de traçabilité"}},

 {t:"notion", kick:"Usage unique", titre:"Ce qui est à usage unique le reste",
  paras:["La réglementation française interdit de réutiliser les dispositifs médicaux à usage unique. Le système qualité de la stérilisation prévu par le code de la santé publique précise les procédures assurant que les dispositifs à usage unique ne sont pas réutilisés.",
   "L'interdiction ne souffre pas d'exception liée au coût, à la pénurie ou à l'apparence du dispositif : un dispositif à usage unique retraité n'a plus aucune garantie de conformité, et le retraitement transfère sur l'établissement la responsabilité du fabricant."],
  encart:{type:"piege", titre:"À ne pas confondre", texte:"Usage unique n'est pas synonyme de jetable après un patient : c'est un statut réglementaire porté par le fabricant, qui figure sur l'étiquetage sous forme du pictogramme barré."}},

 {t:"etapes", kick:"Le référencement", titre:"D'un besoin à un dispositif référencé",
  etapes:["Expression du besoin par les utilisateurs, souvent une équipe de soins",
   "Analyse du besoin et recherche des dispositifs répondant à la destination visée",
   "Vérification du marquage CE et de la classe, et donc du niveau de contrôle appliqué",
   "Évaluation technique et essais cliniques d'utilisation par les utilisateurs",
   "Décision de référencement, inscription au livret des dispositifs médicaux",
   "Achat dans le respect des règles de la commande publique",
   "Suivi en vie réelle : matériovigilance, traçabilité, réévaluation périodique"],
  note:"Le référencement n'est pas un acte d'achat : c'est la décision collégiale d'inscrire un dispositif dans l'arsenal de l'établissement, avec l'évaluation qui la fonde et la réévaluation qui la prolonge."},

 {t:"quiz", kick:"Vérification", question:"Un fabricant vous affirme que son instrument chirurgical réutilisable est de classe I et qu'il n'a donc pas eu besoin d'organisme notifié. Que répondez-vous ?",
  options:["C'est exact, la classe I est en auto-certification",
   "C'est faux : les instruments chirurgicaux réutilisables, classe Ir, exigent l'intervention d'un organisme notifié",
   "Cela dépend du pays de fabrication"],
  bonne:1,
  expl:"L'ANSM le précise sans ambiguïté : les classes Im, Is et Ir relèvent d'un organisme notifié, comme les classes IIa, IIb et III. Seule la classe I non stérile, sans fonction de mesurage et non réutilisable est en auto-certification."},

 {t:"quiz", kick:"Vérification", question:"Une infirmière constate qu'un cathéter s'est rompu pendant la pose, sans conséquence pour le patient. Que faites-vous ?",
  options:["Rien, il n'y a pas eu de dommage",
   "Un signalement de matériovigilance auprès du correspondant local de l'établissement",
   "Une déclaration de pharmacovigilance au centre régional"],
  bonne:1,
  expl:"Les incidents graves sont signalés sans délai, et tous les autres incidents peuvent l'être. Un risque d'incident se signale même sans dommage : c'est précisément ce que la matériovigilance cherche à capter avant l'accident."},

 {t:"quiz", kick:"Vérification", question:"Quel texte encadre aujourd'hui la mise sur le marché des dispositifs médicaux en Europe ?",
  options:["La directive 93/42/CEE","Le règlement (UE) 2017/745","Le règlement (UE) 2017/746, qui vise tous les dispositifs"],
  bonne:1,
  expl:"Le règlement 2017/745 vise les dispositifs médicaux et abroge les directives 90/385 et 93/42. Le règlement 2017/746, lui, vise les dispositifs médicaux de diagnostic in vitro, classés de A à D."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Règlement (UE) 2017/745 du 5 avril 2017", ref:"Texte intégral : marquage CE, classification à l'annexe VIII, abrogation des directives 90/385 et 93/42", url:"https://eur-lex.europa.eu/legal-content/FR/ALL/?uri=CELEX:32017R0745"},
  {titre:"ANSM", ref:"Classifier un dispositif médical ou un dispositif médical de diagnostic in vitro : quatre classes, exemples, classes Im, Is et Ir", url:"https://ansm.sante.fr/documents/reference/classifier-un-dispositif-medical-ou-un-dispositif-medical-de-diagnostic-in-vitro"},
  {titre:"Code de la santé publique, chapitre Matériovigilance", ref:"Articles R. 5212-1 et suivants : signalement sans délai des incidents graves, missions du correspondant local", url:"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072665/LEGISCTA000006178666/"},
  {titre:"ANSM", ref:"Réglementation relative à la matériovigilance et textes d'application", url:"https://ansm.sante.fr/documents/reference/reglementation-relative-aux-differentes-vigilances/reglementation-relative-a-la-materiovigilance"},
  {titre:"ANSM", ref:"Traçabilité des dispositifs médicaux : décret n° 2006-1497, arrêté du 26 janvier 2007, guide Euro-Pharmat et ANSM", url:"https://ansm.sante.fr/documents/reference/reglementation-relative-aux-dispositifs-medicaux-dm-et-aux-dispositifs-medicaux-de-diagnostic-in-vitro-dmdiv/tracabilite-des-dispositifs-medicaux"},
  {titre:"SF2H, guide de bonnes pratiques de traitement des dispositifs médicaux, 2022", ref:"Interdiction de réutiliser les dispositifs médicaux à usage unique", url:"https://www.sf2h.net/k-stock/data/uploads/2022/11/Guide_DM_22_SF2H.pdf"}],
  note:"Textes consultés le 9 août 2026. Le calendrier du règlement a été modifié à plusieurs reprises depuis 2017 : vérifiez les dates avant l'épreuve si votre support est antérieur à 2024."}
]},

"UE7": {titre:"Préparation et contrôles du processus de stérilisation", duree:"15 min", diapos:[
 {t:"intro", kick:"UE8 · pour commencer", titre:"Un état qu'on ne peut pas vérifier sur chaque pièce",
  texte:"On ne peut pas ouvrir un sachet pour vérifier qu'il est stérile : le vérifier, c'est le contaminer. La stérilité d'un dispositif ne se contrôle donc pas à l'arrivée, elle se construit à chaque étape et se prouve par la maîtrise du procédé. Tout le métier de la stérilisation tient dans cette contrainte.",
  img:{f:"ue8-01-sterilisation.jpg", leg:"Unité de stérilisation hospitalière"}},

 {t:"notion", kick:"Le cadre", titre:"Trois textes qui se répondent",
  paras:["Les bonnes pratiques de pharmacie hospitalière, annexées à l'arrêté du 22 juin 2001, contiennent la ligne directrice particulière n° 1 consacrée à la préparation des dispositifs médicaux stériles. C'est le texte de référence du métier.",
   "L'arrêté du 3 juin 2002 rend opposables aux établissements de santé un ensemble de normes de stérilisation, dont la NF EN ISO 14937 sur la caractérisation d'un agent stérilisant et la validation d'un procédé. Le code de la santé publique impose enfin à l'établissement un système permettant d'assurer la qualité de la stérilisation."],
  encart:{type:"info", titre:"Qui est responsable", texte:"En établissement de santé, l'unité de stérilisation est placée sous la responsabilité du pharmacien gérant, qui peut désigner un pharmacien responsable de cette activité. C'est une activité à risques particuliers, dont l'autorisation vaut sept ans."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots du circuit", mots:[
  {m:"DMR", d:"Dispositif médical réutilisable, l'objet même du processus de stérilisation."},
  {m:"Prédésinfection", d:"Premier traitement effectué au plus près du soin, avant le nettoyage. Elle protège le personnel et facilite l'étape suivante."},
  {m:"Recomposition", d:"Reconstitution d'un plateau ou d'une boîte d'instruments selon sa composition de référence, avant conditionnement."},
  {m:"Charge", d:"Ensemble des dispositifs stérilisés au cours d'un même cycle."},
  {m:"Libération", d:"Décision pharmaceutique attestant que la charge est conforme et peut être mise à disposition."},
  {m:"Traçabilité", d:"Ensemble des enregistrements permettant de relier un dispositif à son cycle, à ses opérateurs et au patient."},
  {m:"ATNC", d:"Agent transmissible non conventionnel, autrement dit le prion, caractérisé par sa résistance aux procédés habituels d'inactivation."}]},

 {t:"etapes", kick:"Le processus", titre:"De la salle d'opération au stockage",
  etapes:["Prédésinfection au plus près de l'utilisation",
   "Lavage, manuel ou en laveur-désinfecteur",
   "Séchage, contrôle de propreté et de fonctionnalité",
   "Recomposition des plateaux selon leur composition de référence",
   "Conditionnement adapté au procédé de stérilisation retenu",
   "Stérilisation, le plus souvent à la vapeur d'eau saturée",
   "Contrôle des paramètres du cycle, puis libération pharmaceutique",
   "Stockage à l'abri, puis distribution aux services"],
  note:"L'ensemble des étapes fait l'objet d'une traçabilité, informatisée dans les établissements. Chaque unité d'emploi porte les éléments permettant de la relier à son cycle."},

 {t:"notion", kick:"Les procédés", titre:"La vapeur d'eau, et les autres",
  paras:["Trois catégories de procédés sont distinguées après conditionnement : la stérilisation à la vapeur d'eau saturée, la stérilisation à basse température par le peroxyde d'hydrogène gazeux associé ou non à d'autres gaz, et la stérilisation par irradiation, qui en France n'est utilisée que dans l'industrie.",
   "La stérilisation par la chaleur sèche est proscrite. L'oxyde d'éthylène et le formaldéhyde ne sont plus utilisés dans les établissements de santé français. Dans tous les cas, les recommandations du fabricant du dispositif mentionnent le procédé applicable : c'est lui qui commande, pas l'habitude du service."],
  encart:{type:"piege", titre:"Attention à l'oxyde d'éthylène", texte:"L'efficacité des procédés à l'oxyde d'éthylène et au peroxyde d'hydrogène gazeux n'a pas été évaluée pour l'inactivation des agents transmissibles non conventionnels. Un procédé peut être stérilisant sans rien garantir contre le prion."},
  img:{f:"ue8-05-autoclave.jpg", leg:"Autoclave de stérilisation à vapeur d'eau"}},

 {t:"notion", kick:"Risque prion", titre:"L'instruction 449, et pourquoi elle existe",
  paras:["Les agents transmissibles non conventionnels se caractérisent par leur grande résistance aux procédés chimiques et physiques. L'instruction n° DGS/RI3/2011/449 du 1er décembre 2011 actualise les recommandations visant à réduire les risques de transmission lors des actes invasifs, et abroge la circulaire n° 138 du 14 mars 2001.",
   "Elle intègre la classification des tissus selon leur niveau d'infectiosité publiée par l'OMS en 2010, et renforce le niveau de traitement appliqué aux dispositifs médicaux réutilisables. En France, l'évaluation du risque prion est obligatoire avant tout acte invasif."],
  encart:{type:"info", titre:"Le chiffre à retenir", texte:"La stérilisation par autoclave à vapeur d'eau à 134 °C pendant 18 minutes assure une inactivation importante des ATNC, mais une infectiosité résiduelle reste détectable. C'est pourquoi le texte prévoit, dans certains cas, une étape d'inactivation totale distincte de la stérilisation."}},

 {t:"notion", kick:"Risque prion", titre:"Ce qu'on fait quand le dispositif ne supporte pas 134 °C",
  paras:["Pour un dispositif médical réutilisable non compatible avec la vapeur saturée à 134 °C pendant 18 minutes, l'instruction prévoit une hiérarchie : vapeur saturée à température inférieure ou procédé basse température par vapeur de peroxyde d'hydrogène, et à défaut une désinfection de haut niveau avec rinçage terminal à l'eau stérile.",
   "Lorsque le procédé basse température, conforme à la norme NF EN ISO 14937, ou la désinfection permet aussi une inactivation totale des ATNC selon le protocole standard prion en vigueur, les étapes d'inactivation totale et de stérilisation basse température ou de désinfection sont confondues."],
  encart:{type:"piege", titre:"Le protocole standard prion", texte:"Le PSP est la méthode de référence publiée par l'agence pour évaluer les produits et procédés revendiquant une activité contre les ATNC. Un produit n'est « inactivant total » que s'il figure sur la liste publiée au regard du PSP en vigueur — pas parce que son fabricant l'annonce."}},

 {t:"notion", kick:"Le contrôle", titre:"Prouver plutôt que vérifier",
  paras:["Puisqu'on ne peut pas ouvrir un sachet pour savoir s'il est stérile, le contrôle porte sur le procédé : validation initiale, contrôle de routine des paramètres de chaque cycle, enregistrement, et libération sur la base de ces éléments.",
   "La norme NF EN ISO 14937, rendue opposable, définit les exigences générales pour caractériser un agent stérilisant et pour le développement, la validation et la vérification de routine d'un processus de stérilisation. C'est le cadre méthodologique qui remplace la seule confiance dans la machine."],
  encart:{type:"astuce", titre:"À formuler ainsi en examen", texte:"La stérilité est une probabilité, pas une observation. On ne prouve pas qu'un dispositif est stérile : on prouve que le procédé qui l'a traité était maîtrisé, validé et correctement exécuté."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE8", lignes:[
  {v:"22/06/2001", l:"arrêté relatif aux bonnes pratiques de pharmacie hospitalière, ligne directrice n° 1"},
  {v:"03/06/2002", l:"arrêté fixant les normes opposables pour la stérilisation des dispositifs médicaux"},
  {v:"134 °C", l:"température du cycle d'inactivation des ATNC"},
  {v:"18 min", l:"durée du plateau de ce même cycle"},
  {v:"01/12/2011", l:"instruction 449, qui abroge la circulaire 138 du 14 mars 2001"},
  {v:"7 ans", l:"durée de l'autorisation de l'activité de stérilisation, activité à risques particuliers"}]},

 {t:"quiz", kick:"Vérification", question:"Un bloc vous renvoie un instrument thermosensible utilisé chez un patient suspect d'ATNC. Que ne pouvez-vous pas faire ?",
  options:["Recourir à un procédé basse température par vapeur de peroxyde d'hydrogène",
   "Appliquer le cycle vapeur 134 °C pendant 18 minutes, puisque l'instrument ne le supporte pas",
   "Recourir à une désinfection de haut niveau avec rinçage terminal à l'eau stérile"],
  bonne:1,
  expl:"Un dispositif thermosensible ne peut pas passer le cycle à 134 °C. L'instruction 449 prévoit précisément la hiérarchie de repli : vapeur saturée à température inférieure ou basse température au peroxyde d'hydrogène, à défaut désinfection de haut niveau avec rinçage à l'eau stérile."},

 {t:"quiz", kick:"Vérification", question:"Quelle affirmation est exacte à propos du cycle 134 °C pendant 18 minutes ?",
  options:["Il élimine totalement l'infectiosité liée aux ATNC",
   "Il assure une inactivation importante, mais une infectiosité résiduelle reste détectable",
   "Il n'a aucun effet sur les ATNC"],
  bonne:1,
  expl:"C'est la formulation même de l'instruction 449. C'est pour cette raison qu'une étape d'inactivation totale, distincte de la stérilisation, est prévue dans certaines situations."},

 {t:"quiz", kick:"Vérification", question:"Quel procédé de stérilisation est proscrit dans les établissements de santé français ?",
  options:["La vapeur d'eau saturée","Le peroxyde d'hydrogène gazeux","La chaleur sèche"],
  bonne:2,
  expl:"La chaleur sèche est proscrite. L'oxyde d'éthylène et le formaldéhyde, eux, ne sont plus utilisés dans les établissements de santé français, et l'irradiation est réservée à l'industrie."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Arrêté du 22 juin 2001", ref:"Bonnes pratiques de pharmacie hospitalière, ligne directrice particulière n° 1 : préparation des dispositifs médicaux stériles", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000393840"},
  {titre:"Bonnes pratiques de pharmacie hospitalière, texte intégral", ref:"Chapitres généraux et ligne directrice particulière n° 1", url:"https://www.omedit-centre.fr/Formationnouveauxarrivants_web_gen_web/res/BPPH.pdf"},
  {titre:"Arrêté du 3 juin 2002", ref:"Normes opposables pour la stérilisation des dispositifs médicaux, dont NF EN ISO 14937", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000230729"},
  {titre:"Instruction n° DGS/RI3/2011/449 du 1er décembre 2011", ref:"Risque ATNC lors des actes invasifs, inactivation, séquestration", url:"https://www.legifrance.gouv.fr/circulaire/id/34277"},
  {titre:"Instruction 449, texte publié au Bulletin officiel", ref:"Cycle 134 °C pendant 18 minutes, infectiosité résiduelle, protocole standard prion", url:"https://sante.gouv.fr/fichiers/bo/2012/12-01/ste_20120001_0100_0098.pdf"},
  {titre:"SF2S, société française des sciences de la stérilisation", ref:"Procédés de stérilisation utilisés en France, risque prion, conduite à tenir", url:"https://bonnespratiques.sf2s-sterilisation.fr/processus-operationnel/risque-prion/"},
  {titre:"ANSM", ref:"Protocole standard prion et listes de produits et procédés inactivants", url:"https://ansm.sante.fr/vos-demarches/industriel/protocole-standard-prion-v2018"}],
  note:"Textes consultés le 9 août 2026. Cette leçon ne traite pas des tests de routine des autoclaves ni des indicateurs de passage et de stérilisation : je n'ai pas pu en lire une source primaire accessible, et je préfère ne rien écrire plutôt qu'une approximation. Reportez-vous au cours de votre centre pour ce point."}
]},

"UE8": {titre:"Prévention du risque infectieux et contrôle de l'environnement", duree:"14 min", diapos:[
 {t:"intro", kick:"UE9 · pour commencer", titre:"Ce qu'on ne voit pas se compte quand même",
  texte:"Une salle propre n'est pas une salle qui a l'air propre. C'est une salle dont on connaît le nombre de particules par mètre cube et le nombre d'unités formant colonie par boîte de Petri, mesurés selon des normes, à des fréquences définies. Le risque infectieux se gère avec des chiffres, pas avec une impression."},

 {t:"notion", kick:"Le socle", titre:"Les précautions standard",
  paras:["Les précautions standard sont les mesures appliquées pour tout patient, quel que soit son statut infectieux, par tout professionnel. La SF2H en a publié l'actualisation en juin 2017.",
   "Le document couvre l'hygiène des mains, les équipements de protection individuelle, l'hygiène respiratoire, la prévention des accidents avec exposition au sang, la gestion des excreta et la gestion de l'environnement. Ce ne sont pas des mesures réservées aux patients réputés contagieux : c'est le socle appliqué à tous, tout le temps."],
  encart:{type:"info", titre:"La logique", texte:"On ne sait jamais avec certitude qui est porteur de quoi. Les précautions standard partent de ce constat : elles protègent le soignant du patient et le patient du soignant, sans avoir besoin de savoir."}},

 {t:"notion", kick:"Hygiène des mains", titre:"La friction avant le lavage",
  paras:["La friction hydro-alcoolique est la technique de référence de l'hygiène des mains ; elle remplace le lavage hygiénique. Elle est plus rapide, ne nécessite pas de point d'eau, et laisse la peau en meilleur état grâce aux émollients intégrés au produit.",
   "Deux règles pratiques comptent autant que la technique elle-même : ne pas faire systématiquement un lavage simple des mains avant une friction, car cela provoque des irritations cutanées, et attendre l'évaporation complète du produit avant de toucher le patient, son environnement ou le matériel."],
  encart:{type:"piege", titre:"Les normes des produits", texte:"Un produit hydro-alcoolique destiné à la friction hygiénique répond à la norme NF EN 1500. Pour la désinfection chirurgicale des mains par friction, la norme applicable est la NF EN 12791. Ce ne sont pas les mêmes exigences ni les mêmes produits."},
  img:{f:"ue9-03-friction.jpg", leg:"Friction hydro-alcoolique des mains"}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Ce que mesurent les contrôles", mots:[
  {m:"Contrôle particulaire", d:"Comptage des particules en suspension dans l'air, par taille et par mètre cube. Il caractérise la classe de propreté."},
  {m:"Contrôle microbiologique", d:"Dénombrement des micro-organismes viables dans l'air et sur les surfaces, exprimé en unités formant colonie."},
  {m:"ufc", d:"Unité formant colonie : une colonie visible sur milieu de culture, issue d'un ou de plusieurs micro-organismes viables."},
  {m:"Gélose de sédimentation", d:"Boîte de Petri laissée ouverte pour recueillir les particules viables qui se déposent, pendant une durée définie."},
  {m:"Aérobiocollecteur", d:"Appareil de prélèvement d'air dit « actif », qui aspire un volume connu et l'impacte sur un milieu de culture."},
  {m:"Empreinte de gant", d:"Prélèvement des cinq doigts sur milieu gélosé, qui contrôle l'opérateur au poste de travail."},
  {m:"Seuils d'alerte et d'action", d:"Valeurs définies par procédure au-delà desquelles une investigation, puis des mesures correctives, sont déclenchées."}]},

 {t:"encart", kick:"Attention, ça a changé", titre:"La norme de biocontamination a été remplacée", type:"garde",
  texte:"La maîtrise de la biocontamination en salles propres relevait des normes NF EN ISO 14698-1 et 14698-2. La norme NF EN 17141, homologuée en septembre 2020, les annule et les remplace. Les bonnes pratiques de préparation de 2023 citent d'ailleurs NF ISO 14644 et NF EN 17141 comme les référentiels adaptés au moment de leur publication. Un support qui cite encore l'ISO 14698 renvoie à une norme annulée."},

 {t:"chiffres", kick:"Les valeurs", titre:"Contamination microbiologique en activité", lignes:[
  {v:"< 1", l:"classe A : ufc/m³ dans l'air, ufc par boîte de Petri en 4 heures, ufc par gélose de contact, ufc par gant"},
  {v:"10", l:"classe B : ufc/m³ dans l'air ; 5 pour les autres prélèvements"},
  {v:"100", l:"classe C : ufc/m³ dans l'air ; 50 en boîte de Petri, 25 en gélose de contact"},
  {v:"200", l:"classe D : ufc/m³ dans l'air ; 100 en boîte de Petri, 50 en gélose de contact"}],
  note:"Tableau 9 de la ligne directrice LD1 des bonnes pratiques de préparation 2023. Ce sont des valeurs moyennes et des limites recommandées, à ne pas confondre avec les seuils particulaires du tableau 1, qui relèvent d'un autre contrôle."},

 {t:"notion", kick:"La surveillance", titre:"À quelle fréquence prélever",
  paras:["En environnement de classe A, la surveillance est quotidienne : une gélose de sédimentation au niveau du plan de travail, à raison d'une gélose par session de quatre heures au maximum, et une empreinte de gant de l'opérateur en fin de session de travail.",
   "Le programme de prélèvements de contact à l'intérieur des zones classées est hebdomadaire en classe A et mensuel dans l'environnement immédiat. Les prélèvements d'air actifs sont mensuels en classe A et en classe B, trimestriels en classe C, semestriels en classe D."],
  encart:{type:"astuce", titre:"Le principe qui sous-tend le tableau", texte:"Plus la classe est exigeante, plus la fréquence est élevée. Ce n'est pas une liste à apprendre bêtement : c'est une gradation, et la connaître comme une gradation suffit à retrouver les cases."}},

 {t:"notion", kick:"Quand ça dépasse", titre:"Seuils d'alerte, seuils d'action",
  paras:["Des seuils d'alerte et d'action appropriés sont définis dans une procédure pour les résultats de la surveillance particulaire et microbiologique. En cas de dépassement, des procédures imposent des mesures correctives.",
   "Ces seuils tiennent compte de la nature du germe, de sa pathogénicité et de son potentiel de dissémination : la présence d'un champignon filamenteux, par exemple, ne s'interprète pas comme celle d'un germe cutané banal."],
  encart:{type:"piege", titre:"Le lien avec la libération", texte:"Il convient de porter une attention particulière aux résultats de la surveillance des zones à atmosphère contrôlée au moment de libérer les préparations terminées. Un dépassement environnemental peut donc bloquer un lot, même si tous les contrôles du produit sont conformes."}},

 {t:"notion", kick:"Le nettoyage", titre:"Une fréquence pour chaque surface",
  paras:["Le nettoyage et la désinfection des zones classées suivent une procédure validée, et le choix de la solution désinfectante comme de son système de diffusion est validé.",
   "Les fréquences minimales recommandées distinguent le quotidien — plans de travail hors zone de préparation, sols, surfaces fréquemment touchées comme les poignées de porte et les interrupteurs — du mensuel — surfaces externes des équipements, accessoires — et du trimestriel, pour les murs et les plafonds."],
  encart:{type:"info", titre:"Ce qui prime sur la fréquence", texte:"Ces fréquences sont indicatives et s'adaptent à l'activité. Une souillure constatée impose un nettoyage immédiat, quel que soit le calendrier."}},

 {t:"quiz", kick:"Vérification", question:"Un collègue se lave les mains au savon puis enchaîne systématiquement avec une friction hydro-alcoolique. Que lui dites-vous ?",
  options:["C'est la bonne pratique, les deux se complètent",
   "Il ne faut pas faire systématiquement un lavage simple avant une friction : cela provoque des irritations cutanées",
   "Il faut inverser l'ordre : friction puis lavage"],
  bonne:1,
  expl:"La friction est la technique de référence et remplace le lavage hygiénique. Le lavage simple garde ses indications propres, notamment les mains visiblement souillées, mais ne se cumule pas systématiquement avec la friction."},

 {t:"quiz", kick:"Vérification", question:"Quelle norme s'applique aujourd'hui à la maîtrise de la biocontamination en salles propres ?",
  options:["NF EN ISO 14698-1 et 14698-2","NF EN 17141","NF EN 12791"],
  bonne:1,
  expl:"NF EN 17141, homologuée en septembre 2020, annule et remplace les deux parties de l'ISO 14698. La NF EN 12791, elle, concerne les produits de désinfection chirurgicale des mains par friction."},

 {t:"quiz", kick:"Vérification", question:"En classe A, à quelle fréquence réalise-t-on un prélèvement d'air actif par aérobiocollecteur ?",
  options:["Quotidiennement","Hebdomadairement","Mensuellement"],
  bonne:2,
  expl:"Le quotidien concerne la gélose de sédimentation et l'empreinte de gant, l'hebdomadaire les prélèvements de contact en zone classée. Le prélèvement d'air actif est mensuel en classe A."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"SF2H, Précautions standard, juin 2017", ref:"Hygiène des mains, équipements de protection individuelle, hygiène respiratoire, accidents avec exposition au sang, excreta, environnement", url:"https://www.sf2h.net/k-stock/data/uploads/2017/06/HY_XXV_PS_versionSF2H.pdf"},
  {titre:"SF2H, Hygiène des mains et soins : du choix du produit à son utilisation", ref:"Normes NF EN 1500 pour la friction hygiénique et NF EN 12791 pour la friction chirurgicale", url:"https://www.sf2h.net/k-stock/data/uploads/2018/03/HY_XXVI_1_SF2H-1.pdf"},
  {titre:"CPias et SF2H", ref:"Technique de friction : ne pas laver systématiquement avant, attendre l'évaporation complète", url:"https://cpias-occitanie.fr/wp-content/uploads/2018/06/2.SF2H-DIAPOS-Guide-mains.pdf"},
  {titre:"ANSM, Bonnes pratiques de préparation 2023, ligne directrice LD1", ref:"Tableaux 9 et 10 : limites de contamination microbiologique et fréquences de surveillance ; tableaux 2 et 3 : fréquences de nettoyage", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"AFNOR, norme NF EN 17141 (septembre 2020)", ref:"Maîtrise de la biocontamination ; annule et remplace NF EN ISO 14698-1 et 14698-2", url:"https://www.boutique.afnor.org/fr-fr/norme/nf-en-17141/salles-propres-et-environnements-maitrises-apparentes-maitrise-de-la-biocon/fa187568/86055"}],
  note:"Textes consultés le 9 août 2026. Cette leçon ne traite pas de la norme NF S 90-351 sur le traitement de l'air des établissements de santé ni de la classification des zones à risque qui en découle : je n'ai pas pu en consulter le texte, et je ne l'écris donc pas."}
]},

"UE9": {titre:"Gestion des flux et stocks de médicaments, dispositifs et fluides médicaux", duree:"13 min", diapos:[
 {t:"intro", kick:"UE10 · pour commencer", titre:"Le stock, c'est du soin immobilisé",
  texte:"Un stock trop faible, et le service manque le jour où il faut. Un stock trop élevé, et l'argent dort pendant que des produits périment. Entre les deux, il n'y a pas d'intuition : il y a des règles de gestion, des inventaires, des dates de péremption et des procédures d'achat.",
  img:{f:"ue10-01-stock.jpg", leg:"Rayonnages de stockage d'une pharmacie à usage intérieur"}},

 {t:"notion", kick:"Le référentiel", titre:"Ce que le diplôme attend de vous",
  paras:["La compétence C9 de l'arrêté du 31 juillet 2024 énonce la mission : gérer les flux et les stocks de médicaments, de dispositifs et de fluides médicaux au sein de la PUI et dans les stocks déportés dans les unités de soins et les plateaux techniques, dans le respect des procédures.",
   "Elle comprend l'organisation des stocks et de leur élimination, la participation aux procédures d'achats et la réalisation des commandes, l'approvisionnement selon les données de stock pour éviter toute rupture, et l'archivage manuel ou informatisé des données."],
  encart:{type:"info", titre:"Le mot qui compte", texte:"« Stocks déportés » : le stock n'est pas seulement celui de la pharmacie. Les dotations des services et des plateaux techniques relèvent aussi de votre responsabilité de gestion."}},

 {t:"chiffres", kick:"Les critères d'évaluation", titre:"Sur quoi vous serez jugé", lignes:[
  {v:"Inventaires", l:"réalisés périodiquement selon les procédures en vigueur"},
  {v:"Stockage", l:"conditions permettant la conservation de la qualité et de l'intégrité des produits"},
  {v:"Péremptions", l:"disponibilité vérifiée en tenant compte des dates ; produits périmés identifiés et éliminés"},
  {v:"Commandes", l:"passées selon les procédures et les directives du pharmacien, auprès de fournisseurs agréés"},
  {v:"Ruptures", l:"les ruptures de stock sont évitées"},
  {v:"Archivage", l:"sauvegardes quotidiennes réalisées, périodes de conservation respectées"}],
  note:"Indicateurs de la compétence C9, annexe II de l'arrêté du 31 juillet 2024. Ces formulations sont celles du texte : elles peuvent servir de grille de relecture avant une épreuve pratique."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots de la gestion", mots:[
  {m:"MITM", d:"Médicament d'intérêt thérapeutique majeur : médicament ou classe pour lesquels une interruption de traitement est susceptible de mettre en jeu le pronostic vital à court ou moyen terme, ou de représenter une perte de chance importante."},
  {m:"Rupture de stock", d:"Impossibilité de fabriquer ou d'exploiter un médicament. Elle peut être la cause d'une rupture d'approvisionnement."},
  {m:"Stock de sécurité", d:"Nombre d'unités de produit fini prêtes à être distribuées sur le territoire français, couvrant une durée de besoins calculée sur le volume des ventes des douze derniers mois glissants."},
  {m:"Plan de gestion des pénuries", d:"Document du laboratoire identifiant les situations à risque de tension et proposant des solutions pour poursuivre les traitements. Adressé chaque année à l'ANSM."},
  {m:"Contingentement", d:"Mesure de réduction de l'impact d'une tension : quantitatif, ou qualitatif par réservation du stock à certaines indications."},
  {m:"Stock déporté", d:"Stock détenu hors de la PUI, dans une unité de soins ou un plateau technique, mais géré sous la responsabilité pharmaceutique."}]},

 {t:"encart", kick:"Attention, ça a changé", titre:"Le stock de sécurité est obligatoire depuis 2021", type:"garde",
  texte:"Le décret n° 2021-349 du 30 mars 2021, entré en vigueur le 1er septembre 2021, impose aux titulaires d'AMM et aux exploitants de constituer un stock de sécurité destiné au marché national, situé en France. Ce dispositif a été créé par l'article 48 de la loi de financement de la sécurité sociale pour 2020. Un cours antérieur à 2021 ne décrit pas cette obligation, ni les sanctions financières que l'ANSM peut prononcer en cas de manquement."},

 {t:"chiffres", kick:"À mémoriser", titre:"Les durées de stock de sécurité", lignes:[
  {v:"2 mois", l:"couverture minimale pour un médicament d'intérêt thérapeutique majeur"},
  {v:"1 semaine", l:"couverture pour les autres médicaments"},
  {v:"1 mois", l:"pour les médicaments non MITM contribuant à une politique de santé publique définie par le ministre"},
  {v:"4 mois", l:"plafond : l'ANSM peut porter le stock jusqu'à cette durée après une rupture dans les deux années civiles précédentes"}],
  note:"Décret n° 2021-349 du 30 mars 2021. Les durées se calculent sur la base du volume des ventes en France des douze derniers mois glissants."},

 {t:"notion", kick:"Les ruptures", titre:"Qui signale, et à qui",
  paras:["Les titulaires d'AMM et les entreprises exploitant un médicament d'intérêt thérapeutique majeur informent l'ANSM dès qu'ils en ont connaissance de tout risque de rupture de stock ou de toute rupture de ce médicament, selon les modalités fixées par décision du directeur général de l'agence.",
   "Le phénomène n'est pas marginal : l'ANSM a enregistré 2 446 signalements de ruptures ou de risques de rupture en 2020, contre 1 504 en 2019. Entre 5 et 10 % de ces signalements nécessitent des mesures de réduction d'impact : contingentement quantitatif ou qualitatif, importation de médicaments similaires provenant d'autres pays."],
  encart:{type:"astuce", titre:"Votre place dans le dispositif", texte:"Vous ne signalez pas à l'ANSM : ce sont les industriels qui le font. En revanche vous êtes en première ligne pour repérer la tension, alerter le pharmacien, appliquer le contingentement décidé et informer les services."}},

 {t:"notion", kick:"Fluides médicaux", titre:"Trois statuts, une même bouteille",
  paras:["Les gaz à usage médical sont des produits de santé, mais tous n'ont pas le même statut. Les gaz médicinaux sont des médicaments et disposent d'une autorisation de mise sur le marché : oxygène, protoxyde d'azote, monoxyde d'azote, MEOPA, xénon. D'autres gaz sont des dispositifs médicaux et portent un marquage CE : dioxyde de carbone pour cœlioscopie, gaz pour chirurgie ophtalmique, argon pour chirurgie laser, azote liquide. D'autres enfin n'ont ni AMM ni marquage CE : air médical, vide, aspiration médicale.",
   "Pour l'oxygène, l'AMM est accordée pour le gaz contenu, la bouteille et son robinet, et le cas échéant le détendeur intégré au robinet. Ce n'est pas seulement le gaz qui est autorisé : c'est l'ensemble."],
  encart:{type:"piege", titre:"Le piège à éviter", texte:"Les gaz à usage médical se distinguent des gaz à usage technique, qui ne sont pas des produits de santé — un gaz de laboratoire par exemple. Même apparence, même contenant, régime juridique sans rapport."},
  img:{f:"ue10-08-bouteilles.jpg", leg:"Bouteilles de gaz à usage médical"}},

 {t:"notion", kick:"Fluides médicaux", titre:"Qui commande l'oxygène",
  paras:["L'oxygène médical destiné à des patients hospitalisés est commandé par le pharmacien de la PUI de l'établissement, auprès d'un établissement pharmaceutique exploitant ou distributeur en gros de gaz à usage médical.",
   "Les PUI gèrent également les autres gaz médicinaux disposant d'une AMM ainsi que les gaz ayant le statut de dispositif médical stérile. Le remplissage de bouteilles et de réservoirs cryogéniques mobiles est une opération de fabrication : il ne peut être réalisé que dans un établissement disposant d'une autorisation d'ouverture."],
  encart:{type:"info", titre:"Ce qui reste au laboratoire", texte:"La qualité analytique du produit livré, conforme aux spécifications de l'AMM, relève du laboratoire pharmaceutique fabricant. Le changement des bouteilles sur une rampe d'approvisionnement, lui, relève du pharmacien hospitalier."}},

 {t:"etapes", kick:"En pratique", titre:"Le cycle d'un produit dans la PUI",
  etapes:["Évaluation du besoin, qualitative et quantitative, en fonction de l'activité",
   "Commande selon les procédures et les directives du pharmacien, auprès de fournisseurs agréés",
   "Réception : contrôle de conformité de la livraison et traçabilité de l'approvisionnement",
   "Rangement dans des conditions préservant la qualité et l'intégrité du produit",
   "Suivi des dates de péremption et rotation des lots",
   "Délivrance aux unités de soins ou reconstitution des dotations, avec traçabilité",
   "Inventaires périodiques et rapprochement avec les données informatiques",
   "Élimination des produits périmés selon les procédures et la réglementation"],
  note:"Séquence construite à partir des indicateurs de la compétence C9 de l'annexe II de l'arrêté du 31 juillet 2024."},

 {t:"quiz", kick:"Vérification", question:"Quel est le stock de sécurité minimal imposé pour un médicament d'intérêt thérapeutique majeur ?",
  options:["Une semaine de couverture des besoins","Deux mois de couverture des besoins","Quatre mois de couverture des besoins"],
  bonne:1,
  expl:"Une semaine correspond aux autres médicaments, quatre mois au plafond que l'ANSM peut imposer après une rupture survenue dans les deux années civiles précédentes."},

 {t:"quiz", kick:"Vérification", question:"Un cadre vous demande de commander du dioxyde de carbone pour la cœlioscopie du bloc. Quel est son statut ?",
  options:["Médicament sous AMM","Dispositif médical portant un marquage CE","Gaz sans statut de produit de santé"],
  bonne:1,
  expl:"Le dioxyde de carbone pour cœlioscopie est un gaz dispositif médical. L'air médical, le vide et l'aspiration médicale, eux, n'ont ni AMM ni marquage CE."},

 {t:"quiz", kick:"Vérification", question:"Qui informe l'ANSM d'un risque de rupture de stock d'un MITM ?",
  options:["La PUI qui constate la tension","Le titulaire de l'AMM ou l'entreprise qui exploite le médicament","L'ARS après remontée des établissements"],
  bonne:1,
  expl:"L'obligation pèse sur l'industriel, dès qu'il en a connaissance. La PUI, elle, applique les mesures décidées et alerte en interne."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Arrêté du 31 juillet 2024, annexes I et II", ref:"Activité 4 et compétence C9 : gestion et approvisionnement des médicaments, dispositifs et fluides médicaux, critères d'évaluation", url:"https://www.fhf.fr/sites/default/files/2024-08/Arr%C3%AAt%C3%A9%20du%2031%20juillet%202024%20relatif%20au%20DE%20de%20PPH.pdf"},

  {titre:"ANSM", ref:"Entrée en vigueur de l'obligation de stock de deux mois pour les MITM, plans de gestion des pénuries, chiffres des signalements 2019 et 2020", url:"https://ansm.sante.fr/actualites/disponibilite-des-medicaments-les-medicaments-dinteret-therapeutique-majeur-doivent-desormais-disposer-dun-stock-de-securite-de-deux-mois"},
  {titre:"Vie publique", ref:"Durées de stock par catégorie de médicament et plafond de quatre mois", url:"https://www.vie-publique.fr/en-bref/281379-penuries-de-medicaments-un-stock-minimal-obligatoire"},
  {titre:"Ordre national des pharmaciens", ref:"Dispensation de l'oxygène à usage médical : commande par le pharmacien de la PUI, gaz médicinaux et gaz dispositifs médicaux", url:"https://www.ordre.pharmacien.fr/je-suis/pharmacien/pharmacien/mon-exercice-professionnel/les-fiches-professionnelles/dispensation-de-l-oxygene-a-usage-medical"},
