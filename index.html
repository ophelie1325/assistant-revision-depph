<!DOCTYPE html>
<html lang="fr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F6F2">
<meta name="google" content="notranslate">
<meta name="google" content="nositelinkssearchbox">
<title>Prépa DEPPH</title>
<style>
:root{
  --fond:#F1F6F2; --carte:#FFFFFF; --encre:#16241F; --encre2:#5A6B65; --encre3:#8DA09A;
  --trait:#E2EAE5; --trait2:#EDF3EF;
  --menthe:#17B890; --menthe-fonce:#109272; --menthe-pale:#DFF3EC;
  --d1:#2F6FB2; --d2:#7A3E9D; --d3:#0E8577; --d4:#B2711A; --d5:#B33B4A;
  --or:#F0B429; --or-pale:#FFF6E3; --or-fonce:#B77F16;
  --bleu-pale:#EAF1FA;
  --rouge:#D6452F; --rouge-pale:#FDEDEA;
  --ok:#17B890; --ombre:0 1px 2px rgba(20,40,35,.05), 0 6px 16px rgba(20,40,35,.06);
  --r:18px; --r2:13px;
  --hautNav:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit','Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;background:var(--fond);color:var(--encre);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.02em;font-weight:700}
:focus-visible{outline:2px solid var(--menthe);outline-offset:2px;border-radius:6px}

.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--hautNav) + env(safe-area-inset-bottom));position:relative}
.ecran{padding:18px 16px 20px}
.enTete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.enTete h1{font-size:25px}
.sousTitre{color:var(--encre2);font-size:14px;margin-bottom:18px}
.jour{background:var(--carte);border-radius:999px;padding:5px 12px;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;font-weight:600;color:var(--menthe-fonce);box-shadow:var(--ombre);white-space:nowrap;flex:none}
.iconeBtn{width:38px;height:38px;border-radius:12px;background:var(--carte);box-shadow:var(--ombre);
  display:grid;place-items:center;font-size:17px;flex:none}

/* ---- navigation basse ---- */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--trait);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:520px;margin:0 auto;display:flex;width:100%}
.nav button{flex:1;padding:9px 0 12px;font-size:11.5px;font-weight:600;color:var(--encre3);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.act{color:var(--menthe)}
.nav .ic{font-size:19px;line-height:1}

/* ---- blocs domaine ---- */
.bloc{background:var(--carte);border-radius:var(--r);padding:14px 15px;margin-bottom:11px;box-shadow:var(--ombre)}
.bloc-t{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.point{width:10px;height:10px;border-radius:3px;flex:none}
.bloc-nom{font-size:14px;font-weight:600;min-width:0}
.bloc-meta{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3);flex:none}
.alv{display:flex;gap:8px}
.alv .a{flex:1;min-width:0;border-radius:var(--r2);background:var(--trait2);border:1.5px solid var(--trait);
  padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.alv .a:active{transform:scale(.96)}
.alv .a b{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--encre2)}
.alv .a small{font-size:9.5px;color:var(--encre3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.alv .a.dispo{background:var(--menthe);border-color:var(--menthe);box-shadow:0 3px 0 var(--menthe-fonce)}
.alv .a.dispo b,.alv .a.dispo small{color:#fff}
.alv .a.fait{background:var(--menthe-pale);border-color:#B6E3D5}
.alv .a.fait b{color:var(--menthe-fonce)}
.alv .a.vide{opacity:.55}

/* ---- boutons ---- */
.cta{display:block;width:100%;background:var(--menthe);color:#fff;border-radius:var(--r2);padding:14px;
  text-align:center;font-weight:600;font-size:15.5px;box-shadow:0 3px 0 var(--menthe-fonce);margin-top:6px}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--menthe-fonce)}
.cta.sec{background:var(--carte);color:var(--encre);box-shadow:var(--ombre)}
.cta.sec:active{transform:none}
.cta[disabled]{opacity:.45;box-shadow:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--carte);border-radius:11px;padding:9px 14px;
  font-size:14px;font-weight:600;box-shadow:var(--ombre)}
.btn.plein{background:var(--menthe);color:#fff;box-shadow:0 2px 0 var(--menthe-fonce)}
.btn.mini{padding:6px 11px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45}
.rang{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

/* ---- barre de progression ---- */
.jauge{height:7px;background:var(--trait2);border-radius:4px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--menthe);border-radius:4px;transition:width .45s ease}
.progLigne{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progLigne .jauge{flex:1}
.progLigne span{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--encre2);flex:none}

/* ---- leçon ---- */
.lecon{min-height:100vh;display:flex;flex-direction:column;padding:14px 16px calc(var(--hautNav) + 14px)}
.lecon-haut{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pts{display:flex;gap:3px;flex:1}
.pts span{height:4px;flex:1;border-radius:2px;background:#DCE6E1;transition:background .3s}
.pts span.f{background:var(--menthe)}
.fermer{font-size:22px;color:var(--encre3);line-height:1;padding:0 2px}
.diapo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 18px;animation:entre .28s ease}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--menthe-fonce);margin-bottom:9px}
.diapo h2{font-size:24px;margin-bottom:13px}
.diapo h3{font-size:20px;margin-bottom:11px}
.diapo p{font-size:15.5px;line-height:1.55;color:#31423C;margin-bottom:11px}
.diapo p strong{font-weight:600;color:var(--encre)}
.encart{border-radius:var(--r2);padding:13px 14px;margin-top:6px;font-size:14.5px;line-height:1.5}
.encart b.et{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:5px;font-weight:600}
.encart.astuce{background:var(--or-pale)} .encart.astuce b.et{color:var(--or-fonce)}
.encart.piege{background:var(--rouge-pale)} .encart.piege b.et{color:var(--rouge)}
.encart.garde{background:var(--bleu-pale)} .encart.garde b.et{color:var(--d1)}
.encart.info{background:var(--menthe-pale)} .encart.info b.et{color:var(--menthe-fonce)}
.vocab{list-style:none}
.vocab li{background:var(--carte);border-radius:var(--r2);padding:11px 13px;margin-bottom:8px;font-size:14.5px;
  box-shadow:var(--ombre);line-height:1.45}
.vocab b{display:block;font-size:14px;margin-bottom:2px}
.vocab span{color:var(--encre2)}
.etapes{list-style:none;counter-reset:e}
.etapes li{counter-increment:e;display:flex;gap:11px;align-items:flex-start;margin-bottom:9px;font-size:14.5px;line-height:1.4}
.etapes li::before{content:counter(e);flex:none;width:24px;height:24px;border-radius:8px;background:var(--menthe);
  color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.chiffres{list-style:none}
.chiffres li{display:flex;gap:11px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--trait);font-size:14.5px}
.chiffres li:last-child{border:none}
.chiffres b{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--menthe-fonce);flex:none;min-width:64px}
.sources{list-style:none;font-size:13px}
.sources li{padding:9px 0;border-bottom:1px solid var(--trait);color:var(--encre2);line-height:1.4}
.sources li:last-child{border:none}
.sources b{display:block;color:var(--encre);font-size:13.5px;font-weight:600}
.sources a{color:var(--menthe-fonce);word-break:break-all;font-size:12px;text-decoration:none;font-family:'IBM Plex Mono',monospace}

/* ---- quiz et exercices ---- */
.opt{display:block;width:100%;text-align:left;background:var(--carte);border:1.5px solid var(--trait);
  border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;font-size:15px;line-height:1.4;box-shadow:var(--ombre)}
.opt:active{transform:scale(.985)}
.opt.pris{border-color:var(--menthe);background:var(--menthe-pale)}
.opt.juste{border-color:var(--menthe);background:var(--menthe-pale)}
.opt.faux{border-color:var(--rouge);background:var(--rouge-pale)}
.verdict{border-radius:var(--r2);padding:13px 14px;margin:12px 0;font-size:14.5px;line-height:1.5}
.verdict.ok{background:var(--menthe-pale)} .verdict.ko{background:var(--rouge-pale)}
.verdict b{display:block;margin-bottom:3px}
.champ{display:block;font-size:13px;font-weight:600;color:var(--encre2);margin:0 0 6px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--trait);border-radius:var(--r2);background:var(--carte)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.duo{display:grid;gap:11px;grid-template-columns:1fr 1fr}
.puce{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--carte);
  font-size:12.5px;font-weight:500;box-shadow:var(--ombre);color:var(--encre2)}
.puce.on{background:var(--menthe);color:#fff;box-shadow:0 2px 0 var(--menthe-fonce)}
.puce.mono{font-family:'IBM Plex Mono',monospace;font-size:11px}
.liste-puces{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.avis{border-radius:var(--r2);padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5;background:var(--or-pale)}
.avis.info{background:var(--menthe-pale)} .avis.err{background:var(--rouge-pale)}
.avis b{display:block;margin-bottom:3px}
.vide{text-align:center;padding:38px 16px;color:var(--encre2)}
.vide .em{font-size:34px;margin-bottom:10px}
.vide h3{font-size:17px;margin-bottom:6px;color:var(--encre)}
.carteAct{display:flex;align-items:center;gap:12px;background:var(--carte);border-radius:var(--r);padding:14px 15px;
  margin-bottom:10px;box-shadow:var(--ombre);width:100%;text-align:left}
.carteAct .ic{width:40px;height:40px;border-radius:12px;background:var(--menthe-pale);display:grid;place-items:center;
  font-size:18px;flex:none}
.carteAct .tx{flex:1;min-width:0}
.carteAct .tx b{display:block;font-size:15px;font-weight:600}
.carteAct .tx small{font-size:12.5px;color:var(--encre2)}
.carteAct .fl{color:var(--encre3);font-size:18px}
.tableau{width:100%;border-collapse:collapse;font-size:14px}
.tableau th,.tableau td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--trait)}
.tableau th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--encre3);font-weight:500}
.tableau td.n{font-family:'IBM Plex Mono',monospace;text-align:right}
.chrono{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--menthe-fonce)}
.src{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--encre3);border-bottom:1px dotted var(--trait)}
.srcTxt{display:none;font-size:13.5px;color:var(--encre2);background:var(--trait2);padding:10px 12px;
  border-radius:10px;margin:8px 0;font-style:italic;line-height:1.45}
.srcTxt.ouvert{display:block}
.semaine{border-left:2px solid var(--trait);padding:0 0 15px 14px;position:relative}
.semaine::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--menthe)}
.semaine .quand{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3);text-transform:uppercase;letter-spacing:.08em}

/* ---- légende des unités d'enseignement ---- */
.legende{margin-top:22px;border-top:1px solid var(--trait);padding-top:14px}
.legende .lg-t{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--encre3);margin-bottom:10px}
.legende .lg-d{display:flex;align-items:center;gap:7px;margin:11px 0 5px}
.legende .lg-d b{font-size:12.5px;font-weight:600;color:var(--encre2)}
.legende dl{margin:0}
.legende .lg-l{display:flex;gap:9px;align-items:baseline;padding:3px 0 3px 17px;font-size:12.5px;line-height:1.4}
.legende .lg-l dt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--menthe-fonce);flex:none;min-width:34px}
.legende .lg-l dd{margin:0;color:var(--encre2)}
.legende .lg-l dd i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3)}
body.vueLarge .legende dl{column-count:2;column-gap:26px}
body.vueLarge .legende .lg-l{break-inside:avoid}

/* ---- thème sombre ---- */
body.sombre{
  --fond:#0F1A17; --carte:#182521; --encre:#E9F2ED; --encre2:#A6B7B0; --encre3:#75887F;
  --trait:#27362F; --trait2:#1E2D28;
  --menthe:#22C79C; --menthe-fonce:#0D7A5F; --menthe-pale:#123329;
  --d1:#6FA6E0; --d2:#B583D6; --d3:#35B8A8; --d4:#E0A44E; --d5:#E4707E;
  --or:#F0B429; --or-pale:#2F2717; --or-fonce:#E8B44A;
  --bleu-pale:#16283A;
  --rouge:#E4705C; --rouge-pale:#33201D;
  --ombre:0 1px 2px rgba(0,0,0,.28), 0 6px 16px rgba(0,0,0,.30);
}
body.sombre .nav{background:rgba(24,37,33,.94)}
body.sombre .alv .a.fait{border-color:#1C5145}
body.sombre .diapo p{color:#CBD8D2}
body.sombre .pts span{background:#2C3B35}
body.sombre input,body.sombre select,body.sombre textarea{background:var(--carte);border-color:var(--trait)}

/* ---- confort de lecture ---- */
body.txtL .diapo p{font-size:17px} body.txtL .diapo h2{font-size:26px} body.txtL .diapo h3{font-size:22px}
body.txtL .vocab li,body.txtL .encart,body.txtL .opt,body.txtL .chiffres li,body.txtL .verdict{font-size:16px}
body.txtL .sousTitre,body.txtL .sources li{font-size:14.5px}
body.txtL .carteAct .tx b,body.txtL .bloc-nom{font-size:16px}
body.txtXL .diapo p{font-size:19px} body.txtXL .diapo h2{font-size:29px} body.txtXL .diapo h3{font-size:24px}
body.txtXL .vocab li,body.txtXL .encart,body.txtXL .opt,body.txtXL .chiffres li,body.txtXL .verdict{font-size:17.5px}
body.txtXL .sousTitre,body.txtXL .sources li{font-size:15.5px}
body.txtXL .carteAct .tx b,body.txtXL .bloc-nom{font-size:17px}

/* ---- outils sur exercice ---- */
.outilsExo{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.outilsExo .btn{font-size:12.5px;padding:6px 10px;font-weight:500}
.panEdit{background:var(--carte);border-radius:var(--r2);padding:12px 13px;margin-top:10px;box-shadow:var(--ombre)}
.panEdit textarea{min-height:80px}
.marqueur{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;background:var(--or-pale);color:var(--or-fonce);padding:3px 7px;border-radius:6px;margin-left:6px}

/* ---- vue ordinateur ---- */
body.vueLarge .app{max-width:940px}
body.vueLarge .nav .in{max-width:940px}
body.vueLarge .ecran{padding:26px 30px 30px}
body.vueLarge .lecon{padding:20px 30px calc(var(--hautNav) + 20px);max-width:940px;margin:0 auto}
body.vueLarge .enTete h1{font-size:31px}
body.vueLarge .diapo h2{font-size:31px}
body.vueLarge .diapo h3{font-size:25px}
body.vueLarge .diapo p{font-size:17px}
body.vueLarge .vocab{display:grid;grid-template-columns:1fr 1fr;gap:9px}
body.vueLarge .vocab li{margin-bottom:0}
body.vueLarge .chiffres{column-count:2;column-gap:26px}
body.vueLarge .chiffres li{break-inside:avoid}
body.vueLarge .sources{column-count:2;column-gap:26px}
body.vueLarge .sources li{break-inside:avoid}
body.vueLarge .illus{max-width:560px}
body.vueLarge .opt{font-size:16px}
.illus{margin:14px 0;background:var(--carte);border-radius:var(--r2);overflow:hidden;box-shadow:var(--ombre)}
.illus img{display:block;width:100%;height:auto}
.illus figcaption{font-size:12.5px;color:var(--encre2);padding:8px 11px;line-height:1.4}
.illus figcaption b{display:block;font-weight:600;color:var(--encre);margin-bottom:1px}
.ligneCoche{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--carte);
  border:1.5px solid var(--trait);border-radius:var(--r2);padding:11px 13px;margin-bottom:8px;
  font-size:14.5px;line-height:1.45;box-shadow:var(--ombre)}
.ligneCoche .case{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--trait);
  background:var(--trait2);display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px}
.ligneCoche.on{border-color:var(--menthe);background:var(--menthe-pale)}
.ligneCoche.on .case{background:var(--menthe);border-color:var(--menthe)}
.ligneCoche .tx{flex:1;min-width:0}
.ligneCoche.incert{border-left:4px solid var(--or)}
.ligneCoche:not(.on) .tx{opacity:.55}
.drapeau{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--or-fonce);margin-top:4px}
.horsCours{border-radius:var(--r2);background:var(--bleu-pale);padding:13px 14px;margin-bottom:10px;font-size:14.5px;line-height:1.5}
.horsCours .et{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--d1);font-weight:600;margin-bottom:6px}
.horsCours a{display:block;color:var(--d1);font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  text-decoration:none;word-break:break-all;margin-top:5px}

.reform{display:block;margin-top:6px;padding-left:9px;border-left:2px solid var(--or);
  font-size:13.5px;color:var(--encre2);line-height:1.45}
.anneau3{display:block;flex:none}
.grandAnneau{display:flex;align-items:center;gap:18px;border-radius:26px;padding:20px 22px;
  margin:12px 0 14px;color:#fff;background:linear-gradient(135deg,#0D6E55 0%,#109272 48%,#17B890 100%);
  box-shadow:0 10px 26px rgba(16,146,114,.28);animation:surgit .35s cubic-bezier(.2,.8,.3,1) both}
.grandAnneau .anneau3 circle:first-child{stroke:rgba(255,255,255,.22)}
.grandAnneau .anneau3 text{fill:#fff}
.grandAnneau .chiffres{flex:1;min-width:0}
.grandAnneau .chiffres b{display:block;font-size:25px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.grandAnneau .chiffres small{display:block;font-size:12.5px;opacity:.82;margin-bottom:2px}
.anneaux{display:flex;gap:6px;justify-content:space-between;margin-bottom:10px}
.anneauD{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--carte);border-radius:16px;padding:10px 2px 9px;box-shadow:var(--ombre)}
.anneauD .lab{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
.anneauD .lab2{font-size:10px;color:var(--encre3)}
.legSeg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:11.5px;
  color:var(--encre2);margin:0 0 16px}
.legSeg span{display:inline-flex;align-items:center;gap:5px}

  {id:"UE12.1", code:"5.12.1.S1 + 5.12.1.S2", sem:[1,2], dom:5, ects:3, nom:"Initiation à la démarche de recherche",

const UE = id => UES.find(u => u.id === id) || null;

const TYPES = {
  qcm:"QCM", qcmMulti:"QCM à réponses multiples", vf:"Vrai ou faux", flash:"Flashcard",

const TYPES_IA_SEULE = ["erreur","situation","qcmMulti","choix","redaction","comparer","pourquoi"];

const TYPES_REDIGES = ["ouverte","erreur","situation","redaction","comparer","pourquoi"];

const FAMILLES = {

  {n:1, nom:"Reconnaître", desc:"Retrouver la bonne formulation parmi quatre propositions plausibles.", types:["choix"]},

];
/* Famille et niveau par défaut, pour les exercices produits avant la vague C. */
const DEFAUT_FAMILLE = {
  flash:"memo", vf:"memo", qcm:"memo", qcmMulti:"memo", cloze:"memo", ouverte:"memo",
  paires:"comp", ordre:"comp", classer:"comp", choix:"comp",
  redaction:"comp", situation:"comp", erreur:"comp", comparer:"comp", pourquoi:"comp"
};
const DEFAUT_NIVEAU = {choix:1, classer:2, paires:2, ordre:2, cloze:3,
  redaction:4, situation:4, erreur:4, comparer:4, pourquoi:4};
function familleDe(it){ return it.famille === "comp" || it.famille === "memo" ? it.famille : (DEFAUT_FAMILLE[it.type] || "memo"); }
function niveauDe(it){
  if(familleDe(it) !== "comp") return 0;
  const n = Number(it.niveau);
  return n >= 1 && n <= 4 ? n : (DEFAUT_NIVEAU[it.type] || 2);

/* Durées moyennes en secondes. Ce sont des estimations d'interface, pas des données

/* Le référentiel compte treize UE, dont deux subdivisées. Les versions antérieures
   en comptaient quinze, numérotées à la suite : tout ce qui porte un identifiant
   d'unité doit être renommé, sans perdre la moindre progression. */
const RENUM_V3 = {UE4:"UE4.1", UE5:"UE4.2", UE6:"UE5", UE7:"UE6", UE8:"UE7", UE9:"UE8",
  UE10:"UE9", UE11:"UE10", UE12:"UE11", UE13:"UE12.1", UE14:"UE12.2", UE15:"UE13"};
function renumeroter(){
  const n = id => RENUM_V3[id] || id;
  let touches = 0;
  S.cours.forEach(c => {
    if(RENUM_V3[c.ueId]){ c.ueId = n(c.ueId); touches++; }
    (c.items || []).forEach(it => { if(RENUM_V3[it.ueId]) it.ueId = n(it.ueId); });
  });
  // progression des exercices de préparation : leur identifiant contient le code d'UE
  const prog2 = {};
  Object.keys(S.progres).forEach(k => {
    const m = /^px-(UE\d+)-(\d+)$/.exec(k);
    prog2[m && RENUM_V3[m[1]] ? "px-" + RENUM_V3[m[1]] + "-" + m[2] : k] = S.progres[k];
    if(m && RENUM_V3[m[1]]) touches++;
  });
  S.progres = prog2;
  // avancement des leçons, notes saisies, dates d'examen par UE
  ["prep","notes"].forEach(cle => {
    const o = {};
    Object.keys(S[cle] || {}).forEach(k => { o[n(k)] = S[cle][k]; if(RENUM_V3[k]) touches++; });
    S[cle] = o;
  });
  const d = {};
  Object.keys(S.reglages.datesUE || {}).forEach(k => { d[n(k)] = S.reglages.datesUE[k]; });
  S.reglages.datesUE = d;
  S.travaux.forEach(t => { if(RENUM_V3[t.ueId]) { t.ueId = n(t.ueId); touches++; } });
  S.examens.forEach(e => (e.ues || []).forEach(u => { if(RENUM_V3[u.id]) u.id = n(u.id); }));
  return touches;
}
function migrer(){
  if(Number(S.version) >= VERSION) return false;
  const n = renumeroter();
  S.version = VERSION;
  sauver();
  if(n) messageMigration = n;
  return true;
}

function verifierEtancheite(){
  const connus = new Set();
  S.cours.forEach(c => (c.items || []).forEach(it => connus.add(it.id)));
  const orphelins = Object.keys(S.progres)
    .filter(k => !estPrep(k) && !connus.has(k));
  orphelins.forEach(k => delete S.progres[k]);
  if(orphelins.length) sauver();

}

function empreinte(t){
  const n = normaliser(t); let h = 5381;
  for(let i = 0; i < n.length; i++){ h = ((h << 5) + h + n.charCodeAt(i)) | 0; }
  return String(h) + "-" + n.length;
}

   4. LECTURE DU TEXTE — découpage en phrases, titres, listes

const UNITES = "%|mg|µg|mcg|g|kg|mL|ml|L|l|°C|min|h|heures?|jours?|semaines?|mois|ans?|bar|kPa|ppm|UI|Bq|kBq|MBq|GBq|mSv|µSv|Gy|log|cm|mm|m²|€|ECTS|/20|/min|mmol|mOsm";
const RE_CHIFFRE = new RegExp("(?:^|[\\s(])(\\d+(?:[.,]\\d+)?)\\s?(" + UNITES + ")(?![a-zA-Zéèà])", "");
const RE_NORME = /(NF\s?EN\s?ISO\s?\d+|NF\s?EN\s?\d+|ISO\s?\d{3,5}(?:-\d+)?|EN\s?\d{3,5})/i;
const RE_TEXTE_REG = /(arrêté du \d|décret n|circulaire|directive \d|règlement \(UE\)|article [LRD]\.\s?\d|bonnes pratiques de préparation|BPP|BPF|pharmacopée)/i;
const RE_PIEGE = /\b(attention|jamais|ne (?:doit|peut|faut) (?:pas|jamais)|interdit|obligatoire|impérativ|systématiquement|sauf|risque de|à ne pas confondre|contrairement à|en aucun cas)\b/i;
const RE_DEF = /^(.{3,70}?)\s*(?::|\s[—–]\s)\s*(.{25,})$/;
const RE_DEF_VERBE = /^(.{3,60}?)\s+(?:est|sont|désigne|désignent|correspond à|correspondent à|se définit comme|consiste à|permet de)\s+(.{20,})$/i;
const RE_PUCE = /^\s*(?:[-•–*·]|\d{1,2}\s*[.)°]|[a-h]\s*[.)]|[IVX]{1,4}\s*[.)])\s+(.{3,})$/;

const RE_TITRE_MD = /^(#{1,6})\s+(.{2,120})$/;
const RE_GRAS = /\*\*([^*]{2,90})\*\*/g;
function sansGras(t){ return String(t||"").replace(/\*\*/g, ""); }
function grasDe(t){
  const out = []; let m; RE_GRAS.lastIndex = 0;
  while((m = RE_GRAS.exec(String(t||""))) !== null){ const v = m[1].trim(); if(v) out.push(v); }
  return out;
}
function decouper(texte){
  const lignes = texte.replace(/\r/g,"").split("\n").map(l => l.replace(/\s+$/,""));
  const blocs = [];
  lignes.forEach(l => {
    const t = l.trim();
    if(!t){ blocs.push({type:"vide", txt:""}); return; }
    const md = t.match(RE_TITRE_MD);
    if(md){ blocs.push({type:"titre", txt:sansGras(md[2]).trim(), niveau:md[1].length, brut:t}); return; }
    const gras = grasDe(t);
    const p = t.match(RE_PUCE);
    if(p){ blocs.push({type:"puce", txt:sansGras(p[1]).trim(), brut:sansGras(t), gras}); return; }
    const nu = sansGras(t);
    const estTitre = nu.length < 85 && !/[.;:!?]$/.test(nu) &&
      (/^[A-ZÉÈÀÇ0-9]/.test(nu)) && nu.split(" ").length <= 12 && !RE_DEF.test(nu);
    blocs.push({type: estTitre ? "titre" : "para", txt:nu, gras});
  });
  return blocs;
}
function phrases(texte){
  return sansGras(texte).replace(/\s+/g," ")
    .split(/(?<=[.!?;])\s+(?=[A-ZÉÈÀÇ0-9«"])/)
    .map(p => p.trim()).filter(p => p.length > 30 && p.length < 400);
}
function detecterUE(texte){
  const n = " " + normaliser(texte) + " ";
  let meilleur = null, best = 0;
  UES.forEach(u => {
    let score = 0;
    u.cles.forEach(c => {
      const cn = normaliser(c);
      if(!cn) return;
      const occ = n.split(" " + cn).length - 1;
      if(occ > 0) score += occ * (cn.includes(" ") ? 3 : 1.6);
    });
    if(score > best){ best = score; meilleur = u.id; }
  });
  return best >= 4 ? meilleur : null;
}

const SONDES = [
  {re:/\b\d{13}(?:\s?\d{2})?\b/g,                     quoi:"numéro à 13 chiffres (type NIR)"},
  {re:/\b(?:NIP|IPP|IEP)\s?[:n°]*\s?\d{4,}/gi,        quoi:"identifiant de séjour ou de patient"},
  {re:/\bné(?:e)?\s+le\s+\d{1,2}[\/\s.-]\d{1,2}[\/\s.-]\d{2,4}/gi, quoi:"date de naissance"},
  {re:/\b(?:M\.|Mme|Mlle|Monsieur|Madame)\s+[A-ZÉÈÀ][a-zéèêàçï]+/g, quoi:"nom précédé d'une civilité"},
  {re:/\bchambre\s?n?°?\s?\d{1,4}\b/gi,               quoi:"numéro de chambre"},
  {re:/\b[\w.%+-]+@[\w.-]+\.[a-z]{2,}\b/gi,           quoi:"adresse électronique"},
  {re:/(?:\+33|\b0)\s?[1-9](?:[\s.-]?\d{2}){4}\b/g,   quoi:"numéro de téléphone"}
];
function sonderDonnees(t){
  const trouves = [];
  SONDES.forEach(s => { s.re.lastIndex = 0; if(s.re.test(t)) trouves.push(s.quoi); });
  return trouves;
}
function anonymiser(t){
  let r = t;
  r = r.replace(/\b\d{13}(?:\s?\d{2})?\b/g, "[IDENTIFIANT]");
  r = r.replace(/\b(NIP|IPP|IEP)\s?[:n°]*\s?\d{4,}/gi, "$1 [IDENTIFIANT]");
  r = r.replace(/\bné(e)?\s+le\s+\d{1,2}[\/\s.-]\d{1,2}[\/\s.-]\d{2,4}/gi, "né$1 le [DATE]");
  r = r.replace(/\b(M\.|Mme|Mlle|Monsieur|Madame)\s+[A-ZÉÈÀ][a-zéèêàçï]+(?:\s+[A-ZÉÈÀ][A-ZÉÈÀa-zéèêàçï]+)?/g, "$1 [PATIENT]");
  r = r.replace(/\bchambre\s?n?°?\s?\d{1,4}\b/gi, "chambre [N°]");
  r = r.replace(/\b[\w.%+-]+@[\w.-]+\.[a-z]{2,}\b/gi, "[COURRIEL]");
  r = r.replace(/(?:\+33|\b0)\s?[1-9](?:[\s.-]?\d{2}){4}\b/g, "[TÉLÉPHONE]");
  return r;
}
/* =========================================================================
   6. MOTEUR LOCAL — extraction sans intelligence artificielle
   Tout ce qui est produit ici provient littéralement du cours importé.
   ========================================================================= */
function analyseLocale(texte, ueId){
  const blocs = decouper(texte);
  const phr = phrases(texte);
  const definitions = [], points = [], chiffres = [], normes = [], pieges = [], procedures = [], sigles = [];

  // définitions : « terme : explication » ou « terme est ... »
  const vusDef = new Set();
  blocs.forEach(b => {
    if(b.type === "vide") return;
    let m = b.txt.match(RE_DEF) || b.txt.match(RE_DEF_VERBE);
    if(m){
      const terme = m[1].replace(/^[-•–*·\d.)\s]+/,"")
        .replace(/^(?:les|le|la|un|une|des|du)\s+/i,"").replace(/^l['’]\s*/i,"").trim();
      const def = m[2].trim();
      const k = normaliser(terme);
      if(terme.length > 2 && terme.length < 70 && def.length > 20 && !vusDef.has(k)){
        vusDef.add(k);
        definitions.push({terme, def, src:b.txt});
      }
    }
  });

  // sigles explicités dans le cours : « PUI (pharmacie à usage intérieur) » et l'inverse
  const vusSig = new Set();
  let ms;
  const reSig1 = /\b([A-ZÉÈ]{2,6})\s*\(([^)]{6,80})\)/g;
  while((ms = reSig1.exec(texte)) !== null){
    if(!vusSig.has(ms[1])){ vusSig.add(ms[1]); sigles.push({sigle:ms[1], sens:ms[2].trim(), src:ms[0]}); }
  }
  const reSig2 = /([a-zéèêàç][^.()\n]{6,80})\s*\(([A-ZÉÈ]{2,6})\)/g;
  while((ms = reSig2.exec(texte)) !== null){
    if(!vusSig.has(ms[2])){ vusSig.add(ms[2]); sigles.push({sigle:ms[2], sens:ms[1].trim(), src:ms[0]}); }
  }

  // chiffres, normes, pièges, points importants
  phr.forEach(p => {
    if(RE_CHIFFRE.test(p) && chiffres.length < 25) chiffres.push({txt:p, src:p});
    if((RE_NORME.test(p) || RE_TEXTE_REG.test(p)) && normes.length < 20) normes.push({txt:p, src:p});
    if(RE_PIEGE.test(p) && pieges.length < 15) pieges.push({txt:p, src:p});
  });
  // ce que le document met en valeur : titres et passages en gras ou soulignés
  const saillants = [], vusSail = new Set();
  blocs.forEach(b => (b.gras || []).forEach(g => {
    const k = normaliser(g);
    if(k && !vusSail.has(k)){ vusSail.add(k); saillants.push({txt:g, src:b.txt}); }
  }));
  blocs.forEach(b => {
    if(b.type === "puce" && b.txt.length > 25 && b.txt.length < 260 && points.length < 30)
      points.push({txt:b.txt, src:b.txt, saillant: (b.gras || []).length > 0});
  });
  points.sort((a,b2) => (b2.saillant ? 1 : 0) - (a.saillant ? 1 : 0));
  if(points.length < 6){
    phr.slice(0, 40).forEach(p => {
      if(points.length < 12 && !points.some(x => x.txt === p) && p.length < 260) points.push({txt:p, src:p});
    });
  }

  // suites d'étapes : au moins trois puces consécutives numérotées
  let courante = [];
  const cloture = () => {
    if(courante.length >= 3 && courante.length <= 10)
      procedures.push({titre:"Suite d'étapes relevée dans le cours", etapes:courante.slice()});
    courante = [];
  };
  blocs.forEach(b => {
    if(b.type === "puce" && /^\s*\d{1,2}\s*[.)°]/.test(b.brut || "") && b.txt.length < 180) courante.push(b.txt);
    else cloture();
  });
  cloture();

  // plan du cours : un intitulé suivi de ses puces. Sert au classement en deux colonnes.
  const sections = []; let sec = null;
  blocs.forEach(b => {
    if(b.type === "titre"){ if(sec && sec.puces.length) sections.push(sec); sec = {titre:b.txt, puces:[]}; }
    else if(b.type === "puce" && sec && b.txt.length > 8 && b.txt.length < 140) sec.puces.push(b.txt);
  });
  if(sec && sec.puces.length) sections.push(sec);

  const titre = (blocs.find(b => b.type === "titre") || {txt:""}).txt;
  const resume = phr.slice(0,2).join(" ");

  // sigles employés sans être explicités nulle part : mentionnés mais non expliqués
  const expliques = new Set(sigles.map(s => s.sigle));
  const mentionnes = [], vusM = new Set();
  let mm; const reSigNu = /\b([A-ZÉÈ]{2,6})\b/g;
  while((mm = reSigNu.exec(texte)) !== null){
    const g = mm[1];
    if(expliques.has(g) || vusM.has(g) || /^(LE|LA|LES|DES|UNE|UN|ET|OU|AU|EN|DU|SI|NF|EN|ISO)$/.test(g)) continue;
    vusM.add(g);
    mentionnes.push({txt:"Sigle « " + g + " » employé sans être développé dans le cours.", src:g});
  }

  const fiche = {resume, definitions:definitions.slice(0,20), points:points.slice(0,18),
    chiffres:chiffres.slice(0,14), normes:normes.slice(0,10), pieges:pieges.slice(0,10),
    sigles:sigles.slice(0,15), procedures:procedures.slice(0,3),
    saillants:saillants.slice(0,20), mentionnes:mentionnes.slice(0,12),
    sections:sections.slice(0,10), complements:null, titreDetecte:titre};

  return {fiche, phr};
}

function itemsLocaux(fiche, phr, ueId){
  const items = [];
  const base = t => {
    const o = {id:uid(), ueId, type:t, cree:Date.now(), origine:"local",
      famille: DEFAUT_FAMILLE[t] || "memo"};
    if(o.famille === "comp") o.niveau = DEFAUT_NIVEAU[t] || 2;
    return o;
  };

  // flashcards et questions ouvertes à partir des définitions
  fiche.definitions.forEach(d => {
    items.push(Object.assign(base("flash"), {recto:d.terme, verso:d.def, source:d.src}));
    if(d.def.length >= 45){
      items.push(Object.assign(base("ouverte"), {
        question:"Expliquez : " + d.terme, attendu:d.def, motsCles:motsCles(d.def, 6), source:d.src}));
    }
  });
  // sigles en flashcards
  fiche.sigles.forEach(s => {
    items.push(Object.assign(base("flash"), {recto:s.sigle, verso:s.sens, source:s.src}));
  });
  // QCM : la bonne réponse et les distracteurs sont de vraies définitions du cours
  if(fiche.definitions.length >= 4){
    fiche.definitions.forEach((d,i) => {
      const autres = melanger(fiche.definitions.filter((_,j) => j !== i)).slice(0,3);
      if(autres.length < 3) return;
      const opts = melanger([d.def].concat(autres.map(a => a.def))).map(o => tronquer(o, 150));
      if(new Set(opts).size !== opts.length) return;
      items.push(Object.assign(base("qcm"), {
        question:"Que désigne « " + d.terme + " » ?", options:opts,
        reponse:opts.findIndex(o => o === tronquer(d.def,150)), source:d.src}));
    });
  }
  // appariement terme / définition
  if(fiche.definitions.length >= 4){
    const lot = melanger(fiche.definitions).slice(0,5);
    items.push(Object.assign(base("paires"), {
      question:"Associez chaque terme à sa définition.",
      paires: lot.map(d => [d.terme, tronquer(d.def, 110)]),
      source: lot.map(d => d.src).join(" — ")}));
  }
  // textes à trous sur les valeurs chiffrées
  fiche.chiffres.forEach(c => {
    const m = c.txt.match(RE_CHIFFRE);
    if(!m) return;
    const val = m[1] + (m[2] ? " " + m[2] : "");
    items.push(Object.assign(base("cloze"), {
      question: c.txt.replace(m[1] + (m[0].includes(" " + m[2]) ? " " : "") + m[2], "_____"),
      reponse: val, source:c.txt}));
  });
  // vrai / faux : la version fausse est obtenue en modifiant une valeur du cours
  fiche.chiffres.slice(0,10).forEach((c,i) => {
    const m = c.txt.match(RE_CHIFFRE);
    if(!m) return;
    const vrai = Math.random() < 0.5;   // tirage au sort : une alternance régulière se devine
    let enonce = c.txt;
    if(!vrai){
      const n = parseFloat(m[1].replace(",","."));
      let faux = n < 10 ? n + 1 : Math.round(n * (Math.random() < .5 ? 1.5 : 0.5));
      if(faux === n) faux = n + 2;
      enonce = c.txt.replace(m[1], String(faux).replace(".", ","));
    }
    items.push(Object.assign(base("vf"), {
      question: enonce, reponse: vrai,
      correction: vrai ? "Énoncé conforme au cours." : "Faux : la valeur exacte du cours est « " + m[1] + " " + m[2] + " ».",
      source: c.txt}));
  });
  // classement en deux colonnes : les intitulés et leurs puces viennent du plan du cours
  const retenus = new Set((fiche.points || []).map(p => normaliser(p.txt)));
  const utiles = (fiche.sections || [])
    .filter(sc => sc.titre && sc.titre.length > 3 && sc.titre.length < 60)
    .map(sc => ({titre:sc.titre, puces:sc.puces.filter(p => retenus.has(normaliser(p)))}))
    .filter(sc => sc.puces.length >= 3);
  if(utiles.length >= 2){
    const g = utiles[0], d2 = utiles[1];
    const el = g.puces.slice(0,4).map(t => ({txt:t, col:0}))
      .concat(d2.puces.slice(0,4).map(t => ({txt:t, col:1})));
    items.push(Object.assign(base("classer"), {
      question:"Rangez chaque élément sous l'intitulé du cours auquel il appartient.",
      colonnes:[g.titre, d2.titre], elements:melanger(el),
      source: g.titre + " / " + d2.titre}));
  }

  // remise en ordre des procédures
  fiche.procedures.forEach(p => {
    items.push(Object.assign(base("ordre"), {
      question:"Remettez ces étapes dans l'ordre du cours.",
      etapes:p.etapes, source:p.etapes.join(" → ")}));
  });
  // points clés en textes à trous sur un terme saillant
  fiche.points.slice(0,10).forEach(p => {
    const mots = p.txt.split(/\s+/);
    const idx = mots.findIndex(m => m.length > 8 && !MOTS_VIDES.has(normaliser(m)));
    if(idx < 0) return;
    const cible = mots[idx].replace(/[.,;:)]$/,"");
    const copie = mots.slice(); copie[idx] = "_____";
    items.push(Object.assign(base("cloze"), {question:copie.join(" "), reponse:cible, source:p.txt}));
  });
  return items;
}

}

function decouperTexte(t, max){
  if(t.length <= max) return [t];
  const blocs = t.split(/\n\s*\n/);
  const out = []; let cur = "";
  blocs.forEach(b => {
    if((cur + "\n\n" + b).length > max && cur){ out.push(cur); cur = b; }
    else cur = cur ? cur + "\n\n" + b : b;
  });
  if(cur) out.push(cur);
  return out.flatMap(x => {
    if(x.length <= max) return [x];
    const morceaux = [];
    for(let i = 0; i < x.length; i += max) morceaux.push(x.slice(i, i + max));
    return morceaux;
  });
}
/* Un cours long est découpé, chaque morceau relevé séparément, puis les fiches
   sont réunies en dédoublonnant. Aucun exercice n'est produit à ce stade. */
function fusionnerFiches(liste){
  const f = {resume:"", definitions:[], points:[], chiffres:[], normes:[], pieges:[], sigles:[],
    procedures:[], mentionnes:[], saillants:[], sections:[], complements:null, titreDetecte:""};
  const cles = ["definitions","points","chiffres","normes","pieges","sigles","mentionnes"];
  const vus = {}; cles.forEach(k => vus[k] = new Set());
  liste.forEach(r => {
    if(!f.resume && r.resume) f.resume = r.resume;
    if(!f.titreDetecte && r.titreDetecte) f.titreDetecte = r.titreDetecte;
    cles.forEach(k => (r[k] || []).forEach(x => {
      const c = normaliser(x.terme || x.sigle || x.txt || "");
      if(c && !vus[k].has(c)){ vus[k].add(c); f[k].push(x); }
    }));
    (r.procedures || []).forEach(x => f.procedures.push(x));
    (r.saillants || []).forEach(x => f.saillants.push(x));
    (r.sections || []).forEach(x => f.sections.push(x));
  });
  return f;
}

/* Délai maximal par appel. Sans cela, une requête qui reste en attente bloque
   l'application sans aucun message : l'écran semble figé indéfiniment. */
const DELAI_APPEL = 120000;
let annulation = null;
function annulerAppel(){
  if(annulation){ try{ annulation.abort(); }catch(e){} annulation = null; }
}
async function appelGemini(corps, modele, cle){
  const ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  annulation = ctrl;
  const minuterie = ctrl ? setTimeout(() => { try{ ctrl.abort(); }catch(e){} }, DELAI_APPEL) : null;
  let r;
  try{
    r = await fetch(API + "/models/" + encodeURIComponent(modele) + ":generateContent?key=" + encodeURIComponent(cle),
      {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps),
       signal: ctrl ? ctrl.signal : undefined});
  }catch(e){
    if(e && (e.name === "AbortError" || /abort/i.test(e.message || "")))
      throw new Error("Pas de réponse au bout de " + Math.round(DELAI_APPEL/1000) + " secondes. Vérifiez la connexion, ou découpez le cours en deux.");
    throw new Error("La requête n'a pas abouti : " + (e && e.message ? e.message : "réseau indisponible") + ".");
  }finally{
    if(minuterie) clearTimeout(minuterie);
    annulation = null;
  }
  if(!r.ok){
    let d = ""; try{ d = (await r.json()).error.message; }catch(e){}
    if(r.status === 429) throw new Error("Quota Google atteint (429). Attendez une minute, ou passez en mode local.");
    throw new Error("Gemini a renvoyé une erreur " + r.status + (d ? " : " + d : "") + ".");
  }
  const d = await r.json();
  const cand = (d.candidates || [])[0];
  if(!cand) throw new Error("Gemini n'a rien renvoyé. Le texte est peut-être trop long : découpez-le en deux.");
  if(cand.finishReason === "MAX_TOKENS")
    throw new Error("La réponse a été coupée avant la fin : le morceau de cours est trop gros. Découpez-le en deux.");
  if(cand.finishReason === "SAFETY" || cand.finishReason === "PROHIBITED_CONTENT")
    throw new Error("Le modèle a refusé de traiter ce passage. Réessayez sur une autre partie du cours.");
  return cand;
}
function lireJson(cand){
  const brut = (cand.content && cand.content.parts || []).map(p => p.text || "").join("");
  try{ return JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim()); }
  catch(e){ throw new Error("La réponse de Gemini n'était pas exploitable. Relancez l'analyse."); }
}

/* Le relevé accepte les cours longs : ils sont découpés et les fiches réunies. */
async function analyseGeminiPoints(texte, ueId, cle, modele, avancement){
  const morceaux = decouperTexte(texte, 18000);
  const fiches = [];
  for(let k = 0; k < morceaux.length; k++){
    const m = morceaux[k];
    if(avancement) avancement(k + 1, morceaux.length);
    const cand = await appelGemini({
      systemInstruction:{parts:[{text:consignePoints(ueId)}]},
      contents:[{role:"user", parts:[{text:"COURS :\n\n" + m}]}],
      generationConfig:{temperature:0.2, responseMimeType:"application/json", maxOutputTokens:8192}
    }, modele, cle);
    fiches.push(normaliserFiche(lireJson(cand)));
  }
  return fiches.length === 1 ? fiches[0] : fusionnerFiches(fiches);
}

/* Deux exercices par point au minimum. Une grosse fiche demande donc plusieurs
   appels : un seul ne tiendrait pas dans la limite de jetons de sortie. */
const EXOS_PAR_POINT = 2, EXOS_PAR_APPEL = 24;
function pointsDeFiche(f){
  return RUBRIQUES.reduce((n, r) => n + ((f[r.cle] || []).length), 0);
}
/* Découpe la fiche en tranches, chacune donnant un appel. Les points transversaux
   restent groupés : un classement n'a de sens qu'entre points d'une même tranche. */
function tranchesDeFiche(f, parAppel){
  const n = pointsDeFiche(f);
  const cible = Math.max(EXOS_PAR_POINT * n, 12);
  const nbAppels = Math.max(1, Math.ceil(cible / parAppel));
  if(nbAppels === 1) return [{fiche:f, cible}];
  const tranches = [];
  for(let k = 0; k < nbAppels; k++){
    const t = {resume:f.resume};
    RUBRIQUES.forEach(r => {
      const l = f[r.cle] || [];
      t[r.cle] = l.filter((_, i) => i % nbAppels === k);
    });
    const np = pointsDeFiche(t);
    if(np) tranches.push({fiche:t, cible: Math.max(EXOS_PAR_POINT * np, 6)});
  }
  return tranches;
}
async function analyseGeminiExercices(fiche, ueId, cle, modele, avancement, dejaVus){
  const tranches = tranchesDeFiche(fiche, EXOS_PAR_APPEL);
  const out = [];
  for(let k = 0; k < tranches.length; k++){
    if(avancement) avancement(k + 1, tranches.length);
    const t = tranches[k];
    let corps = "FICHE VALIDÉE :\n\n" + ficheEnTexte(t.fiche) +
      "\n\nQUANTITÉ DEMANDÉE : " + t.cible + " exercices pour cette fiche.";
    if(dejaVus && dejaVus.length){
      corps += "\n\nEXERCICES DÉJÀ EXISTANTS, à ne pas refaire — produis-en d'autres, " +
        "sur d'autres angles et d'autres formats :\n" +
        dejaVus.slice(0, 60).map(q => "- " + tronquer(q, 120)).join("\n");
    }
    const cand = await appelGemini({
      systemInstruction:{parts:[{text:consigneExercices(ueId)}]},
      contents:[{role:"user", parts:[{text:corps}]}],
      generationConfig:{temperature: dejaVus && dejaVus.length ? 0.7 : 0.35,
        responseMimeType:"application/json", maxOutputTokens:8192}
    }, modele, cle);
    normaliserItems(lireJson(cand).items, ueId).forEach(x => out.push(x));
  }
  return out;
}

/* Compléments : mode texte obligatoire, et seules les adresses renvoyées par
   groundingMetadata sont conservées. Aucune URL écrite par le modèle n'est retenue. */
async function chercherComplements(ueId, mentionnes, cle, modele){
  /* Deux noms d'outil coexistent : google_search pour les modèles Gemini 2 et suivants,
     google_search_retrieval pour les 1.5. On tente l'un puis l'autre plutôt que
     d'imposer un modèle à l'utilisateur. */
  const base = {
    contents:[{role:"user", parts:[{text:consigneComplements(ueId, mentionnes)}]}],
    generationConfig:{temperature:0.2, maxOutputTokens:2048}
  };
  const outils = [{google_search:{}}, {google_search_retrieval:{}}];
  let cand = null, derniere = null;
  for(const o of outils){
    try{ cand = await appelGemini(Object.assign({tools:[o]}, base), modele, cle); break; }
    catch(e){
      derniere = e;
      // on ne réessaie que si l'outil lui-même a été refusé
      if(!/tool|google_search|not supported|INVALID_ARGUMENT|400/i.test(e.message || "")) throw e;
    }
  }
  if(!cand){
    throw new Error("Ce modèle ne sait pas chercher sur le web" +
      (derniere ? " (" + derniere.message + ")" : "") +
      " Choisissez un modèle Gemini plus récent dans les réglages.");
  }
  const txt = (cand.content && cand.content.parts || []).map(p => p.text || "").join("").trim();
  const chunks = (cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
  const vues = new Set(), liens = [];
  chunks.forEach(c => {
    const w = c && c.web;
    if(!w || !w.uri || vues.has(w.uri)) return;
    vues.add(w.uri);
    liens.push({titre: w.title || w.uri, url: w.uri});
  });
  if(!txt) throw new Error("La recherche n'a rien renvoyé d'exploitable.");
  return {texte: txt.replace(/https?:\/\/\S+/g, "").replace(/[ \t]{2,}/g," "),
    liens, date: new Date().toISOString()};
}

/* La fiche validée est transmise au second appel sous forme de texte, jamais le cours. */
function ficheEnTexte(f){
  const l = [];
  if(f.resume) l.push("Résumé : " + f.resume);
  const bloc = (t, arr, fn) => { if(arr && arr.length){ l.push("", t.toUpperCase()); arr.forEach(x => l.push("- " + fn(x))); } };
  bloc("Définitions", f.definitions, x => x.terme + " : " + x.def);
  bloc("Sigles", f.sigles, x => x.sigle + " : " + x.sens);
  bloc("Points à retenir", f.points, x => x.txt);
  bloc("Valeurs chiffrées", f.chiffres, x => x.txt);
  bloc("Textes et normes", f.normes, x => x.txt);
  bloc("Pièges", f.pieges, x => x.txt);
  (f.procedures || []).forEach(p => { l.push("", "SUITE D'ÉTAPES"); p.etapes.forEach((e,i) => l.push((i+1) + ". " + e)); });
  return l.join("\n");
}

function normaliserFiche(o){

    points: tab(f.points).filter(p => p && p.txt).map(p => ({txt:p.txt, src:p.src || "", incertain:inc(p)})),
    chiffres: tab(f.chiffres).filter(c => c && c.txt).map(c => ({txt:c.txt, src:c.src || "", incertain:inc(c)})),
    normes: tab(f.normes).filter(n => n && n.txt).map(n => ({txt:n.txt, src:n.src || "", incertain:inc(n)})),
    pieges: tab(f.pieges).filter(p => p && p.txt).map(p => ({txt:p.txt, src:p.src || "", incertain:inc(p)})),
    sigles: tab(f.sigles).filter(s => s && s.sigle)
      .map(s => ({sigle:s.sigle, sens:s.sens || "", src:s.src || "", incertain:inc(s)})),
    mentionnes: tab(f.mentionnes).filter(m => m && m.txt).map(m => ({txt:m.txt, src:m.src || ""})),

function normaliserItems(liste, ueId){
  const items = [];
  const poser = (b, it) => {
    b.famille = it.famille === "comp" ? "comp" : (it.famille === "memo" ? "memo" : (DEFAUT_FAMILLE[it.type] || "memo"));
    if(b.famille === "comp"){
      const n = Number(it.niveau);
      b.niveau = n >= 1 && n <= 4 ? n : (DEFAUT_NIVEAU[it.type] || 2);
    }
    return b;
  };
  (Array.isArray(liste) ? liste : []).forEach(it => {
    if(!it || !TYPES[it.type]) return;
    const b = poser({id:uid(), ueId, type:it.type, cree:Date.now(), origine:"gemini",
      source: it.source || "", correction: it.correction || ""}, it);
    if((it.type === "qcm" || it.type === "choix") && Array.isArray(it.options) && it.options.length >= 2){
      /* Le modèle place presque toujours la bonne réponse en première position :
         on mélange les options et on recalcule l'index. */
      const iBon = Math.max(0, Math.min(it.options.length - 1, Number(it.reponse) || 0));
      const marque = it.options.map((x, k) => ({x, bon: k === iBon}));
      const mel = melanger(marque);
      const o = Object.assign(b, {question:it.question, options: mel.map(m => m.x),
        reponse: mel.findIndex(m => m.bon)});
      if(it.type === "choix") o.angle = ANGLES[it.angle] ? it.angle : "explication";
      items.push(o);
    } else if(it.type === "qcmMulti" && Array.isArray(it.options) && Array.isArray(it.reponses) && it.reponses.length){
      const bons = new Set(it.reponses.map(Number));
      const mel2 = melanger(it.options.map((x, k) => ({x, bon: bons.has(k)})));
      items.push(Object.assign(b, {question:it.question, options: mel2.map(m => m.x),
        reponses: mel2.map((m, k) => m.bon ? k : -1).filter(k => k >= 0)}));
    } else if(it.type === "vf"){
      items.push(Object.assign(b, {question:it.question, reponse: it.reponse === true || it.reponse === "true"}));
    } else if(it.type === "flash" && it.recto && it.verso){
      items.push(Object.assign(b, {recto:it.recto, verso:it.verso}));
    } else if(it.type === "cloze" && it.question && it.reponse){
      items.push(Object.assign(b, {question:it.question, reponse:it.reponse}));
    } else if(it.type === "paires" && Array.isArray(it.paires) && it.paires.length >= 2){
      const p = it.paires.filter(x => Array.isArray(x) && x[0] && x[1]).map(x => [String(x[0]), String(x[1])]);
      if(p.length >= 2) items.push(Object.assign(b, {question: it.question || "Associez chaque terme à sa définition.", paires:melanger(p)}));
    } else if(it.type === "classer" && Array.isArray(it.colonnes) && it.colonnes.length === 2 && Array.isArray(it.elements)){
      const el = it.elements.filter(e => e && e.txt && (Number(e.col) === 0 || Number(e.col) === 1))
        .map(e => ({txt:String(e.txt), col:Number(e.col)}));
      const c0 = el.filter(e => e.col === 0).length;
      if(el.length >= 4 && c0 > 0 && c0 < el.length){
        items.push(Object.assign(b, {question: it.question || "Rangez chaque élément dans la bonne colonne.",
          colonnes: it.colonnes.map(String), elements: el}));
      }
    } else if(TYPES_REDIGES.includes(it.type) && it.question){
      items.push(Object.assign(b, {question:it.question, attendu:it.attendu || "",
        motsCles: Array.isArray(it.motsCles) && it.motsCles.length ? it.motsCles : motsCles(it.attendu || "", 6)}));
    } else if(it.type === "ordre" && Array.isArray(it.etapes) && it.etapes.length >= 3){
      items.push(Object.assign(b, {question: it.question || "Remettez ces étapes dans l'ordre.", etapes:it.etapes}));
    }
  });
  return items;
}

function base64VersOctets(b64){
  const bin = atob(b64);
  const o = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
  return o;
}
/* L'API renvoie du son brut : on lui ajoute l'en-tête d'un fichier WAV. */
function wavDepuisPcm(pcm, taux){
  const n = pcm.length, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const txt = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  txt(0, "RIFF"); v.setUint32(4, 36 + n, true); txt(8, "WAVE");
  txt(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, taux, true); v.setUint32(28, taux * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  txt(36, "data"); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], {type:"audio/wav"});
}
/* Découpe en segments courts, sur des fins de phrase, pour rester sous les limites. */
function segmenter(texte, max){
  const out = [];
  let courant = "";
  String(texte || "").split(/(?<=[.!?])\s+/).forEach(p => {
    if((courant + " " + p).trim().length > (max || 1400) && courant){ out.push(courant.trim()); courant = p; }
    else courant += " " + p;
  });
  if(courant.trim()) out.push(courant.trim());
  return out;
}
async function synthetiser(texte, cle, modele, voix, avance){
  const seg = segmenter(texte, 1400);
  const blocs = [];
  let taux = 24000;
  for(let i = 0; i < seg.length; i++){
    if(avance) avance(i + 1, seg.length);
    const corps = {
      contents:[{role:"user", parts:[{text: seg[i]}]}],
      generationConfig:{responseModalities:["AUDIO"]}
    };
    if(voix) corps.generationConfig.speechConfig =
      {voiceConfig:{prebuiltVoiceConfig:{voiceName: voix}}};
    const cand = await appelGemini(corps, modele, cle);
    const part = cand && cand.content && (cand.content.parts || [])
      .find(p => p.inlineData && p.inlineData.data);
    if(!part) throw new Error("Aucun son renvoyé pour le passage " + (i + 1) + ".");
    const mt = part.inlineData.mimeType || "";
    const m = mt.match(/rate=(\d+)/);
    if(m) taux = Number(m[1]);
    blocs.push(base64VersOctets(part.inlineData.data));
  }
  const total = blocs.reduce((s, b) => s + b.length, 0);
  const tout = new Uint8Array(total);
  let o = 0;
  blocs.forEach(b => { tout.set(b, o); o += b.length; });
  return {blob: wavDepuisPcm(tout, taux), secondes: Math.round(total / 2 / taux)};
}

'{"reformulations":[{"i":0,"txt":"…"},{"i":1,"txt":"…"}]}',

  ].join("\n");

async function reformulerGemini(notions, niveau, cle, modele){
  const liste = notions.map((n,i) => i + ". " + n.terme + " : " + n.def).join("\n");
  const cand = await appelGemini({
    systemInstruction:{parts:[{text:consigneReformuler(niveau)}]},
    contents:[{role:"user", parts:[{text:"DÉFINITIONS À REFORMULER :\n\n" + liste}]}],
    generationConfig:{temperature:0.4, responseMimeType:"application/json", maxOutputTokens:4096}
  }, modele, cle);
  const brut = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
  let o;
  try{ o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim()); }
  catch(e){ throw new Error("La réponse n'était pas exploitable. Relance."); }
  const out = {};
  (Array.isArray(o.reformulations) ? o.reformulations : []).forEach(r => {
    const i = Number(r.i);
    if(i >= 0 && i < notions.length && r.txt && String(r.txt).trim().length > 5)
      out[i] = String(r.txt).trim();
  });
  return out;
}


/* =========================================================================
   7 ter. JOURNAL D'ACTIVITÉ
   Ce qui a été travaillé chaque jour, banque par banque. Ce n'est pas un score :
   c'est un relevé, qui montre la régularité plutôt qu'une performance.
   ========================================================================= */
function noterJournal(banque, juste){
  const cle = banque === "prep" ? "journalPrep" : "journal";
  if(!S[cle]) S[cle] = {};
  const j = new Date().toISOString().slice(0,10);
  if(!S[cle][j]) S[cle][j] = {n:0, ok:0};
  S[cle][j].n++;
  if(juste) S[cle][j].ok++;
}
/* Série de jours renvoyée du plus ancien au plus récent, banques cumulées ou non. */
function activite(jours, banque){
  const out = [];
  for(let k = jours - 1; k >= 0; k--){
    const d = new Date(Date.now() - k * JOUR).toISOString().slice(0,10);
    const a = (banque !== "prep" && S.journal ? S.journal[d] : null) || {n:0, ok:0};
    const b = (banque !== "rev" && S.journalPrep ? S.journalPrep[d] : null) || {n:0, ok:0};
    out.push({jour:d, n:a.n + b.n, ok:a.ok + b.ok});
  }
  return out;
}
/* Jours consécutifs travaillés, en s'arrêtant à hier pour ne pas punir la journée en cours. */
function serieJours(){
  let n = 0;
  for(let k = 0; k < 400; k++){
    const d = new Date(Date.now() - k * JOUR).toISOString().slice(0,10);
    const a = (S.journal && S.journal[d]) || {n:0}, b = (S.journalPrep && S.journalPrep[d]) || {n:0};
    if(a.n + b.n > 0) n++;
    else if(k > 0) break;
  }
  return n;
}
function totalJour(){
  const d = new Date().toISOString().slice(0,10);
  const a = (S.journal && S.journal[d]) || {n:0, ok:0}, b = (S.journalPrep && S.journalPrep[d]) || {n:0, ok:0};
  return {n:a.n + b.n, ok:a.ok + b.ok};
}
/* Graphe en barres, dessiné à la main : pas de bibliothèque, pas de dépendance. */
function grapheActivite(jours, banque){
  const l = activite(jours || 30, banque);
  const haut = Math.max(4, ...l.map(x => x.n));
  const larg = 100 / l.length;
  let h = `<div class="graphe" role="img" aria-label="Activité des ${l.length} derniers jours">`;
  l.forEach((x,i) => {
    const p = Math.round(x.n / haut * 100);
    const reussite = x.n ? Math.round(x.ok / x.n * 100) : 0;
    h += `<span class="barre" style="width:${larg}%;--h:${p}%;--d:${i * 14}ms"
      title="${esc(dateFr(x.jour))} · ${x.n} exercice${x.n>1?"s":""}${x.n?", "+reussite+" % de réussite":""}"><i></i></span>`;
  });
  h += `</div><div class="grapheLeg"><span>${esc(dateFr(l[0].jour))}</span><span>${haut} max</span><span>aujourd'hui</span></div>`;
  return h;
}

const TYPES_SCHEMA = {
  flux:{nom:"Enchaînement", desc:"Étapes qui se suivent, avec embranchements",
    consigne:"Utilise « flowchart TD » (de haut en bas). Chaque étape est un nœud. Les décisions sont des losanges avec {texte}."},
  arbre:{nom:"Arborescence", desc:"Une notion et ses subdivisions",

  compare:{nom:"Comparaison", desc:"Deux notions voisines, mises côte à côte",
    consigne:"Utilise « flowchart LR » avec deux sous-graphes « subgraph », un par notion comparée, et les points de distinction à l'intérieur."},
  carte:{nom:"Carte mentale", desc:"Une notion centrale et ce qui s'y rattache",
    consigne:"Utilise « mindmap » avec la notion centrale à la racine et deux niveaux au maximum."}
};
function consigneSchema(ueId, type){
  const t = TYPES_SCHEMA[type] || TYPES_SCHEMA.flux;
  return [
"Tu écris le code d'un schéma au format Mermaid, pour un étudiant préparant le diplôme d'État de préparateur en pharmacie hospitalière.",
contexteUE(ueId),
"On te donne la fiche qu'il a validée à partir de son cours.",
"",
"RÈGLES ABSOLUES :",
"1. Le schéma ne contient QUE ce qui figure dans la fiche. Aucune étape, aucune catégorie, aucun lien qui n'en vienne pas.",
"2. N'ajoute aucune valeur chiffrée, aucune norme, aucune date absente de la fiche.",
"3. Si la fiche ne permet pas de construire ce type de schéma, renvoie un code vide et explique pourquoi dans \"note\".",
"4. Quinze nœuds au maximum. Au-delà, le schéma devient illisible sur un téléphone.",
"5. Libellés courts : six mots au maximum par nœud.",
"6. Réponds en français.",
"",
"TYPE DEMANDÉ : " + t.nom + ". " + t.consigne,
"",
"CONTRAINTES DE SYNTAXE, à respecter à la lettre :",
"- N'emploie ni parenthèses, ni crochets, ni accolades, ni guillemets À L'INTÉRIEUR d'un libellé : ils cassent le rendu. Remplace-les par une virgule.",
"- Pas d'accent dans les identifiants de nœuds. Les accents sont autorisés dans les libellés.",
"- Un seul schéma, sans balise de code autour.",
"",
"Réponds UNIQUEMENT par un objet JSON valide :",
'{"titre":"titre court du schéma","code":"le code Mermaid, avec de vrais retours à la ligne","note":""}'
  ].join("\n");
}
async function schemaGemini(fiche, ueId, type, cle, modele){
  const cand = await appelGemini({
    systemInstruction:{parts:[{text:consigneSchema(ueId, type)}]},
    contents:[{role:"user", parts:[{text:"FICHE VALIDÉE :\n\n" + ficheEnTexte(fiche)}]}],
    generationConfig:{temperature:0.3, responseMimeType:"application/json", maxOutputTokens:3072}
  }, modele, cle);
  const o = lireJson(cand);
  const code = nettoyerMermaid(String(o.code || ""));
  if(!code) throw new Error(o.note ? String(o.note) : "Aucun schéma n'a pu être construit sur cette fiche.");
  return {titre:String(o.titre || "Schéma"), code, note:String(o.note || "")};
}
/* Les ponctuations fermantes dans un libellé cassent le rendu : on les neutralise
   avant même d'essayer, plutôt que d'afficher une erreur de syntaxe. */
function nettoyerMermaid(code){
  let c = code.replace(/^```[a-z]*\s*|```\s*$/g, "").trim();
  c = c.replace(/\[([^\]\n]*)\]/g, (m, t) => "[" + t.replace(/[()\[\]{}"]/g, ",") + "]");
  c = c.replace(/\{([^}\n]*)\}/g, (m, t) => "{" + t.replace(/[()\[\]{}"]/g, ",") + "}");
  return c;
}
/* Mermaid n'est chargé qu'au moment où un schéma doit être rendu. */
let mermaidPret = false;
async function chargerMermaid(){
  if(mermaidPret) return;
  await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js");
  if(!window.mermaid) throw new Error("Mermaid n'a pas pu être chargé : une connexion est nécessaire la première fois.");
  window.mermaid.initialize({startOnLoad:false, securityLevel:"strict", theme:"base",
    fontFamily:"Outfit, system-ui, sans-serif",
    themeVariables:{
      primaryColor:"#DFF3EC", primaryTextColor:"#16241F", primaryBorderColor:"#17B890",
      lineColor:"#5A6B65", secondaryColor:"#FFF6E3", tertiaryColor:"#F1F6F2",
      fontSize:"14px"}});
  mermaidPret = true;
}
const SVG_SCHEMA = {};
async function rendreSchema(id, code){
  await chargerMermaid();
  const r = await window.mermaid.render("mmd-" + id.replace(/[^\w-]/g,""), code);
  SVG_SCHEMA[id] = r.svg;
  return r.svg;
}
async function prechargerSchemas(c){
  const l = (c.schemas || []).filter(x => !SVG_SCHEMA[x.id] && !x.erreur);
  if(!l.length) return;
  for(const x of l){
    try{ await rendreSchema(x.id, x.code); }
    catch(e){ x.erreur = String(e && e.message || e).slice(0, 160); }
  }
  sauver(); rendre();
}

/* =========================================================================
   8. PROGRESSION — trois boîtes, carnet d'erreurs, niveau de confiance
   ========================================================================= */
const DELAIS = {1:0, 2:2, 3:7};   // jours avant la prochaine présentation
function prog(id){
  if(!S.progres[id]) S.progres[id] = {boite:1, vus:0, ok:0, ko:0, dernier:0, prochain:0, erreurConfiante:false};
  return S.progres[id];
}
function majProg(id, juste, sur){
  const p = prog(id);
  p.vus++; p.dernier = Date.now();
  if(juste){ p.ok++; p.boite = Math.min(3, p.boite + 1); if(p.ok >= p.ko) p.erreurConfiante = false; }
  else{ p.ko++; p.boite = 1; if(sur === true) p.erreurConfiante = true; }
  p.prochain = Date.now() + DELAIS[p.boite] * JOUR;
  sauver();
}
function tousItems(){ return S.cours.flatMap(c => c.items.filter(i => !i.douteux)
  .map(i => Object.assign({coursId:c.id, coursTitre:c.titre}, i))); }
function itemsEcartes(){ return S.cours.flatMap(c => c.items.filter(i => i.douteux)); }
function trouverItem(coursId, id){
  const c = S.cours.find(x => x.id === coursId); if(!c) return null;
  const i = c.items.find(x => x.id === id); return i ? {cours:c, item:i} : null;
}
function itemsDus(){
  const t = Date.now();
  const urg = (typeof uesUrgentes === "function") ? new Set(uesUrgentes()) : new Set();
  return tousItems().filter(i => {
    if(urg.has(i.ueId)) return true;
    const p = S.progres[i.id]; return !p || p.prochain <= t;
  });
}
function carnetErreurs(){ return tousItems().filter(i => { const p = S.progres[i.id]; return p && p.ko > 0 && p.boite === 1; }); }
function erreursConfiantes(){ return tousItems().filter(i => { const p = S.progres[i.id]; return p && p.erreurConfiante; }); }
function statsUE(ueId){
  const its = tousItems().filter(i => i.ueId === ueId);
  const vus = its.filter(i => S.progres[i.id] && S.progres[i.id].vus > 0);
  const sus = its.filter(i => S.progres[i.id] && S.progres[i.id].boite === 3);
  return {total:its.length, vus:vus.length, sus:sus.length,
    part: its.length ? Math.round(sus.length / its.length * 100) : 0};
}
/* Deux chiffres distincts : « travaillés » compte ce qui a été vu au moins une fois,
   « acquis » ce qui a atteint la troisième boîte. Après une première session,
   le second est forcément nul : n'afficher que lui donne l'impression de n'avoir rien fait. */
function compter(l){
  const vus = l.filter(i => S.progres[i.id] && S.progres[i.id].vus > 0);
  const sus = l.filter(i => S.progres[i.id] && S.progres[i.id].boite === 3);
  return {total:l.length, vus:vus.length, sus:sus.length,
    part: l.length ? Math.round(sus.length/l.length*100) : 0,
    partVus: l.length ? Math.round(vus.length/l.length*100) : 0};
}
function libelleAvancement(s){
  if(!s.total) return "aucun exercice";
  if(!s.vus) return s.total + " exercices, aucun encore travaillé";
  return s.vus + "/" + s.total + " travaillés · " + s.sus + " acquis";
}
function statsFamille(f){ return compter(tousItems().filter(i => familleDe(i) === f)); }
function statsNiveau(n){ return compter(tousItems().filter(i => familleDe(i) === "comp" && niveauDe(i) === n)); }
function statsDomaine(d){
  const ues = UES.filter(u => u.dom === d);
  let total = 0, sus = 0, ects = 0, ectsCouverts = 0;
  ues.forEach(u => { const s = statsUE(u.id); total += s.total; sus += s.sus; ects += u.ects; if(s.total) ectsCouverts += u.ects; });
  return {total, sus, ects, ectsCouverts, part: total ? Math.round(sus / total * 100) : 0};
}

const RE_CHIFFRE_G = new RegExp("(\\d+(?:[.,]\\d+)?)(\\s?(?:" + UNITES + "))", "g");
/* Version muette : les valeurs chiffrées deviennent des pointillés à compléter. */
function masquerChiffres(t){ return String(t||"").replace(RE_CHIFFRE_G, "……$2"); }

/* Tri d'impression, propre à chaque cours et conservé d'une fois sur l'autre. */
function triDe(c){
  if(!c.tri) c.tri = {exclus:{}, valeur:{}};
  if(!c.tri.exclus) c.tri.exclus = {};
  if(!c.tri.valeur) c.tri.valeur = {};
  return c.tri;
}
const cleTri = (cle, i) => cle + ":" + i;
function retenusImp(c, cle){
  const t = triDe(c), l = (c.fiche[cle] || []);
  return l.map((x,i) => ({x, i})).filter(o => !t.exclus[cleTri(cle, o.i)]);
}
function nbImprimes(c){ return RUB_IMP.reduce((n,r) => n + retenusImp(c, r.cle).length, 0); }

function piedImp(){

    Les compléments hors cours, s'il y en a, ne viennent pas de vos notes.</div>`;

/* Construit la fiche dans l'un des cinq modes. */
function construireFiche(c, mode){
  const muet = mode === "muette";
  const cls = ["f-print", mode === "nb" ? "nb" : (mode === "compacte" ? "compacte nb" : "couleur")];
  const t = triDe(c);
  let h = `<div class="${cls.join(" ")}">` + enteteImp(c, muet ? "version muette" : (mode === "compacte" ? "version compacte" : ""));

  RUB_IMP.forEach(r => {
    const l = retenusImp(c, r.cle);
    if(!l.length) return;
    h += `<div class="rub r-${r.cle}"><div class="rub-t">${esc(r.nom)}</div><div class="rub-c">`;
    l.forEach((o,rang) => {
      const v = t.valeur[cleTri(r.cle, o.i)] || "";
      h += `<div class="el ${v}"><span class="num">${rang + 1}</span><span class="co">${
        muet ? r.muet(o.x) : r.corps(o.x)}</span></div>`;
    });
    h += visHtml(c, "rub:" + r.cle, true);
    h += `</div></div>`;
  });

  if((c.tableaux || []).length && mode !== "compacte"){
    h += `<div class="rub"><div class="rub-t">Tableaux du document</div><div class="rub-c">`;
    c.tableaux.forEach(tb => {
      const l = tb.lignes || [];
      if(!l.length) return;
      h += `<table class="t-imp"><thead><tr>${l[0].map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead>
        <tbody>${l.slice(1).map(rr => `<tr>${rr.map(x => `<td>${esc(muet ? masquerChiffres(x) : x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    });
    h += `</div></div>`;
  }
  const men = (c.fiche.mentionnes || []);
  if(men.length && mode !== "compacte"){
    h += `<div class="rub"><div class="rub-t">Resté en suspens</div><div class="rub-c">` +
      men.map((m,i) => `<div class="el"><span class="num">${i+1}</span><span class="co">${esc(m.txt)}</span></div>`).join("") +
      `</div></div>`;
  }
  const cp = c.fiche.complements;
  if(cp && mode !== "compacte"){
    h += `<div class="rub r-complements"><div class="rub-t">Compléments hors cours</div><div class="rub-c">
      <div class="el"><span class="num">!</span><span class="co">
      ${cp.texte.split(/\n+/).filter(x => x.trim()).map(x => `<div>${esc(x.trim())}</div>`).join("")}
      ${(cp.liens||[]).map(l => `<div class="ex">${esc(l.titre || l.url)}</div>`).join("")}</span></div></div></div>`;
  }
  const vfin = visHtml(c, "fin", true);
  const scin = schemasDe(c).filter(x => !x.erreur && SVG_SCHEMA[x.id]).map(x => schemaHtml(x, true)).join("");
  if(vfin || scin) h += `<div class="rub"><div class="rub-t">Schémas</div><div class="rub-c">${scin}${vfin}</div></div>`;
  h += blocQuestions(mode === "compacte" ? 3 : 6);
  return h + piedImp() + `</div>`;
}

/* Flashcards : 8 par page. Le verso inverse les colonnes deux à deux pour qu'après
   une impression recto-verso sur le bord long, chaque dos tombe en face de son recto. */
function cartesDe(c){
  const out = [];
  retenusImp(c, "definitions").forEach(o => out.push({r:o.x.terme, v:o.x.def}));
  retenusImp(c, "sigles").forEach(o => out.push({r:o.x.sigle, v:o.x.sens}));
  return out;
}
const ORDRE_VERSO = [1,0,3,2,5,4,7,6];
function construireCartes(c){
  const l = cartesDe(c), u = UE(c.ueId), ref = (u ? u.id : "") + " · " + tronquer(c.titre, 22);
  if(!l.length) return `<div class="f-print"><p>Aucune définition ni sigle retenu : rien à découper.</p></div>`;
  let h = `<div class="f-print nb">`;
  for(let p = 0; p < l.length; p += 8){
    // la dernière page est complétée par des emplacements vides : sans cela la grille
    // du verso ne compte pas le même nombre de cases et les dos se décalent
    const page = l.slice(p, p + 8);
    while(page.length < 8) page.push(null);
    h += `<div class="f-cartes">` + page.map(x =>
      `<div class="f-carte">${x ? `<div class="r">${esc(x.r)}</div><div class="ref">${esc(ref)}</div>` : ""}</div>`).join("") + `</div>`;
    h += `<div class="f-cartes">` + ORDRE_VERSO.map(k => {
      const x = page[k];
      return `<div class="f-carte">${x ? `<div class="v">${esc(x.v)}</div>` : ""}</div>`;
    }).join("") + `</div>`;
  }
  return h + `</div>`;
}

function imprimerFiche(id, mode){
  const c = S.cours.find(x => x.id === id); if(!c) return;
  $("#impression").innerHTML = mode === "cartes" ? construireCartes(c) : construireFiche(c, mode || "couleur");
  window.print();
}

/* =========================================================================
   16bis. IMAGES — base séparée des fiches
   Le stockage local plafonne vers 5 Mo, que trois schémas suffisent à saturer :
   les images vont dans IndexedDB, avec repli en mémoire si la base est refusée.
   ========================================================================= */
const BASE_IMG = "depph_images", MAGASIN = "visuels";
let baseImg = null, baseImgKo = false;
const imgMemoire = new Map();
const URL_IMG = {};

function ouvrirBaseImg(){
  if(baseImg) return Promise.resolve(baseImg);
  if(baseImgKo || !window.indexedDB) return Promise.reject(new Error("base indisponible"));
  return new Promise((ok, ko) => {
    let r;
    try{ r = indexedDB.open(BASE_IMG, 1); }
    catch(e){ baseImgKo = true; return ko(e); }
    r.onupgradeneeded = () => { const d = r.result;
      if(!d.objectStoreNames.contains(MAGASIN)) d.createObjectStore(MAGASIN); };
    r.onsuccess = () => { baseImg = r.result; ok(baseImg); };
    r.onerror = () => { baseImgKo = true; ko(r.error || new Error("ouverture refusée")); };
    r.onblocked = () => { baseImgKo = true; ko(new Error("base verrouillée")); };
  });
}
function transaction(mode, fn){
  return ouvrirBaseImg().then(d => new Promise((ok, ko) => {
    const t = d.transaction(MAGASIN, mode), m = t.objectStore(MAGASIN);
    let res;
    const r = fn(m);
    if(r) r.onsuccess = () => { res = r.result; };
    t.oncomplete = () => ok(res);
    t.onerror = () => ko(t.error || new Error("transaction refusée"));
  }));
}
async function ecrireImage(id, blob){
  try{ await transaction("readwrite", m => m.put(blob, id)); return "base"; }
  catch(e){ baseImgKo = true; imgMemoire.set(id, blob); return "memoire"; }
}
async function lireImage(id){
  try{ const b = await transaction("readonly", m => m.get(id)); if(b) return b; }
  catch(e){ baseImgKo = true; }
  return imgMemoire.get(id) || null;
}
async function effacerImages(ids){
  ids.forEach(id => {
    imgMemoire.delete(id);
    if(URL_IMG[id]){ libererUrl(URL_IMG[id]); delete URL_IMG[id]; }
  });
  try{ await transaction("readwrite", m => { ids.forEach(id => m.delete(id)); return null; }); }
  catch(e){ baseImgKo = true; }
}
/* Adresse d'affichage d'une image. Si le navigateur ne fournit pas d'adresse
   temporaire, on retombe sur une adresse encodée, plus lourde mais toujours lisible. */
function urlPour(blob){
  if(typeof URL !== "undefined" && typeof URL.createObjectURL === "function"){
    try{ return Promise.resolve(URL.createObjectURL(blob)); }catch(e){}
  }
  return new Promise(ok => {
    try{
      const fr = new FileReader();
      fr.onload = () => ok(String(fr.result || ""));
      fr.onerror = () => ok("");
      fr.readAsDataURL(blob);
    }catch(e){ ok(""); }
  });
}
function libererUrl(u){
  if(u && /^blob:/.test(u) && typeof URL !== "undefined" && URL.revokeObjectURL){
    try{ URL.revokeObjectURL(u); }catch(e){}
  }
}

/* Les adresses temporaires sont préparées avant le rendu, qui reste synchrone. */
async function prechargerVisuels(c){
  const l = (c.visuels || []).filter(v => !URL_IMG[v.id]);
  for(const v of l){
    const b = await lireImage(v.id);
    if(b){ const u = await urlPour(b); if(u) URL_IMG[v.id] = u; }
  }
  if(l.length) rendre();
}
function tousVisuels(){ return S.cours.flatMap(c => (c.visuels || []).map(v => v.id)); }

/* Redimensionnement à 1400 px sur le grand côté, JPEG qualité 0,78 :
   un schéma pèse alors une centaine de kilo-octets. */
const LARGEUR_MAX = 1400, QUALITE = 0.78;
function redimensionner(source, maxi, qualite){
  maxi = maxi || LARGEUR_MAX; qualite = qualite || QUALITE;
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const f = Math.min(1, maxi / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * f)), h = Math.max(1, Math.round(img.height * f));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      if(!ctx) return ko(new Error("Le navigateur ne permet pas de retailler l'image."));
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? ok({blob:b, w, h}) : ko(new Error("Conversion impossible.")), "image/jpeg", qualite);
    };
    img.onerror = () => ko(new Error("Image illisible."));
    if(typeof source === "string") img.src = source;
    else urlPour(source).then(u => { if(u) img.src = u; else ko(new Error("Image illisible.")); });
  });
}

function scriptExterne(src){
  return new Promise((ok, ko) => {
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = () => ok(); s.onerror = () => ko(new Error("Chargement impossible : une connexion est nécessaire pour lire ce format."));
    document.head.appendChild(s);
  });
}
/* Texte d'un élément sans le contenu de ses listes filles, pour ne pas dupliquer. */
function texteDirect(el){
  const c = el.cloneNode(true);
  c.querySelectorAll("ul,ol,table").forEach(x => x.remove());
  return (c.textContent || "").replace(/\s+/g," ").trim();
}
/* Un tableau du document devient une structure de texte, jamais du balisage réinjecté. */
function extraireTableau(t){
  const lignes = [];
  t.querySelectorAll("tr").forEach(tr => {
    const cel = Array.from(tr.querySelectorAll("th,td")).map(c => (c.textContent||"").replace(/\s+/g," ").trim());
    if(cel.some(x => x)) lignes.push(cel);
  });
  if(lignes.length < 2) return null;
  const larg = Math.max.apply(null, lignes.map(l => l.length));
  return {lignes: lignes.map(l => { const c = l.slice(); while(c.length < larg) c.push(""); return c; })};
}
/* La mise en forme du document dit déjà ce qui est important : on la garde en balisage léger.
   Titres en dièses, listes en tirets, gras et souligné entre doubles astérisques. */
function docxVersTexte(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tableaux = [];
  doc.querySelectorAll("table").forEach(t => {
    const x = extraireTableau(t);
    if(x){ x.titre = "Tableau " + (tableaux.length + 1); tableaux.push(x); }
    t.remove();
  });
  const images = [];
  doc.querySelectorAll("img").forEach(im => {
    const src = im.getAttribute("src") || "";
    if(/^data:image\//.test(src) && src.length > 500) images.push(src);
  });
  doc.querySelectorAll("img,script,style").forEach(x => x.remove());
  doc.querySelectorAll("strong,b,u").forEach(el => {
    const t = (el.textContent || "").replace(/\s+/g," ").trim();
    if(!t || t.length > 90 || /\*\*/.test(t)) return;
    el.replaceWith(doc.createTextNode("**" + t + "**"));
  });
  const out = [];
  Array.from(doc.body.children).forEach(el => {
    const tag = el.tagName.toLowerCase();
    if(tag === "ul" || tag === "ol"){
      el.querySelectorAll("li").forEach(li => { const t = texteDirect(li); if(t) out.push("- " + t); });
      out.push("");
      return;
    }
    const t = texteDirect(el);
    if(!t) return;
    if(/^h[1-6]$/.test(tag)) out.push("", "#".repeat(Number(tag[1])) + " " + t, "");
    else out.push(t, "");
  });
  return {texte: out.join("\n").replace(/\n{3,}/g,"\n\n").trim(), tableaux, images};
}

/* Un document de cours contient surtout des logos, des filets et des en-têtes.
   On écarte ce qui ne peut pas être un schéma : trop petit, trop allongé,
   ou répété à l'identique d'une page à l'autre. */
const IMG_MIN = 200, IMG_RATIO_MAX = 4;
function trierImages(liste){
  const gardees = [], rejets = {petite:0, allongee:0, repetee:0};
  const vues = new Map();
  liste.forEach(im => {
    const grand = Math.max(im.w, im.h), petit = Math.min(im.w, im.h);
    if(grand < IMG_MIN){ rejets.petite++; return; }
    if(petit > 0 && grand / petit > IMG_RATIO_MAX){ rejets.allongee++; return; }
    const empreinte = im.blob.size + "x" + im.w + "x" + im.h;
    vues.set(empreinte, (vues.get(empreinte) || 0) + 1);
    gardees.push(Object.assign({empreinte}, im));
  });
  // une image qui revient plusieurs fois à l'identique est un logo, pas un schéma
  const finales = gardees.filter(im => {
    if(vues.get(im.empreinte) > 1){ rejets.repetee++; return false; }
    return true;
  });
  return {images:finales, rejets, total:liste.length};
}
function resumeTri(t){
  const r = t.rejets, n = r.petite + r.allongee + r.repetee;
  if(!n) return "";
  const d = [];
  if(r.petite) d.push(r.petite + " trop petite" + (r.petite>1?"s":""));
  if(r.allongee) d.push(r.allongee + " en bandeau");
  if(r.repetee) d.push(r.repetee + " répétée" + (r.repetee>1?"s":"") + " sur plusieurs pages");
  return n + " image" + (n>1?"s":"") + " écartée" + (n>1?"s":"") + " (" + d.join(", ") + ") : logos et filets de mise en page.";
}

async function lireFichier(f){
  const nom = f.name.toLowerCase();
  if(/\.(txt|md|csv)$/.test(nom)){
    const t = await f.text();
    return {texte:t, tableaux:[], avertissement: /\.csv$/.test(nom)
      ? "Fichier CSV : les colonnes sont lues telles quelles, sans reconstruction de tableau." : ""};
  }
  if(/\.docx$/.test(nom)){
    await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const buf = await f.arrayBuffer();
    const r = await window.mammoth.convertToHtml({arrayBuffer: buf});
    const d = docxVersTexte(r.value || "");
    return {texte:d.texte, tableaux:d.tableaux, images:d.images,
      avertissement: d.tableaux.length
        ? d.tableaux.length + " tableau" + (d.tableaux.length>1?"x":"") + " mis de côté : il" + (d.tableaux.length>1?"s ne polluent":" ne pollue") + " pas l'analyse et rest" + (d.tableaux.length>1?"ent":"e") + " joint" + (d.tableaux.length>1?"s":"") + " à la fiche."
        : ""};
  }
  if(/\.pdf$/.test(nom)){
    await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf = await f.arrayBuffer();
    const doc = await window.pdfjsLib.getDocument({data: buf}).promise;
    let t = "";
    for(let p = 1; p <= doc.numPages; p++){
      const page = await doc.getPage(p);
      const c = await page.getTextContent();
      t += c.items.map(i => i.str).join(" ") + "\n\n";
    }
    return {texte:t, tableaux:[],
      avertissement:"Le PDF ne conserve ni les titres, ni le gras, ni les tableaux : l'analyse travaillera sur du texte plat. Un .docx donne un bien meilleur résultat."};
  }
  throw new Error("Format non pris en charge. Formats acceptés : .txt, .md, .csv, .docx, .pdf.");
}
