    case "json-remplacer":
      if(confirm("Remplacer toutes vos données actuelles ? Cette action est définitive.")){
        S = Object.assign(etatVierge(), ui.importJSON.donnees);
        S.reglages = Object.assign(etatVierge().reglages, ui.importJSON.donnees.reglages || {});
        S.meta = Object.assign(etatVierge().meta, ui.importJSON.donnees.meta || {});
        ui.importJSON = null; sauver(); ui.fiche = null; aller("rev","accueil");
      } break;
    case "json-fusion": {
      const o = ui.importJSON.donnees;
      const connus = new Set(S.cours.map(c => c.emp || c.id));
      let n = 0;
      (o.cours || []).forEach(c => { if(!connus.has(c.emp || c.id)){ S.cours.push(c); n++; } });
      Object.keys(o.progres || {}).forEach(k => { if(!S.progres[k]) S.progres[k] = o.progres[k]; });
      Object.keys(o.prep || {}).forEach(k => {
        const a = S.prep[k], b = o.prep[k];
        if(!a || (b && (b.termine && !a.termine || (b.index || 0) > (a.index || 0)))) S.prep[k] = b;
      });
      (o.examens || []).forEach(e => { if(!S.examens.some(x => x.date === e.date)) S.examens.push(e); });
      ui.importJSON = null; sauver();
      ui.message = {type:"info", titre:"Fusion effectuée", txt:n + " cours ajouté" + (n>1?"s":"") + ", vos données existantes sont intactes."};
      rendre(); break;
    }
    case "exporter":
      telecharger("prepa-depph-" + new Date().toISOString().slice(0,10) + ".json", JSON.stringify(S, null, 1));
      S.meta.dernierExport = Date.now(); S.meta.sessionsExport = 0; sauver(); rendre(); break;
    case "ecran-tri": { ui.fiche = el.dataset.id; ui.ecran = "tri"; rendre(); window.scrollTo(0,0);
      const c = S.cours.find(x => x.id === ui.fiche); if(c){ prechargerVisuels(c); prechargerSchemas(c); } break; }
    case "ecran-lecture": { ui.fiche = el.dataset.id; ui.lecture = 0; ui.ecran = "lecture"; rendre(); window.scrollTo(0,0);
      const c = S.cours.find(x => x.id === ui.fiche); if(c){ prechargerVisuels(c); prechargerSchemas(c); } break; }
    case "ecran-visuels": { ui.fiche = el.dataset.id; ui.ecran = "visuels"; rendre(); window.scrollTo(0,0);
      const c = S.cours.find(x => x.id === ui.fiche); if(c){ prechargerVisuels(c); prechargerSchemas(c); } break; }
    case "suppr-visuel": { const c = S.cours.find(x => x.id === ui.fiche);
      if(c && confirm("Supprimer ce schéma ?")){
        await effacerImages([el.dataset.id]);
        c.visuels = (c.visuels||[]).filter(v => v.id !== el.dataset.id);
        delete triDe(c).exclus["visuel:" + el.dataset.id];
        sauver(); rendre(); } break; }
    case "page-prec": if(ui.decoupe && ui.decoupe.page > 1){ ui.decoupe.page--; rendre(); await dessinerPage(); } break;
    case "page-suiv": if(ui.decoupe && ui.decoupe.page < ui.decoupe.total){ ui.decoupe.page++; rendre(); await dessinerPage(); } break;
    case "extraire": await extraireZone(); break;
    case "transcrire": await lancerTranscription(); break;
    case "retirer-photo": { const i = Number(el.dataset.i);
      const p = (ui.photos||[])[i];
      if(p){ libererUrl(p.url); ui.photos.splice(i, 1); rendre(); } break; }
    case "lecture-suiv": ui.lecture++; rendre(); window.scrollTo(0,0); break;
    case "lecture-prec": if(ui.lecture > 0) ui.lecture--; rendre(); window.scrollTo(0,0); break;
    case "tri-coche": { const c = S.cours.find(x => x.id === ui.fiche);
      if(c){ const t = triDe(c), k = el.dataset.k;
        if(t.exclus[k]) delete t.exclus[k]; else t.exclus[k] = true;
        sauver(); rendre(); } break; }
    case "tri-valeur": { const c = S.cours.find(x => x.id === ui.fiche);
      if(c){ const t = triDe(c); if(el.dataset.v) t.valeur[el.dataset.k] = el.dataset.v; else delete t.valeur[el.dataset.k];
        sauver(); rendre(); } break; }
    case "tri-tout": { const c = S.cours.find(x => x.id === ui.fiche);
      if(c){ const t = triDe(c), v = el.dataset.v === "1";
        RUB_IMP.forEach(r => (c.fiche[r.cle]||[]).forEach((_,i) => {
          if(v) delete t.exclus[cleTri(r.cle,i)]; else t.exclus[cleTri(r.cle,i)] = true; }));
        sauver(); rendre(); } break; }
    case "cocher": { const b2 = ui.brouillon; if(b2){ b2.garde[el.dataset.k] = !b2.garde[el.dataset.k]; rendre(); } break; }
    case "tout-cocher": { const b2 = ui.brouillon;
      if(b2){ const v = el.dataset.v === "1";
        RUBRIQUES.forEach(r => (b2.fiche[r.cle]||[]).forEach((_,i) => b2.garde[r.cle + ":" + i] = v)); rendre(); }
      break; }
    case "fabriquer": await fabriquer(); break;
    case "abandon": abandonner(); break;
    case "complements": await lancerComplements(el.dataset.id); break;
    case "oublier-complements": { const c = S.cours.find(x => x.id === el.dataset.id);
      if(c){ c.fiche.complements = null; sauver(); rendre(); } break; }
    case "ranger": s.assoc[Number(el.dataset.i)] = Number(el.dataset.c); rendre(); break;
    case "martelage": S.reglages.martelage = el.dataset.v === "1"; sauver(); rendre(); break;
    case "complements-reglage": S.reglages.complements = el.dataset.v === "1"; sauver(); rendre(); break;
    case "ouvrir-ue-notes": ui.ueNotes = el.dataset.ue; if(!evals(ui.ueNotes).length) evals(ui.ueNotes).push(evalVierge()); sauver(); rendre(); break;
    case "fermer-ue-notes": ui.ueNotes = null; rendre(); break;
    case "prerremplir": { const n = prerremplirEvals(el.dataset.ue);
      ui.message = n ? {type:"info", titre:n + " évaluations reprises", txt:"Ajustez les poids et les notes."}
                     : {titre:"Déjà renseignée", txt:"Retirez les évaluations existantes avant de reprendre le référentiel."};
      rendre(); break; }
    case "ajout-eval": if(ui.ueNotes){ evals(ui.ueNotes).push(evalVierge()); sauver(); rendre(); } break;
    case "suppr-eval": if(ui.ueNotes){ evals(ui.ueNotes).splice(Number(el.dataset.i), 1); sauver(); rendre(); } break;

    /* --- travaux --- */
    case "prerremplir-stages": {
      STAGES_REF.forEach(st => S.travaux.push({id:uid(),
        titre:st.code + " · " + st.lieu + " (" + st.sem + " semaines)", type:"stage", ueId:"",
        echeance:"", etat:"afaire",
        livrables:[{txt:"Portfolio rempli et remis au CFPPH", fait:false},
                   {txt:"Feuille d'évaluation signée en présence de l'apprenant", fait:false}]}));
      sauver();
      ui.message = {type:"info", titre:"Cinq périodes ajoutées",
        txt:"Complétez les dates et les lieux. " + STAGES_REF.map(x => x.code + " " + x.sem + " sem.").join(", ") + "."};
      rendre(); break; }
    case "ajout-travail": S.travaux.push({id:uid(), titre:"", type:"ecrit", ueId:"", echeance:"", etat:"afaire", livrables:[]});
      sauver(); rendre(); break;
    case "suppr-travail": if(confirm("Supprimer ce travail ?")){ S.travaux = S.travaux.filter(t => t.id !== el.dataset.id); sauver(); rendre(); } break;
    case "etat-travail": { const t = S.travaux.find(x => x.id === el.dataset.id);
      if(t){ t.etat = el.dataset.v; sauver(); rendre(); } break; }
    case "ajout-livrable": { const t = S.travaux.find(x => x.id === el.dataset.id);
      const ch = document.getElementById("lv-" + el.dataset.id);
      if(t && ch && ch.value.trim()){ t.livrables = t.livrables || [];
        t.livrables.push({txt:ch.value.trim(), fait:false}); sauver(); rendre(); } break; }
    case "livrable": { const t = S.travaux.find(x => x.id === el.dataset.id), k = Number(el.dataset.k);
      if(t && t.livrables && t.livrables[k]){ t.livrables[k].fait = !t.livrables[k].fait; sauver(); rendre(); } break; }

    /* --- questions --- */
    case "question-posee": { const c = S.cours.find(x => x.id === el.dataset.c);
      const q = c && questionsDe(c).find(x => x.id === el.dataset.q);
      if(q){ q.posee = !q.posee; sauver(); rendre(); } break; }
    case "suppr-question": { const c = S.cours.find(x => x.id === el.dataset.c);
      if(c){ c.questions = questionsDe(c).filter(x => x.id !== el.dataset.q); sauver(); rendre(); } break; }
    case "ajout-question": { const c = S.cours.find(x => x.id === el.dataset.id);
      const ch = document.getElementById("mq-" + el.dataset.id);
      if(c && ch && ch.value.trim()){
        questionsDe(c).push({id:uid(), txt:ch.value.trim(), ancre:"", categorie:"justification",
          origine:"moi", posee:false, reponse:""});
        sauver(); rendre();
      } break; }
    case "preparer-questions": await preparerQuestions(el.dataset.id); break;
    case "ajout-suspens": { const c = S.cours.find(x => x.id === el.dataset.id);
      const ch = document.getElementById("ms-" + el.dataset.id);
      if(c && ch && ch.value.trim()){
        if(!Array.isArray(c.fiche.mentionnes)) c.fiche.mentionnes = [];
        c.fiche.mentionnes.push({txt:ch.value.trim(), src:"", origine:"moi"});
        sauver(); rendre();
      } break; }
    case "suppr-suspens": { const c = S.cours.find(x => x.id === el.dataset.id);
      if(c && Array.isArray(c.fiche.mentionnes)){
        c.fiche.mentionnes.splice(Number(el.dataset.i), 1); sauver(); rendre();
      } break; }
    case "imprimer-questions": imprimerQuestions(); break;

    /* --- lexique --- */
    case "ajout-mot": {
      const fr = (document.getElementById("lx-fr")||{}).value || "";
      const en = (document.getElementById("lx-en")||{}).value || "";
      const ap = (document.getElementById("lx-ap")||{}).value || "";
      if(!fr.trim() || !en.trim()){ ui.message = {titre:"Entrée incomplète", txt:"Il faut les deux langues."}; rendre(); break; }
      const r = ajouterEntreeLexique(fr.trim(), en.trim(), ap.trim());
      sauver();
      ui.message = r ? {type:"info", titre:"Entrée ajoutée", txt:"Deux exercices créés, un dans chaque sens."}
                     : {titre:"Déjà présente", txt:"Cette entrée figure déjà dans le lexique."};
      rendre(); break;
    }
    case "coller-lot": {
      const brut = (document.getElementById("lx-lot")||{}).value || "";
      let ok = 0, refus = 0;
      brut.split("\n").forEach(l => {
        if(!l.trim()) return;
        const e = lireLigneLexique(l);
        if(!e){ refus++; return; }
        if(ajouterEntreeLexique(e.fr, e.en, e.appui)) ok++; else refus++;
      });
      sauver();
      ui.message = {type: ok ? "info" : "err", titre: ok + " entrée" + (ok>1?"s":"") + " ajoutée" + (ok>1?"s":""),
        txt: refus ? refus + " ligne" + (refus>1?"s":"") + " ignorée" + (refus>1?"s":"") + " : séparateur absent ou entrée déjà présente." : "Deux exercices par entrée."};
      rendre(); break;
    }
    case "suppr-mot": supprimerEntreeLexique(el.dataset.k); sauver(); rendre(); break;
    case "tout-effacer":
      if(confirm("Effacer vos cours, fiches, exercices et résultats ? La progression des leçons est conservée.")){
        const prep = S.prep, regl = S.reglages;
        effacerImages(tousVisuels());
        S = etatVierge(); S.prep = prep; S.reglages = regl;
        sauver(); ui.fiche = null; aller("rev", "accueil");
      } break;
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id === "i-fic" && t.files[0]){
    const f = t.files[0];
    ui.message = {type:"info", titre:"Lecture du fichier", txt:f.name}; rendre();
    try{
      const r = await lireFichier(f);
      const txt = r.texte || "";
      ui.importTexte = txt;
      ui.importTableaux = r.tableaux || [];
      ui.avertFichier = r.avertissement || "";
      const brutes = [];
      for(const src of (r.images || []).slice(0, 30)){
        try{ brutes.push(await redimensionner(src)); }catch(e){}
      }
      const tri = trierImages(brutes);
      ui.importImages = tri.images.slice(0, 12);
      const dit = resumeTri(tri);
      if(dit) ui.avertFichier += (ui.avertFichier ? " " : "") + dit;
      if(ui.importImages.length) ui.avertFichier += (ui.avertFichier ? " " : "") +
        ui.importImages.length + " image" + (ui.importImages.length>1?"s":"") + " retenue" +
        (ui.importImages.length>1?"s":"") + " : elle" + (ui.importImages.length>1?"s seront jointes":" sera jointe") +
        " à la fiche une fois les exercices fabriqués. Vous pourrez les trier dans Schémas.";
      if(!ui.importTitre) ui.importTitre = f.name.replace(/\.[^.]+$/,"");
      if(!ui.importUE) ui.importUE = detecterUE(txt) || "";
      const al = sonderDonnees(txt);
      ui.avisRGPD = al.length ? al : null; ui.rgpdIgnore = false;
      ui.message = {type:"info", titre:"Fichier lu",
        txt: txt.length + " caractères" + (ui.importUE ? " · unité proposée : " + ui.importUE : "") + "."};
    }catch(err){ ui.message = {type:"err", titre:"Lecture impossible", txt:err.message}; }
    rendre(); return;
  }
  if(t.id === "v-gal" && t.files.length){
    const c = S.cours.find(x => x.id === ui.fiche);
    if(c){
      ui.message = {type:"info", titre:"Ajout des images", txt:t.files.length + " fichier(s)"}; rendre();
      let mem = false;
      for(const f of Array.from(t.files).slice(0, 12)){
        try{ if(await ajouterVisuel(c, await redimensionner(f), "galerie") === "memoire") mem = true; }
        catch(err){ ui.message = {type:"err", titre:"Image ignorée", txt:f.name + " : " + err.message}; }
      }
      ui.message = mem
        ? {type:"err", titre:"Images non conservées", txt:"Le navigateur refuse la base d'images : elles seront perdues à la fermeture de l'onglet."}
        : {type:"info", titre:"Images ajoutées", txt:"Donnez-leur une légende et un emplacement."};
      rendre();
    }
    t.value = ""; return;
  }
  if(t.id === "v-pdf" && t.files[0]){ await ouvrirDecoupe(t.files[0]); t.value = ""; return; }
  if(t.id === "p-photo" && t.files.length){
    if(!ui.photos) ui.photos = [];
    const place = PHOTO_MAX - ui.photos.length;
    if(place <= 0){ ui.message = {titre:"Lot complet", txt:"Retirez une page avant d'en ajouter une autre."}; rendre(); t.value = ""; return; }
    ui.message = {type:"info", titre:"Préparation des pages", txt:"Retaille en cours…"}; rendre();
    for(const f of Array.from(t.files).slice(0, place)){
      try{
        const im = await redimensionner(f, PHOTO_PX, PHOTO_QUALITE);
        ui.photos.push({blob:im.blob, url: await urlPour(im.blob), w:im.w, h:im.h});
      }catch(err){ ui.message = {type:"err", titre:"Page ignorée", txt:f.name + " : " + err.message}; }
    }
    if(ui.message && ui.message.titre === "Préparation des pages") ui.message = null;
    rendre(); t.value = ""; return;
  }
  if(t.id === "i-json" && t.files[0]){
    try{
      const o = JSON.parse(await t.files[0].text());
      if(!o || !Array.isArray(o.cours)) throw new Error("Ce fichier ne contient pas de sauvegarde.");
      const connus = new Set(S.cours.map(c => c.emp || c.id));
      const neufs = o.cours.filter(c => !connus.has(c.emp || c.id));
      ui.importJSON = {donnees:o, neufs:neufs.length, total:o.cours.length};
      ui.message = null; ui.ecran = "reglages"; rendre();
    }catch(err){ ui.message = {type:"err", titre:"Import impossible", txt:err.message}; rendre(); }
    t.value = ""; return;
  }
  if(t.dataset.dateue){
    const v = t.value;
    if(v) datesUE()[t.dataset.dateue] = v; else delete datesUE()[t.dataset.dateue];
    sauver(); rendre(); return;
  }
  const act = t.closest("[data-act]");
  if(act && act.dataset.act === "assoc"){ ui.session.assoc[Number(act.dataset.i)] = t.value; return; }
  if(act && act.dataset.act === "eval" && ui.ueNotes){
    const e = evals(ui.ueNotes)[Number(act.dataset.i)];
    if(e){
      const ch = act.dataset.champ;
      if(ch === "note") e.note = t.value === "" ? null : Math.max(0, Math.min(20, Number(t.value)));
      else if(ch === "sem") e.sem = t.value ? Number(t.value) : null;
      else if(ch === "poids") e.poids = Math.max(0.5, Number(t.value) || 1);
      else e.titre = t.value;
      sauver(); rendre();
    }
    return;
  }
  if(act && act.dataset.act === "titre-schema"){
    const c = S.cours.find(x => x.id === act.dataset.c);
    const x = c && schemasDe(c).find(y => y.id === act.dataset.s);
    if(x){ x.titre = t.value; sauver(); }
    return;
  }
  if(act && act.dataset.act === "reponse-question"){
    const c = S.cours.find(x => x.id === act.dataset.c);
    const q = c && questionsDe(c).find(x => x.id === act.dataset.q);
    if(q){ q.reponse = t.value; sauver(); }
    return;
  }
  if(act && act.dataset.act === "travail"){
    const tr = S.travaux.find(x => x.id === act.dataset.id);
    if(tr){ tr[act.dataset.champ] = t.value; sauver(); rendre(); }
    return;
  }
  if(act && (act.dataset.act === "legende" || act.dataset.act === "place")){
    const c = S.cours.find(x => x.id === ui.fiche);
    const v = c && (c.visuels||[]).find(x => x.id === act.dataset.id);
    if(v){ if(act.dataset.act === "legende") v.legende = t.value; else v.place = t.value; sauver(); }
    return;
  }
  const b = t.dataset.bind;
  if(!b) return;
  if(b === "codeSchema"){ ui.codeSchema = t.value; return; }
  if(b === "podSrc"){ ui.podSrc = t.value; rendre(); return; }
  if(b === "podScript"){ ui.podScript = t.value; return; }
  if(b === "voixIA"){ S.reglages.voixIA = t.value; sauver(); return; }
  if(b === "brouillonTitre"){ if(ui.brouillon) ui.brouillon.titre = t.value; return; }
  if(b === "brouillonUE"){ if(ui.brouillon) ui.brouillon.ueId = t.value; rendre(); return; }
  if(b in ui){
    ui[b] = t.value;
    if(b === "importTexte"){
      const al = sonderDonnees(t.value);
      ui.avisRGPD = al.length ? al : null;
      if(!ui.importUE){ const d = detecterUE(t.value); if(d) ui.importUE = d; }
      rendre();
    }
  } else {
    S.reglages[b] = t.value; sauver();
    if(b === "cleGemini" || b === "modele") ui.testCle = null;
    if(["dateExamen","dateRentree","voix","debitVoix","modele","rappelExport","minutesJour"].includes(b)) rendre();
  }
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind;
  if(b === "importTexte" || b === "importTitre") ui[b] = e.target.value;
  if(b === "podScript") ui.podScript = e.target.value;
  if(b === "codeSchema") ui.codeSchema = e.target.value;
  if(b === "brouillonTitre" && ui.brouillon) ui.brouillon.titre = e.target.value;
  if(b === "requete"){
    ui.requete = e.target.value;
    clearTimeout(window.__rech);
    window.__rech = setTimeout(() => {
      const pos = document.getElementById("q-txt") ? document.getElementById("q-txt").selectionStart : null;
      rendre();
      const c = document.getElementById("q-txt");
      if(c){ c.focus(); if(pos !== null) try{ c.setSelectionRange(pos, pos); }catch(err){} }
    }, 260);
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "rep-cloze"){ e.preventDefault(); valider(); }
});
window.addEventListener("resize", () => { if((S.reglages.affichage || "auto") === "auto") appliquerAffichage(); });
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if(ui.ecran === "reglages") rendre(); };

charger();
migrer();
verifierEtancheite();
if(!S.prep) S.prep = {};
rendre();
</script>
