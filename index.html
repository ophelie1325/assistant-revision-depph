function ecranPlanning(){
  const d = S.reglages.dateExamen;
  let h = `<div class="ecran">` + retour("accueil", "Planning");
  h += `<label class="champ" for="p-date">Date de l'examen</label>
    <input type="date" id="p-date" data-bind="dateExamen" value="${esc(d)}">`;
  if(!d) return h + `<div class="avis info" style="margin-top:14px"><b>Aucune date</b>Renseignez-la pour construire le rétroplanning.</div></div>`;
  const j = joursEntre(new Date(), d);
  if(j <= 0) return h + `<div class="avis" style="margin-top:14px"><b>Date passée</b>Choisissez une date à venir.</div></div>`;
  const actives = UES.filter(u => statsUE(u.id).total > 0);
  if(!actives.length) return h + `<div class="avis" style="margin-top:14px"><b>Aucun cours importé</b>Le plan se construit sur les UE que vous alimentez.</div></div>`;
  const sem = Math.max(1, Math.min(12, Math.ceil(j/7)));
  const scores = actives.map(u => { const s = statsUE(u.id);
    return {u, poids:u.ects * (1 + (100-s.part)/100), part:s.part, total:s.total}; })
    .sort((a,b) => b.poids - a.poids);
  h += `<p class="sousTitre" style="margin-top:14px">${j} jours, soit ${sem} semaine${sem>1?"s":""} de travail.</p>`;
  for(let k = 0; k < sem; k++){
    const lot = scores.filter((_,i) => i % sem === k);
    h += `<div class="semaine"><div class="quand">Semaine ${k+1} — dès le ${dateFr(new Date(Date.now()+k*7*JOUR).toISOString())}</div>
      <h4 style="font-size:15px">${lot.length ? lot.map(x => x.u.id).join(" · ") : "Reprise libre"}</h4>
      ${lot.map(x => `<div style="font-size:13.5px;color:var(--encre2)">${esc(tronquer(x.u.nom,52))} — ${x.total} exercices, ${x.part}% acquis</div>`).join("")}</div>`;
  }
  return h + `<p style="font-size:12.5px;color:var(--encre3)">La révision du jour reste prioritaire : elle suit les échéances des trois boîtes.</p></div>`;
}
function ecranReglages(){
  const r = S.reglages;
  const voix = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /fr/i.test(v.lang));
  let h = `<div class="ecran">` + retour("accueil", "Réglages");
  h += `<p class="kick">Dates</p>
    <label class="champ" for="r-rentree">Rentrée</label>
    <input type="date" id="r-rentree" data-bind="dateRentree" value="${esc(r.dateRentree||"")}">
    <label class="champ" for="r-exam" style="margin-top:12px">Examen</label>
    <input type="date" id="r-exam" data-bind="dateExamen" value="${esc(r.dateExamen||"")}">`;
  h += `<p class="kick" style="margin-top:20px">Moteur d'analyse</p>
    <div class="liste-puces">
      <button class="puce${r.moteur==="local"?" on":""}" data-act="moteur" data-v="local">Local</button>
      <button class="puce${r.moteur==="gemini"?" on":""}" data-act="moteur" data-v="gemini">Gemini</button></div>`;
  if(r.moteur === "local"){
    h += `<p style="font-size:14px;color:var(--encre2)">Rien ne quitte l'appareil. L'analyse repère définitions, valeurs chiffrées, normes, pièges et suites d'étapes.</p>`;
  } else {
    h += `<label class="champ" for="g-cle">Clé Google AI Studio</label>
      <input type="password" id="g-cle" data-bind="cleGemini" value="${esc(r.cleGemini)}" placeholder="AIza…">
      <label class="champ" for="g-mod" style="margin-top:12px">Modèle</label>
      <select id="g-mod" data-bind="modele">${r.modeles.length ? r.modeles.map(m =>
        `<option value="${esc(m.id)}"${r.modele===m.id?" selected":""}>${esc(m.nom)}</option>`).join("")
        : `<option value="">— charger la liste —</option>`}</select>
      <div class="rang"><button class="btn mini" data-act="charger-modeles">Charger les modèles</button></div>
      <p style="font-size:13px;color:var(--encre2)">La clé reste sur cet appareil. Sur l'offre gratuite, Google peut utiliser les contenus transmis pour entraîner ses modèles : aucune donnée de patient.</p>`;
  }
  h += `<p class="kick" style="margin-top:20px">Lecture audio</p>
    <label class="champ" for="v-voix">Voix</label>
    <select id="v-voix" data-bind="voix"><option value="">Voix par défaut</option>
      ${voix.map(v => `<option value="${esc(v.name)}"${r.voix===v.name?" selected":""}>${esc(v.name)}</option>`).join("")}</select>
    <label class="champ" for="v-deb" style="margin-top:12px">Débit</label>
    <input type="number" id="v-deb" data-bind="debitVoix" min="0.5" max="2" step="0.1" value="${r.debitVoix}">`;
  h += `<p class="kick" style="margin-top:20px">Sauvegarde</p>
    <div class="rang"><button class="btn mini" data-act="exporter">Exporter</button>
      <label class="btn mini" for="i-json">Importer</label>
      <input type="file" id="i-json" accept=".json" style="display:none">
      <button class="btn mini" data-act="tout-effacer" style="color:var(--rouge)">Tout effacer</button></div>
    <p style="font-size:12.5px;color:var(--encre3)">Les leçons de préparation ne sont pas effacées par ce bouton : seuls vos cours, exercices et résultats le sont.</p>`;
  return h + `</div>`;
}
/* =========================================================================
   25. ACTIONS ET ÉVÉNEMENTS
   ========================================================================= */
async function analyser(){
  const texte = (ui.importTexte||"").trim();
  if(texte.length < 200){
    ui.message = {titre:"Texte trop court", txt:"Quelques paragraphes au minimum pour produire une fiche utile."};
    rendre(); return;
  }
  const al = sonderDonnees(texte);
  if(al.length && !ui.rgpdIgnore){ ui.avisRGPD = al; rendre(); return; }
  const ueId = ui.importUE || detecterUE(texte);
  if(!ueId){ ui.message = {titre:"Unité à préciser", txt:"Elle n'a pas pu être déduite du texte : choisissez-la dans la liste."}; rendre(); return; }
  ui.occupe = true; ui.message = null; rendre();
  let res, origine = S.reglages.moteur;
  try{
    if(origine === "gemini"){
      if(!S.reglages.cleGemini || !S.reglages.modele) throw new Error("Renseignez la clé et le modèle dans les réglages, ou repassez en mode local.");
      res = await analyseGemini(texte, ueId, S.reglages.cleGemini, S.reglages.modele);
    } else res = analyseLocale(texte, ueId);
  }catch(e){ ui.occupe = false; ui.message = {type:"err", titre:"Analyse interrompue", txt:e.message}; rendre(); return; }
  if(!res.items.length){
    ui.occupe = false;
    ui.message = {titre:"Aucun exercice tiré de ce texte",
      txt:"Un cours structuré — définitions, listes, valeurs chiffrées — donne de bien meilleurs résultats."};
    rendre(); return;
  }
  const titre = (ui.importTitre||"").trim() || res.fiche.titreDetecte || UE(ueId).nom;
  const c = {id:uid(), titre, ueId, date:new Date().toISOString(), origine, fiche:res.fiche,
    items:res.items.map(i => Object.assign(i, {ueId})), texte};
  S.cours.push(c); sauver();
  ui.occupe = false; ui.importTexte = ""; ui.importTitre = ""; ui.importUE = "";
  ui.avisRGPD = null; ui.rgpdIgnore = false; ui.fiche = c.id; ui.ecran = "fiche";
  ui.message = {type:"info", titre:"Fiche créée", txt:res.items.length + " exercices générés."};
  rendre(); window.scrollTo(0,0);
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const a = el.dataset.act, s = ui.session;
  switch(a){
    case "nav": ui.session = null; clearInterval(minuteur); aller(el.dataset.tab, "accueil"); break;
    case "ecran": ui.ecran = el.dataset.e; ui.message = null; rendre(); window.scrollTo(0,0); break;
    case "filtre": ui.filtreUE = el.dataset.ue; rendre(); break;
    case "src": { const c = document.getElementById(el.dataset.cible); if(c) c.classList.toggle("ouvert"); break; }

    /* --- leçons --- */
    case "ouvrir-lecon": {
      ui.ue = el.dataset.ue;
      const p = progLecon(ui.ue);
      if(p.termine) p.index = 0;
      ui.quizRep = null; ui.ecran = "lecon"; sauver(); rendre(); window.scrollTo(0,0); break;
    }
    case "fermer-lecon": ui.ecran = "accueil"; ui.quizRep = null; rendre(); break;
    case "quiz": {
      const d = LECONS[ui.ue].diapos[progLecon(ui.ue).index];
      ui.quizRep = Number(el.dataset.k);
      progLecon(ui.ue).quiz[progLecon(ui.ue).index] = ui.quizRep === d.bonne;
      sauver(); rendre(); break;
    }
    case "diapo-suiv": {
      const p = progLecon(ui.ue), L = LECONS[ui.ue];
      if(p.index >= L.diapos.length - 1){
        p.termine = true; p.index = L.diapos.length - 1; sauver();
        ui.ecran = "accueil"; ui.quizRep = null;
        ui.message = {type:"info", titre:"Leçon terminée", txt:L.titre + " — vous pouvez la reprendre quand vous voulez."};
      } else { p.index++; ui.quizRep = null; sauver(); }
      rendre(); window.scrollTo(0,0); break;
    }
    case "diapo-prec": { const p = progLecon(ui.ue); if(p.index > 0) p.index--; ui.quizRep = null; sauver(); rendre(); window.scrollTo(0,0); break; }

    /* --- fiches --- */
    case "ouvrir-fiche": ui.fiche = el.dataset.id; ui.ecran = "fiche"; rendre(); window.scrollTo(0,0); break;
    case "imprimer": imprimerFiche(el.dataset.id); break;
    case "fiche-erreurs": imprimerErreurs(); break;
    case "lire": { const c = S.cours.find(x => x.id === el.dataset.id); if(c) lire(texteFiche(c)); break; }
    case "stop-lecture": if(window.speechSynthesis) speechSynthesis.cancel(); break;
    case "supprimer":
      if(confirm("Supprimer ce cours, sa fiche et ses exercices ?")){
        const c = S.cours.find(x => x.id === el.dataset.id);
        if(c) c.items.forEach(i => delete S.progres[i.id]);
        S.cours = S.cours.filter(x => x.id !== el.dataset.id);
        sauver(); ui.ecran = "fiches"; rendre();
      } break;
    case "analyser": await analyser(); break;
    case "anonymiser": ui.importTexte = anonymiser(ui.importTexte); ui.avisRGPD = null; ui.rgpdIgnore = true;
      ui.message = {type:"info", titre:"Texte anonymisé", txt:"Relisez-le avant de lancer l'analyse."}; rendre(); break;
    case "rgpd-ignorer": ui.rgpdIgnore = true; ui.avisRGPD = null; rendre(); break;

    /* --- sessions --- */
    case "session": lancerSession(el.dataset.source, el.dataset.ue, el.dataset.id); break;
    case "choix": {
      const it = s.liste[s.i];
      if(it.type === "qcmMulti"){ const k = Number(el.dataset.k); s.choix = s.choix || [];
        s.choix = s.choix.includes(k) ? s.choix.filter(x => x !== k) : s.choix.concat([k]); }
      else if(it.type === "vf") s.choix = el.dataset.v === "true";
      else s.choix = Number(el.dataset.k);
      rendre(); break;
    }
    case "sur": s.sur = el.dataset.v === "1"; rendre(); break;
    case "monter": { const p = Number(el.dataset.p); [s.ordre[p-1], s.ordre[p]] = [s.ordre[p], s.ordre[p-1]]; rendre(); break; }
    case "descendre": { const p = Number(el.dataset.p); [s.ordre[p+1], s.ordre[p]] = [s.ordre[p], s.ordre[p+1]]; rendre(); break; }
    case "valider": valider(); break;
    case "passer": if(s.mode === "examen") s.resultats.push({id:s.liste[s.i].id, ueId:s.liste[s.i].ueId, juste:false}); suivant(); break;
    case "auto": { const it = s.liste[s.i], j = el.dataset.v === "1";
      majProg(it.id, j, s.sur); s.resultats.push({id:it.id, ueId:it.ueId, juste:j}); suivant(); break; }
    case "suivant": suivant(); break;
    case "quitter-session": terminerSession(); break;
    case "lancer-examen": {
      const nb = Math.max(10, Math.min(60, Number(document.getElementById("e-nb").value) || 20));
      const mn = Math.max(5, Math.min(180, Number(document.getElementById("e-min").value) || 30));
      ui.resultat = null; ouvrirSession(composerExamen(nb), "examen", mn*60); break;
    }

    /* --- réglages --- */
    case "moteur": S.reglages.moteur = el.dataset.v; sauver(); rendre(); break;
    case "charger-modeles": {
      if(!S.reglages.cleGemini){ ui.message = {titre:"Clé manquante", txt:"Collez d'abord votre clé Google AI Studio."}; rendre(); break; }
      el.textContent = "Chargement…";
      try{
        const m = await listerModeles(S.reglages.cleGemini);
        S.reglages.modeles = m;
        if(!S.reglages.modele && m.length){
          const pref = m.find(x => /flash/i.test(x.id) && !/lite|preview|exp/i.test(x.id)) || m.find(x => /flash/i.test(x.id)) || m[0];
          S.reglages.modele = pref.id;
        }
        sauver(); ui.message = {type:"info", titre:"Modèles chargés", txt:m.length + " modèles disponibles."};
      }catch(err){ ui.message = {type:"err", titre:"Clé refusée", txt:err.message}; }
      rendre(); break;
    }
    case "exporter": telecharger("prepa-depph-" + new Date().toISOString().slice(0,10) + ".json", JSON.stringify(S, null, 1)); break;
    case "tout-effacer":
      if(confirm("Effacer vos cours, fiches, exercices et résultats ? La progression des leçons est conservée.")){
        const prep = S.prep, regl = S.reglages;
        S = etatVierge(); S.prep = prep; S.reglages = regl;
        sauver(); ui.fiche = null; aller("rev", "accueil");
      } break;
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id === "i-fic" && t.files[0]){
    const f = t.files[0];
    ui.message = {type:"info", titre:"Lecture du fichier", txt:f.name}; rendre();
    try{
      const txt = await lireFichier(f);
      ui.importTexte = txt;
      if(!ui.importTitre) ui.importTitre = f.name.replace(/\.[^.]+$/,"");
      if(!ui.importUE) ui.importUE = detecterUE(txt) || "";
      const al = sonderDonnees(txt);
      ui.avisRGPD = al.length ? al : null; ui.rgpdIgnore = false;
      ui.message = {type:"info", titre:"Fichier lu",
        txt: txt.length + " caractères" + (ui.importUE ? " · unité proposée : " + ui.importUE : "") + "."};
    }catch(err){ ui.message = {type:"err", titre:"Lecture impossible", txt:err.message}; }
    rendre(); return;
  }
  if(t.id === "i-json" && t.files[0]){
    try{
      const o = JSON.parse(await t.files[0].text());
      if(!o || !Array.isArray(o.cours)) throw new Error("Ce fichier ne contient pas de sauvegarde.");
      if(confirm("Remplacer les données actuelles ?")){
        S = Object.assign(etatVierge(), o); sauver(); ui.fiche = null; aller("rev","accueil");
      }
    }catch(err){ ui.message = {type:"err", titre:"Import impossible", txt:err.message}; rendre(); }
    return;
  }
  const act = t.closest("[data-act]");
  if(act && act.dataset.act === "assoc"){ ui.session.assoc[Number(act.dataset.i)] = t.value; return; }
  const b = t.dataset.bind;
  if(!b) return;
  if(b in ui){
    ui[b] = t.value;
    if(b === "importTexte"){
      const al = sonderDonnees(t.value);
      ui.avisRGPD = al.length ? al : null;
      if(!ui.importUE){ const d = detecterUE(t.value); if(d) ui.importUE = d; }
      rendre();
    }
  } else {
    S.reglages[b] = t.value; sauver();
    if(["dateExamen","dateRentree","voix","debitVoix"].includes(b)) rendre();
  }
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind;
  if(b === "importTexte" || b === "importTitre") ui[b] = e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "rep" && e.target.tagName === "INPUT"){ e.preventDefault(); valider(); }
});
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if(ui.ecran === "reglages") rendre(); };

charger();
if(!S.prep) S.prep = {};
rendre();
</script>
