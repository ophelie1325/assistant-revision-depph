UE3: {titre:"Prévention, information et éducation thérapeutique du patient", duree:"11 min", diapos:[
 {t:"intro", kick:"UE3 · pour commencer", titre:"Apprendre à vivre avec sa maladie",
  texte:"L'éducation thérapeutique ne consiste pas à expliquer une ordonnance plus lentement. C'est un processus continu, intégré aux soins, qui vise à ce que le patient acquière les compétences dont il a besoin pour gérer sa vie avec une maladie chronique."},

 {t:"notion", kick:"La définition", titre:"Deux références qui se complètent",
  paras:["L'OMS, en 1996, décrit l'ETP comme visant à aider les patients à acquérir ou maintenir les compétences nécessaires pour gérer au mieux leur vie avec une maladie chronique. Elle fait partie intégrante et permanente de la prise en charge.",
   "Le code de la santé publique, à l'article L. 1161-1, est plus bref : l'éducation thérapeutique s'inscrit dans le parcours de soins du patient, et a pour objectif de le rendre plus autonome en facilitant son adhésion aux traitements prescrits et en améliorant sa qualité de vie."],
  encart:{type:"info", titre:"D'où ça vient", texte:"C'est la loi HPST du 21 juillet 2009, en son article 84, qui a donné pour la première fois un cadre légal à l'ETP en France."}},

 {t:"encart", kick:"Attention, ça a changé", titre:"Déclaration, et non plus autorisation", type:"garde",
  texte:"Jusqu'en 2020, un programme d'ETP devait être autorisé par l'agence régionale de santé. Depuis le 1er janvier 2021, ce régime d'autorisation a été remplacé par un régime de déclaration : le porteur déclare son programme à l'ARS, sur la base d'un cahier des charges national fixé par l'arrêté du 30 décembre 2020. Un cours ou un manuel qui parle encore d'« autorisation ARS » décrit l'état du droit d'avant 2021."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Ce que recouvrent les mots", mots:[
  {m:"Programme d'ETP", d:"Ensemble structuré et conforme au cahier des charges national, déclaré à l'ARS, proposé au patient par le médecin prescripteur."},
  {m:"Programme personnalisé", d:"Déclinaison du programme pour un patient donné, élaborée avec lui."},
  {m:"Actions d'accompagnement", d:"Assistance et soutien apportés au malade ou à son entourage dans la prise en charge de la maladie. Elles font partie de l'ETP."},
  {m:"Programme d'apprentissage", d:"Appropriation par le patient des gestes techniques nécessaires à l'utilisation d'un médicament qui l'exige."}]},

 {t:"notion", kick:"Qui peut faire quoi", titre:"Une compétence qui se prouve",
  paras:["Dispenser ou coordonner l'ETP suppose des compétences définies par arrêté du 2 août 2010, acquises par une formation d'une durée minimale de quarante heures d'enseignements théoriques et pratiques.",
   "L'ETP est proposée au malade par le médecin prescripteur, et donne lieu à l'élaboration d'un programme personnalisé."],
  encart:{type:"piege", titre:"Interdiction ferme", texte:"Les entreprises exploitant un médicament ou responsables de la mise sur le marché d'un dispositif médical ne peuvent ni élaborer ni mettre en œuvre un programme d'ETP. Elles peuvent seulement y prendre part, notamment pour le financement, dès lors que professionnels de santé et associations agréées en gardent l'élaboration."}},

 {t:"notion", kick:"Sur le terrain", titre:"Ce que le préparateur y fait",
  paras:["Le référentiel du diplôme confie au préparateur la conduite d'entretiens ciblés de prévention, d'information et d'actions d'éducation thérapeutique, dans un cadre pluriprofessionnel.",
   "Concrètement : expliquer les modalités de reconstitution d'un médicament, montrer l'usage d'un dispositif, vérifier que la personne a compris — et le vérifier vraiment, en lui demandant de reformuler ou de faire devant vous."],
  encart:{type:"astuce", titre:"Astuce d'entretien", texte:"Les critères d'évaluation du diplôme insistent sur un point précis : la compréhension de l'interlocuteur est vérifiée, et une reformulation est réalisée le cas échéant. Faire répéter n'est pas une politesse, c'est un critère."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE3", lignes:[
  {v:"1996", l:"définition de l'ETP par l'OMS, reprise par la HAS"},
  {v:"2009", l:"loi HPST, article 84 : cadre légal de l'ETP"},
  {v:"40 h", l:"durée minimale de formation pour dispenser ou coordonner l'ETP"},
  {v:"2021", l:"passage de l'autorisation à la déclaration des programmes"}]},

 {t:"etapes", kick:"La démarche", titre:"Les quatre étapes de la HAS",
  etapes:["Élaborer un diagnostic éducatif : connaître le patient, identifier ses besoins et ses attentes, formuler avec lui les compétences à acquérir",
   "Définir un programme personnalisé, en formulant avec lui les compétences à acquérir ou à mobiliser au regard de son projet",
   "Planifier et mettre en œuvre les séances, individuelles ou collectives",
   "Évaluer les progrès du patient, puis lui proposer une éducation thérapeutique de suivi"],
  note:"Guide méthodologique HAS. Le programme s'organise toujours autour de ces quatre étapes, quelles que soient les modalités de réalisation. L'évaluation n'est pas une formalité de fin : elle actualise le diagnostic éducatif et ouvre le cycle suivant."},

 {t:"notion", kick:"Ce qu'on cherche à construire", titre:"Deux familles de compétences",
  paras:["L'ETP vise des compétences d'auto-soins : soulager ses symptômes, tenir compte des résultats d'une auto-surveillance ou d'une auto-mesure, réaliser des gestes techniques comme une injection d'insuline, adapter des doses de médicaments.",
   "Elle vise aussi des compétences d'adaptation, plus personnelles : mieux se connaître, gagner en confiance, prendre des décisions, résoudre des problèmes, se fixer des buts et faire des choix. Un programme personnalisé prend en compte ces deux dimensions."],
  encart:{type:"piege", titre:"L'erreur d'examen", texte:"Réduire l'ETP aux gestes techniques. Apprendre à piquer relève de l'auto-soin ; accepter de vivre avec la maladie et savoir demander de l'aide relève de l'adaptation. Un programme qui ne travaille que la première famille est incomplet."},
  img:{f:"ue3-etp.jpg", leg:"Séance d'éducation thérapeutique"}},

 {t:"notion", kick:"Qui met en œuvre", titre:"Jamais tout seul",
  paras:["Un programme d'ETP est mis en œuvre par au moins deux professionnels de santé de professions différentes, conformément au décret du 2 août 2010. L'ensemble des professions de santé listées par le code de la santé publique sont concernées : médecins, infirmiers, diététiciens, masseurs-kinésithérapeutes, pharmaciens, et l'équipe de la pharmacie avec eux.",
   "Le programme comporte aussi des activités de coordination et de partage d'informations entre intervenants : sans elles, chaque professionnel recommence l'entretien de zéro et le patient répète son histoire quatre fois."],
  encart:{type:"astuce", titre:"Votre valeur ajoutée", texte:"Le préparateur connaît les formes, les dispositifs et les contraintes pratiques d'administration mieux que quiconque dans l'équipe. C'est exactement ce qui manque quand un patient abandonne un traitement pour une raison purement matérielle."}},

 {t:"quiz", kick:"Vérification", question:"Un laboratoire pharmaceutique propose de construire et d'animer un programme d'ETP dans votre établissement. Que dit la loi ?",
  options:["C'est possible si le programme est déclaré à l'ARS",
   "C'est interdit : le laboratoire ne peut ni élaborer ni mettre en œuvre le programme, seulement y prendre part, par exemple en le finançant",
   "C'est possible à condition qu'un médecin signe le programme"],
  bonne:1,
  expl:"L'article L. 1161-4 du code de la santé publique pose cette interdiction. La participation au financement reste possible dès lors que professionnels de santé et associations agréées élaborent le programme."},

 {t:"quiz", kick:"Vérification", question:"Depuis 2021, pour mettre en œuvre un programme d'ETP, il faut :",
  options:["Une autorisation de l'ARS","Une déclaration à l'ARS conforme au cahier des charges national","Rien de particulier"],
  bonne:1,
  expl:"Le régime de déclaration a remplacé le régime d'autorisation au 1er janvier 2021. Le cahier des charges national, lui, reste obligatoire."},

 {t:"quiz", kick:"Vérification", question:"Un patient diabétique sait faire son injection mais n'ose plus sortir de chez lui de peur d'une hypoglycémie. Que travaille-t-on en priorité ?",
  options:["Une compétence d'auto-soins, il faut revoir la technique d'injection",
   "Une compétence d'adaptation : confiance, prise de décision, résolution de problèmes",
   "Rien, cela relève d'un suivi psychiatrique et sort de l'ETP"],
  bonne:1,
  expl:"Le geste est acquis, ce n'est donc pas l'auto-soin qui bloque. La HAS range explicitement dans l'ETP le fait de gagner en confiance, de prendre des décisions et de résoudre des problèmes : ce sont les compétences d'adaptation."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"Code de la santé publique, articles L. 1161-1 à L. 1161-6", ref:"Définition, programmes, actions d'accompagnement, interdictions", url:"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072665/LEGISCTA000020891754/"},
  {titre:"Ministère chargé de la santé", ref:"Éducation thérapeutique du patient — textes de référence et régime de déclaration", url:"https://sante.gouv.fr/systeme-de-sante/parcours-des-patients-et-des-usagers/education-therapeutique-du-patient/article/education-therapeutique-du-patient"},
  {titre:"Arrêté du 30 décembre 2020", ref:"Cahier des charges des programmes et dossier de déclaration", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000042845767"},
  {titre:"Arrêté du 2 août 2010 modifié, article 2", ref:"Compétences requises pour dispenser ou coordonner l'ETP — formation d'une durée minimale de quarante heures", url:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000022664581"},
  {titre:"Décret n° 2020-1832 du 31 décembre 2020", ref:"Remplacement du régime d'autorisation par un régime de déclaration au 1er janvier 2021", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000042845656"},
  {titre:"Arrêté du 31 juillet 2024, annexe II", ref:"Référentiel de compétences du DEPPH, compétence C3 et ses critères d'évaluation", url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000050066720"},
  {titre:"HAS, Éducation thérapeutique du patient", ref:"Démarche éducative en quatre étapes, compétences d'auto-soins et d'adaptation", url:"https://www.has-sante.fr/jcms/r_1496895/fr/education-therapeutique-du-patient-etp"},
  {titre:"HAS, Structuration d'un programme d'ETP dans le champ des maladies chroniques", ref:"Suivi régulier ou approfondi, actualisation du diagnostic éducatif", url:"https://www.has-sante.fr/jcms/c_601290/fr/structuration-d-un-programme-d-education-therapeutique-du-patient-dans-le-champ-des-maladies-chroniques"},
  {titre:"HAS, Mise en œuvre de l'éducation thérapeutique", ref:"Programme mis en œuvre par au moins deux professionnels de santé de professions différentes, décret n° 2010-904 du 2 août 2010", url:"https://www.has-sante.fr/jcms/c_2812200/fr/mise-en-oeuvre-de-l-education-therapeutique"}],
  note:"Consulté le 8 août 2026."}
]},

UE4: {titre:"Chimiothérapie, nutrition parentérale, préparations stériles et non stériles", duree:"16 min", diapos:[
 {t:"intro", kick:"UE4 · pour commencer", titre:"Fabriquer un médicament qui n'existe pas",
  texte:"Quand aucune spécialité n'est adaptée au patient, la pharmacie fabrique. Une poche de chimiothérapie, un mélange de nutrition parentérale pour un nouveau-né, une gélule dosée pour un enfant : ce sont des médicaments sans autorisation de mise sur le marché, dont la seule garantie de qualité est le procédé suivi. D'où un référentiel opposable : les bonnes pratiques de préparation.",
  img:{f:"ue4-01-preparation.jpg", leg:"Préparation pharmaceutique en établissement de santé"}},

 {t:"encart", kick:"Attention, ça a changé", titre:"Les BPP de 2007 sont abrogées", type:"garde",
  texte:"La décision de l'ANSM du 21 juillet 2023 met en vigueur au 20 septembre 2023 une nouvelle édition des bonnes pratiques de préparation. Elle abroge celle du 5 novembre 2007 ainsi qu'une décision intermédiaire du 20 septembre 2022. Si un cours, un QCM ou un manuel renvoie encore aux « BPP de 2007 » ou à la « décision du 5 novembre 2007 », il décrit un texte qui n'est plus applicable."},

 {t:"notion", kick:"Le cadre", titre:"Trois préparations, trois définitions",
  paras:["L'article L. 5121-1 du code de la santé publique distingue la préparation magistrale, préparée selon une prescription médicale destinée à un malade déterminé quand aucune spécialité adaptée ou disponible n'existe ; la préparation hospitalière, préparée selon les indications de la pharmacopée en l'absence de spécialité disponible ou adaptée, par une PUI ou l'établissement pharmaceutique de l'établissement de santé ; et la préparation officinale, inscrite à la pharmacopée ou au formulaire national.",
   "La préparation hospitalière est dispensée sur prescription médicale à un ou plusieurs patients et fait l'objet d'une déclaration à l'ANSM. Les BPP demandent aux PUI de déclarer chaque nouvelle préparation hospitalière réalisée, ainsi que toute préparation cessée."],
  encart:{type:"info", titre:"À retenir", texte:"Magistrale : un patient nommé. Hospitalière : plusieurs patients, en série, déclarée. Officinale : une formule inscrite au formulaire national."}},

 {t:"notion", kick:"Le référentiel", titre:"Comment le guide est bâti",
  paras:["Les BPP 2023 comprennent neuf chapitres généraux, quatre annexes, quatre lignes directrices et un glossaire. Les chapitres décrivent les conditions communes à toutes les préparations. Les lignes directrices ajoutent des règles propres à certains types : LD1 médicaments stériles, LD2 substances pouvant présenter un risque pour la santé et l'environnement, LD3 recherches impliquant la personne humaine, LD4 médicaments radiopharmaceutiques.",
   "Le guide précise que lorsqu'une préparation relève de plusieurs lignes directrices, celles-ci s'appliquent simultanément."],
  encart:{type:"astuce", titre:"L'exemple donné par le texte lui-même", texte:"Une chimiothérapie cytotoxique injectable suit les chapitres généraux, la LD1 et la LD2. Si elle est réalisée dans le cadre d'une recherche impliquant la personne humaine, la LD3 s'ajoute."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots du guide", mots:[
  {m:"MPUP", d:"Matière première à usage pharmaceutique : tous les composants d'une préparation, substances actives, excipients et éléments de mise en forme comme les gélules vides."},
  {m:"ZAC", d:"Zone d'atmosphère contrôlée : locaux et équipements dont les qualités microbiologique et particulaire sont maîtrisées, qualifiés et maintenus."},
  {m:"Système clos", d:"Procédé de transfert où les systèmes de fermeture des contenants et le matériel de transfert restent en place pendant tout le processus : le produit n'est jamais en contact avec l'environnement."},
  {m:"Système ouvert", d:"Dès qu'une seule étape de la préparation n'est pas réalisée en système clos."},
  {m:"Vide de ligne", d:"Vérification faite avant chaque nouveau lot pour s'assurer qu'aucun élément du lot précédent ne peut être introduit dans le nouveau."},
  {m:"Dossier de préparation", d:"Le dossier de fond, en trois parties, qui décrit la préparation, son procédé et ses contrôles. Il sert de matrice."},
  {m:"Dossier de lot", d:"Le dossier d'un lot précis, en cinq parties : préparation, conditionnement, contrôle, libération pharmaceutique, gestion des anomalies."}]},

 {t:"notion", kick:"Analyse de risque", titre:"Trois catégories de préparations",
  paras:["L'annexe III classe les préparations en trois catégories selon la substance active, la voie d'administration, les opérations pharmaceutiques et le nombre de patients concernés par un lot. Catégorie 1, risque faible : formes liquides, solides ou semi-solides sans technique particulière, par exemple le mélange de deux pommades. Catégorie 2, risque moyen : formes demandant une technicité particulière, comme les suppositoires ou les gélules. Catégorie 3, risque élevé : formes stériles, substances CMR reconnues, préparations pédiatriques hors voie cutanée.",
   "La règle de lecture est stricte : un seul critère en catégorie 3 suffit à y classer la préparation, et il devient alors inutile de poursuivre le questionnement. En cas de doute persistant, on retient la catégorie immédiatement supérieure."],
  encart:{type:"info", titre:"Ce que la catégorie commande", texte:"La tenue, notamment. Catégorie 1 : tenue adaptée et propre, charlotte obligatoire. Catégories 2 et 3 : charlotte, sur-chaussures et sur-blouse ou tenue propre dédiée obligatoires, cache-barbe recommandé le cas échéant."}},

 {t:"notion", kick:"Préparations stériles", titre:"Trois procédés, et un ordre de préférence",
  paras:["La LD1 identifie trois procédés : la stérilisation terminale, la filtration stérilisante et la préparation aseptique. Selon la pharmacopée, la stérilisation terminale est la méthode de choix ; lorsqu'elle est envisageable et que l'établissement dispose de l'équipement, la stérilisation par la chaleur humide, c'est-à-dire l'autoclave, est la méthode de choix sauf justification.",
   "Quand la MPUP est une spécialité pharmaceutique stérile — le cas courant à l'hôpital pour les chimiothérapies — la préparation aseptique est le procédé le plus approprié. Et parmi les préparations aseptiques, la LD1 note que le procédé en système clos est la méthode de choix."],
  encart:{type:"piege", titre:"Le chiffre à ne pas rater", texte:"Les solutions sont filtrées sur un filtre stérile à usage unique dont le diamètre nominal des pores est inférieur ou égal à 0,22 µm. La préparation aseptique en système ouvert est associée à une filtration stérilisante à 0,22 µm, sauf exception justifiée."},
  img:{f:"ue4-07-autoclave.jpg", leg:"Autoclave de stérilisation par la chaleur humide"}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les quatre classes de ZAC", lignes:[
  {v:"A", l:"au repos comme en activité : 3 520 particules/m³ de 0,5 µm et plus, 20 de 5 µm et plus"},
  {v:"B", l:"au repos identique à A ; en activité 352 000 et 2 900"},
  {v:"C", l:"au repos 352 000 et 2 900 ; en activité 3 520 000 et 29 000"},
  {v:"D", l:"au repos 3 520 000 et 29 000 ; en activité non défini"}],
  note:"Tableau 1 de la LD1. Au repos, les classes A et B correspondent à ISO 5, la classe C à ISO 7, la classe D à ISO 8. « Au repos » : installation achevée et opérationnelle, sans opérateur à son poste. « En activité » : installation en fonctionnement avec le nombre prévu d'opérateurs."},

 {t:"notion", kick:"Les équipements", titre:"Poste à flux unidirectionnel et isolateur",
  paras:["Le poste à flux d'air unidirectionnel distribue l'air dans une seule direction, horizontale ou verticale, sur toute la surface à protéger. Le local qui le contient relève d'une classe B ou C selon le procédé.",
   "L'isolateur est un équipement clos à barrière physique étanche, qui n'échange ni air non filtré ni contaminants avec l'environnement adjacent. Ses surfaces internes subissent régulièrement une stérilisation de contact selon un procédé et une fréquence validés, et tout objet introduit subit ce cycle. Ses gants ne sont pas réutilisables. Les isolateurs pour médicaments stériles sont essentiellement en surpression et sont situés au minimum dans une ZAC de classe D."],
  encart:{type:"piege", titre:"Le cas des produits pulvérulents à risque", texte:"En système ouvert avec une MPUP pulvérulente, un isolateur en pression négative est préféré. Et la LD1 est catégorique : la ZAC contenant un isolateur en dépression est toujours de classe C."},
  img:{f:"ue4-09-isolateur.jpg", leg:"Isolateur de préparation avec gants de manipulation"}},

 {t:"chiffres", kick:"Le tableau qui tombe en examen", titre:"Quelle classe pour quelle opération", lignes:[
  {v:"A dans C", l:"préparation aseptique en isolateur placé en dépression"},
  {v:"A dans D", l:"préparation aseptique en isolateur placé en surpression"},
  {v:"A dans B", l:"poste à flux unidirectionnel, procédé en système ouvert"},
  {v:"A dans C", l:"poste à flux unidirectionnel, procédé en système clos"},
  {v:"C puis A", l:"stérilisation terminale avec risque potentiel : préparation en C, remplissage en A dans un environnement C"},
  {v:"D puis C", l:"stérilisation terminale sans risque potentiel : préparation en D, remplissage en C dans un environnement D"}],
  note:"Tableaux 6, 7 et 8 de la LD1. La colonne indiquée après « dans » est l'environnement immédiat de la zone de préparation."},

 {t:"etapes", kick:"Le déroulé", titre:"Une préparation, du début à la libération",
  etapes:["Vide de ligne, vérification de la propreté de la zone et du matériel, contrôles d'environnement",
   "Rassemblement des MPUP, articles de conditionnement, matériels et documents valides",
   "Vérification des péremptions, de l'étiquetage, des qualités organoleptiques et de l'intégrité des emballages",
   "Pesée ou mesure de volume, enregistrée, avec vérification de l'identité et de la quantité de chaque MPUP",
   "Réalisation continue, sans conservation à un stade intermédiaire sauf justification technique",
   "Conditionnement après un nouveau vide de ligne, puis bilan comparatif",
   "Contrôles, puis libération pharmaceutique datée et signée, non modifiable ensuite"],
  note:"Le guide demande de ne réaliser qu'une seule préparation à la fois sur une même zone de travail, de confier préférentiellement tout un lot à la même personne qualifiée, et de ne pas l'interrompre avant la fin."},

 {t:"notion", kick:"LD2 · protection", titre:"Protéger l'opérateur sans exposer le produit",
  paras:["La LD2 sépare deux logiques : le risque produit, c'est-à-dire la contamination microbiologique du patient, et le risque pour le personnel et l'environnement. Elle impose de déterminer le danger intrinsèque de la substance — mentions de danger du règlement CLP pour les matières premières, résumé des caractéristiques du produit pour les spécialités — puis le niveau d'exposition, réévalué chaque année pour chaque groupe de personnel exposé de la même façon.",
   "Les équipements de protection collective priment : enceinte ventilée aspirante, isolateur ou boîte à gants selon le risque. Pour les substances chimiques, l'air traité des postes à flux unidirectionnel ou des isolateurs est rejeté à l'extérieur du bâtiment après passage sur un filtre HEPA."],
  encart:{type:"piege", titre:"Les obligations nominatives de la LD2", texte:"Substances CMR manipulées hors isolateur ou boîte à gants : sur-blouse, manchons pour avant-bras et gants obligatoires. Danger respiratoire : masque FFP2, FFP3 ou appareil respiratoire isolant. Danger oculaire : lunettes ou écran facial obligatoires. Une trousse d'urgence à proximité, une douche oculaire ou un rince-œil installé."}},

 {t:"notion", kick:"Nutrition parentérale", titre:"Pourquoi ce sujet est devenu sensible",
  paras:["En décembre 2013, trois nourrissons meurent au centre hospitalier de Chambéry après administration de poches de nutrition parentérale contaminées. Une mission est confiée à l'IGAS, dont le rapport 2014-168R de janvier 2015 met en évidence une grande hétérogénéité des pratiques de prescription, de préparation, de contrôle et d'administration.",
   "L'instruction DGOS/DGS n° 2015-85 du 20 mars 2015 en tire les conséquences : diagnostic de territoire par les ARS, fabrication de tout mélange nutritif placée sous responsabilité pharmaceutique, coopérations entre PUI encouragées. La HAS et la Société française de néonatalogie publient en avril 2018 une recommandation sur la nutrition parentérale en néonatologie."],
  encart:{type:"info", titre:"La trace dans le référentiel", texte:"Le préambule des BPP 2023 cite expressément les recommandations de la mission IGAS 2014-168R parmi les raisons de la révision du guide. Un accident de terrain a directement modifié le référentiel opposable."},
  img:{f:"ue4-13-nutrition.jpg", leg:"Poche de nutrition parentérale"}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE4", lignes:[
  {v:"20/09/2023", l:"entrée en vigueur des BPP 2023, en remplacement de celles de 2007"},
  {v:"0,22 µm", l:"diamètre nominal maximal des pores du filtre stérilisant"},
  {v:"250 / 28 j", l:"nombre maximal de patients potentiellement traités par un lot, pour 28 jours de traitement"},
  {v:"10 à 15 Pa", l:"écart de pression entre locaux adjacents de classes différentes"},
  {v:"18 à 23 °C", l:"température ambiante d'une ZAC de préparation, sans dépasser 25 °C"},
  {v:"1 fois/an", l:"requalification minimale des équipements, locaux et zones composant la ZAC"},
  {v:"5 ans", l:"conservation du dossier de préparation après péremption du dernier lot produit"},
  {v:"10 ans", l:"conservation du livre-registre des préparations"}]},

 {t:"quiz", kick:"Vérification", question:"Vous préparez une poche de cytotoxique injectable. Quels textes des BPP vous appliquez-vous ?",
  options:["Uniquement la ligne directrice LD1, puisque la préparation est stérile",
   "Uniquement la ligne directrice LD2, puisque le produit est CMR",
   "Les chapitres généraux, la LD1 et la LD2, qui s'appliquent simultanément"],
  bonne:2,
  expl:"Le préambule et la LD1 donnent exactement cet exemple : lorsqu'une préparation relève de plusieurs lignes directrices, elles s'appliquent en même temps. Rien ne se substitue aux chapitres généraux."},

 {t:"quiz", kick:"Vérification", question:"Un isolateur est placé en dépression pour manipuler une poudre CMR en système ouvert. Quelle doit être la classe de la ZAC qui le contient ?",
  options:["Classe D, comme pour un isolateur en surpression","Classe C, toujours","Classe B, à cause du système ouvert"],
  bonne:1,
  expl:"La LD1 l'énonce sans condition : la ZAC contenant un isolateur en dépression est toujours de classe C. L'isolateur en surpression, lui, est au minimum dans une ZAC de classe D."},

 {t:"quiz", kick:"Vérification", question:"Une préparation pédiatrique par voie orale contient une substance inscrite sur la liste I. Dans quelle catégorie la classez-vous ?",
  options:["Catégorie 1, il s'agit d'une forme orale simple","Catégorie 2, la voie orale relève de la technicité moyenne","Catégorie 3, risque élevé"],
  bonne:2,
  expl:"L'annexe III place en catégorie 3 toute substance vénéneuse destinée aux enfants de moins de 12 ans hors voie cutanée, ainsi que la liste I. Un seul critère en catégorie 3 suffit, et il est alors inutile de poursuivre le questionnement."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"ANSM, Bonnes pratiques de préparation, édition 2023", ref:"Préambule, champ d'application, chapitres 1 à 6, annexe III, lignes directrices LD1 et LD2 — texte intégral", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"Décision ANSM du 21 juillet 2023", ref:"Entrée en vigueur au 20 septembre 2023, abrogation des décisions du 5 novembre 2007 et du 20 septembre 2022", url:"https://ansm.sante.fr/actualites/decision-du-21-07-2023-relative-aux-bonnes-pratiques-de-preparation"},
  {titre:"Code de la santé publique, article L. 5121-1", ref:"Définitions des préparations magistrale, hospitalière et officinale", url:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000048701765"},
  {titre:"Arrêté du 14 novembre 2014", ref:"Liste des préparations pouvant présenter un risque pour la santé", url:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000029762675/"},
  {titre:"Instruction DGOS/PF2/DGS/PP2 n° 2015-85 du 20 mars 2015", ref:"Gestion des risques liés à la nutrition parentérale en néonatalogie et pédiatrie", url:"https://www.legifrance.gouv.fr/circulaire/id/39383"},
  {titre:"HAS et Société française de néonatalogie, avril 2018", ref:"Nutrition parentérale en néonatologie — origine de la saisine et rapport IGAS 2014-168R", url:"https://www.has-sante.fr/upload/docs/application/pdf/2018-06/argu_np_neonat_2018-06-28_11-18-23_280.pdf"},
  {titre:"ANSM, page de référence Bonnes pratiques de préparation", ref:"Étiquetage, sous-traitance, substances interdites ou restreintes", url:"https://ansm.sante.fr/documents/reference/bonnes-pratiques-de-preparation"}],
  note:"Textes consultés le 9 août 2026, guide BPP lu dans son texte intégral. En cas d'écart avec le cours de votre centre de formation, c'est le cours qui fait foi pour l'examen — mais signalez l'écart à votre formateur."}
]},

UE5: {titre:"Radiopharmacie et radioprotection", duree:"16 min", diapos:[
 {t:"intro", kick:"UE5 · pour commencer", titre:"Un médicament qui décroît pendant qu'on le prépare",
  texte:"Un médicament radiopharmaceutique perd son activité minute après minute, ne peut pas être stérilisé dans son récipient final, et expose celui qui le manipule. Trois contraintes qui ne se retrouvent nulle part ailleurs à la pharmacie, et qui expliquent que la radiopharmacie ait son propre référentiel et son propre corps de règles de radioprotection."},

 {t:"notion", kick:"Les fondations", titre:"Justification, optimisation, limitation",
  paras:["La radioprotection française transpose la directive 2013/59/Euratom, dans le code du travail aux articles L. 4451-1 et suivants et R. 4451-1 et suivants, et dans le code de la santé publique aux articles L. 1333-1 et suivants. Elle réintroduit les neuf principes généraux de prévention sans renier les trois principes fondateurs de la radioprotection : justification, optimisation, limitation.",
   "L'employeur doit supprimer ou réduire au minimum les risques, en tenant compte du progrès technique et de la disponibilité de mesures de maîtrise du risque à la source. La prévention est intégrée dès la conception des lieux de travail, la protection collective prime, l'équipement individuel vient en dernier ressort."],
  encart:{type:"info", titre:"Deux risques distincts", texte:"L'exposition externe, où la source irradie à distance, et la contamination externe ou interne, où la substance radioactive se dépose ou entre dans l'organisme. Les parades ne sont pas les mêmes."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Ne pas confondre", mots:[
  {m:"Dose efficace", d:"La grandeur qui exprime l'exposition de l'organisme entier. C'est elle qui porte la limite des 20 mSv."},
  {m:"Dose équivalente", d:"La grandeur qui exprime l'exposition d'un organe ou d'un tissu : peau, extrémités, cristallin."},
  {m:"Période", d:"Le temps au bout duquel l'activité d'un radionucléide a diminué de moitié."},
  {m:"Zone délimitée", d:"Zone surveillée ou contrôlée, dont l'accès est réservé aux travailleurs autorisés par l'employeur."},
  {m:"Conseiller en radioprotection", d:"Personne physique salariée, dite personne compétente en radioprotection, ou personne morale, dite organisme compétent en radioprotection."},
  {m:"Radiopharmacien", d:"Seul à pouvoir assumer la responsabilité technique de la préparation et du contrôle des médicaments radiopharmaceutiques."},
  {m:"MRP", d:"Médicament radiopharmaceutique, l'abréviation employée par la ligne directrice LD4 des BPP."}]},

 {t:"notion", kick:"Le zonage", titre:"Des couleurs qui gradent le risque",
  paras:["L'employeur identifie les lieux où l'exposition est susceptible de dépasser 0,08 mSv par mois pour l'organisme entier, 4 mSv par mois pour les extrémités ou la peau, ou 6 mSv par an pour le radon. L'évaluation se fait en considérant le lieu de travail occupé de manière permanente, soit 2 000 heures par an ou 170 heures par mois.",
   "Il délimite alors des zones qui traduisent la gradation du risque : zone surveillée signalée en bleu, zone contrôlée verte, jaune, orange puis rouge. Si l'exposition des extrémités ou de la peau peut dépasser 4 mSv par mois, une zone d'extrémité est délimitée."],
  encart:{type:"piege", titre:"Les conditions d'accès diffèrent", texte:"L'accès en zone contrôlée orange ou rouge fait l'objet d'une autorisation individuelle délivrée par l'employeur. Pour la zone rouge, cet accès est exceptionnel et donne lieu à un enregistrement nominatif à chaque entrée."},
  img:{f:"ue5-04-zonage.jpg", leg:"Signalisation de zone contrôlée et trisecteur radiologique"}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les limites d'exposition des travailleurs", lignes:[
  {v:"20 mSv", l:"dose efficace, organisme entier, sur douze mois consécutifs"},
  {v:"500 mSv", l:"dose équivalente aux extrémités : mains, avant-bras, pieds, chevilles"},
  {v:"500 mSv", l:"dose équivalente à la peau, sur tout cm² quelle que soit la surface exposée"},
  {v:"20 mSv", l:"dose équivalente au cristallin depuis le 1er juillet 2023"},
  {v:"6 mSv", l:"jeunes travailleurs de 16 à 18 ans, organisme entier"},
  {v:"1 mSv", l:"enfant à naître, de la déclaration de grossesse à l'accouchement"}],
  note:"Articles R. 4451-6 à R. 4451-8 du code du travail. Les femmes enceintes et les jeunes travailleurs de 16 à 18 ans sont exclus des travaux impliquant un classement en catégorie A. Une femme allaitant ne peut être affectée à un poste entraînant un risque d'exposition interne."},

 {t:"encart", kick:"Attention, ça a changé", titre:"La limite au cristallin a été divisée par sept", type:"garde",
  texte:"La valeur limite d'exposition du cristallin était de 150 mSv par an. Entre le 1er juillet 2018 et le 30 juin 2023, un régime transitoire a fixé une limite cumulée de 100 mSv sur cinq ans, sans dépasser 50 mSv une année donnée. Depuis le 1er juillet 2023, la limite est de 20 mSv sur douze mois consécutifs. Un support qui affiche encore 150 mSv au cristallin a plus de huit ans de retard."},

 {t:"notion", kick:"L'organisation", titre:"Classement, dosimétrie, formation",
  paras:["Sont classés en catégorie A les travailleurs susceptibles de recevoir sur douze mois consécutifs une dose efficace supérieure à 6 mSv, ou une dose équivalente supérieure à 150 mSv pour la peau ou les extrémités. Sont classés en catégorie B les autres travailleurs susceptibles de dépasser 1 mSv de dose efficace, ou 15 mSv au cristallin, ou 50 mSv à la peau ou aux extrémités.",
   "Le classement suit une évaluation individuelle préalable, réalisée avant l'affectation au poste, et recueille l'avis du médecin du travail. Les travailleurs disposant d'une surveillance dosimétrique individuelle reçoivent une formation renouvelée au moins tous les trois ans."],
  encart:{type:"astuce", titre:"Deux dosimètres, deux usages", texte:"Le dosimètre passif à lecture différée mesure la dose reçue a posteriori et alimente SISERI. Le dosimètre opérationnel, actif et à lecture directe, se porte en zone contrôlée, en zone d'extrémité et en zone d'opération ; il est muni d'alarmes sonores et visuelles qui doivent être activées."},
  img:{f:"ue5-07-dosimetre.jpg", leg:"Dosimètres individuels portés par les travailleurs exposés"}},

 {t:"notion", kick:"La radiopharmacie", titre:"Qui décide, et où",
  paras:["Les préparations de médicaments radiopharmaceutiques ne sont pas autorisées en officine. Elles relèvent d'une PUI dont les locaux répondent aux textes sur les installations utilisant des radionucléides en sources non scellées, soumises à l'autorisation préalable de l'Autorité de sûreté nucléaire délivrée au responsable de l'activité nucléaire.",
   "Seuls les radiopharmaciens peuvent avoir la responsabilité technique de la préparation et du contrôle des MRP ; en PUI, le radiopharmacien reçoit une délégation écrite du pharmacien gérant. Les préparateurs en pharmacie qui effectuent ces tâches sont placés sous son autorité technique."],
  encart:{type:"info", titre:"Ce que le préparateur y fait", texte:"Il prépare et contrôle sous autorité technique du radiopharmacien, après avoir réussi l'évaluation de sa formation, laquelle comprend un test de remplissage aseptique, et après avoir été habilité par le radiopharmacien."}},

 {t:"notion", kick:"LD4 · les locaux", titre:"Surpression dehors, dépression dedans",
  paras:["Les locaux de préparation des MRP sont des zones d'atmosphère contrôlée dont les caractéristiques sont conformes à celles décrites dans la LD1. Ils sont munis d'un sas d'accès, dont les portes sont asservies et ne peuvent être ouvertes en même temps. Les locaux de préparation et leur sas sont placés en surpression par rapport à l'environnement extérieur, avec un écart d'au moins 10 pascals.",
   "Les enceintes blindées, elles, sont ventilées en dépression pour assurer le confinement et empêcher la dispersion de la contamination radioactive, avec une filtration de l'air extrait adaptée aux gaz ou aérosols présents."],
  encart:{type:"astuce", titre:"La logique à retenir", texte:"On protège le produit en mettant la salle en surpression, et on protège l'opérateur en mettant l'enceinte en dépression. Les deux exigences cohabitent parce qu'elles ne portent pas sur le même volume."},
  img:{f:"ue5-09-enceinte.jpg", leg:"Enceinte blindée de radiopharmacie"}},

 {t:"chiffres", kick:"Le tableau à connaître", titre:"Classes exigées selon le procédé", lignes:[
  {v:"A dans D", l:"transfert en système clos en enceinte blindée : classe D minimum, classe C recommandée"},
  {v:"A dans C", l:"préparation aseptique en système ouvert, enceinte blindée ou hotte à flux unidirectionnel"},
  {v:"A dans C", l:"étape de filtration stérilisante"},
  {v:"A dans C", l:"radiosynthèse automatisée selon un procédé aseptique"},
  {v:"A dans C", l:"radiomarquage d'éléments figurés du sang en système ouvert"}],
  note:"Points 72 à 82 de la LD4. Le radiomarquage d'éléments figurés du sang se fait dans un local uniquement dédié à cette activité, un seul radiomarquage à la fois sur une même zone de travail."},

 {t:"notion", kick:"Le générateur", titre:"Faire venir un radionucléide qui ne voyage pas",
  paras:["Le technétium-99m est le radionucléide de diagnostic le plus utilisé, mais sa période est trop courte pour être transporté. On transporte donc son père, le molybdène-99, fixé sur une colonne : c'est le générateur, que l'on élue pour récupérer le technétium en solution saline.",
   "Le résumé des caractéristiques du produit indique que le molybdène-99 décroît avec une période de 66 heures en générant principalement le technétium-99m, qui décroît avec une période de 6 heures par émission gamma principale d'énergie 140 keV, en technétium-99 de période très longue."],
  encart:{type:"info", titre:"Traçabilité des sources", texte:"Les sources radioactives détenues font l'objet d'un inventaire permettant de justifier en permanence de leur origine et de leur localisation. Les activités commandées sont strictement en rapport avec l'utilisation et avec les activités maximales autorisées."},
  img:{f:"ue5-11-generateur.jpg", leg:"Générateur de technétium-99m"}},

 {t:"notion", kick:"Étiquetage et délais", titre:"L'heure fait partie du médicament",
  paras:["Toute indication d'activité indique la date et l'heure exacte de la mesure. L'étiquetage du blindage de protection comporte au minimum la dénomination de la préparation, son numéro d'enregistrement, l'activité, le volume, la date et l'heure exacte de mesure en fin de préparation, la date et l'heure limite d'utilisation, et le trisecteur normalisé signalant la présence de substances radioactives.",
   "L'étiquetage de la dose destinée au patient ajoute l'identité du patient et l'activité de la dose avec sa date et son heure exacte."],
  encart:{type:"piege", titre:"Le délai à retenir", texte:"La préparation d'une dose à administrer se fait le plus près possible de son heure d'administration. L'heure limite d'utilisation d'une dose à administrer ne doit pas excéder 30 minutes, sauf justification appropriée."}},

 {t:"notion", kick:"Contrôle et libération", titre:"Personne différente, décision du radiopharmacien",
  paras:["Les contrôles de qualité sont réalisés par une personne formée et habilitée, différente de celle qui a préparé le MRP, sauf exception justifiée. La libération est effectuée par le radiopharmacien, et aucune préparation n'est libérée ni délivrée avant qu'il ait certifié qu'elle répond aux spécifications du dossier de préparation.",
   "La taille des lots ne permet pas de suivre les prescriptions de la pharmacopée européenne pour l'essai de stérilité : le radiopharmacien évalue alors le risque associé, en s'appuyant notamment sur la surveillance particulaire et microbiologique des ZAC."],
  encart:{type:"info", titre:"Deux règles propres aux MRP", texte:"Une préparation peut être délivrée avant l'achèvement de tous les contrôles, mais cela ne supprime pas l'obligation d'une décision formellement enregistrée sur la conformité du lot. Toute préparation non conforme est considérée, après recherche des causes, comme un déchet radioactif et traitée comme tel. Sauf indication contraire, l'échantillothèque n'est pas requise."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l'UE5", lignes:[
  {v:"66 h / 6 h", l:"périodes du molybdène-99 et du technétium-99m"},
  {v:"140 keV", l:"énergie d'émission gamma principale du technétium-99m"},
  {v:"30 min", l:"heure limite d'utilisation d'une dose à administrer, sauf justification"},
  {v:"10 Pa", l:"écart minimal de pression entre le local de préparation et son sas"},
  {v:"6 mois", l:"délai sans préparation au-delà duquel la formation théorique est à renouveler"},
  {v:"3 ans", l:"périodicité minimale de renouvellement de la formation des travailleurs suivis"},
  {v:"1 fois/an", l:"requalification des ZAC, essais d'étanchéité et d'intégrité des filtres HEPA"}]},

 {t:"quiz", kick:"Vérification", question:"Un collègue affirme que la limite d'exposition du cristallin est de 150 mSv par an. Que répondez-vous ?",
  options:["C'est exact, cette valeur n'a jamais bougé",
   "C'était exact avant 2018 ; depuis le 1er juillet 2023 la limite est de 20 mSv sur douze mois consécutifs",
   "C'est faux, la limite a toujours été de 20 mSv"],
  bonne:1,
  expl:"Un régime transitoire a fixé 100 mSv cumulés sur cinq ans entre le 1er juillet 2018 et le 30 juin 2023, sans dépasser 50 mSv par an. Depuis le 1er juillet 2023 la limite est de 20 mSv sur douze mois consécutifs, alignée sur celle du corps entier."},

 {t:"quiz", kick:"Vérification", question:"Vous avez préparé une dose de MRP. Qui en réalise le contrôle de qualité ?",
  options:["Vous-même, puisque vous connaissez la préparation",
   "Une personne formée et habilitée, différente de celle qui a préparé, sauf exception justifiée",
   "Le physicien médical, obligatoirement"],
  bonne:1,
  expl:"C'est la règle du point 90 de la LD4, cohérente avec le chapitre 6 des BPP qui exige un contrôle indépendant de l'activité de préparation. Le physicien médical intervient sur les contrôles de qualité de l'activimètre, pas sur la préparation."},

 {t:"quiz", kick:"Vérification", question:"Pourquoi les locaux de préparation des MRP sont-ils en surpression alors que les enceintes blindées sont en dépression ?",
  options:["C'est une incohérence historique du texte",
   "La surpression protège la préparation de la contamination extérieure, la dépression confine la contamination radioactive dans l'enceinte",
   "La dépression sert à accélérer la filtration stérilisante"],
  bonne:1,
  expl:"Les deux exigences portent sur des volumes différents : le local vis-à-vis de l'extérieur, l'enceinte vis-à-vis du local. La LD4 impose la surpression des locaux et de leur sas, et la ventilation en dépression des enceintes blindées."},

 {t:"sources", kick:"Pour aller vérifier", titre:"Sources de cette leçon", liste:[
  {titre:"ANSM, Bonnes pratiques de préparation 2023, ligne directrice LD4", ref:"Préparation de médicaments radiopharmaceutiques : locaux, équipements, personnel, préparation, contrôle et libération", url:"https://ansm.sante.fr/uploads/2023/08/02/20230802-bonnes-pratiques-de-preparation-08-2023.pdf"},
  {titre:"Code du travail, articles R. 4451-6 et suivants", ref:"Valeurs limites d'exposition professionnelle aux rayonnements ionisants", url:"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072050/LEGISCTA000018491123/"},
  {titre:"INRS, Rayonnements ionisants — réglementation et démarche de prévention", ref:"Valeurs limites, régime transitoire du cristallin, zonage, classement des travailleurs, conseiller en radioprotection", url:"https://www.inrs.fr/risques/rayonnements-ionisants/reglementation.html"},
  {titre:"ASNR, modalités de surveillance de l'exposition des travailleurs", ref:"Catégories A et B, dosimétrie individuelle et système SISERI", url:"https://recherche-expertise.asnr.fr/savoir-comprendre/sante/modalites-surveillance-lexposition-travailleurs"},
  {titre:"ANSM, résumé des caractéristiques du produit d'un générateur de technétium", ref:"Périodes du molybdène-99 et du technétium-99m, énergie gamma de 140 keV", url:"https://agence-prd.ansm.sante.fr/php/ecodex/rcp/R0229128.htm"}],
  note:"Textes consultés le 9 août 2026. Les valeurs de dose sont celles du code du travail en vigueur ; vérifiez la date de votre support de cours avant de réviser des chiffres de radioprotection."}
]},

UE6: {titre:"Contrôles des préparations", duree:"14 min", diapos:[
 {t:"intro", kick:"UE6 · pour commencer", titre:"Prouver que ce qu'on a fabriqué est bien ce qu'on croit",
  texte:"Une préparation n'a pas d'autorisation de mise sur le marché. Personne n'a validé sa formule, sa stabilité ou sa pureté avant vous. Le contrôle est donc la seule chose qui sépare une intention thérapeutique d'un médicament réellement conforme. Le chapitre 6 des bonnes pratiques de préparation lui est entièrement consacré."},

 {t:"notion", kick:"La définition", titre:"Mesurer, comparer, décider",
  paras:["Le contrôle de la qualité pharmaceutique consiste à mettre en œuvre des opérations de mesure ou d'examen des caractéristiques des matières premières, des articles de conditionnement, des préparations en cours et des préparations terminées, en comparant les résultats obtenus aux exigences spécifiées.",
   "L'objectif est double : déterminer si chaque caractéristique est conforme, et prendre pour chacun une décision d'acceptation ou de refus. Rien n'est libéré tant que la qualité n'a pas été jugée satisfaisante."],

 {t:"erreur", q:"Un préparateur établit le bilan médicamenteux d'une patiente uniquement à partir de l'ordonnance apportée par la famille, ne note pas les dosages, et classe d'emblée en erreur médicamenteuse un antihypertenseur absent de la prescription d'entrée sans en parler au médecin. Relevez les non-conformités.",
  a:"Trois écarts. Le recueil doit croiser plusieurs sources concordantes, au moins trois en pratique : patient, entourage, médecin traitant, officine, dossier médical. Le bilan médicamenteux optimisé doit comporter pour chaque médicament le nom, le dosage, la forme galénique et la posologie : sans dosage, il est inexploitable. Enfin, le caractère intentionnel ou non d'une divergence est précisé par le prescripteur : on ne peut pas qualifier soi-même une divergence d'erreur médicamenteuse avant cet échange.",

  s:"HAS, guide et mode opératoire de la conciliation ; SFPC, fiche mémo."},

 {t:"situation", q:"Vous conciliez à la sortie d'un patient âgé polymédiqué. Quels documents produisez-vous et à qui sont-ils utiles ?",
  a:"On actualise le bilan médicamenteux et on renseigne le volet médicamenteux de la lettre de liaison à la sortie, structuré depuis mars 2018 sous forme d'un tableau à six colonnes, faisant figurer le bilan et la liste des médicaments à prendre : poursuivis, modifiés, ajoutés. Ces documents sont utiles au patient, au médecin traitant et au pharmacien d'officine, qui reprennent le traitement sans avoir à reconstituer l'historique. La fiche de conciliation est archivée dans le dossier médical.",
  m:["lettre de liaison","six colonnes","médecin traitant","officine","dossier"],
  s:"HAS, volet médicamenteux de la lettre de liaison à la sortie ; mode opératoire de la conciliation."},

 {t:"ouverte", q:"Pourquoi le préparateur est-il particulièrement bien placé pour la recherche active d'informations ?",
  a:"Parce que cette étape est un travail d'enquête méthodique : interroger le patient et son entourage, contacter le médecin traitant, la pharmacie d'officine ou l'établissement d'origine, consulter le dossier médical, puis croiser au moins trois sources concordantes. Des guides régionaux de conciliation sont spécifiquement destinés aux préparateurs, et le référentiel du diplôme place cette activité dans leur champ.",
  m:["enquête","entourage","officine","croiser","sources"],
  s:"Guide pratique de la conciliation à l'intention des préparateurs en pharmacie, OMéDIT Grand Est."},

 {t:"vf", q:"Le bilan médicamenteux établi à l'admission est réutilisé lors de la conciliation de transfert ou de sortie.",

 {t:"cloze", q:"Dispenser ou coordonner l'ETP suppose une formation d'une durée minimale de _____ heures d'enseignements théoriques et pratiques.",

 {t:"qcm", q:"Depuis le 1er janvier 2021, quelle formalité un programme d'ETP doit-il accomplir auprès de l'ARS ?",

 {t:"erreur", q:"Un préparateur explique à une patiente âgée le montage d'un stylo injecteur, parle trois minutes sans interruption, conclut par « c'est bon pour vous ? », obtient un hochement de tête et passe au patient suivant. Relevez ce qui ne va pas.",
  a:"La compréhension de l'interlocuteur doit être vérifiée, et une reformulation réalisée le cas échéant : c'est un critère d'évaluation du référentiel du diplôme, pas une politesse. Un hochement de tête ne vaut pas vérification. Il fallait faire reformuler la patiente, ou mieux lui faire exécuter le geste devant soi, puis tracer l'action dans le dossier et signaler à l'équipe pluriprofessionnelle si un besoin d'accompagnement plus large apparaît.",
  m:["compréhension","reformulation","geste","tracer"],

 {t:"situation", q:"Un patient diabétique de type 2 sait faire ses injections mais ne sort plus de chez lui de peur d'une hypoglycémie. Quelle est votre analyse et quelle suite donnez-vous ?",

  s:"HAS, compétences visées par l'ETP ; décret n° 2010-904 du 2 août 2010."},

 {t:"ouverte", q:"Quelle est la différence entre un programme d'ETP et des actions d'accompagnement ?",
  a:"Le programme d'ETP est un ensemble structuré, conforme au cahier des charges national et déclaré à l'ARS, proposé au patient par le médecin prescripteur et décliné en programme personnalisé. Les actions d'accompagnement consistent en une assistance et un soutien apportés au malade ou à son entourage dans la prise en charge de la maladie ; elles font partie de l'ETP mais ne se confondent pas avec un programme structuré.",
  m:["structuré","cahier des charges","déclaré","soutien","entourage"],
  s:"Code de la santé publique, articles L. 1161-1 à L. 1161-3."},

 {t:"qcmMulti", q:"Quelles professions peuvent intervenir dans un programme d'ETP ?",

 {t:"vf", q:"Le diagnostic éducatif est réalisé une fois pour toutes au début du programme.",

 {t:"qcm", q:"Une préparation présente un critère relevant de la catégorie 2 et un critère relevant de la catégorie 3. Comment la classez-vous ?",

 {t:"erreur", q:"Un préparateur commence un lot de gélules. Il pèse la substance active, est appelé au téléphone dix minutes, revient, termine la préparation puis enchaîne immédiatement sur une seconde préparation différente sur le même plan de travail sans autre formalité. Relevez les non-conformités et l'action corrective attendue.",
  a:"Trois écarts : l'opération d'un lot doit être confiée préférentiellement à la même personne sans être interrompue avant la réalisation complète ; une seule préparation à la fois est réalisée sur une même zone de travail ; un vide de ligne doit être effectué avant le nouveau lot pour éliminer tout risque de contamination croisée. Action corrective : tracer l'interruption dans le relevé d'anomalies du dossier de lot, réaliser le vide de ligne et le nettoyage de la zone avant toute nouvelle préparation.",
  m:["interruption","une seule préparation","vide de ligne","contamination croisée","dossier de lot"],
  s:"BPP 2023, point 5.34 et note de bas de page sur le vide de ligne au point 5.35."},

 {t:"situation", q:"Le pharmacien vous demande de préparer une poche de cytotoxique alors que l'alarme du système de traitement d'air de la ZAC s'est déclenchée il y a dix minutes. Que faites-vous et sur quoi vous appuyez-vous ?",
  a:"On ne démarre pas. L'alimentation en air filtré doit être maintenue en toutes circonstances pour garantir la pression positive, et toute déficience détectée par l'alarme est portée sans délai à la connaissance du pharmacien désigné comme responsable des préparations. Les vérifications de conformité des contrôles d'environnement sont réalisées avant utilisation de la zone. L'incident est tracé, la conformité de la ZAC rétablie et vérifiée avant reprise.",
  m:["alarme","pression positive","pharmacien désigné","contrôles d'environnement","tracé"],
  s:"BPP 2023, LD1 points 51 et 52, et point 5.36."},

 {t:"ouverte", q:"Quelle est la différence entre le dossier de préparation et le dossier de lot ?",
  a:"Le dossier de préparation regroupe en trois parties la validité technico-réglementaire, la description du procédé et des spécifications, et la description des contrôles ; il sert de matrice et peut couvrir plusieurs préparations de même composition qualitative. Le dossier de lot concerne un lot précis et comporte cinq parties : préparation, conditionnement, contrôle, libération pharmaceutique, gestion des anomalies ou retours et réclamations.",
  m:["trois parties","matrice","lot","cinq parties","libération"],
  s:"BPP 2023, points 4.30, 4.31, 4.36 et 4.38."},

 {t:"qcm", q:"Combien de temps le livre-registre des préparations est-il conservé ?",
  o:["1 an","5 ans","10 ans","Selon le règlement interne de l'établissement"], r:2,
  c:"Le dossier de préparation se conserve 5 ans après la péremption du dernier lot ; le dossier de lot 1 an au moins, ou 10 ans s'il sert à la traçabilité du livre-registre.",

function itemsExos(ue){
  return (EXOS[ue] || []).map((x, i) => {
    const b = {id:"px-" + ue + "-" + i, ueId:ue, type:x.t, origine:"prep",
      source:x.s || "", correction:x.c || ""};
    if(x.t === "qcm") return Object.assign(b, {question:x.q, options:x.o, reponse:x.r});
    if(x.t === "qcmMulti") return Object.assign(b, {question:x.q, options:x.o, reponses:x.r});
    if(x.t === "vf") return Object.assign(b, {question:x.q, reponse:x.r});
    if(x.t === "cloze") return Object.assign(b, {question:x.q, reponse:x.r});
    if(x.t === "paires") return Object.assign(b, {question:x.q, paires:x.p});
    if(x.t === "ordre") return Object.assign(b, {question:x.q, etapes:x.e});
    return Object.assign(b, {question:x.q, attendu:x.a || "", motsCles:x.m || []});
  });
}
function statsExos(ue){
  const l = itemsExos(ue);
  const sus = l.filter(i => S.progres[i.id] && S.progres[i.id].boite === 3).length;
  return {total:l.length, sus};
}
const UES_EXOS = Object.keys(EXOS);

function progLecon(ue){
  if(!S.prep[ue]) S.prep[ue] = {index:0, termine:false, quiz:{}};
  return S.prep[ue];
}
function nbDiapos(ue){ return LECONS[ue] ? LECONS[ue].diapos.length : 0; }
function leconsFaites(){ return UES_PRETES.filter(u => S.prep[u] && S.prep[u].termine).length; }

function largeurVoulue(){
  const v = S.reglages.affichage || "auto";
  if(v === "large") return true;
  if(v === "mobile") return false;
  return window.innerWidth >= 900;
}
function sombreVoulu(){
  const t = S.reglages.theme || "auto";
  if(t === "sombre") return true;
  if(t === "clair") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function appliquerAffichage(){
  const b = document.body;
  b.classList.toggle("vueLarge", largeurVoulue());
  const noir = sombreVoulu();
  b.classList.toggle("sombre", noir);
  b.classList.toggle("txtL", S.reglages.texte === "grand");
  b.classList.toggle("txtXL", S.reglages.texte === "tresGrand");
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", noir ? "#0F1A17" : "#F1F6F2");
}
function aller(tab, ecran){
  ui.tab = tab; ui.ecran = ecran || "accueil"; ui.message = null;
  rendre(); window.scrollTo(0,0);
}
function rendre(){
  appliquerAffichage();
  $("#nav").innerHTML = `<div class="in">
    <button data-act="nav" data-tab="prep" class="${ui.tab==="prep"?"act":""}"><span class="ic">◈</span>Préparation</button>
    <button data-act="nav" data-tab="rev" class="${ui.tab==="rev"?"act":""}"><span class="ic">◇</span>Révision</button>
  </div>`;
  const ecrans = {
    "prep/accueil":ecranPrep, "prep/lecon":ecranLecon,
    "rev/accueil":ecranRev, "rev/import":ecranImport, "rev/fiches":ecranFiches, "rev/fiche":ecranFiche,
    "rev/reviser":ecranReviser, "rev/session":ecranSession, "rev/examen":ecranExamen,
    "rev/planning":ecranPlanning, "rev/stats":ecranStats, "rev/recherche":ecranRecherche,
    "reglages":ecranReglages
  };
  const f = ecrans[ui.ecran === "reglages" ? "reglages" : ui.tab + "/" + ui.ecran] || ecranPrep;
  let h = "";
  if(ui.ecran !== "lecon" && ui.ecran !== "session"){
    if(ui.message) h += `<div class="ecran" style="padding-bottom:0"><div class="avis ${ui.message.type||"info"}">
      <b>${esc(ui.message.titre)}</b>${esc(ui.message.txt)}</div></div>`;
    if(!stockageOk) h += `<div class="ecran" style="padding-bottom:0"><div class="avis"><b>Rien ne sera conservé</b>
      Le navigateur bloque l'enregistrement local. Ouvrez le fichier depuis votre appareil pour garder votre progression.</div></div>`;
  }
  $("#app").innerHTML = h + f();
}

function joursRentree(){

}

   20. ONGLET PRÉPARATION
   ========================================================================= */
function ecranPrep(){
  const j = joursRentree();
  const faites = leconsFaites();
  let h = `<div class="ecran">` + entete("Préparation",
    "Voir l'essentiel de chaque UE avant le premier cours", j !== null ? "J–" + j : null);
  h += `<div class="progLigne"><div class="jauge"><i style="width:${UES_PRETES.length ? Math.round(faites/UES_PRETES.length*100) : 0}%"></i></div>
    <span>${faites}/${UES_PRETES.length} leçons</span></div>`;

  for(let d = 1; d <= 5; d++){
    const ues = UES.filter(u => u.dom === d);
    const ects = ues.reduce((s,u) => s + u.ects, 0);
    h += `<div class="bloc"><div class="bloc-t"><span class="point" style="background:${DOMAINES[d].coul}"></span>
      <span class="bloc-nom">${esc(DOMAINES[d].nom)}</span><span class="bloc-meta">${ects} ECTS</span></div>
      <div class="alv">`;
    ues.forEach(u => {
      const pret = !!LECONS[u.id];
      const p = pret ? progLecon(u.id) : null;
      let cl = "a vide", etat = "bientôt";
      if(pret){
        if(p.termine){ cl = "a fait"; etat = "revoir"; }
        else if(p.index > 0){ cl = "a dispo"; etat = "reprendre"; }
        else { cl = "a dispo"; etat = nbDiapos(u.id) + " écrans"; }
      }
      h += `<button class="${cl}" ${pret ? `data-act="ouvrir-lecon" data-ue="${u.id}"` : "disabled"}>
        <b>${u.id}</b><small>${etat}</small></button>`;
    });
    h += `</div></div>`;
  }
  const suivante = UES_PRETES.find(u => !S.prep[u] || !S.prep[u].termine);
  h += suivante
    ? `<button class="cta" data-act="ouvrir-lecon" data-ue="${suivante}">${S.prep[suivante] && S.prep[suivante].index > 0 ? "Reprendre" : "Commencer"} ${suivante} · ${esc(tronquer(LECONS[suivante].titre, 34))}</button>`
    : `<div class="avis info"><b>Les trois premières leçons sont faites</b>Les UE suivantes s'ajouteront au fil des mises à jour. En attendant, l'onglet Révision travaille sur vos propres cours.</div>`;
  if(UES_EXOS.length){
    h += `<p class="kick" style="margin-top:20px">Entraînement</p>
      <p class="sousTitre">Exercices d'application, corrigés et rattachés au texte source. Ils ne remplacent pas la leçon : faites-la d'abord.</p>`;
    UES_EXOS.forEach(u => {
      const st = statsExos(u), ue = UE(u), d = ue ? ue.dom : 1;
      const err = itemsExos(u).filter(i => { const p = S.progres[i.id]; return p && p.ko > 0 && p.boite === 1; }).length;
      h += `<div class="bloc"><div class="bloc-t"><span class="point" style="background:${DOMAINES[d].coul}"></span>
        <span class="bloc-nom">${u} · ${esc(tronquer(ue ? ue.nom : "", 28))}</span>
        <span class="bloc-meta">${st.sus}/${st.total} acquis</span></div>
        <div class="jauge"><i style="width:${st.total ? Math.round(st.sus / st.total * 100) : 0}%"></i></div>
        <div class="rang" style="margin-bottom:0">
          <button class="btn plein mini" data-act="exos" data-ue="${u}">Tout (${st.total})</button>
          <button class="btn mini" data-act="exos" data-ue="${u}" data-mode="neufs">Jamais vus</button>
          <button class="btn mini" data-act="exos" data-ue="${u}" data-mode="erreurs"${err ? "" : " disabled"}>Mes erreurs${err ? " (" + err + ")" : ""}</button>
        </div></div>`;
    });
  }
  h += `<div class="avis" style="margin-top:14px"><b>Ce que sont ces leçons</b>
    Une mise en route, pas un cours. Chaque leçon finit par ses sources et la date de vérification : en cas d'écart avec le cours de votre centre, c'est le cours qui fait foi.</div>`;
  h += legendeUE();
  return h + `</div>`;
}

function ecranLecon(){
  const L = LECONS[ui.ue];
  if(!L){ ui.ecran = "accueil"; return ecranPrep(); }
  const p = progLecon(ui.ue);
  const i = Math.min(p.index, L.diapos.length - 1);
  const d = L.diapos[i];
  let h = `<div class="lecon"><div class="lecon-haut">
    <button class="fermer" data-act="fermer-lecon" aria-label="Fermer">×</button>
    <div class="pts">${L.diapos.map((_,k) => `<span class="${k <= i ? "f" : ""}"></span>`).join("")}</div>
    <span class="src">${i+1}/${L.diapos.length}</span></div><div class="diapo">`;

  h += `<p class="kick">${esc(d.kick || ui.ue)}</p>`;
  if(d.t === "intro"){
    h += `<h2>${esc(d.titre)}</h2><p>${esc(d.texte)}</p>`;
  } else if(d.t === "notion"){
    h += `<h3>${esc(d.titre)}</h3>` + d.paras.map(x => `<p>${esc(x)}</p>`).join("");
    if(d.encart) h += encartHtml(d.encart);
  } else if(d.t === "vocab"){
    h += `<h3>${esc(d.titre)}</h3><ul class="vocab">` +
      d.mots.map(m => `<li><b>${esc(m.m)}</b><span>${esc(m.d)}</span></li>`).join("") + `</ul>`;
  } else if(d.t === "etapes"){
    h += `<h3>${esc(d.titre)}</h3><ol class="etapes">` +
      d.etapes.map(e => `<li>${esc(e)}</li>`).join("") + `</ol>`;
    if(d.note) h += encartHtml({type:"info", titre:"Précision", texte:d.note});
  } else if(d.t === "chiffres"){
    h += `<h3>${esc(d.titre)}</h3><ul class="chiffres">` +
      d.lignes.map(l => `<li><b>${esc(l.v)}</b><span>${esc(l.l)}</span></li>`).join("") + `</ul>`;
    if(d.note) h += `<p style="font-size:13.5px;color:var(--encre2);margin-top:10px">${esc(d.note)}</p>`;
  } else if(d.t === "encart"){
    h += `<h3>${esc(d.titre)}</h3>` + encartHtml({type:d.type, titre:"", texte:d.texte});
  } else if(d.t === "quiz"){
    h += `<h3>${esc(d.question)}</h3>`;
    d.options.forEach((o,k) => {
      let cl = "opt";
      if(ui.quizRep !== null){
        if(k === d.bonne) cl = "opt juste";
        else if(k === ui.quizRep) cl = "opt faux";
      }
      h += `<button class="${cl}" data-act="quiz" data-k="${k}"${ui.quizRep !== null ? " disabled" : ""}>${esc(o)}</button>`;
    });
    if(ui.quizRep !== null){
      const bon = ui.quizRep === d.bonne;
      h += `<div class="verdict ${bon ? "ok" : "ko"}"><b>${bon ? "C'est ça." : "Pas tout à fait."}</b>${esc(d.expl)}</div>`;
    }
  } else if(d.t === "sources"){
    h += `<h3>${esc(d.titre)}</h3><ul class="sources">` + d.liste.map(s =>
      `<li><b>${esc(s.titre)}</b>${esc(s.ref)}<br><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(tronquer(s.url,58))}</a></li>`).join("") + `</ul>`;
    if(d.note) h += `<p style="font-size:13.5px;color:var(--encre2);margin-top:12px">${esc(d.note)}</p>`;
  }
  if(d.img) h += illus(d.img);
  h += `</div>`;
  const dernier = i === L.diapos.length - 1;
  const bloque = d.t === "quiz" && ui.quizRep === null;
  h += `<div style="display:flex;gap:9px;align-items:center">
    ${i > 0 ? `<button class="btn" data-act="diapo-prec">Retour</button>` : ""}
    <button class="cta" style="flex:1;margin-top:0" data-act="diapo-suiv"${bloque ? " disabled" : ""}>
      ${bloque ? "Choisissez une réponse" : (dernier ? "Terminer la leçon" : "Continuer")}</button></div>`;
  return h + `</div>`;
}

const DELAIS_TXT = "Réussi, l'exercice monte d'une boîte : revu le jour même, puis à deux jours, puis à une semaine.";
let minuteur = null;
function mmss(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }

function corrigerItem(it, choix, assoc, ordre){
  switch(it.type){
    case "qcm": return choix === it.reponse;
    case "qcmMulti": { const a=(choix||[]).slice().sort().join(","), b=(it.reponses||[]).slice().sort().join(",");
      return a === b && a !== ""; }
    case "vf": return choix === it.reponse;
    case "cloze": return normaliser(choix) === normaliser(it.reponse) && normaliser(choix) !== "";
    case "ordre": return (ordre||[]).join(",") === it.etapes.map((_,i)=>i).join(",");
    case "paires": return it.paires.every((p,i) => String((assoc||{})[i]) === String(i));
    default: return null;
  }
}
function motsTrouves(rep, cles){ const n = " " + normaliser(rep) + " ";
  return (cles||[]).map(c => ({mot:c, ok:n.includes(normaliser(c))})); }
function autoNoteExamen(it, rep){ const m = motsTrouves(rep||"", it.motsCles);
  return m.length ? m.filter(x=>x.ok).length / m.length >= .5 : false; }

function ouvrirSession(liste, mode, limite, retour){
  if(!liste.length){ ui.message = {titre:"Rien ici", txt:"Aucun exercice ne correspond à ce filtre."}; rendre(); return; }
  ui.session = {liste:melanger(liste), i:0, mode, limite:limite||null, debut:Date.now(),

/* =========================================================================
   24. EXAMEN BLANC, PLANNING, RÉGLAGES
   ========================================================================= */
function composerExamen(nb){
  const dispo = tousItems().filter(i => i.type !== "flash");
  if(dispo.length < 5) return [];
  const parUE = {}; dispo.forEach(i => (parUE[i.ueId] = parUE[i.ueId] || []).push(i));
  const ids = Object.keys(parUE);
  const pt = ids.reduce((s,id) => s + (UE(id)?UE(id).ects:1), 0);
  let out = [];
  ids.forEach(id => { const part = Math.max(1, Math.round(nb * (UE(id)?UE(id).ects:1) / pt));
    out = out.concat(melanger(parUE[id]).slice(0, part)); });
  return melanger(out).slice(0, nb);
}
function calculerExamen(s){
  const parUE = {};
  s.resultats.forEach(r => { const e = parUE[r.ueId] = parUE[r.ueId] || {total:0,bons:0};
    e.total++; if(r.juste) e.bons++; });
  const ues = Object.keys(parUE).map(id => { const u = UE(id), e = parUE[id];
    return {id, nom:u?u.nom:id, dom:u?u.dom:0, ects:u?u.ects:0, total:e.total, bons:e.bons,
      note: Math.round(e.bons/e.total*200)/10}; });
  const domaines = [1,2,3,4,5].map(d => {
    const l = ues.filter(x => x.dom === d);
    if(!l.length) return {dom:d, presente:false};
    const p = l.reduce((s2,x) => s2 + x.ects, 0);
    const note = Math.round(l.reduce((s2,x) => s2 + x.note*x.ects, 0)/p*10)/10;
    return {dom:d, presente:true, note, valide:note >= 10, bloquantes:l.filter(x => x.note < 8).map(x => x.id)};
  });
  return {date:new Date().toISOString(), duree:Math.round((Date.now()-s.debut)/1000),
    questions:s.resultats.length, bons:s.resultats.filter(r=>r.juste).length, ues, domaines};
}
function tableauResultats(r){
  let h = `<table class="tableau"><thead><tr><th>UE</th><th>Score</th><th>Note</th></tr></thead><tbody>`;
  r.ues.forEach(u => h += `<tr><td>${u.id}</td><td class="n">${u.bons}/${u.total}</td>
    <td class="n" style="color:${u.note<8?"var(--rouge)":(u.note<10?"var(--or-fonce)":"var(--menthe-fonce)")}">${u.note.toFixed(1)}</td></tr>`);
  h += `</tbody></table>`;
  r.domaines.filter(d => d.presente).forEach(d => {
    h += `<div class="bloc" style="margin-top:10px"><div class="bloc-t">
      <span class="point" style="background:${DOMAINES[d.dom].coul}"></span>
      <span class="bloc-nom">${esc(DOMAINES[d.dom].nom)}</span>
      <span class="bloc-meta" style="color:${d.valide?"var(--menthe-fonce)":"var(--rouge)"}">${d.note.toFixed(1)}/20</span></div>
      <div style="font-size:13px;color:var(--encre2)">${d.valide?"Domaine validé dans cette simulation":"Sous la barre des 10/20"}${d.bloquantes.length?" · non compensable : "+d.bloquantes.join(", "):""}</div></div>`;
  });
  return h + `<p style="font-size:12.5px;color:var(--encre3);margin-top:10px">Simulation de la règle du référentiel : 10/20 par domaine, compensation entre UE d'un même domaine au-dessus de 8/20. Elle ne porte que sur vos propres exercices.</p>`;
}
function ecranExamen(){
  const dispo = tousItems().filter(i => i.type !== "flash").length;
  let h = `<div class="ecran">` + retour("accueil", "Examen blanc");
  if(dispo < 10){

/* =========================================================================
   24 bis. PLANNING PAR UNITÉ D'ENSEIGNEMENT
   Une date par UE, plusieurs UE pouvant partager la même date.
   ========================================================================= */
const PASSAGES = [[14,"Passage complet"],[7,"Reprise"],[3,"Reprise ciblée"],[1,"Dernière relecture"]];
const NOMS_JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const SEC_PAR_EXO = 45;

function datesUE(){ if(!S.reglages.datesUE) S.reglages.datesUE = {}; return S.reglages.datesUE; }
function dateUE(id){ return datesUE()[id] || S.reglages.dateExamen || ""; }
function joursAvant(id){ return joursJusqua(dateUE(id)); }
function itemsUE(id){ return tousItems().filter(i => i.ueId === id).concat(itemsExos(id)); }
function bilanUE(id){
  const l = itemsUE(id);
  let sus = 0, faibles = 0, vus = 0;
  l.forEach(i => { const p = S.progres[i.id]; if(!p || !p.vus) return;
    vus++; if(p.boite === 3) sus++; if(p.boite === 1 && p.ko > 0) faibles++; });
  return {total:l.length, vus, sus, faibles, part: l.length ? Math.round(sus / l.length * 100) : 0};
}
function uesUrgentes(){
  return UES.filter(u => { const j = joursAvant(u.id); return j !== null && j >= 0 && j <= 3 && bilanUE(u.id).total; })
    .map(u => u.id);
}
function prioriteUE(u){
  const b = bilanUE(u.id);
  if(!b.total) return null;
  const j = joursAvant(u.id);
  const urgence = j === null ? 0.30 : (j <= 0 ? 1 : 1 / (1 + j / 7));
  const lacune = 1 - b.sus / b.total;
  const poids = u.ects / 4;
  const bonus = j === null ? 0 : (j <= 3 ? 30 : (j <= 7 ? 15 : 0));
  const score = Math.min(100, Math.round((urgence * 0.50 + lacune * 0.35 + poids * 0.15) * 100) + bonus);
  const motifs = [];
  if(j !== null && j >= 0 && j <= 3) motifs.push("dernière ligne droite");
  if(j !== null) motifs.push(j <= 0 ? "épreuve passée ou aujourd'hui" : j + " jour" + (j > 1 ? "s" : ""));
  motifs.push(u.ects + " ECTS");
  motifs.push(b.part + " % acquis");
  if(b.faibles) motifs.push(b.faibles + " en boîte 1");
  return {score, jours:j, bilan:b, motifs};
}
function classementUE(){
  return UES.map(u => ({u, p:prioriteUE(u)})).filter(x => x.p)
    .sort((a,b) => b.p.score - a.p.score);
}
function prochainesEcheances(n){
  return UES.map(u => ({u, j:joursAvant(u.id), d:dateUE(u.id)}))
    .filter(x => x.j !== null && x.j >= 0)
    .sort((a,b) => a.j - b.j).slice(0, n || 3);
}
function itemsDusTous(){
  const t = Date.now(), urg = new Set(uesUrgentes());
  const prep = UES_EXOS.flatMap(u => itemsExos(u)).filter(i => {
    if(urg.has(i.ueId)) return true;
    const p = S.progres[i.id]; return !p || p.prochain <= t;
  });
  return itemsDus().concat(prep);
}
function planJour(){
  const budget = Math.max(5, Number(S.reglages.minutesJour) || 45);
  const off = (S.reglages.joursOff || []).map(Number);
  const repos = off.includes(new Date().getDay());
  const cap = Math.max(1, Math.floor(budget * 60 / SEC_PAR_EXO));
  const urg = new Set(uesUrgentes());
  const rang = {};
  classementUE().forEach(x => rang[x.u.id] = x.p.score);
  const tri = itemsDusTous().slice().sort((a,b) => {
    const ua = urg.has(a.ueId) ? 1 : 0, ub = urg.has(b.ueId) ? 1 : 0;
    if(ua !== ub) return ub - ua;
    return (rang[b.ueId] || 0) - (rang[a.ueId] || 0);
  });
  const liste = tri.slice(0, cap);
  const parUE = {};
  liste.forEach(i => parUE[i.ueId] = (parUE[i.ueId] || 0) + 1);
  return {repos, cap, budget, liste, total:tri.length, parUE, urgentes:[...urg]};
}
function passagesPrevus(){
  const out = [];
  UES.forEach(u => {
    const d = dateUE(u.id); if(!d) return;
    if(!bilanUE(u.id).total) return;
    const base = new Date(d).getTime();
    if(isNaN(base)) return;
    PASSAGES.forEach(([k, lib]) => {
      const t = base - k * JOUR;
      if(t < Date.now() - JOUR) return;
      out.push({t, ue:u.id, lib, reste:k});
    });
    if(base >= Date.now()) out.push({t:base, ue:u.id, lib:"Épreuve", reste:0});
  });
  return out.sort((a,b) => a.t - b.t).slice(0, 16);
}

        txt:"Ni cours importé ni banque d'exercices pour cette unité. C'est le trou le plus coûteux de votre planning."});

  Object.keys(parDate).sort().forEach(d => {

  });
  return a;
}

function chercher(q){
  const n = normaliser(q); if(n.length < 3) return [];
  const out = [];
  const test = (t) => normaliser(t || "").includes(n);
  Object.keys(LECONS).forEach(ue => {
    LECONS[ue].diapos.forEach((d, i) => {
      const bloc = [d.titre, d.texte, (d.paras||[]).join(" "), (d.mots||[]).map(m => m.m + " " + m.d).join(" "),
        (d.etapes||[]).join(" "), (d.lignes||[]).map(l => l.v + " " + l.l).join(" "),
        d.encart ? d.encart.texte : "", d.question || "", d.note || ""].join(" ");
      if(test(bloc)) out.push({ou:"Leçon " + ue, titre:d.titre || d.question || ("Écran " + (i+1)),
        extrait:tronquer(bloc.replace(/\s+/g, " "), 150), act:"lecon", ue, index:i});
    });
  });
  S.cours.forEach(c => {
    const f = c.fiche;
    const bloc = [f.resume, (f.definitions||[]).map(x => x.terme + " " + x.def).join(" "),
      (f.points||[]).map(x => x.txt).join(" "), (f.chiffres||[]).map(x => x.txt).join(" "),
      (f.normes||[]).map(x => x.txt).join(" "), (f.pieges||[]).map(x => x.txt).join(" ")].join(" ");
    if(test(c.titre) || test(bloc)) out.push({ou:"Fiche " + (c.ueId || ""), titre:c.titre,
      extrait:tronquer(bloc.replace(/\s+/g, " "), 150), act:"fiche", id:c.id});
  });
  UES_EXOS.forEach(ue => {
    itemsExos(ue).forEach(i => {
      if(test(i.question) || test(i.source)) out.push({ou:"Exercice " + ue, titre:tronquer(i.question, 70),
        extrait:tronquer(i.source, 140), act:"exos", ue});
    });
  });
  return out.slice(0, 40);
}
