const DELAIS_TXT = "Réussi, l'exercice monte d'une boîte : revu le jour même, puis à deux jours, puis à une semaine.";
let minuteur = null;
function mmss(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }

function corrigerItem(it, choix, assoc, ordre){
  switch(it.type){
    case "qcm": case "choix": return choix === it.reponse;
    case "qcmMulti": { const a=(choix||[]).slice().sort().join(","), b=(it.reponses||[]).slice().sort().join(",");
      return a === b && a !== ""; }
    case "vf": return choix === it.reponse;
    case "cloze": return normaliser(choix) === normaliser(it.reponse) && normaliser(choix) !== "";
    case "ordre": return (ordre||[]).join(",") === it.etapes.map((_,i)=>i).join(",");
    case "paires": return it.paires.every((p,i) => String((assoc||{})[i]) === String(i));
    case "classer": return (it.elements||[]).every((e,i) => String((assoc||{})[i]) === String(e.col));
    default: return null;
  }
}
function motsTrouves(rep, cles){ const n = " " + normaliser(rep) + " ";
  return (cles||[]).map(c => ({mot:c, ok:n.includes(normaliser(c))})); }
function autoNoteExamen(it, rep){ const m = motsTrouves(rep||"", it.motsCles);
  return m.length ? m.filter(x=>x.ok).length / m.length >= .5 : false; }

/* Martelage : un exercice raté revient dans la même session jusqu'à deux réussites
   d'affilée, avec un plafond de quatre passages. Seul le premier passage compte pour
   les boîtes de Leitner : les tours suivants sont de l'entraînement, pas de l'évaluation. */
const MARTEL_MAX = 4;
function marteler(it, juste){
  const s = ui.session;
  if(!s || S.reglages.martelage === false) return;
  if(s.mode === "examen" || s.mode === "sprint") return;
  if(juste === null || juste === undefined) return;
  const m = s.martel[it.id] || (s.martel[it.id] = {tours:0, suite:0, actif:false});
  m.tours++;
  if(juste) m.suite++; else { m.suite = 0; m.actif = true; }
  if(!m.actif || m.suite >= 2 || m.tours >= MARTEL_MAX) return;
  const pos = Math.min(s.liste.length, s.i + 3);
  s.liste.splice(pos, 0, Object.assign({}, it, {reprise:true, tour:m.tours + 1}));
  s.reprises++;
}
function enregistrer(it, juste){
  const s = ui.session;
  if(!it.reprise){
    noterJournal(estPrep(it.id) ? "prep" : "rev", juste);
    majProg(it.id, juste, s.sur);
    s.resultats.push({id:it.id, ueId:it.ueId, juste:!!juste});
  }
  marteler(it, juste);
}

/* Rotation : sur un gros stock, une session n'en présente qu'une portion, en
   commençant par ce qui a été vu le moins souvent et le plus anciennement.
   Sans cela, les mêmes exercices reviennent séance après séance. */
const PORTION = 20;
function portionner(liste){
  if(liste.length <= PORTION) return liste;
  const cle = i => { const p = S.progres[i.id];
    return [p ? p.vus : 0, p ? p.dernier : 0]; };
  const tri = liste.slice().sort((a, b) => {
    const ca = cle(a), cb = cle(b);
    return ca[0] - cb[0] || ca[1] - cb[1];
  });
  return tri.slice(0, PORTION);
}

function ouvrirSession(liste, mode, limite, retour){
  if(!liste.length){ ui.message = {titre:"Rien ici", txt:"Aucun exercice ne correspond à ce filtre."}; rendre(); return; }
  const stock = liste.length;
  if(mode !== "examen" && mode !== "sprint") liste = portionner(liste);
  ui.session = {liste:melanger(liste), i:0, mode, limite:limite||null, debut:Date.now(),
    etat:"q", choix:null, sur:null, ordre:[], assoc:{}, resultats:[], melangeD:null, retour:retour||null,
    martel:{}, reprises:0, stock:stock};
  if(mode === "sprint") ui.session.liste = ui.session.liste.slice(0,10);
  preparerQuestion();
  ui.ecran = "session"; ui.tab = retour ? retour.tab : "rev"; rendre(); lancerMinuteur();
}
function preparerQuestion(){
  const s = ui.session, it = s.liste[s.i];
  s.etat = "q"; s.choix = it.type === "qcmMulti" ? [] : null; s.sur = null; s.assoc = {}; s.melangeD = null;
  s.correction = null; s.correctionEnCours = false;
  s.ordre = it.type === "ordre" ? melanger(it.etapes.map((_,i)=>i)) : [];
}
function lancerMinuteur(){
  clearInterval(minuteur);
  if(!ui.session || (ui.session.mode !== "sprint" && ui.session.mode !== "examen")) return;
  minuteur = setInterval(() => {
    const el = document.getElementById("chrono");
    if(!el || !ui.session){ clearInterval(minuteur); return; }
    const e = Math.floor((Date.now() - ui.session.debut)/1000);
    if(ui.session.limite){ const r = ui.session.limite - e;
      if(r <= 0){ clearInterval(minuteur); terminerSession(); return; }
      el.textContent = mmss(r); } else el.textContent = mmss(e);
  }, 1000);
}
function ecranReviser(){
  let h = `<div class="ecran">` + retour("accueil", "Réviser");
  if(!tousItems().length) return h + `<div class="vide"><div class="em">◇</div><h3>Aucun exercice</h3>
    <p>Ils naissent des cours que vous importez.</p></div>
    <button class="cta" data-act="ecran" data-e="import">Importer un cours</button></div>`;
  const dus = itemsDus().length, err = carnetErreurs().length, conf = erreursConfiantes().length;
  h += `<p class="sousTitre">${DELAIS_TXT}</p>`;
  h += carteSession("↻", "Révision du jour", dus + " à échéance", "dus", dus);
  const sm = statsFamille("memo"), sfc = statsFamille("comp");
  h += `<p class="kick" style="margin-top:18px">Par famille</p>`;
  h += carteSession("▣", "Mémoriser", libelleAvancement(sm), "memo", sm.total);
  h += carteSession("◈", "Comprendre", libelleAvancement(sfc), "niveaux", sfc.total);
  h += `<p class="kick" style="margin-top:18px">Reprises</p>`;
  h += carteSession("⏱", "Sprint chronométré", "dix questions contre la montre", "sprint", 1);
  h += carteSession("✎", "Carnet d'erreurs", err + " en attente", "erreurs", err);
  h += carteSession("！", "Erreurs confiantes", conf + " ratée" + (conf>1?"s":"") + " en se croyant sûr", "confiantes", conf);
  h += `<div class="rang"><button class="btn mini" data-act="fiche-erreurs"${err?"":" disabled"}>Imprimer mes points faibles</button></div>`;
  h += `<p class="kick" style="margin-top:18px">Par unité d'enseignement</p><div class="liste-puces">`;
  UES.forEach(u => { const st = statsUE(u.id);
    if(st.total) h += `<button class="puce mono" data-act="session" data-source="ue" data-ue="${u.id}">${u.id} · ${st.total}</button>`; });
  return h + `</div></div>`;
}
function carteSession(ic, titre, sous, source, actif){
  return `<button class="carteAct" data-act="session" data-source="${source}"${actif?"":" disabled"}>
    <span class="ic">${ic}</span><span class="tx"><b>${esc(titre)}</b><small>${esc(sous)}</small></span>
    <span class="fl">›</span></button>`;
}

function ecranSession(){
  const s = ui.session;
  if(!s){ ui.ecran = "reviser"; return ecranReviser(); }
  const it = s.liste[s.i], u = UE(it.ueId), examen = s.mode === "examen";
  let h = `<div class="lecon"><div class="lecon-haut">
    <button class="fermer" data-act="quitter-session" aria-label="Quitter">×</button>
    <div class="pts">${s.liste.map((_,k) => `<span class="${k < s.i ? "f" : ""}"></span>`).join("")}</div>
    ${(s.mode==="sprint"||examen) ? `<span class="chrono" id="chrono">00:00</span>` : `<span class="src">${s.i+1}/${s.liste.length}</span>`}
    </div><div class="diapo">
    <p class="kick">${u?u.id:""} · ${FAMILLES[familleDe(it)].court}${familleDe(it)==="comp" ? " n" + niveauDe(it) : ""} · ${esc(TYPES[it.type]||it.type)}${it.reprise ? " · reprise, tour " + (it.tour||2) : ""}</p>`;

  if(it.type === "flash"){
    h += `<h3>${esc(it.recto)}</h3>`;
    if(s.etat === "c") h += `<div class="verdict ok">${esc(it.verso)}</div>`;
  } else h += `<h3>${esc(it.question || "")}</h3>`;

  if(it.type === "choix" && it.angle) h += `<p class="puce mono" style="margin-bottom:10px">${esc(ANGLES[it.angle] || it.angle)}</p>`;
  if(it.type === "qcm" || it.type === "qcmMulti" || it.type === "choix"){
    const multi = it.type === "qcmMulti";
    if(multi) h += `<p style="font-size:13.5px;color:var(--encre2)">Plusieurs réponses possibles.</p>`;
    it.options.forEach((o,k) => {
      let cl = "opt";
      const pris = multi ? (s.choix||[]).includes(k) : s.choix === k;
      if(pris) cl += " pris";
      if(s.etat === "c" && !examen){
        const bon = multi ? (it.reponses||[]).includes(k) : k === it.reponse;
        cl = bon ? "opt juste" : (pris ? "opt faux" : "opt");
      }
      h += `<button class="${cl}" data-act="choix" data-k="${k}"${s.etat==="c"?" disabled":""}>${esc(o)}</button>`;
    });
  } else if(it.type === "vf"){
    [["Vrai",true],["Faux",false]].forEach(([lab,val]) => {
      let cl = "opt";
      if(s.choix === val) cl += " pris";
      if(s.etat === "c" && !examen) cl = val === it.reponse ? "opt juste" : (s.choix === val ? "opt faux" : "opt");
      h += `<button class="${cl}" data-act="choix" data-v="${val}"${s.etat==="c"?" disabled":""}>${lab}</button>`;
    });
  } else if(it.type === "cloze"){
    h += `<input type="text" id="rep-cloze" placeholder="Votre réponse" value="${esc(s.choix||"")}"${s.etat==="c"?" disabled":""}>`;
  } else if(TYPES_REDIGES.includes(it.type)){
    h += `<textarea id="rep-libre" style="min-height:110px" placeholder="Votre réponse"${s.etat==="c"?" disabled":""}>${esc(s.choix||"")}</textarea>`;
  } else if(it.type === "ordre"){
    h += s.ordre.map((idx,pos) => `<div class="opt" style="display:flex;align-items:center;gap:10px">
      <span class="src">${pos+1}</span><span style="flex:1">${esc(it.etapes[idx])}</span>
      <button class="btn mini" data-act="monter" data-p="${pos}"${pos===0||s.etat==="c"?" disabled":""}>↑</button>
      <button class="btn mini" data-act="descendre" data-p="${pos}"${pos===s.ordre.length-1||s.etat==="c"?" disabled":""}>↓</button></div>`).join("");
  } else if(it.type === "classer"){
    const col = it.colonnes || ["A","B"];
    h += `<p style="font-size:13.5px;color:var(--encre2)">Rangez chaque élément dans l'une des deux colonnes.</p>`;
    (it.elements||[]).forEach((e,i) => {
      const v = String(s.assoc[i] === undefined ? "" : s.assoc[i]);
      const bon = s.etat === "c" ? String(e.col) : null;
      h += `<div class="opt" style="display:block${s.etat==="c" && v !== bon ? ";border-color:var(--rouge)" : ""}">
        <div style="margin-bottom:7px">${esc(e.txt)}</div>
        <div style="display:flex;gap:7px">${col.map((c,k) =>
          `<button class="puce${v===String(k)?" on":""}" data-act="ranger" data-i="${i}" data-c="${k}"${s.etat==="c"?" disabled":""}>${esc(tronquer(c,26))}</button>`).join("")}</div></div>`;
    });
  } else if(it.type === "paires"){
    if(!s.melangeD) s.melangeD = melanger(it.paires.map((p,i) => ({i, txt:p[1]})));
    it.paires.forEach((p,i) => {
      h += `<div style="margin-bottom:9px"><div style="font-size:14.5px;font-weight:600;margin-bottom:4px">${esc(p[0])}</div>
        <select data-act="assoc" data-i="${i}"${s.etat==="c"?" disabled":""}><option value="">— choisir —</option>
        ${s.melangeD.map(d => `<option value="${d.i}"${String(s.assoc[i])===String(d.i)?" selected":""}>${esc(tronquer(d.txt,70))}</option>`).join("")}
        </select></div>`;
    });
  }

  if(s.etat === "q"){
    if(!examen) h += `<div class="rang"><span style="font-size:13.5px;color:var(--encre2)">Vous êtes sûr ?</span>
      <button class="puce${s.sur===true?" on":""}" data-act="sur" data-v="1">Sûr</button>
      <button class="puce${s.sur===false?" on":""}" data-act="sur" data-v="0">Pas sûr</button></div>`;
    h += `</div><div style="display:flex;gap:9px">
      <button class="btn" data-act="passer">Passer</button>
      <button class="cta" style="flex:1;margin-top:0" data-act="valider">${it.type==="flash"?"Retourner":(examen?"Valider":"Vérifier")}</button></div></div>`;
    return h;
  }
  const j = s.dernierJuste;
  if(j !== null && j !== undefined){
    h += `<div class="verdict ${j?"ok":"ko"}"><b>${j?"Juste.":"Raté."}</b>
      ${it.correction ? esc(it.correction)+" " : ""}
      ${!j && it.type==="cloze" ? "Réponse attendue : « " + esc(it.reponse) + " »." : ""}
      ${!j && it.type==="ordre" ? "Ordre du cours : " + it.etapes.map((e,k)=>(k+1)+". "+esc(e)).join(" ") : ""}
      ${!j && it.type==="paires" ? it.paires.map(p => esc(p[0])+" → "+esc(tronquer(p[1],70))).join("<br>") : ""}
      ${!j && it.type==="classer" ? (it.elements||[]).map(e => esc(e.txt)+" → "+esc((it.colonnes||[])[e.col]||"")).join("<br>") : ""}</div>`;
  }
  if(TYPES_REDIGES.includes(it.type)){
    if(s.correction) h += blocCorrection(s.correction);
    else if(s.correctionEnCours) h += `<div class="verdict ok"><b>Correction en cours…</b>Les éléments attendus s'affichent en attendant.</div>`;
    const m = motsTrouves(s.choix||"", it.motsCles);
    h += `<div class="verdict ok"><b>Éléments attendus</b>
      <div class="liste-puces" style="margin:6px 0">${m.map(x => `<span class="puce">${x.ok?"✓":"○"} ${esc(x.mot)}</span>`).join("")}</div>
      ${it.attendu ? esc(it.attendu) : ""}</div>`;
  }
  if(it.source) h += `<button class="src" data-act="src" data-cible="srcq">Voir le passage du cours</button>
    <div class="srcTxt" id="srcq">« ${esc(tronquer(it.source,380))} »</div>`;
  if(it.coursId && !examen){
    h += `<div class="outilsExo">
      <button class="btn" data-act="exo-editer">Corriger cet exercice</button>
      <button class="btn" data-act="exo-douteux">Écarter</button>
      <button class="btn" data-act="exo-supprimer" style="color:var(--rouge)">Supprimer</button></div>`;
    if(ui.editExo === it.id) h += panneauEdition(it);
  }
  h += `</div>`;
  if(j === null || j === undefined || it.type === "flash"){
    h += `<div style="display:flex;gap:9px;align-items:center">
      <span style="font-size:14px;color:var(--encre2)">Vous l'aviez ?</span>
      <button class="btn mini" data-act="auto" data-v="0">Non</button>
      <button class="cta" style="flex:1;margin-top:0" data-act="auto" data-v="1">Oui</button></div>`;
  } else h += `<button class="cta" data-act="suivant">Suivant</button>`;
  return h + `</div>`;
}

function panneauEdition(it){
  let h = `<div class="panEdit"><label class="champ" for="ed-q">Énoncé</label>
    <textarea id="ed-q">${esc(it.question || it.recto || "")}</textarea>`;
  if(it.type === "cloze" || it.type === "flash"){
    h += `<label class="champ" for="ed-r" style="margin-top:10px">${it.type === "flash" ? "Verso" : "Réponse attendue"}</label>
      <input type="text" id="ed-r-txt" value="${esc(it.type === "flash" ? it.verso : it.reponse)}">`;
  } else if(it.type === "qcm"){
    h += `<label class="champ" for="ed-r-qcm" style="margin-top:10px">Bonne réponse</label>
      <select id="ed-r-qcm">${it.options.map((o,k) => `<option value="${k}"${k===it.reponse?" selected":""}>${esc(tronquer(o,60))}</option>`).join("")}</select>`;
  } else if(it.type === "vf"){
    h += `<label class="champ" for="ed-r-vf" style="margin-top:10px">Bonne réponse</label>
      <select id="ed-r-vf"><option value="1"${it.reponse?" selected":""}>Vrai</option><option value="0"${!it.reponse?" selected":""}>Faux</option></select>`;
  }
  h += `<div class="rang" style="margin-bottom:0"><button class="btn plein mini" data-act="exo-enregistrer">Enregistrer</button>
    <button class="btn mini" data-act="exo-annuler">Annuler</button></div>
    <p style="font-size:12.5px;color:var(--encre3);margin-top:6px">La correction porte sur le cours importé, elle est conservée.</p></div>`;
  return h;
}
function enregistrerEdition(){
  const s = ui.session, it = s.liste[s.i];
  const t = trouverItem(it.coursId, it.id); if(!t) return;
  const q = document.getElementById("ed-q");
  const r = document.getElementById("ed-r-txt") || document.getElementById("ed-r-qcm") || document.getElementById("ed-r-vf");
  if(q){ const v = q.value.trim(); if(v){ if(it.type === "flash"){ t.item.recto = v; it.recto = v; } else { t.item.question = v; it.question = v; } } }
  if(r){
    if(it.type === "cloze"){ t.item.reponse = r.value.trim(); it.reponse = t.item.reponse; }
    else if(it.type === "flash"){ t.item.verso = r.value.trim(); it.verso = t.item.verso; }
    else if(it.type === "qcm"){ t.item.reponse = Number(r.value); it.reponse = t.item.reponse; }
    else if(it.type === "vf"){ t.item.reponse = r.value === "1"; it.reponse = t.item.reponse; }
  }
  sauver(); ui.editExo = null;
  ui.message = {type:"info", titre:"Exercice corrigé", txt:"La modification est enregistrée dans votre fiche."};
  rendre();
}
function retirerExercice(mode){
  const s = ui.session, it = s.liste[s.i];
  const t = trouverItem(it.coursId, it.id);
  if(t){
    if(mode === "douteux") t.item.douteux = true;
    else { t.cours.items = t.cours.items.filter(x => x.id !== it.id); delete S.progres[it.id]; }
    sauver();
  }
  s.liste = s.liste.filter((x, k) => k !== s.i);
  ui.editExo = null;
  if(!s.liste.length || s.i >= s.liste.length){ terminerSession(); return; }
  preparerQuestion(); rendre();
}
function valider(){
  const s = ui.session, it = s.liste[s.i];
  if(it.type === "cloze" || TYPES_REDIGES.includes(it.type)){
    const el = document.getElementById(it.type === "cloze" ? "rep-cloze" : "rep-libre");
    if(el) s.choix = el.value;
  }
  const j = corrigerItem(it, s.choix, s.assoc, s.ordre);
  s.dernierJuste = j;
  if(s.mode === "examen"){
    s.resultats.push({id:it.id, ueId:it.ueId, juste: j === null ? autoNoteExamen(it, s.choix) : j});
    suivant(); return;
  }
  if(j !== null && j !== undefined) enregistrer(it, j);
  s.etat = "c"; rendre();
  if(TYPES_REDIGES.includes(it.type)) lancerCorrection(s, it);
}
/* Correction assistée des rédactions. En cas d'échec ou hors ligne, on garde
   silencieusement l'auto-évaluation par mots-clés : aucune note n'est inventée. */
function lancerCorrection(s, it){
  if(S.reglages.moteur !== "gemini" || !S.reglages.cleGemini || !S.reglages.modele) return;
  if(!(s.choix || "").trim()) return;
  const idx = s.i;
  s.correctionEnCours = true; rendre();
  corrigerRedaction(it, s.choix, S.reglages.cleGemini, S.reglages.modele)
    .then(c => { if(ui.session === s && s.i === idx){ s.correction = c; s.correctionEnCours = false; rendre(); } })
    .catch(() => { if(ui.session === s && s.i === idx){ s.correctionEnCours = false; rendre(); } });
}

function suivant(){
  const s = ui.session; s.i++;
  if(s.i >= s.liste.length){ terminerSession(); return; }
  preparerQuestion(); rendre(); window.scrollTo(0,0);
}
function terminerSession(){
  clearInterval(minuteur);
  const s = ui.session; if(!s) return;
  if(s.mode === "examen"){
    const r = calculerExamen(s); S.examens.push(r); sauver();
    ui.resultat = r; ui.session = null; ui.ecran = "examen"; rendre(); return;
  }
  const t = s.resultats.length, b = s.resultats.filter(x => x.juste).length;
  S.meta.sessions = (S.meta.sessions || 0) + 1;
  S.meta.sessionsExport = (S.meta.sessionsExport || 0) + 1;
  sauver();
  const r = s.retour;
  ui.session = null;
  if(r){ ui.tab = r.tab; ui.ecran = r.ecran; } else ui.ecran = "reviser";
  ui.message = {type:"info", titre:"Session terminée",
    txt: t ? b + " réussite" + (b>1?"s":"") + " sur " + t + "." : "Session close."};
  rendre();
}
function lancerExosPrep(ue, mode){
  let l = itemsExos(ue);
  if(mode === "erreurs") l = l.filter(i => { const p = S.progres[i.id]; return p && p.ko > 0 && p.boite === 1; });
  else if(mode === "neufs") l = l.filter(i => !S.progres[i.id] || !S.progres[i.id].vus);
  if(!l.length){
    ui.message = {type:"info", titre:"Rien à reprendre ici",
      txt: mode === "erreurs" ? "Aucune erreur en attente sur cette unité." : "Tous les exercices de cette unité ont déjà été vus."};
    rendre(); return;
  }
  ouvrirSession(l, "libre", null, {tab:"prep", ecran:"accueil"});
}
function lancerSession(source, ue, id, el0){
  el0 = el0 || {};
  if(source === "niveaux"){ ui.ecran = "niveaux"; rendre(); window.scrollTo(0,0); return; }
  let l = [];
  if(source === "dus") l = itemsDus();
  else if(source === "erreurs") l = carnetErreurs();
  else if(source === "confiantes") l = erreursConfiantes();
  else if(source === "ue") l = tousItems().filter(i => i.ueId === ue);
  else if(source === "cours"){ const c = S.cours.find(x => x.id === id); l = c ? c.items.slice() : []; }
  else if(source === "sprint"){ l = itemsDus(); if(l.length < 10) l = tousItems(); }
  else if(source === "memo") l = tousItems().filter(i => familleDe(i) === "memo");
  else if(source === "comp") l = tousItems().filter(i => familleDe(i) === "comp");
  else if(source === "niveau") l = tousItems().filter(i => familleDe(i) === "comp" && niveauDe(i) === Number(el0.niveau));
  else if(source === "jour"){
    l = planJour().liste;
    ouvrirSession(l, "libre", null, {tab:"rev", ecran:"planning"}); return;
  }
  ouvrirSession(l, source === "sprint" ? "sprint" : "libre");
}

/* =========================================================================
   24bis. MOYENNES, TRAVAUX, QUESTIONS À POSER, LEXIQUE
   Règle de validation citée de l'arrêté du 31 juillet 2024, modifié le 7 août 2025 :
   10/20 par domaine, compensation entre UE d'un même domaine au-dessus de 8/20,
   en tenant compte des coefficients, qui correspondent au nombre de crédits.
   ========================================================================= */
const SOURCES_REGLE = [
  {titre:"Arrêté du 31 juillet 2024", ref:"Modalités de validation : 10/20 par domaine, compensation au-dessus de 8/20, pas de compensation entre domaines ni entre théorie et milieu professionnel",
   url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000050066720"},
  {titre:"Arrêté du 7 août 2025", ref:"Les coefficients correspondent au nombre de crédits affectés à chaque unité d'enseignement",
   url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052115022"}
];
function encartRegle(){
  return `<div class="avis info"><b>La règle appliquée</b>
    Une note d'au moins 10/20 est requise pour valider un domaine. Au sein d'un même domaine, les UE au moins égales à 8/20 se compensent entre elles, en tenant compte des coefficients, qui sont les crédits ECTS. Aucune compensation entre deux domaines, ni entre théorie et milieu professionnel.
    Seul le jury atteste la validation : ce qui suit n'est qu'un calcul.</div>`;
}
function listeSources(l){
  return `<ul class="sources">${l.map(s =>
    `<li><b>${esc(s.titre)}</b>${esc(s.ref)}<br><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(tronquer(s.url,58))}</a></li>`).join("")}</ul>`;
}

/* Évaluations de référence, telles qu'annoncées par le centre de formation.
   Elles ne sont qu'un point de départ : les poids restent modifiables. */

  "UE2":  [{titre:"Écrit individuel QCM/QROC", poids:1}, {titre:"Exercice pratique : conciliation / BMO", poids:1}],
  "UE3":  [{titre:"Écrit individuel QCM/QROC", poids:4}, {titre:"Exercice en groupe", poids:6}],
  "UE4.1":[{titre:"Écrit individuel QCM/QROC", poids:7}, {titre:"TD en groupe", poids:3}],
  "UE4.2":[{titre:"Écrit individuel QCM/QROC/Cas pratiques", poids:1}],

/* --- moyennes --- */
function evals(ueId){ if(!S.notes[ueId]) S.notes[ueId] = []; return S.notes[ueId]; }
/* Pré-remplit les évaluations d'une UE d'après le référentiel du centre. */
function prerremplirEvals(ueId){
  const ref = EVALS_REF[ueId];
  if(!ref || evals(ueId).length) return 0;
  ref.forEach(e => S.notes[ueId].push({titre:e.titre, poids:e.poids, note:null, sem:e.sem || null}));
  sauver();
  return ref.length;
}
/* Chaque note de semestre doit atteindre 8/20 pour les UE évaluées sur deux semestres. */
function moyenneSemestre(ueId, sem){
  const l = evals(ueId).filter(e => Number(e.sem) === sem &&
    e.note !== null && e.note !== "" && isFinite(Number(e.note)));
  const p = l.reduce((a,e) => a + (Number(e.poids) || 1), 0);
  return p ? l.reduce((a,e) => a + Number(e.note) * (Number(e.poids) || 1), 0) / p : null;
}
function semestresSousHuit(ueId){
  if(!surDeuxSemestres(ueId)) return [];
  return [1,2].filter(k => { const m = moyenneSemestre(ueId, k); return m !== null && m < 8; });
}
function moyenneUE(ueId){
  const l = evals(ueId).filter(e => e.note !== null && e.note !== "" && isFinite(Number(e.note)));
  const p = l.reduce((s2,e) => s2 + (Number(e.poids) || 1), 0);
  if(!p) return null;
  return l.reduce((s2,e) => s2 + Number(e.note) * (Number(e.poids) || 1), 0) / p;
}
function poidsRestant(ueId){
  return evals(ueId).filter(e => e.note === null || e.note === "" || !isFinite(Number(e.note)))
    .reduce((s2,e) => s2 + (Number(e.poids) || 1), 0);
}
/* Ce qu'il faut obtenir en moyenne sur les évaluations restantes pour atteindre la cible. */
function besoinPourCible(ueId, cible){
  const l = evals(ueId);
  const total = l.reduce((s2,e) => s2 + (Number(e.poids) || 1), 0);
  const rest = poidsRestant(ueId);
  if(!total) return {etat:"vide"};
  if(!rest) return {etat:"fini", moyenne:moyenneUE(ueId)};
  const acquis = l.filter(e => e.note !== null && e.note !== "" && isFinite(Number(e.note)))
    .reduce((s2,e) => s2 + Number(e.note) * (Number(e.poids) || 1), 0);
  const besoin = (cible * total - acquis) / rest;
  if(besoin > 20) return {etat:"impossible", besoin, rest};
  return {etat:"possible", besoin: Math.max(0, besoin), rest};
}
function moyenneDomaine(d){
  const ues = UES.filter(u => u.dom === d).map(u => ({u, m:moyenneUE(u.id)})).filter(x => x.m !== null);
  if(!ues.length) return null;
  const p = ues.reduce((s2,x) => s2 + x.u.ects, 0);
  const moy = ues.reduce((s2,x) => s2 + x.m * x.u.ects, 0) / p;
  return {moyenne:moy, ues, bloquantes:ues.filter(x => x.m < 8).map(x => x.u.id),
    valide: moy >= 10 && !ues.some(x => x.m < 8), partiel: ues.length < UES.filter(u => u.dom === d).length};
}

/* --- lexique bilingue (UE14) --- */
const ID_LEXIQUE = "lexique-ue14";
const SEPARATEURS = [/\t+/, /\s*;\s*/, /\s*=\s*/, /\s+-\s+/];
/* Quatre séparateurs acceptés, plus une phrase d'appui facultative entre parenthèses. */
function lireLigneLexique(ligne){
  let t = String(ligne || "").trim();
  if(!t) return null;
  let appui = "";
  const m = t.match(/\(([^)]{3,160})\)\s*$/);
  if(m){ appui = m[1].trim(); t = t.slice(0, m.index).trim(); }
  for(const sep of SEPARATEURS){
    const p = t.split(sep);
    if(p.length === 2 && p[0].trim() && p[1].trim())
      return {fr:p[0].trim(), en:p[1].trim(), appui};
  }
  return null;
}
function coursLexique(){
  let c = S.cours.find(x => x.id === ID_LEXIQUE);
  if(!c){
    c = {id:ID_LEXIQUE, titre:"Lexique anglais", ueId:"UE14", date:new Date().toISOString(),
      origine:"lexique", texte:"", tableaux:[], visuels:[], lexique:[],
      fiche:{resume:"", definitions:[], points:[], chiffres:[], normes:[], pieges:[], sigles:[],
        procedures:[], saillants:[], mentionnes:[], sections:[], complements:null},
      items:[]};
    S.cours.push(c);
  }
  if(!Array.isArray(c.lexique)) c.lexique = [];
  return c;
}
/* Chaque entrée produit deux exercices, un dans chaque sens, qui entrent dans les mêmes boîtes. */
function ajouterEntreeLexique(fr, en, appui){
  const c = coursLexique();
  const cle = normaliser(fr) + "|" + normaliser(en);
  if(c.lexique.some(e => e.cle === cle)) return null;
  const idFr = uid(), idEn = uid();
  c.lexique.push({cle, fr, en, appui:appui || "", idFr, idEn});
  const src = fr + " = " + en + (appui ? " (" + appui + ")" : "");
  c.items.push({id:idFr, ueId:"UE14", type:"flash", cree:Date.now(), origine:"lexique",
    famille:"memo", recto:fr, verso:en + (appui ? " — " + appui : ""), source:src, sens:"fr-en"});
  c.items.push({id:idEn, ueId:"UE14", type:"flash", cree:Date.now(), origine:"lexique",
    famille:"memo", recto:en, verso:fr + (appui ? " — " + appui : ""), source:src, sens:"en-fr"});
  return c.lexique[c.lexique.length - 1];
}
function supprimerEntreeLexique(cle){
  const c = coursLexique();
  const e = c.lexique.find(x => x.cle === cle);
  if(!e) return;
  [e.idFr, e.idEn].forEach(id => delete S.progres[id]);
  c.items = c.items.filter(i => i.id !== e.idFr && i.id !== e.idEn);
  c.lexique = c.lexique.filter(x => x.cle !== cle);
}

async function exporter(complet){
  const o = JSON.parse(JSON.stringify(S));
  o.export = {version:VERSION, date:new Date().toISOString(), complet:!!complet};
  if(complet){
    o.images = {};
    let n = 0;
    for(const c of S.cours){
      for(const v of (c.visuels || [])){
        const b = await lireImage(v.id);
        if(b){ o.images[v.id] = await enBase64(b); n++; }
      }
    }
    o.export.nbImages = n;
  }
  telecharger("prepa-depph-" + (complet ? "complet-" : "leger-") + new Date().toISOString().slice(0,10) + ".json",
    JSON.stringify(o));
  ui.message = {type:"info", titre: complet ? "Export complet" : "Export léger",
    txt: complet ? (o.export.nbImages || 0) + " schéma(s) inclus." : "Les schémas ne sont pas dans ce fichier."};
  rendre();
}
function base64EnBlob(b64, type){
  const bin = atob(b64), n = bin.length, t = new Uint8Array(n);
  for(let i = 0; i < n; i++) t[i] = bin.charCodeAt(i);
  return new Blob([t], {type: type || "image/jpeg"});
}
async function restaurerImages(o){
  if(!o || !o.images) return 0;
  let n = 0;
  for(const id of Object.keys(o.images)){
    try{ await ecrireImage(id, base64EnBlob(o.images[id])); n++; }catch(e){}
  }
  return n;
}

/* =========================================================================
   24. EXAMEN BLANC, PLANNING, RÉGLAGES
   ========================================================================= */
function composerExamen(nb){
  const dispo = tousItems().filter(i => i.type !== "flash");
  if(dispo.length < 5) return [];
  const parUE = {}; dispo.forEach(i => (parUE[i.ueId] = parUE[i.ueId] || []).push(i));
  const ids = Object.keys(parUE);
  const pt = ids.reduce((s,id) => s + (UE(id)?UE(id).ects:1), 0);
  let out = [];
  ids.forEach(id => { const part = Math.max(1, Math.round(nb * (UE(id)?UE(id).ects:1) / pt));
    out = out.concat(melanger(parUE[id]).slice(0, part)); });
  return melanger(out).slice(0, nb);
}
function calculerExamen(s){
  const parUE = {};
  s.resultats.forEach(r => { const e = parUE[r.ueId] = parUE[r.ueId] || {total:0,bons:0};
    e.total++; if(r.juste) e.bons++; });
  const ues = Object.keys(parUE).map(id => { const u = UE(id), e = parUE[id];
    return {id, nom:u?u.nom:id, dom:u?u.dom:0, ects:u?u.ects:0, total:e.total, bons:e.bons,
      note: Math.round(e.bons/e.total*200)/10}; });
  const domaines = [1,2,3,4,5].map(d => {
    const l = ues.filter(x => x.dom === d);
    if(!l.length) return {dom:d, presente:false};
    const p = l.reduce((s2,x) => s2 + x.ects, 0);
    const note = Math.round(l.reduce((s2,x) => s2 + x.note*x.ects, 0)/p*10)/10;
    return {dom:d, presente:true, note, valide:note >= 10, bloquantes:l.filter(x => x.note < 8).map(x => x.id)};
  });
  return {date:new Date().toISOString(), duree:Math.round((Date.now()-s.debut)/1000),
    questions:s.resultats.length, bons:s.resultats.filter(r=>r.juste).length, ues, domaines};
}
function tableauResultats(r){
  let h = `<table class="tableau"><thead><tr><th>UE</th><th>Score</th><th>Note</th></tr></thead><tbody>`;
  r.ues.forEach(u => h += `<tr><td>${u.id}</td><td class="n">${u.bons}/${u.total}</td>
    <td class="n" style="color:${u.note<8?"var(--rouge)":(u.note<10?"var(--or-fonce)":"var(--menthe-fonce)")}">${u.note.toFixed(1)}</td></tr>`);
  h += `</tbody></table>`;
  r.domaines.filter(d => d.presente).forEach(d => {
    h += `<div class="bloc" style="margin-top:10px"><div class="bloc-t">
      <span class="point" style="background:${DOMAINES[d.dom].coul}"></span>
      <span class="bloc-nom">${esc(DOMAINES[d.dom].nom)}</span>
      <span class="bloc-meta" style="color:${d.valide?"var(--menthe-fonce)":"var(--rouge)"}">${d.note.toFixed(1)}/20</span></div>
      <div style="font-size:13px;color:var(--encre2)">${d.valide?"Domaine validé dans cette simulation":"Sous la barre des 10/20"}${d.bloquantes.length?" · non compensable : "+d.bloquantes.join(", "):""}</div></div>`;
  });
  return h + `<p style="font-size:12.5px;color:var(--encre3);margin-top:10px">Simulation de la règle du référentiel : 10/20 par domaine, compensation entre UE d'un même domaine au-dessus de 8/20. Elle ne porte que sur vos propres exercices.</p>`;
}

/* =========================================================================
   24 bis. PLANNING PAR UNITÉ D'ENSEIGNEMENT
   Une date par UE, plusieurs UE pouvant partager la même date.
   ========================================================================= */
const PASSAGES = [[14,"Passage complet"],[7,"Reprise"],[3,"Reprise ciblée"],[1,"Dernière relecture"]];
const NOMS_JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const SEC_PAR_EXO = 45;

function datesUE(){ if(!S.reglages.datesUE) S.reglages.datesUE = {}; return S.reglages.datesUE; }
function dateUE(id){ return datesUE()[id] || S.reglages.dateExamen || ""; }
function joursAvant(id){ return joursJusqua(dateUE(id)); }
function itemsUE(id){ return tousItems().filter(i => i.ueId === id).concat(itemsExos(id)); }
function bilanUE(id){
  const l = itemsUE(id);
  let sus = 0, faibles = 0, vus = 0;
  l.forEach(i => { const p = S.progres[i.id]; if(!p || !p.vus) return;
    vus++; if(p.boite === 3) sus++; if(p.boite === 1 && p.ko > 0) faibles++; });
  return {total:l.length, vus, sus, faibles, part: l.length ? Math.round(sus / l.length * 100) : 0};
}
function uesUrgentes(){
  return UES.filter(u => { const j = joursAvant(u.id); return j !== null && j >= 0 && j <= 3 && bilanUE(u.id).total; })
    .map(u => u.id);
}
function prioriteUE(u){
  const b = bilanUE(u.id);
  if(!b.total) return null;
  const j = joursAvant(u.id);
  const urgence = j === null ? 0.30 : (j <= 0 ? 1 : 1 / (1 + j / 7));
  const lacune = 1 - b.sus / b.total;
  const poids = u.ects / 4;
  const bonus = j === null ? 0 : (j <= 3 ? 30 : (j <= 7 ? 15 : 0));
  const score = Math.min(100, Math.round((urgence * 0.50 + lacune * 0.35 + poids * 0.15) * 100) + bonus);
  const motifs = [];
  if(j !== null && j >= 0 && j <= 3) motifs.push("dernière ligne droite");
  if(j !== null) motifs.push(j <= 0 ? "épreuve passée ou aujourd'hui" : j + " jour" + (j > 1 ? "s" : ""));
  motifs.push(u.ects + " ECTS");
  motifs.push(b.part + " % acquis");
  if(b.faibles) motifs.push(b.faibles + " en boîte 1");
  return {score, jours:j, bilan:b, motifs};
}
function classementUE(){
  return UES.map(u => ({u, p:prioriteUE(u)})).filter(x => x.p)
    .sort((a,b) => b.p.score - a.p.score);
}
function prochainesEcheances(n){
  return UES.map(u => ({u, j:joursAvant(u.id), d:dateUE(u.id)}))
    .filter(x => x.j !== null && x.j >= 0)
    .sort((a,b) => a.j - b.j).slice(0, n || 3);
}
function itemsDusTous(){
  const t = Date.now(), urg = new Set(uesUrgentes());
  const prep = UES_EXOS.flatMap(u => itemsExos(u)).filter(i => {
    if(urg.has(i.ueId)) return true;
    const p = S.progres[i.id]; return !p || p.prochain <= t;
  });
  return itemsDus().concat(prep);
}
function planJour(){
  const budget = Math.max(5, Number(S.reglages.minutesJour) || 45);
  const off = (S.reglages.joursOff || []).map(Number);
  const repos = off.includes(new Date().getDay());
  const cap = Math.max(1, Math.floor(budget * 60 / SEC_PAR_EXO));
  const urg = new Set(uesUrgentes());
  const rang = {};
  classementUE().forEach(x => rang[x.u.id] = x.p.score);
  const tri = itemsDusTous().slice().sort((a,b) => {
    const ua = urg.has(a.ueId) ? 1 : 0, ub = urg.has(b.ueId) ? 1 : 0;
    if(ua !== ub) return ub - ua;
    return (rang[b.ueId] || 0) - (rang[a.ueId] || 0);
  });
  const liste = tri.slice(0, cap);
  const parUE = {};
  liste.forEach(i => parUE[i.ueId] = (parUE[i.ueId] || 0) + 1);
  return {repos, cap, budget, liste, total:tri.length, parUE, urgentes:[...urg]};
}
function passagesPrevus(){
  const out = [];
  UES.forEach(u => {
    const d = dateUE(u.id); if(!d) return;
    if(!bilanUE(u.id).total) return;
    const base = new Date(d).getTime();
    if(isNaN(base)) return;
    PASSAGES.forEach(([k, lib]) => {
      const t = base - k * JOUR;
      if(t < Date.now() - JOUR) return;
      out.push({t, ue:u.id, lib, reste:k});
    });
    if(base >= Date.now()) out.push({t:base, ue:u.id, lib:"Épreuve", reste:0});
  });
  return out.sort((a,b) => a.t - b.t).slice(0, 16);
}
function alertesPlanning(){
  const a = [];
  UES.forEach(u => {
    const j = joursAvant(u.id); if(j === null || j < 0 || j > 14) return;
    const jrs = j + " jour" + (j > 1 ? "s" : "");
    const importes = tousItems().filter(i => i.ueId === u.id).length;
    const b = bilanUE(u.id);
    if(!importes){
      a.push({type:"err", titre:u.id + " : épreuve dans " + jrs + ", aucun cours importé",
        txt:"La leçon de préparation et ses exercices ne remplacent pas votre cours : ils en donnent le cadre, pas le contenu enseigné dans votre centre. Importez le cours de cette unité."});
    }
    if(b.total && b.part < 25){
      a.push({type:"err", titre:u.id + " : épreuve dans " + jrs + ", " + b.part + " % acquis",
        txt:"Moins d'un quart des exercices de cette unité sont en boîte 3, leçons de préparation et cours importés confondus."});
    }
  });
  const parDate = {};
  UES.forEach(u => { const d = dateUE(u.id), j = joursAvant(u.id);
    if(d && j !== null && j >= 0) (parDate[d] = parDate[d] || []).push(u.id); });
  Object.keys(parDate).sort().forEach(d => {
    if(parDate[d].length > 1)
      a.push({type:"", titre:parDate[d].length + " épreuves le " + dateFr(d),
        txt:parDate[d].join(", ") + " tombent le même jour. Avancez le travail sur les jours qui précèdent."});
  });
  const dernier = S.examens[S.examens.length - 1];
  if(dernier) (dernier.ues || []).filter(x => x.note < 8).forEach(x => {
    const u = UE(x.id);
    a.push({type:"err", titre:x.id + " sous 8/20 au dernier examen blanc",
      txt:"En dessous de 8, l'unité n'est pas compensable : elle fait tomber tout le domaine " +
        (u ? u.dom + ", « " + DOMAINES[u.dom].nom + " »" : "") + ", quelles que soient les autres notes."});
  });
  return a;
}
function bandeauEcheances(){
  const e = prochainesEcheances(3);

  return `<div class="liste-puces">` + e.map(x =>

  const alertes = alertesPlanning();

  if(p.repos){

  } else {

      <span class="bloc-nom">${p.liste.length} exercice${p.liste.length>1?"s":""} · ${Math.round(p.liste.length*SEC_PAR_EXO/60)} min</span>
      <span class="bloc-meta">${p.total} à échéance</span></div>
      <div class="liste-puces" style="margin-bottom:10px">${Object.keys(p.parUE).map(u =>
        `<span class="puce mono">${u} · ${p.parUE[u]}</span>`).join("")}</div>
      <button class="cta" data-act="session" data-source="jour">Commencer la séance du jour</button></div>
      <p style="font-size:12.5px;color:var(--encre3);margin-top:-2px">Budget de ${p.budget} min, soit ${p.cap} exercices sur la base de ${SEC_PAR_EXO} secondes chacun. Le reste attendra demain.</p>`;
  }

  // --- réglage du rythme
  h += `<p class="kick" style="margin-top:20px">Mon rythme</p>
    <label class="champ" for="p-min">Minutes par jour</label>
    <input type="number" id="p-min" data-bind="minutesJour" min="5" max="240" step="5" value="${esc(String(S.reglages.minutesJour || 45))}">
    <label class="champ" for="p-off" style="margin-top:12px">Jours sans révision</label>
    <div class="liste-puces" id="p-off">${NOMS_JOURS.map((n,k) =>
      `<button class="puce${(S.reglages.joursOff||[]).map(Number).includes(k)?" on":""}" data-act="jour-off" data-k="${k}">${n.slice(0,3)}</button>`).join("")}</div>`;

  // --- priorités
  const cl = classementUE();

function ecranStats(){
  let h = `<div class="ecran">` + retour("accueil", "Statistiques");

  /* Les deux banques sont comptées séparément : mélanger fausse la lecture
     de sa propre progression sur ses propres cours. */
  const prepIts = UES_EXOS.flatMap(u => itemsExos(u));
  const compte = l => { let vus = 0, ok = 0, sus = 0;
    l.forEach(i => { const p = S.progres[i.id]; if(!p || !p.vus) return;
      vus += p.vus; ok += p.ok; if(p.boite === 3) sus++; });
    return {total:l.length, vus, ok, sus, part: vus ? Math.round(ok/vus*100) : 0}; };
  const cRev = compte(its), cPrep = compte(prepIts);
  h += `<p class="kick">Activité des 60 derniers jours</p>` + grapheActivite(60) +
    `<div class="liste-puces" style="margin-top:-4px">
      <span class="puce mono">série : ${serieJours()} j</span>
      <span class="puce mono">aujourd'hui : ${totalJour().n}</span>
      <span class="puce mono">30 j : ${activite(30).reduce((a,x) => a + x.n, 0)}</span></div>`;
  h += `<p class="kick">Par onglet</p>
    <div class="bloc"><div class="bloc-t"><span class="point" style="background:var(--menthe)"></span>
      <span class="bloc-nom">Révision · vos cours</span><span class="bloc-meta">${cRev.total} ex.</span></div>
      <div class="jauge"><i style="width:${cRev.part}%"></i></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3);margin-top:5px">
        ${cRev.part}% de réussite · ${cRev.sus} acquis</div></div>
    <div class="bloc"><div class="bloc-t"><span class="point" style="background:var(--d1)"></span>
      <span class="bloc-nom">Préparation · exercices intégrés</span><span class="bloc-meta">${cPrep.total} ex.</span></div>
      <div class="jauge"><i style="width:${cPrep.part}%;background:var(--d1)"></i></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3);margin-top:5px">
        ${cPrep.part}% de réussite · ${cPrep.sus} acquis</div></div>
    <p style="font-size:12.5px;color:var(--encre3);margin-bottom:14px">Les deux ne sont jamais additionnés : les exercices intégrés ne mesurent pas votre travail sur vos propres cours.</p>`;
  const parType = {};
  its.concat(prepIts).forEach(i => {
    const p = S.progres[i.id]; if(!p || !p.vus) return;
    const e = parType[i.type] = parType[i.type] || {vus:0, ok:0};
    e.vus += p.vus; e.ok += p.ok;
  });
  const lignes = Object.keys(parType).sort((a,b) =>
    (parType[a].ok/parType[a].vus) - (parType[b].ok/parType[b].vus));
  if(lignes.length){
    h += `<p class="kick">Réussite par type d'exercice</p><table class="tableau">
      <thead><tr><th>Type</th><th>Tentatives</th><th>Réussite</th></tr></thead><tbody>`;
    lignes.forEach(t => {
      const e = parType[t], part = Math.round(e.ok / e.vus * 100);
      h += `<tr><td>${esc(TYPES[t] || t)}</td><td class="n">${e.vus}</td>
        <td class="n" style="color:${part<50?"var(--rouge)":(part<75?"var(--or-fonce)":"var(--menthe-fonce)")}">${part}%</td></tr>`;
    });
    h += `</tbody></table><p style="font-size:12.5px;color:var(--encre3);margin-top:8px">
      Les types en tête de liste sont ceux que vous ratez le plus. C'est là qu'il y a du terrain à gagner.</p>`;
  } else h += `<div class="avis info"><b>Pas encore de tentative</b>Faites une session, les chiffres apparaîtront.</div>`;

  h += `<p class="kick" style="margin-top:20px">Acquis par unité d'enseignement</p>`;
  UES.forEach(u => {
    const s = statsUE(u.id), e = UES_EXOS.indexOf(u.id) >= 0 ? statsExos(u.id) : {total:0, sus:0};
    const tot = s.total + e.total, sus = s.sus + e.sus;
    if(!tot) return;
    h += `<div class="bloc"><div class="bloc-t"><span class="point" style="background:${DOMAINES[u.dom].coul}"></span>
      <span class="bloc-nom">${u.id} · ${esc(tronquer(u.nom, 26))}</span>
      <span class="bloc-meta">${sus}/${tot}</span></div>
      <div class="jauge"><i style="width:${Math.round(sus/tot*100)}%"></i></div></div>`;
  });
  if(S.examens.length){
    h += `<p class="kick" style="margin-top:20px">Examens blancs</p><table class="tableau">
      <thead><tr><th>Date</th><th>Score</th><th>Domaines validés</th></tr></thead><tbody>`;
    S.examens.slice().reverse().forEach(e => {
      const pres = (e.domaines || []).filter(d => d.presente);
      const val = pres.filter(d => d.valide).length;
      h += `<tr><td>${dateFr(e.date)}</td><td class="n">${e.bons}/${e.questions}</td>
        <td class="n">${val}/${pres.length}</td></tr>`;
    });
    h += `</tbody></table>`;
  }
  return h + `</div>`;
}

function chercher(q){
  const n = normaliser(q); if(n.length < 3) return [];
  const out = [];
  const test = (t) => normaliser(t || "").includes(n);
  Object.keys(LECONS).forEach(ue => {
    LECONS[ue].diapos.forEach((d, i) => {
      const bloc = [d.titre, d.texte, (d.paras||[]).join(" "), (d.mots||[]).map(m => m.m + " " + m.d).join(" "),
        (d.etapes||[]).join(" "), (d.lignes||[]).map(l => l.v + " " + l.l).join(" "),
        d.encart ? d.encart.texte : "", d.question || "", d.note || ""].join(" ");
      if(test(bloc)) out.push({ou:"Leçon " + ue, titre:d.titre || d.question || ("Écran " + (i+1)),
        extrait:tronquer(bloc.replace(/\s+/g, " "), 150), act:"lecon", ue, index:i});
    });
  });
  S.cours.forEach(c => {
    const f = c.fiche;
    const bloc = [f.resume, (f.definitions||[]).map(x => x.terme + " " + x.def).join(" "),
      (f.points||[]).map(x => x.txt).join(" "), (f.chiffres||[]).map(x => x.txt).join(" "),
      (f.normes||[]).map(x => x.txt).join(" "), (f.pieges||[]).map(x => x.txt).join(" ")].join(" ");
    if(test(c.titre) || test(bloc)) out.push({ou:"Fiche " + (c.ueId || ""), titre:c.titre,
      extrait:tronquer(bloc.replace(/\s+/g, " "), 150), act:"fiche", id:c.id});
  });
  UES_EXOS.forEach(ue => {
    itemsExos(ue).forEach(i => {
      if(test(i.question) || test(i.source)) out.push({ou:"Exercice " + ue, titre:tronquer(i.question, 70),
        extrait:tronquer(i.source, 140), act:"exos", ue});
    });
  });
  return out.slice(0, 40);
}

  let h = `<div class="ecran">` + retour("accueil", "Recherche");
  h += `<label class="champ" for="q-txt">Chercher dans les leçons, les fiches et les exercices</label>
    <input type="text" id="q-txt" data-bind="requete" value="${esc(ui.requete || "")}" placeholder="stérilisation, 0,22, cristallin…">`;
  const q = (ui.requete || "").trim();

    <p style="font-size:12.5px;color:var(--encre3)">Les leçons de préparation ne sont pas effacées par ce bouton : seuls vos cours, exercices et résultats le sont.</p>`;
  return h + `</div>`;
}

/* Premier temps : on relève la matière et on s'arrête. Rien n'est enregistré. */
async function releverPoints(){
  const texte = (ui.importTexte||"").trim();
  if(texte.length < 200){
    ui.message = {titre:"Texte trop court", txt:"Quelques paragraphes au minimum pour produire une fiche utile."};
    rendre(); return;
  }
  const al = sonderDonnees(texte);
  if(al.length && !ui.rgpdIgnore){ ui.avisRGPD = al; rendre(); return; }
  const ueId = ui.importUE || detecterUE(texte);
  if(!ueId){ ui.message = {titre:"Unité à préciser", txt:"Elle n'a pas pu être déduite du texte : choisissez-la dans la liste."}; rendre(); return; }
  ui.occupe = true; ui.message = null; rendre();
  const origine = S.reglages.moteur;
  let fiche, phr = [];
  try{
    if(origine === "gemini"){
      if(!S.reglages.cleGemini || !S.reglages.modele) throw new Error("Renseignez la clé et le modèle dans les réglages, ou repassez en mode local.");
      fiche = await analyseGeminiPoints(texte, ueId, S.reglages.cleGemini, S.reglages.modele,
        (k, n) => { ui.avancement = n > 1 ? "morceau " + k + " sur " + n : "en cours"; rendre(); });
    } else {
      const r = analyseLocale(texte, ueId);
      fiche = r.fiche; phr = r.phr;
    }
  }catch(e){ ui.occupe = false; ui.avancement = null;
    ui.message = {type:"err", titre:"Analyse interrompue", txt:e.message}; rendre(); return; }
  ui.occupe = false; ui.avancement = null;
  if(!nbPoints(fiche)){
    ui.message = {titre:"Aucun point relevé",
      txt:"Un cours structuré — définitions, listes, valeurs chiffrées — donne de bien meilleurs résultats."};
    rendre(); return;
  }
  ui.brouillon = {texte, phr, ueId, origine, fiche, garde:{},
    titre:(ui.importTitre||"").trim() || fiche.titreDetecte || UE(ueId).nom,
    tableaux:(ui.importTableaux||[]).slice(), images:(ui.importImages||[]).slice()};
  RUBRIQUES.forEach(r => (fiche[r.cle]||[]).forEach((_,i) => ui.brouillon.garde[r.cle + ":" + i] = true));
  ui.ecran = "verifier"; rendre(); window.scrollTo(0,0);
}

const RUBRIQUES = [
  {cle:"definitions", nom:"Définitions",        aff:x => "<b>" + esc(x.terme) + "</b> — " + esc(x.def)},
  {cle:"sigles",      nom:"Sigles",             aff:x => "<b>" + esc(x.sigle) + "</b> — " + esc(x.sens)},
  {cle:"points",      nom:"Points à retenir",   aff:x => esc(x.txt)},
  {cle:"chiffres",    nom:"Valeurs chiffrées",  aff:x => esc(x.txt)},
  {cle:"normes",      nom:"Textes et normes",   aff:x => esc(x.txt)},
  {cle:"pieges",      nom:"Pièges",             aff:x => esc(x.txt)},
  {cle:"procedures",  nom:"Suites d'étapes",    aff:x => esc((x.etapes||[]).join(" → "))}
];
function nbPoints(f){ return RUBRIQUES.reduce((s,r) => s + ((f[r.cle]||[]).length), 0); }
function nbRetenus(b){ return Object.keys(b.garde).filter(k => b.garde[k]).length; }
/* La fiche enregistrée ne contient que ce qui a été coché. Un point décoché disparaît. */
function ficheRetenue(b){
  const f = {resume:b.fiche.resume, saillants:b.fiche.saillants || [],
    mentionnes:b.fiche.mentionnes || [], sections:b.fiche.sections || [],
    complements:b.fiche.complements || null};
  RUBRIQUES.forEach(r => f[r.cle] = (b.fiche[r.cle]||[]).filter((_,i) => b.garde[r.cle + ":" + i]));
  return f;
}

/* Second temps : les exercices sont fabriqués sur les seuls points retenus. */
async function fabriquer(){
  const b = ui.brouillon;
  if(!b) { ui.ecran = "import"; rendre(); return; }
  if(!nbRetenus(b)){ ui.message = {titre:"Aucun point retenu", txt:"Cochez au moins un point avant de fabriquer les exercices."}; rendre(); return; }
  const f = ficheRetenue(b);
  ui.occupe = true; ui.message = null; rendre();
  let items;
  try{
    if(b.origine === "gemini") items = await analyseGeminiExercices(f, b.ueId, S.reglages.cleGemini, S.reglages.modele,
      (k, n) => { ui.avancement = n > 1 ? "lot " + k + " sur " + n : "en cours"; rendre(); });
    else items = itemsLocaux(f, b.phr, b.ueId);
  }catch(e){ ui.occupe = false; ui.avancement = null;
    ui.message = {type:"err", titre:"Fabrication interrompue", txt:e.message}; rendre(); return; }
  ui.occupe = false; ui.avancement = null;
  if(!items.length){
    ui.message = {titre:"Aucun exercice produit", txt:"Les points retenus ne s'y prêtent pas. Élargissez la sélection ou complétez le cours."};
    rendre(); return;
  }
  const c = {id:uid(), titre:b.titre, ueId:b.ueId, date:new Date().toISOString(), origine:b.origine,
    fiche:f, items:items.map(i => Object.assign(i, {ueId:b.ueId})), texte:b.texte, tableaux:b.tableaux,
    visuels:[]};
  // les images du document n'entrent en base qu'ici : un abandon n'en laisse aucune
  let enMemoire = false;
  for(const im of (b.images || [])){
    const id = uid();
    if(await ecrireImage(id, im.blob) === "memoire") enMemoire = true;
    c.visuels.push({id, legende:"", place:"fin", w:im.w, h:im.h, origine:"docx"});
  }
  S.cours.push(c); sauver();
  if(enMemoire) ui.message = {type:"err", titre:"Images non conservées",
    txt:"Le navigateur refuse la base d'images : elles resteront visibles jusqu'à la fermeture de l'onglet, puis seront perdues."};
  prechargerVisuels(c);
  ui.brouillon = null; ui.importTexte = ""; ui.importTitre = ""; ui.importUE = "";
  ui.importTableaux = []; ui.importImages = []; ui.avertFichier = "";
  ui.avisRGPD = null; ui.rgpdIgnore = false; ui.transcritIllisibles = null;
  viderPhotos();
  ui.fiche = c.id; ui.ecran = "fiche";
  if(!ui.message) ui.message = {type:"info", titre:"Fiche créée",
    txt:items.length + " exercices sur " + nbRetenus(b) + " points retenus" +
      (c.visuels.length ? ", " + c.visuels.length + " image" + (c.visuels.length>1?"s":"") + " jointe" + (c.visuels.length>1?"s":"") : "") + "."};
  rendre(); window.scrollTo(0,0);
}
/* Déclenchée à la main, jamais automatiquement. Le résultat est rangé
   dans une rubrique distincte du cours, avec la date et les liens vérifiés. */
async function lancerComplements(id){
  const c = S.cours.find(x => x.id === id);
  if(!c) return;
  const men = (c.fiche.mentionnes||[]).map(m => m.txt).slice(0,10);
  if(!men.length) return;
  if(!S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Configuration incomplète", txt:"Renseignez la clé et le modèle dans les réglages."};
    rendre(); return;
  }
  ui.occupe = true; ui.message = null; rendre();
  try{
    c.fiche.complements = await chercherComplements(c.ueId, men, S.reglages.cleGemini, S.reglages.modele);
    sauver();
    ui.message = {type:"info", titre:"Compléments ajoutés",
      txt:(c.fiche.complements.liens||[]).length + " source" + ((c.fiche.complements.liens||[]).length>1?"s":"") + " retenue" + ((c.fiche.complements.liens||[]).length>1?"s":"") + ". Ils ne remplacent pas votre cours."};
  }catch(e){ ui.message = {type:"err", titre:"Recherche interrompue", txt:e.message}; }
  ui.occupe = false; rendre();
}

/* Nouvelle vague : on ajoute des exercices à une fiche déjà faite, sans toucher
   aux anciens ni à leur progression. Les énoncés existants sont transmis au
   modèle pour qu'il produise autre chose. */
async function nouvelleVague(id){
  const c = S.cours.find(x => x.id === id);
  if(!c) return;
  if(c.origine !== "gemini" || S.reglages.moteur !== "gemini"){
    ui.message = {type:"err", titre:"Mode Gemini nécessaire",
      txt:"Produire une nouvelle vague demande le mode Gemini. En mode local, refaites un import."};
    rendre(); return;
  }
  if(!S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Configuration incomplète", txt:"Renseignez la clé et le modèle dans les réglages."};
    rendre(); return;
  }
  ui.occupe = true; ui.message = null; rendre();
  let neufs;
  try{
    const dejaVus = c.items.map(i => i.question || i.recto || "").filter(Boolean);
    neufs = await analyseGeminiExercices(c.fiche, c.ueId, S.reglages.cleGemini, S.reglages.modele,
      (k, n) => { ui.avancement = n > 1 ? "lot " + k + " sur " + n : "en cours"; rendre(); }, dejaVus);
  }catch(e){ ui.occupe = false; ui.avancement = null;
    ui.message = {type:"err", titre:"Fabrication interrompue", txt:e.message}; rendre(); return; }
  ui.occupe = false; ui.avancement = null;
  // on écarte ce qui répète un énoncé déjà présent
  const vus = new Set(c.items.map(i => normaliser(i.question || i.recto || "")));
  const gardes = neufs.filter(i => { const k = normaliser(i.question || i.recto || "");
    if(!k || vus.has(k)) return false; vus.add(k); return true; });
  if(!gardes.length){
    ui.message = {titre:"Rien de nouveau", txt:"Le modèle n'a produit que des exercices déjà présents. Réessayez, ou enrichissez la fiche."};
    rendre(); return;
  }
  gardes.forEach(i => { i.ueId = c.ueId; i.vague = (c.vague || 1) + 1; });
  c.vague = (c.vague || 1) + 1;
  c.items = c.items.concat(gardes);
  sauver();
  ui.message = {type:"info", titre:"Nouvelle vague ajoutée",
    txt: gardes.length + " exercices de plus, les anciens sont conservés avec leur progression."};
  rendre();
}

function abandonner(){
  // les images n'ont jamais été écrites en base : les oublier suffit
  ui.brouillon = null; ui.importTableaux = []; ui.importImages = []; ui.avertFichier = "";
  ui.ecran = "import"; ui.message = {type:"info", titre:"Analyse abandonnée", txt:"Rien n'a été enregistré."};
  rendre();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const a = el.dataset.act, s = ui.session;
  switch(a){
    case "nav": ui.session = null; clearInterval(minuteur); aller(el.dataset.tab, "accueil"); break;
    case "ecran": ui.ecran = el.dataset.e; ui.message = null; rendre(); window.scrollTo(0,0); break;
    case "filtre": ui.filtreUE = el.dataset.ue; rendre(); break;
    case "src": { const c = document.getElementById(el.dataset.cible); if(c) c.classList.toggle("ouvert"); break; }

    /* --- leçons --- */
    case "ouvrir-lecon": {
      ui.ue = el.dataset.ue;
      const p = progLecon(ui.ue);
      if(p.termine) p.index = 0;
      ui.quizRep = null; ui.ecran = "lecon"; sauver(); rendre(); window.scrollTo(0,0); break;
    }
    case "fermer-lecon": ui.ecran = "accueil"; ui.quizRep = null; rendre(); break;
    case "quiz": {
      const d = LECONS[ui.ue].diapos[progLecon(ui.ue).index];
      ui.quizRep = Number(el.dataset.k);
      progLecon(ui.ue).quiz[progLecon(ui.ue).index] = ui.quizRep === d.bonne;
      sauver(); rendre(); break;
    }
    case "diapo-suiv": {
      const p = progLecon(ui.ue), L = LECONS[ui.ue];
      if(p.index >= L.diapos.length - 1){
        p.termine = true; p.index = L.diapos.length - 1; sauver();
        ui.ecran = "accueil"; ui.quizRep = null;
        ui.message = {type:"info", titre:"Leçon terminée",
          txt: L.titre + (EXOS[ui.ue] ? " — les exercices de cette unité vous attendent plus bas." : " — vous pouvez la reprendre quand vous voulez.")};
      } else { p.index++; ui.quizRep = null; sauver(); }
      rendre(); window.scrollTo(0,0); break;
    }
    case "diapo-prec": { const p = progLecon(ui.ue); if(p.index > 0) p.index--; ui.quizRep = null; sauver(); rendre(); window.scrollTo(0,0); break; }

    /* --- fiches --- */
    case "ouvrir-fiche": ui.fiche = el.dataset.id; ui.ecran = "fiche"; rendre(); window.scrollTo(0,0); break;
    case "imprimer": imprimerFiche(el.dataset.id, el.dataset.mode); break;
    case "fiche-erreurs": imprimerErreurs(); break;
    case "lire": { const c = S.cours.find(x => x.id === el.dataset.id); if(c) lire(texteFiche(c)); break; }
    case "stop-lecture": if(window.speechSynthesis) speechSynthesis.cancel(); break;
    case "supprimer":
      if(confirm("Supprimer ce cours, sa fiche et ses exercices ?")){
        const c = S.cours.find(x => x.id === el.dataset.id);
        if(c) c.items.forEach(i => delete S.progres[i.id]);
        effacerImages(((S.cours.find(x => x.id === el.dataset.id)||{}).visuels || []).map(v => v.id));
        S.cours = S.cours.filter(x => x.id !== el.dataset.id);
        sauver(); ui.ecran = "fiches"; rendre();
      } break;
    case "analyser": await releverPoints(); break;
    case "prep-dus": {
      const l = UES_EXOS.flatMap(u => itemsExos(u))
        .filter(i => { const p = S.progres[i.id]; return !p || p.prochain <= Date.now(); });
      ouvrirSession(l, "libre", null, {tab:"prep", ecran:"accueil"}); break; }
    case "ecran-schemas": { ui.fiche = el.dataset.id; ui.ecran = "schemas"; ui.codeOuvert = ""; rendre(); window.scrollTo(0,0);
      const c = S.cours.find(x => x.id === ui.fiche); if(c) prechargerSchemas(c); break; }
    case "faire-schema": await faireSchema(el.dataset.id, el.dataset.v); break;
    case "ouvrir-code": { const c = S.cours.find(x => x.id === ui.fiche);
      const x = c && schemasDe(c).find(y => y.id === el.dataset.s);
      ui.codeOuvert = ui.codeOuvert === el.dataset.s ? "" : el.dataset.s;
      ui.codeSchema = x ? x.code : ""; rendre(); break; }
    case "refaire-schema": await reRendreSchema(el.dataset.c, el.dataset.s); break;
    case "suppr-schema": { const c = S.cours.find(x => x.id === el.dataset.c);
      if(c && confirm("Supprimer ce schéma ?")){
        c.schemas = schemasDe(c).filter(y => y.id !== el.dataset.s);
        delete SVG_SCHEMA[el.dataset.s]; sauver(); rendre(); } break; }
    case "annuler-appel": annulerAppel(); break;
    case "pod-duree": ui.podDuree = el.dataset.v; rendre(); break;
    case "pod-niveau": ui.podNiveau = el.dataset.v; rendre(); break;
    case "pod-essai": await podcastEssai(); break;
    case "pod-faire": await podcastFaire(); break;
    case "pod-revoix": await podcastRevoix(); break;
    case "pod-telecharger": { const p2 = ui.podcast;
      if(p2 && p2.blob) telecharger((p2.titre || "podcast").replace(/[^\w -]/g,"").slice(0,40) + ".wav", p2.blob, "audio/wav");
      break; }
    case "charger-voix": {
      if(!S.reglages.cleGemini){ ui.message = {titre:"Clé manquante", txt:"Collez d'abord votre clé Google AI Studio."}; rendre(); break; }
      el.textContent = "Chargement…";
      try{
        const m = await modelesVoix(S.reglages.cleGemini);
        S.reglages.modelesVoix = m;
        if(!S.reglages.modeleVoix && m.length) S.reglages.modeleVoix = m[0].id;
        sauver(); ui.message = {type:"info", titre:"Modèles vocaux chargés", txt:m.length + " disponibles."};
      }catch(err){ ui.message = {type:"err", titre:"Chargement impossible", txt:err.message}; }
      rendre(); break;
    }
    case "reformuler": await reformuler(el.dataset.v); break;
    case "voir-reform": ui.voirReform = ui.voirReform === el.dataset.v ? "" : el.dataset.v; rendre(); break;
    case "nouvelle-vague": await nouvelleVague(el.dataset.id); break;

      ui.message = {type:"info", titre:"Texte anonymisé", txt:"Relisez-le avant de lancer l'analyse."}; rendre(); break;
    case "rgpd-ignorer": ui.rgpdIgnore = true; ui.avisRGPD = null; rendre(); break;

    /* --- sessions --- */
    case "exos": lancerExosPrep(el.dataset.ue, el.dataset.mode || ""); break;
    case "session": lancerSession(el.dataset.source, el.dataset.ue, el.dataset.id, {niveau:el.dataset.niveau}); break;

      const it = s.liste[s.i];
      if(it.type === "qcmMulti"){ const k = Number(el.dataset.k); s.choix = s.choix || [];
        s.choix = s.choix.includes(k) ? s.choix.filter(x => x !== k) : s.choix.concat([k]); }
      else if(it.type === "vf") s.choix = el.dataset.v === "true";
      else s.choix = Number(el.dataset.k);
      rendre(); break;
    }
    case "sur": s.sur = el.dataset.v === "1"; rendre(); break;
    case "monter": { const p = Number(el.dataset.p); [s.ordre[p-1], s.ordre[p]] = [s.ordre[p], s.ordre[p-1]]; rendre(); break; }
    case "descendre": { const p = Number(el.dataset.p); [s.ordre[p+1], s.ordre[p]] = [s.ordre[p], s.ordre[p+1]]; rendre(); break; }
    case "valider": valider(); break;
    case "passer": if(s.mode === "examen") s.resultats.push({id:s.liste[s.i].id, ueId:s.liste[s.i].ueId, juste:false}); suivant(); break;
    case "auto": { const it = s.liste[s.i], j = el.dataset.v === "1";

      const l = (S.reglages.joursOff || []).map(Number);
      S.reglages.joursOff = l.includes(k) ? l.filter(x => x !== k) : l.concat([k]);

    case "reintegrer": S.cours.forEach(c => c.items.forEach(i => { delete i.douteux; })); sauver(); rendre(); break;
    case "imprimer-ue": if(ui.effacerUE) imprimerUE(ui.effacerUE); break;
